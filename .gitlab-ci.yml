# Checks every merge request and main, and deploys main to Scaleway.
#
#   lint:copy        the editorial rules of docs/editorial-guidelines.md (scripts/lint-copy.mjs).
#   build            `yarn build`: the Nitro Node server and the prerendered pages, then the output
#                    size check. On merge requests, the prerendered pages are kept for a day as an
#                    artifact (there are no preview deployments; review with `yarn dev`).
#   image:scaleway   on the deploy branch: `.output/` packaged as a Docker image and pushed to the Scaleway
#                    registry, tagged with the commit.
#   release:scaleway on the deploy branch: runs that image on the Serverless Container, checks it, and empties
#                    the CDN cache. Rollback: "Rollback" on the production environment reruns an
#                    older release job, without a rebuild. Both run only when the project variable
#                    SCALEWAY_DEPLOY is "true". The release reads the resource IDs from the
#                    variables SCW_SITE_CONTAINER_ID and SCW_SITE_PIPELINE_ID. See infra/scaleway/.
#
# The deploy branch is the variable SCALEWAY_DEPLOY_BRANCH, `main` by default. Until the revamp
# is merged, the project variable sets it to `v2026`. That branch must be
# protected, or the jobs cannot read the protected Scaleway key.
#
# Node 24: nuxt-og-image 7 needs Node >= 24.15.

image: node:24

stages:
  - lint
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $SCALEWAY_DEPLOY_BRANCH

variables:
  SCALEWAY_DEPLOY_BRANCH: main
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn-cache"
  NUXT_PUBLIC_SITE_URL: "https://www.dokos.io"

.deps:
  before_script:
    - yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn-cache/
    policy: pull

lint:copy:
  extends: .deps
  stage: lint
  script:
    - yarn lint:copy

build:
  extends: .deps
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn-cache/
    policy: pull-push
  script:
    - yarn build
  artifacts:
    expire_in: 1 day
    paths:
      - .output/public/

.scaleway:
  rules:
    - if: $CI_COMMIT_BRANCH == $SCALEWAY_DEPLOY_BRANCH && $SCALEWAY_DEPLOY == "true"
  variables:
    SCW_VERSION: "2.65.2"
    SCW_SHA256: "184e697e6ab8a8e825be1c5cf61d104341abe3598bb0e20b7a54618cb05231b3"
    SCW_DEFAULT_REGION: fr-par

image:scaleway:
  extends: [.deps, .scaleway]
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_VERSION: "29.9.3"
  script:
    - yarn build
    # The Docker CLI only; the daemon is the docker:dind service.
    - curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
    - bash infra/scaleway/deploy.sh image
  timeout: 1h

release:scaleway:
  extends: .scaleway
  stage: deploy
  image: debian:bookworm-slim
  needs: [image:scaleway]
  resource_group: scaleway-production     # one deploy at a time, in order
  environment:
    name: production
    url: https://www.dokos.io
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl jq >/dev/null
    - curl -fsSL -o /usr/local/bin/scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
    - echo "${SCW_SHA256}  /usr/local/bin/scw" | sha256sum -c -
    - chmod +x /usr/local/bin/scw
  script:
    - bash infra/scaleway/deploy.sh release "$CI_COMMIT_SHA"

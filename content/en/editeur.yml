# source: content/fr/blog/2026 (arrivee-V5) for the release date; LICENSE files of gitlab.com/dokos/dokos (GPLv3) and gitlab.com/dokos/dodock (MIT)
proof:
  items:
    - label: Latest major version
      value: Version 5
      note: Released on 16 March 2026, on Frappe and ERPNext v16
    - label: Licences
      value: GPLv3 · AGPLv3 · MIT
      note: Depending on the repository, readable and modifiable by you or by a third party
    - label: Maintained repositories
      value: "16"
      note: Dodock, Dokos and fourteen applications

scope:
  title: What we maintain
  description: Each repository has its product page. The forks follow the versions published by Frappe; the applications are written by us.
  items:
    - title: Dodock
      description: The framework under Dokos, our version of Frappe. Documents, permissions, approval workflows, reports, API.
      icon: i-heroicons-circle-stack
      badge: Fork of Frappe
      to: /en/modules/dodock
    - title: Dokos
      description: The business management software built on Dodock, derived from ERPNext and adapted to French obligations.
      icon: i-heroicons-building-office
      badge: Fork of ERPNext
      to: /en/modules/dokos
    - title: Dokos HR
      description: Human resources management, our version of Frappe HR.
      icon: i-heroicons-users
      badge: Fork of Frappe HR
      to: /en/modules/ressources-humaines
    - title: Payments
      description: Online payments through payment gateways, our version of Frappe Payments.
      icon: i-heroicons-credit-card
      badge: Fork of Frappe Payments
      to: /en/modules/paiements
    - title: Webshop
      description: The online shop and the customer portal, our version of Frappe Webshop.
      icon: i-heroicons-shopping-bag
      badge: Fork of Frappe Webshop
      to: /en/modules/e-commerce
    - title: Bank
      description: Bank account synchronisation and reconciliation, with the Banking module and the cash-flow forecast in beta.
      icon: i-heroicons-building-library
      badge: Application
      to: /en/modules/bank
    - title: Bookings
      description: Resource booking and credit management, written for third places.
      icon: i-heroicons-calendar-days
      badge: Application
      to: /en/modules/reservations-de-ressources
    - title: eTransactions
      description: Receiving CII, Factur-X and UBL e-invoices, and the connection to an approved platform (PA).
      icon: i-heroicons-document-check
      badge: Application
      to: /en/modules/etransactions
    - title: OCR
      description: Data extraction from supplier invoices, with Amazon Textract.
      icon: i-heroicons-document-magnifying-glass
      badge: Application
      to: /en/modules/ocr
    - title: Construction
      description: A quotation configurator for businesses that sell building work.
      icon: i-heroicons-calculator
      badge: Application
      to: /en/modules/construction
    - title: Hiboutik
      description: The connector with the Hiboutik point of sale.
      icon: i-heroicons-shopping-cart
      badge: Application
      to: /en/modules/hiboutik
    - title: Dokos WooCommerce
      description: The connector between a WooCommerce shop and Dokos.
      icon: i-simple-icons-woocommerce
      badge: Application
      to: /en/modules/woocommerce
    - title: Tribu
      description: Members, memberships, donations and online registrations for non-profits.
      icon: i-heroicons-identification
      badge: Application
      to: /en/modules/tribu
    - title: Dokos AI
      description: An assistant connected to the site's data, with a confirmation before any write.
      icon: i-heroicons-sparkles
      badge: Application
      to: /en/modules/dokos-ai
    - title: Dokos CLI
      description: A command-line tool and an MCP server to drive a site from a terminal or an agent.
      icon: i-heroicons-command-line
      badge: Tool
      to: /en/modules/dokos-cli
    - title: Certification Caisse
      description: The LNE-certified scope of the point-of-sale system, with the fingerprint of each file published.
      icon: i-octicon-law
      badge: Application
      to: /en/certifications

operations:
  title: How the product moves forward
  description: Business software is judged on its trajectory as much as on its current state. This is how we keep ours.
  items:
    - title: We follow Frappe and ERPNext
      description: Every version published by Frappe is read, tested and ported. Dokos 5 runs on version 16 of Frappe and ERPNext.
      icon: i-heroicons-arrow-trending-up
    - title: Differences are documented
      description: Where French needs differ from upstream, we diverge, and we keep a record of each difference so that it can be maintained over time.
      icon: i-heroicons-arrows-pointing-out
    - title: A two-stage rollout
      description: A new version reaches sites without custom applications first, then the others, after a compatibility check.
      icon: i-heroicons-arrow-path
    - title: Public repositories and tickets
      description: The code, the tickets and the history of changes are readable by everyone on gitlab.com/dokos.
      icon: i-simple-icons-gitlab
    - title: Published fingerprints
      description: For the certified scope, the fingerprint of each file is published, with the procedure to recompute it on your installation.
      icon: i-heroicons-finger-print
    - title: A release log
      description: Each change is described on doc.dokos.io/nouveautes, and major versions are presented in a webinar.
      icon: i-heroicons-newspaper
    - title: A community
      description: The community.dokos.io forum, the third places and fablabs we met at Faire Festival, the outside contributors. Dokos SAS is also a founding member of the PDP Libre association.
      icon: i-heroicons-user-group

reversibility:
  title: What the licence gives you
  description: Publishing under a free licence commits the publisher as much as the user.
  items:
    - title: Read the code
      description: Your teams or a third party can audit the software, with no non-disclosure agreement.
      icon: i-heroicons-magnifying-glass
    - title: Modify and contribute
      description: Fix, extend, propose. Outside contributions are merged when they pass review.
      icon: i-heroicons-code-bracket
    - title: Move the installation elsewhere
      description: Your site stays operable by another provider, or by you, with the same code.
      icon: i-heroicons-arrows-right-left
    - title: Fork
      description: The right the licence grants. We used it ourselves, starting from Frappe and ERPNext.
      icon: i-heroicons-arrows-pointing-out

cta:
  title: Start with the repository
  description: The code, the tickets and the history of changes are public. If a question remains, write to us.
  links:
    - label: Open GitLab
      to: https://gitlab.com/dokos
      target: _blank
      size: xl
      color: primary
    - label: Write to us
      to: /en/contact
      size: xl
      color: neutral
      variant: outline

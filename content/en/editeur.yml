title: Open source publisher
description: Dokos SAS maintains Dodock, Dokos and a dozen applications, published under free licences on GitLab, with the full history of every change.
navigation:
  title: Open source publisher
  icon: i-heroicons-code-bracket-square
  description: Dodock, Dokos and the applications we maintain

hero:
  headline:
    label: Public code on gitlab.com/dokos
    icon: i-simple-icons-gitlab
  title: We publish <span class="text-primary">Dokos</span>, Dodock<br>and the applications around them.
  description: Dodock is our version of the Frappe framework. Dokos is the business management software built on it, derived from ERPNext. Around them, we maintain the applications that French companies and non-profits need. Dokos is published under GPLv3 and Dodock under MIT, and you can read every change before you trust us with anything.

# The AI assistant at the user's side. The invoice and its history are example data.
access:
  label: Dokos AI
  title: An assistant at your side, under your rules.
  rules:
    - title: A user's permissions
      description: An agent signs in with an account and roles. It sees only what that account sees.
    - title: A confirmation before writing
      description: Dokos AI shows each creation or change and waits for your approval.
    - title: Every action in the history
      description: An agent's change appears in the document timeline, with its author and time.
  link:
    label: AI & agents
    to: /en/ecosysteme/intelligence-artificielle
  assistants:
    title: With the assistant you already use
    description: Dokos AI opens an MCP server protected by OAuth. You connect it to your assistant, which then acts with your account and your permissions.
    note: MCP connectors depend on each assistant's plan.
    items:
      - { name: Claude, logo: /ai/claude.svg }
      - { name: ChatGPT, logo: /ai/chatgpt.svg }
      - { name: Gemini, logo: /ai/gemini.svg }
      - { name: Mistral Le Chat, logo: /ai/mistral.svg }
      - { name: Grok, logo: /ai/grok.svg }
      - { name: Microsoft Copilot, logo: /ai/copilot.svg }
      - { name: Perplexity, logo: /ai/perplexity.svg }
  example:
    title: Invoice INV-2026-0412
    status: Submitted
    fields:
      - { label: Customer, value: Example Ltd }
      - { label: Format, value: Factur-X }
      - { label: Grand total, value: "€4,860.00" }
    history:
      - { kind: person, who: Accounting, what: created the invoice, time: "09:12" }
      - { kind: ai, who: Dokos AI, what: added 3 lines from the quotation, time: "09:14" }
      - { kind: mcp, who: Agent over MCP, what: checked the Factur-X, time: "09:20" }
      - { kind: person, who: Accounting, what: submitted the invoice, time: "09:21" }
    ask: Shall I add these three lines to the invoice?
    confirm: Confirm
    cancel: Cancel

# How Dokos adapts to a company: three levels. Studio is in Dodock develop only,
# so it is marked « coming soon ». Documentation links point to the French docs.
extend:
  label: Made to measure
  title: Dokos adapts to your company.
  description: What is specific to you is added to the same database. Your applications inherit the documents, the permissions, the history, the API and AI agent access.
  levels:
    - title: Customise without code
      status: Available
      state: ok
      description: From the browser, you add fields, adapt forms and define your approval workflows, print formats and reports.
      items: [Fields, Forms, Approvals, Print formats, Reports]
      link: { label: Customisation (in French), to: "https://doc.dokos.io/v5/dodock/personnalisation", target: _blank }
    - title: Studio
      status: Coming soon
      state: soon
      description: A visual web application builder built into Dokos. You put together pages, components and data sources, then publish the application on your site. Studio is being prepared in the next version of Dodock.
      items: [Pages, Components, Dokos data]
      link: { label: Preview in the documentation (in French), to: "https://doc.dokos.io/next/dodock/personnalisation/studio", target: _blank }
    - title: Business applications
      status: Available
      state: ok
      description: Our engineers, or yours, build the applications that carry your processes, on Dodock, the Dokos application framework. They are delivered to your repositories under an open source licence, and can be operated under contract.
      items: [Business processes, Connectors, Automations]
      link: { label: Our engineering work, to: /en/ingenierie }


# Layer 3: Dokos itself. The document numbers are example data.
core:
  label: The company brain
  title: Entered once, used everywhere.
  description: "An accepted quotation becomes a sales order, a delivery, an invoice, a journal entry and a payment. Each document picks up the one before it, and Dokos does the repetitive work at each step. Permissions are set once, per role, and apply everywhere: screens, reports, API and agents."
  does_label: Dokos takes care of it
  chain:
    - { title: Quotation, number: QTN-0388, does: "applies your price list and the customer's discounts" }
    - { title: Sales order, number: SO-0291, does: "reserves stock and tracks what remains to deliver and invoice" }
    - { title: Delivery, number: DN-0277, does: "takes the goods out of stock and updates its value" }
    - { title: Invoice, number: INV-0412, does: "posts the journal entry and goes out through your approved platform" }
    - { title: Journal entry, number: JE-5530, does: "feeds the general ledger, VAT and the balance sheet" }
    - { title: Payment, number: PAY-0198, does: "proposes the match with your bank statement" }
  # Product facts, verifiable on /en/certifications and content/fr/blog/2026/facturation-electronique.md.
  facts:
    - label: Payments from individuals
      value: LNE certified
      status: Available
      state: ok
      note: LNE certification standard for point-of-sale systems (« systèmes de caisse »). With the Certification Caisse module and a licence issued by Dokos SAS.
      link: { label: The certifications, to: /en/certifications }
    - label: E-invoicing
      value: Sending and receiving
      status: Available
      state: ok
      note: CII, Factur-X and UBL invoices, through the approved platform (PA) of your choice.
      link: { label: eTransactions, to: /en/modules/etransactions }

# Layer 4: the open source base, and the tools Dokos connects to.
base:
  label: The open source base
  title: Built on Frappe and ERPNext, with their community.
  description: Dodock and Dokos follow every Frappe and ERPNext release, and add what France requires. Dokos 5, released on 16 March 2026, runs on version 16 of Frappe and ERPNext. All the code is published on our GitLab, under GPLv3, AGPLv3 or MIT depending on the repository.
  link:
    label: Read the code
    to: https://gitlab.com/dokos
  layers:
    - { title: Dokos, note: "management, French localisation, LNE", to: /en/modules/dokos }
    - { title: ERPNext, note: the management modules }
    - { title: Dodock, note: "the framework, Dokos's version of Frappe", to: /en/modules/dodock }
    - { title: Free licences, note: "GPLv3, AGPLv3 or MIT, published code" }


title: "Dokos, the brain of your company, as open source software"
description: "Sales, purchasing, stock, accounting, manufacturing, projects and HR in one database. Dokos does the repetitive work, adapts to your processes with your own applications, and gives you an AI assistant that asks for your approval."
navigation: false

announcement:
  label: The Dokos system for taking payments from individuals is certified by LNE.
  cta: See the certifications

colored_section:
  title: Built with third places since 2018
  description: "The project started in 2018 with the Compagnie des Tiers-Lieux, first on ERPNext, before it became Dokos. Third places built the tool with us and funded new features. The discussion continues on the Dokos community forum, open to everyone."
  image: /image/dokos-communaute.webp
  align: left

sections:
  - title: Your members and their fees
    description: With Tribu, members sign up and pay in a web form. Tribu creates their record, their membership and the sales invoice. The donations module records one-off contributions. Payments received are reconciled in the bank module.
    image: /modules/comptabilite/hero.webp
    align: left
    links:
      - label: Tribu
        to: /en/modules/tribu
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Your resources booked from the portal
    description: Each room, desk or machine becomes a bookable resource, with its prices per hour, half-day, day or month, its opening calendar and its minimum notice. The customer picks a slot on the portal. The booking is confirmed after the order, or after payment if you require it.
    image: /solutions/reservations.webp
    align: right
    features:
      - title: Booking credits
        description: A ticket or a subscription allocates credits, used up at each booking. A report shows the balances.
        icon: i-heroicons-ticket
      - title: Google Calendar synchronisation
        description: Each resource is linked to its calendar, and an option synchronises online bookings.
        icon: i-heroicons-calendar-days
      - title: Several venues on one site
        description: In multi-venue mode, each company has its own price list and cart.
        icon: i-heroicons-map-pin
    links:
      - label: Resource bookings
        to: /en/modules/reservations-de-ressources
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Contracts and subscriptions for your residents
    description: For a dedicated desk or a business address, you send the contract to the customer, who signs it in one click on their portal. The active contract creates the sales order, the subscription and the deposit. The subscription creates its invoices each period and triggers payment if the customer has saved a payment method.
    image: /solutions/abonnement.webp
    align: left
    links:
      - label: The Sales module
        to: /en/modules/ventes
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Online payment
    description: You send a payment link from an order or an invoice. Your customer pays by card or by SEPA direct debit, and the request's status updates in Dokos. Stripe, GoCardless, Stancer, HelloAsso, SumUp and PayPal gateways are available. With Stripe or GoCardless, the payment method is kept for the subscription's instalments.
    image: /modules/paiements/hero.webp
    align: right
    links:
      - label: The Payments module
        to: /en/modules/paiements
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Your website and your shop
    description: You build your site's pages in the Frappe Builder visual editor and publish them in one click. With Webshop, your items are published on the site, an online order becomes a sales order, and your customers find their orders and invoices on their portal.
    image: /modules/builder/hero.webp
    align: right
    links:
      - label: Frappe Builder
        to: /en/modules/builder
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
      - label: Webshop
        to: /en/modules/e-commerce
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true


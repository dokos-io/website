title: Dokos for third places and associations
description: Memberships, fees and donations with Tribu, resource bookings, contracts, subscriptions and online payment, in your Dokos accounts.

hero:
  headline:
    label: Third places and associations
    icon: i-heroicons-building-office-2
  title: Your members, your spaces and <span class="text-primary">your accounts</span> in one place.
  description: Your members sign up and pay their fees online with Tribu. They book a room, a desk or a machine from the portal. Dokos creates the invoices, contracts and subscriptions in your accounts.
  links:
    - label: Try Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Documentation (in French)
      to: https://doc.dokos.io/v5/dokos/lieu
      target: _blank
      size: xl
      color: neutral
      variant: outline


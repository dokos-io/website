title: We build your business applications
description: Our engineers build the applications your business management is missing, on Dokos and Frappe, and deliver them in your repositories.
navigation:
  title: Engineering
  icon: i-heroicons-wrench-screwdriver
  description: Business applications built on Dokos and Frappe

hero:
  headline:
    label: Engineering
    icon: i-heroicons-wrench-screwdriver
  title: We <span class="text-primary">build</span> your business applications.
  description: "Not all of your processes fit into standard software. We build the missing applications on Dokos and Frappe, and deliver them in your repositories, under a free licence. They inherit everything the base provides: documents, permissions, the API and agent access."
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See pricing
      to: /en/tarifs
      size: xl
      color: neutral
      variant: outline

scope:
  title: What we take on
  description: Five kinds of engagement, quoted per project after a short scoping phase.
  links:
    - label: See the ecosystem
      to: /en/modules
      color: neutral
      variant: outline
      icon: i-heroicons-arrow-right-20-solid
      trailing: true
  items:
    - title: Platform architecture
      description: Sizing, splitting into applications, upgrade strategy, integration with your information system. The engagement that prevents the next three.
      icon: i-heroicons-squares-2x2
    - title: Migration
      description: Takeover from proprietary software, spreadsheets or an existing Frappe or ERPNext installation. Cutover plan, acceptance tests, rollback procedure.
      icon: i-heroicons-arrow-path
    - title: Custom development
      description: Specific applications, automations, connectors. Delivered under a free licence in your repositories, documented, and deployable without us.
      icon: i-heroicons-code-bracket-square
    - title: AI engineering
      description: Dokos AI skills written for your processes, and agents connected through the MCP server, with a confirmation before any write and a history of every action.
      icon: i-heroicons-cpu-chip
    - title: Training
      description: Your teams learn to configure, adapt and administer the site. The engagement succeeds when you call us less.
      icon: i-heroicons-academic-cap

sections:
  - title: What a business application inherits from Dokos
    description: <strong>An application built on Dokos starts with everything the base already provides.</strong><br><br>You describe your documents and their rules; the forms, lists, reports, permissions and API exist straight away. Your teams reach the application from the same desk, and your AI agents from the same MCP server.
    image: /modules/dodock/fit.webp
    align: right
    features:
      - title: Documents and approval workflows
        description: Draft, submit, cancel, history. Each document records who did what.
        icon: i-heroicons-document-check
      - title: Permissions by role
        description: The permissions defined for Dokos apply to your application with no extra work.
        icon: i-heroicons-shield-check
      - title: API, webhooks and MCP
        description: Each document can be read and changed through the API, a webhook, or an agent through Dokos CLI.
        icon: i-heroicons-code-bracket

operations:
  title: How we work
  description: How we work matters as much as the scope.
  items:
    - title: Two people from day one
      description: Each engagement is followed by two engineers. A project that rests on one person is a risk for you as much as for us.
      icon: i-heroicons-user-group
    - title: Alongside your teams
      description: We work on your real processes, with the people who run them. Skills transfer happens along the way.
      icon: i-heroicons-users
    - title: Delivered in your repositories
      description: Code under a free licence, documentation, deployment procedure. You can take over the work or hand it to a third party at any time.
      icon: i-heroicons-document-text
    - title: On the base we publish
      description: When a limit comes from Dokos or Dodock, we fix it in the base, and every user gets the fix.
      icon: i-heroicons-code-bracket-square
    - title: Operations can follow
      description: What we build, we know how to run. A managed operations contract can take over at the end of the project.
      icon: i-material-symbols-cloud-done-outline
    - title: What is beyond our skills
      description: When we do not master a subject, we say so and refer you to a partner.
      icon: i-heroicons-hand-raised

faq:
  title: Frequently asked questions
  items:
    - label: How are engagements priced?
      content: Per project, after a short scoping phase that sets the scope and the deliverables. An architecture or AI engineering engagement calls on rarer skills than a module build, and the quote reflects that. For a one-off, well-defined need, the hour packs on the Pricing page are often a better fit than a project.
    - label: Do you work with our internal teams?
      content: That is the way we prefer to work. Our engineers work alongside your teams, and the goal is your independence. We also work alongside your existing providers when the scope of each one is written down.
    - label: What happens to the code produced?
      content: "It is published under a free licence and committed to your repositories as well as ours. You can take it over, modify it, or hand it to another provider. When a development is useful to others, we offer to contribute it to the product: you keep the benefit and the maintenance becomes ours."
    - label: Do you work on an installation you did not deploy?
      content: Yes, including standard ERPNext and applications from the Frappe ecosystem. The engagement starts with an audit of what is in place. It may conclude that an upgrade must come before any development.

cta:
  title: Describe the process that gets stuck
  description: What does not work today tells us more than a list of features. A first one-hour conversation is enough to scope the work.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: Managed operations
      to: /en/exploitation
      size: xl
      color: neutral
      variant: outline

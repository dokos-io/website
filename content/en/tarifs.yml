scope:
  title: Engineering is quoted per project
  description: Architecture, migration, custom development and AI engineering are not sold as hour packs. These engagements are quoted after a short scoping phase.
  items:
    - title: Platform architecture
      description: Sizing, splitting into applications, upgrade strategy and integration with your existing information system.
      icon: i-heroicons-squares-2x2
    - title: Migration
      description: Data takeover from existing software or from a Frappe or ERPNext installation, with a cutover and rollback plan.
      icon: i-heroicons-arrow-path
    - title: Custom development
      description: Specific applications, automations, connectors. Delivered under a free licence, in your repositories.
      icon: i-heroicons-wrench-screwdriver
    - title: AI engineering
      description: Dokos AI skills and agents connected through the MCP server, on your processes, with a confirmation before any write.
      icon: i-heroicons-cpu-chip
  links:
    - label: See the engineering engagements
      to: /en/ingenierie
      color: primary
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

faq:
  title: Billing questions
  items:
    - label: Why bill by CPU and not by user?
      content: Because the real cost of an instance depends on what it computes. Per-user billing penalises organisations that open the tool to many people, which is the use we want to encourage. If your consumption stays above your plan, we agree together on moving to the matching tier.
    - label: Do marketplace apps cost extra?
      # source: cloud.dokos.io marketplace, 30 published apps out of 33 listings, all with subscription type "Free" (checked 4 November 2026); hostingconditions.md §6.1
      content: >-
        No. The apps published on the Dokos Cloud marketplace have no separate subscription: you install them on your
        site from your dashboard. The price of your plan does not depend on the apps you install but on the resources
        they use. An app that computes or stores a lot can move you to the next plan up. The Certification Caisse module
        is the exception: it needs a licence from Dokos SAS, which carries each company's signing keys and access to the
        external signature journal.
    - label: Can prices increase during the contract?
      content: A revision is possible after a significant change in economic or regulatory conditions. It requires sixty days' written notice, and you can then terminate without penalty by telling us within thirty days. If you do not reply, the new prices apply on the stated date.
    - label: What is the notice period for termination?
      content: Thirty days before the end of the current monthly period, by registered letter or by e-mail. Termination takes effect at the end of the month following receipt of the notice. No partial refund is made for a period already invoiced.
    - label: Can I get support while self-hosting?
      content: Yes. Support packs are open to all users, including those who host Dokos themselves. Managed operations require that we control the infrastructure or have equivalent access. That is what makes the response times achievable.
    - label: Are the prices shown up to date?
      content: They follow the pricing in effect on 1 September 2024, as set out in our hosting terms and conditions, which remain the reference contractual document. If this page and the terms and conditions differ, the terms and conditions prevail.


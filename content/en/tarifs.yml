scope:
  title: What about engineering?
  description: Architecture, migration, custom development, and AI engineering aren't sold as hourly packages. These missions are quoted per project, after scoping.
  items:
    - title: Platform architecture
      description: Sizing, structuring, version upgrade strategy, and integration with your existing information system.
      icon: i-heroicons-squares-2x2
    - title: Migration
      description: Data takeover from an existing ERP or from an existing Frappe/ERPNext installation, with a cutover and rollback plan.
      icon: i-heroicons-arrow-path
    - title: Custom development
      description: Specific modules, automations, connectors. Delivered under a free license, in your repositories as much as in ours.
      icon: i-heroicons-wrench-screwdriver
    - title: AI engineering
      description: Integration of agents and assisted automations into your management processes, on an open, auditable base.
      icon: i-heroicons-cpu-chip
  links:
    - label: See our engineering offers
      to: /en/ingenierie
      color: primary
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

faq:
  title: Billing questions
  items:
    - label: Why bill by CPU rather than by user?
      content: Because the real cost of an instance depends on what it computes, not how many people connect to it. Per-user billing penalizes organizations that open the tool up widely, which is precisely the usage we want to encourage. If your consumption durably exceeds your plan, we agree together on moving up a tier.
    - label: Can prices increase during the contract?
      content: A revision is possible in case of a significant change in economic or regulatory conditions. It requires 60 days' written notice, and you can then cancel without penalty by notifying us within 30 days. Absent a response from you, the new prices apply on the stated date.
    - label: What is the cancellation notice period?
      content: Thirty days before the end of the current monthly period, by registered letter or email. Cancellation takes effect at the end of the month following receipt of the notice. No partial refund is issued for a period already billed.
    - label: Can I get support while self-hosting?
      content: Yes. Support packs are open to all users, including those who host Dokos themselves. Managed operations, on the other hand, require that we have control over the infrastructure or an equivalent level of access, which is what makes the deadlines achievable.
    - label: Are the prices shown up to date?
      content: They reflect the pricing in effect as of September 1, 2024, as stated in our Hosting Terms and Conditions, which remain the authoritative contractual document. In case of a discrepancy between this page and the terms and conditions, the latter prevail.


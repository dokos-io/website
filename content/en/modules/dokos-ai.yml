hero:
  title: An assistant that works <span class="text-primary">on your Dokos data</span>, with your permissions.
  description: You ask a question in your own words. Dokos AI reads your documents, runs your reports and answers, citing what it looked at. When the answer involves writing to a document, it prepares the change and waits for your approval.

for_whom:
  items:
    - title: You open the same report several times a day to get one figure
      description: You ask "which customers went over their credit limit this month". The assistant runs the receivables report, compares it with the credit limits and returns the list with each customer's overrun.
      icon: i-heroicons-chart-bar
    - title: You type the same texts into your documents again and again
      description: The AI button of a form writes or rewords an item description or the terms of an offer from the open document. You see the proposal before it replaces the field.
      icon: i-heroicons-pencil-square
    - title: A user does not understand why a screen is closed to them
      description: The assistant explains why this user cannot open the document and proposes the roles to add. You approve the assignment.
      icon: i-heroicons-lock-closed
    - title: You repeat the same procedure for each incoming request
      description: You write a skill that describes the procedure. The assistant then applies it the same way, whoever receives the request.
      icon: i-heroicons-document-text

fit:
  description: >-
    Dokos AI installs on your site and acts <strong>with the permissions of the signed-in
    user</strong>. It does not read a document you could not open, and it does not prepare an
    entry you could not make yourself. A salesperson and an accountant do not get the same answer
    to the same question.<br>
    Every creation or change of a document goes through the <strong>inbox</strong> of the Dokos
    AI workspace. You see what is proposed, on which document and at whose request, then you
    approve or reject it. A proposal that is not approved never becomes a document. Each action,
    approved or rejected, is written to the audit log with its author and the tokens used.<br>
    AI is switched off until you switch it on in the AI Settings. Before that, nothing is sent to
    a model provider.
  reads:
    - Any document the user has access to (customers, invoices, items, projects)
    - The site's reports and Insights charts
    - The Dokos documentation, the internal Wiki, Learning courses and public notes
    - Users' roles and permissions
  adds:
    - The "Dokos AI" workspace with the inbox, the conversations and workflow tracking
    - The AI button in forms and next to text fields
    - The AI Settings (model provider, capabilities, audit log)
    - Skills and automated workflows
    - An MCP endpoint that exposes the site to external assistants
  depends:
    - Dokos v5
    - An OpenRouter key

features:
  - title: Query your documents and your reports
    description: You ask for a document, a filtered list, a count or a report with your filters. The assistant looks for the answer in your data and cites what it looked at. It also searches the Dokos documentation and your internal wiki.
    badge: Conversation
  - title: Have an entry prepared, then approve it
    description: You ask "prepare a reminder for the first three". The assistant drafts the messages and waits for your agreement. The creation or change of a document arrives in the inbox, where you approve or reject it in one click.
    badge: Confirmation
  - title: Write from the form
    description: The AI button acts on the open document. Next to a text field, it proposes a text based on the document's context. The assistant also writes a print format, a client script or a workspace with its navigation.
    badge: Forms
  - title: Teach it how you work with skills
    description: A skill is a Markdown file with a YAML header. It states the area covered, the model to use, the tools allowed and reference documents. Dokos provides a library of skills (creating and editing documents, reports, print formats, permission diagnosis). You write your own for your internal procedures.
    badge: Skills
  - title: Automate a recurring task with a workflow
    description: A workflow starts on a document event, at a set time, on demand or through an external call. It drafts or compares, then drops the result into the inbox for approval. A gallery of ready-made workflows installs switched off, so that you review them before switching them on.
    badge: Automated workflows

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: In your Dokos Cloud dashboard, open the marketplace and install Dokos AI on your site. It needs no separate subscription. The price of your plan depends on server resources (see <a href="/en/tarifs">pricing</a>).
    - title: Self-hosted
      description: "<code>bench get-app https://gitlab.com/dokos/dokos-ai</code> then <code>bench --site your-site install-app dokos_ai</code>."
    - title: Switch on AI
      description: Open the AI Settings, paste your OpenRouter key and test it. Choose a model for each of the three uses (reasoning and agent, fast, OCR and vision), then switch on the capabilities you need one by one.
  prerequisites:
    - An OpenRouter account and an access key. Usage is billed by this provider.
    - A Dokos v5 site

faq:
  items:
    - label: Can the assistant change a document without me seeing it?
      content: No. An entry prepared by the assistant arrives in the inbox and waits for your approval. An automated workflow prepares and waits by default. Unattended writing must be allowed workflow by workflow, after you have checked its behaviour on several real runs.
    - label: What data goes to the model provider?
      content: Nothing before you switch AI on in the AI Settings. Once it is on, the assistant sends the model what it needs to answer the question asked. Dokos counts the tokens used at each run and shows them in the tracking and in the audit log.
    - label: Which models are used?
      content: Dokos uses models through OpenRouter, which gives access to models from Google, Anthropic, OpenAI and Mistral with a single key. You assign a model to each of the three uses (reasoning and agent, fast, OCR and vision) and you can change the assignment at any time.
    - label: How is the application built?
      content: In three layers. A registry discovers the available skills. An orchestrator decides the steps to follow. Tools carry out the actions (read, write, list, skill, reference). Each write tool asks for confirmation.
    - label: Can I talk to the assistant from Raven or from my own agent?
      content: Yes. The Raven bridge, switched on in the AI Settings, lets you send a direct message to a bot in your team messaging. For an agent installed on your computer, [Dokos CLI](/en/modules/dokos-cli) provides local MCP access. The site also exposes its own MCP endpoint, to which the user connects with their Dokos account and permissions.


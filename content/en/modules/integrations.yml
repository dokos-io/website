hero:
  title: Your <span class="text-primary">connectors</span>, webhooks and API access, in one workspace.
  description: The Integrations workspace brings together the settings of the services linked to your Dokos site. You also create the webhooks that notify your other tools when a document changes, and the OAuth clients they use to connect.
  image: /modules/integrations/hero.webp

for_whom:
  items:
    - title: You also sell outside Dokos
      description: Orders from your WooCommerce shop and sales from your Hiboutik till arrive in Dokos through their connector, whose settings are here.
      icon: i-heroicons-shopping-bag
    - title: An external tool must react when a document changes
      description: A webhook sends the fields you choose to a URL as soon as a document is created, changed, submitted or cancelled. Zapier relies on this mechanism.
      icon: i-heroicons-bolt
    - title: You write a script that reads or writes your data
      description: Each user generates an API key and secret from their profile. Calls follow the same permissions as the interface.
      icon: i-heroicons-code-bracket
    - title: You drive Dokos from an AI assistant
      description: The agent of your choice connects to your site through Dokos CLI and works on the same data, with the same safeguards.
      icon: i-heroicons-cpu-chip

fit:
  description: "The Integrations module is part of the Dodock base that Dokos runs on. It creates no business document itself: it <strong>listens</strong> to the documents of every module to trigger webhooks, and it <strong>holds</strong> the settings of the connector applications you install from the marketplace."
  reads:
    - Any document of your site, according to the DocType and the event chosen on a webhook
    - Sales Order, Item and Customer, synchronised by the WooCommerce connector
    - Hiboutik sale, turned into a Sales Invoice by the Hiboutik connector
    - Payment Request and Mode of Payment, used by the gateways of the Payments application
    - Purchase Invoice, created by eTransactions when a UBL or CII invoice is received
  adds:
    - The Integrations workspace
    - The Webhook documents and the log of sent requests
    - The OAuth Client and Social Login Key documents
    - The Connected App, for access to Google APIs through OAuth
    - The API Access section of the user profile, with the API key and API secret
    - The settings of each installed connector (Stripe Settings, WooCommerce Settings, etc.)

features:
  - title: Notify your other tools with a webhook
    description: "You choose a DocType and an event: After insert, On change, On update, On submit, On update after submit, On cancel or On trash. The Webhook Data table lists the fields sent. Dokos calls the target URL at each event and keeps a log of the requests in Integrations > Webhooks."
    badge: Webhook
  - title: Give a user API access
    description: "From their user profile, API Access section, the user generates an API key and an API secret. REST calls authenticate with this pair and follow the roles and permissions of this user: an employee reads only their own data, an HR manager their team's data. Keys are renewed from the same screen."
    badge: API key
  - title: Connect Zapier through OAuth2
    description: You create an OAuth Client with the redirect URI given by Zapier; Dokos generates the client ID and secret. A Social Login Key with the Dodock provider completes the authentication. In Zapier, the Document events trigger creates the webhooks for you, and the Create Document and Find Document actions create or look up documents.
    badge: OAuth client
  - title: Set up your business connectors in one place
    description: "Each connector application installed from the marketplace adds its settings document to this workspace: Payments for payment gateways, Dokos WooCommerce for your shop, Dokos Hiboutik for your till, and eTransactions for the approved e-invoicing platform."
    badge: Connectors

install:
  description: The Integrations module is part of Dodock and Dokos. There is no separate application to install. Connectors are installed one by one.
  steps:
    - title: On Dokos Cloud
      description: The Integrations workspace is part of Dokos. It is on your site from its creation. Connectors (Payments, WooCommerce, Hiboutik, eTransactions, Dokos AI) are installed from the marketplace in your Dokos Cloud dashboard.
    - title: Self-hosted
      description: "Install Dokos: <code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>. Each connector has its own repository, given on its product page."
    - title: First use
      description: Create a webhook on a test DocType and check the request received. For API access, generate a key from the profile of a dedicated user, with the minimum role needed.

faq:
  items:
    - label: What is the difference between a webhook and the API?
      content: "The webhook starts from Dokos: at each event on a document, Dokos calls the URL you set with the chosen fields. The API starts from your tool: it calls Dokos with an API key to read or write documents."
    - label: Can a script with an API key read everything?
      content: No. Each call follows the roles and permissions of the user whose key is used, as in the web interface. Create a dedicated user with the minimum role and renew their keys regularly.
    - label: Do I need development work to connect Zapier?
      content: No. You create an OAuth Client and a Social Login Key in Dokos, then you enter your site URL, the client ID and the secret in Zapier. The Zapier application for Dokos is in beta, by invitation.
    - label: How do I access Google APIs from Dokos?
      content: Through a Connected App configured with OAuth, which gets lasting offline access to Google APIs. The Dodock documentation describes the setup and token renewal.


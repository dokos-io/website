  title: Maximize your productivity with <span class="text-primary">Dokos integrations</span>
  description: 'Streamline your processes, gain efficiency, and stay focused on what truly matters: growing your business. <br>With an ever-evolving ecosystem, Dokos adapts to your needs and gives you access to powerful tools while keeping a simple, intuitive interface.'
  links:
    - label: Build a harmonious ecosystem
      to: https://cloud.dokos.io
      size: sm

bridge_before_colored_section:
  title: "Explore your data in depth"
  description: "Simply build interactive dashboards, generate custom reports in a few clicks, or view your data in real time. With Insights' intuitive, flexible interface, you can dig deeper into your data and tailor analytics to your specific needs, with no extra costs to worry about"
features_before_colored_section:

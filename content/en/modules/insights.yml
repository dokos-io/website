    - title: Reports built for you
      icon: i-material-symbols-bar-chart-4-bars-rounded
      class: "col-span-4 row-span-3"
    - title: Intuitive visualization
      icon: i-material-symbols-pivot-table-chart-rounded
      class: "col-span-4 row-span-3"
    - title: Real time tracking
      icon: i-material-symbols-alarm-on-outline-rounded
      class: "col-span-4 row-span-3"

colored_section:

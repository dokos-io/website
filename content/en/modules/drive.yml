# English version of content/fr/modules/drive.yml (sources and screenshot notes are there).
# Status from the FR source comment: the frappe/drive repository is archived (notice added 1 October 2026)
# and Drive is now part of Frappe Suite (github.com/frappe/suite, marked WIP). TODO (user decision): remove
# this page or replace it with a Frappe Suite page.

navigation:
  title: Frappe Drive
  icon: i-heroicons-folder-open
  description: File storage, sharing and document editing on your Dokos site.

title: Frappe Drive
icon: i-heroicons-folder-open
description: Stores and shares your files on your Dokos site. Frappe has archived the application, which is moving into Frappe Suite.
application: Frappe Drive
theme: site-web-outils-numeriques
author: Frappe Technologies and contributors
logo:
  light: /frappe/drive.svg
  dark: /frappe/drive.svg

publisher: frappe
licence: AGPLv3
version: v5
marketplace: drive
docs: https://docs.frappe.io/drive/introduction
related: [wiki, raven, support, builder]

hero:
  title: Your team files, <span class="text-primary">stored and shared</span> from your Dokos site.
  description: >-
    Frappe Drive adds a file space to your site, with the users and groups you already have.
    Frappe archived the Drive repository in October 2026: its features are moving into Frappe Suite, still in development.
    For a new project, talk to us about Suite first.

for_whom:
  items:
    - title: Your team files live with a third-party service
      description: You store them on your Dokos site and share them with the site's users and groups.
      icon: i-heroicons-folder
    - title: You write documents together
      description: The Writer editor lets several people write at the same time, annotate, reply to annotations and keep versions.
      icon: i-heroicons-pencil-square
    - title: You need to send a folder to an outside partner
      description: You create a guest user with limited access, or you publish the file.
      icon: i-heroicons-user-plus

fit:
  description: >-
    Frappe Drive installs on your Dokos site and uses its <strong>Users</strong> and
    <strong>User Groups</strong>. You open the /drive interface, upload your files and folders, then share
    each one with a user, a group or the whole site, or publish it.<br>
    Storage is pooled for all users, or allocated to each user by quota.
  reads:
    - User
    - User Group
  adds:
    - The /drive interface
    - Drive files and folders, their shares and their activity log
    - The Writer document editor
    - Guest users and storage quotas
  depends:
    - Dodock

features:
  - title: Upload whole folders
    description: Large files are uploaded in several parts. An uploaded folder keeps its tree. Videos are streamed from the server.
    badge: Upload
  - title: Share and find your files
    description: You share a file or a folder with a user, a group or the whole site, or you publish it. Search covers your files and those shared with you. The activity log shows changes to permissions and metadata.
    badge: Sharing
  - title: Write together with Writer
    description: Several users, or guests, edit a document at the same time. You annotate, reply and resolve annotations. Versions are saved by hand or automatically, and a .docx file can be imported into the editor.
    badge: Documents
  - title: Open your files in the browser
    description: Many file types are previewed without downloading. The list of supported formats is kept in the Frappe Drive documentation.
    badge: Preview

install:
  steps:
    - title: For a new project, look at Frappe Suite
      description: >-
        Frappe Suite brings Drive, Writer, Sheets, Slides, Meet, Mail and Calendar together in one application (github.com/frappe/suite).
        Frappe still marks it as in development. Write to us to discuss it before you install it.
    - title: If your site already uses Drive
      description: >-
        The application is still listed on the Dokos Cloud marketplace. The frappe/drive repository is archived:
        plan the move to Suite with us.
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/drive --branch develop</code> then <code>bench --site your-site install-app drive</code>. The develop branch declares Frappe v15 to v17."
  prerequisites:
    - A Dokos V5 site
    - When self-hosting, the ffmpeg and libmagic system packages

faq:
  items:
    - label: Can I share a file with someone who has no account?
      content: Yes. You publish the file, or you create a guest user with limited, controlled access.
    - label: How is storage space allocated?
      content: Storage is pooled for all the site's users, or allocated to each user by quota.
    - label: Does Frappe Drive replace my backups?
      content: No. The Frappe Drive README advises self-hosters not to make it their only file store and to keep a backup strategy.
    - label: Is Frappe Drive still maintained?
      content: >-
        Frappe archived Drive in October 2026. The frappe/drive repository states that Drive is now part of
        Frappe Suite (github.com/frappe/suite), an application that also includes Writer, Sheets, Slides, Meet, Mail and Calendar.
        Suite is published under the AGPLv3 licence and still marked as in development. For a new site, talk to us about Suite.

bottom_cta:
  title: You use Frappe Drive or want to replace it.
  description: Describe your volumes and uses, and we will prepare the move to Frappe Suite with you.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See the marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

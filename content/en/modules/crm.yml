# English version of content/fr/modules/crm.yml (sources and screenshot notes are there).

navigation:
  title: Frappe CRM
  icon: i-carbon-chart-relationship
  description: Prospecting and deal tracking, from first contact to the Dokos quotation.

title: Frappe CRM
icon: i-carbon-chart-relationship
description: Track your leads and deals in an interface built for sales, then create the quotation in Dokos.
application: Frappe CRM
theme: vente-relation-client
author: Frappe Technologies and contributors
logo:
  light: /frappe/crm.svg
  dark: /frappe/crm.svg

publisher: frappe
licence: AGPLv3
version: v5
marketplace: crm
docs: https://docs.frappe.io/crm/introduction
related: [ventes, telephony, newsletter, support]

hero:
  title: Your leads and deals, <span class="text-primary">tracked up to the quotation</span> in Dokos.
  description: >-
    Frappe CRM gives your sales team an interface built for prospecting.
    When a deal is won, the customer and the quotation are created in your Dokos site.

for_whom:
  items:
    - title: Your leads are scattered across mailboxes and spreadsheets
      description: >-
        Each lead has its own page, with its e-mails, notes, tasks and calls in one place.
      icon: i-heroicons-inbox-stack
    - title: Your sales staff do not want to work in the Dokos desk
      description: >-
        They work in the /crm interface, as a list or a Kanban board. The quotation and the customer then go to Dokos with no re-keying.
      icon: i-heroicons-presentation-chart-line
    - title: Incoming requests wait for someone to pick them up
      description: >-
        Assignment rules share out new leads in turn, or to the person who has the fewest.
      icon: i-heroicons-arrows-right-left

fit:
  description: >-
    Frappe CRM installs on the same site as Dokos. In <strong>Settings > ERPNext</strong>, you enable the
    integration and choose the company. When a deal reaches the Won status, or the status you have chosen,
    the CRM creates the <strong>Customer</strong> in Dokos and links the organisation's contacts and address
    to it. The Create Quotation button opens a Dokos <strong>Quotation</strong> filled in with the contact, the
    address and the product lines.<br>
    Dokos Items feed the CRM Products. The price of a line comes from the customer's price list, or from the
    default selling price list.
  reads:
    - Item and Item Price
    - Customer, Contact and Address
    - Quotation, then Sales Order
    - Email Account
  adds:
    - The /crm interface, as a list and a Kanban board
    - The Lead, Deal, Organization, Note, Task and Call Log documents
    - Assignment rules, SLAs and e-mail templates
  depends:
    - Dodock
    - Dokos for customers and quotations

features:
  - title: Qualify your leads and convert them into deals
    description: >-
      You create a lead by hand, by CSV import, from a web form or from your Meta ads. Its status follows your
      qualification (New, Contacted, Qualified, Unqualified). The Convert to Deal button creates the
      organisation and the contact, or links them to existing records. The deal then moves from stage to
      stage until Won or Lost.
    badge: Leads and deals
  - title: Write to your leads from their page
    description: >-
      You connect an e-mail account in Settings > Email. Messages sent and received appear on the lead or
      deal page. You use e-mail templates and a signature. An option creates a lead from an unknown sender.
    badge: E-mail
  - title: Keep a record of each exchange
    description: >-
      On a lead's page, you add a note, create a follow-up task, log a call and leave a comment that mentions a
      colleague. The whole team's tasks are in the Tasks view.
    badge: Follow-up
  - title: Share out leads and set follow-up times
    description: >-
      Assignment rules distribute new leads in turn, or to the person with the lowest workload. SLAs set the
      first response time. The sales hierarchy limits what each user sees.
    badge: Assignment
  - title: Call from the CRM
    description: >-
      With Twilio or Exotel, you make and receive calls from the record, and the calls are logged. The Frappe
      WhatsApp application sends and receives WhatsApp messages from the same page.
    badge: Telephony

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: >-
        In your Dokos Cloud dashboard, open the marketplace and install CRM on your site.
        The application is included in every plan.
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/crm</code> then <code>bench --site your-site install-app crm</code>."
    - title: Enable the Dokos integration
      description: >-
        In /crm, open Settings > ERPNext, enable the integration and choose the company.
        Set the currency in Settings > Defaults before you create the first deal.
  prerequisites:
    - A Dokos V5 site (Frappe CRM, main branch, works with Frappe v15 and v16)
    - A Twilio or Exotel account for telephony, the Frappe WhatsApp application for WhatsApp

faq:
  items:
    - label: Do I need Dokos to use Frappe CRM?
      content: >-
        Frappe CRM runs on Dodock alone. Creating the customer and the quotation, and syncing items, need Dokos
        on the same site.
    - label: Is the number of users limited?
      content: >-
        No. Frappe CRM does not limit the number of users. You invite them in Settings > Invite User, with the
        Sales User, Sales Manager or Admin role.
    - label: How do leads come in?
      content: >-
        By hand, by CSV import from the lead list, through a web form created in Settings > Forms, or by
        syncing Meta ads in Settings > Lead Syncing.
    - label: Do CRM prices follow the Dokos prices?
      content: >-
        Yes. Dokos is the reference: creating, updating or deleting an Item is passed on to the CRM Product.
        The price comes from the Item Price of the selling price list, and a deal uses the customer's price
        list.
    - label: Under which licence is Frappe CRM published?
      content: >-
        GNU Affero General Public License v3.0 (AGPLv3), according to the licence file of the frappe/crm
        repository.


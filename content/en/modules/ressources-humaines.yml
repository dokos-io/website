features:
  - title: Simple employee management
    description: Easily manage your employees' profiles, positions, and departments. <br><br>Track contracts and structure your organization. <br><br>The full employee lifecycle is covered, from onboarding through promotions, transfers, and departures.</br>
    image: "image/module-rh/un-rh-gestion-des-employes.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Employee management
      color: sky
  - title: Attendance and scheduling
    description: Track attendance with time clocks or biometric integration.<br><br> Automate attendance and shift management with flexible tools for scheduling, handling change requests, and assigning tasks efficiently.</br>
    image: "image/module-rh/deux-presence-et-horaires.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Attendance and scheduling
      color: sky
  - title: Leave management
    description: Create and customize your leave policies, leave types, and holiday lists. <br><br>Manage leave requests with clear approval workflows, including compensatory leave requests.</br>
    image: "image/module-rh/trois-gestion-des-conges.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Leave
      color: sky
  - title: Expenses and advances
    description: Manage employee advances, expense claim requests, and their approval.
    image: "image/module-rh/quatre-note-de-frais-modifie.svg"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Expenses
      color: sky
  - title: Performance reviews
    description: Create templates and track your employees' review cycles. <br><br>Collect feedback, track goals, and run regular reviews to improve your teams' performance.</br>
    image: "image/module-rh/cinq-evaluation.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Performance
      color: sky
  - title: Simplified recruitment
    description: Manage your job postings, candidates, and interviews. <br><br>Dokos also offers an employee referral system and automates job posting generation.</br>
    image: "image/module-rh/six-tableau-de-bord-offre-demploi.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Recruitment
      color: sky
  - title: Training and development
    description: Plan and track training programs, events, results, and participant feedback to support your employees' development.
    image: "image/module-rh/sept-programme-formation.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Training
      color: sky
  - title: Real-time reports and analytics
    description: Generate detailed, up-to-date reports on attendance, leave balances, and review data.
    image: "image/module-rh/tableau-bord-presences.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Reports
      color: sky
  - title: An online portal for your employees
    description: With Dokos, your employees get a portal to view their data, submit leave requests, and track expenses on their own.
    image: "image/module-rh/applications-demande-de-conges.svg"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Portal
      color: sky
  - title: A simple mobile app
    description: Make everyday life easier for your employees, even on the move, for leave, expenses, and timesheet management.
    image: "image/module-rh/application-rh-seul.svg"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Application
      color: sky


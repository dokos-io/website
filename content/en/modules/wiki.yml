# English version of content/fr/modules/wiki.yml (sources and screenshot notes are there).

navigation:
  title: Wiki
  icon: i-heroicons-book-open
  description: Documentation and procedures published from your site, reviewed before publication.

title: Wiki
description: Publishes your documentation and procedures as web pages from your site, with a revision history and a review of changes before publication.
icon: i-heroicons-book-open
application: Frappe Wiki
theme: support-collaboration
author: Frappe Technologies
logo:
  light: /frappe/wiki.png
  dark: /frappe/wiki.png

publisher: frappe
licence: MIT
version: v5
marketplace: wiki
related: [support, raven, dokos-ai, learning]

hero:
  title: Your procedures and documentation, <span class="text-primary">published from your site</span>.
  description: You write a page in Markdown, and it is online with no redeployment. Each change is kept in the history and can go through an approval before publication.

for_whom:
  items:
    - title: Your internal procedures are scattered across files
      description: You write them as wiki pages, organised by space, with a sidebar and a table of contents generated from the headings.
      icon: i-heroicons-folder-open
    - title: You publish product documentation for your customers
      description: A wiki page is a web page of your site. You fix a sentence or add a page with no service interruption.
      icon: i-heroicons-globe-alt
    - title: A change must be reviewed before it goes online
      description: A contributor proposes a change. A reviewer approves it, and the published page changes at that moment.
      icon: i-heroicons-check-circle

fit:
  description: >-
    Wiki installs on your site and serves its pages as web pages of that site. Pages are organised
    in <strong>wiki spaces</strong>, each with its own sidebar. Contributors sign in with their Dokos
    account. The revision history keeps every version of a page.<br>
    If <a href="/en/modules/dokos-ai">Dokos AI</a> is installed, the assistant searches your internal
    wiki to answer your users' questions.
  reads:
    - The site's user accounts, for editing and approval
  adds:
    - The Wiki Page, Wiki Space and Wiki Group documents
    - The Wiki Settings, with support for custom scripts
    - Pages published under your spaces' addresses
    - The revision history and the changes waiting for approval
  depends:
    - Dodock v5

features:
  - title: Write in Markdown, with attachments
    description: You write the page in Markdown in the editor. You attach files to the page. The table of contents is generated from the headings.
    badge: Writing
  - title: Organise pages in spaces
    description: A wiki space groups pages on one subject and has its own sidebar. You reorder the sidebar by drag and drop and you group pages.
    badge: Spaces
  - title: Have changes reviewed before publishing
    description: A proposed change waits for a reviewer's approval. The published page changes only once the change is approved.
    badge: Approval
  - title: Find every version
    description: The revision history keeps every version of a page. You open a past version and see what changed.
    badge: Revisions

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: In your Dokos Cloud dashboard, open the marketplace and install Wiki on your site. The marketplace asks no subscription for Wiki.
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/wiki</code> then <code>bench --site your-site install-app wiki</code>."
    - title: Create a first space
      description: Open the desk, create a Wiki Space with its address, then a first Wiki Page. The page is online at the space's address.

faq:
  items:
    - label: In which format are pages written?
      content: In Markdown. The table of contents is generated from the page's headings.
    - label: Can a change be published without review?
      content: The wiki has an approval mechanism. A proposed change waits for a reviewer to approve it before the published page changes.
    - label: Can I go back to a previous version?
      content: Yes. The revision history keeps every version of a page.
    - label: Does Dokos AI read the wiki?
      content: Yes. The Dokos AI assistant searches the internal wiki, Learning courses and public notes to answer your users' questions.
    - label: Can I take over an existing wiki?
      content: The Frappe Wiki documentation includes a migration guide. Describe your current tool so that we can estimate the takeover.

bottom_cta:
  title: Tell us what you want to document.
  description: We will show you Wiki on a demo site, with a space and a reviewed page.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See the marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

colored_section:
  title: "Centralize and organize your organization's knowledge"
  description: "At Dokos, we're glad to offer our customers Frappe Wiki, a powerful knowledge management tool built by the innovative team behind Frappe. Thanks to their work, we can provide you with a robust open-source solution, at no extra cost, that improves how information is shared across your company. With Frappe Wiki, you can easily centralize and organize your organization's knowledge, keeping information accessible, up to date and directly usable."
  image: "image/wiki/wiki.png"
  align: left

features:
  - title: "Build a simple, effective knowledge base"
    description: "Frappe Wiki gives you a smooth platform for building and managing a knowledge base. Whether you're documenting internal processes, user guides or project notes, its intuitive interface lets every team member contribute, edit and organize information with ease."
    image: "image/wiki/wiki.png"
    image_bg_color: bg-teal-500
    align: right
  - title: "Make search effortless"
    description: "No more endless searching. With its powerful search engine, Frappe Wiki makes sure the right information is always within reach. Your teams can find articles by category, tag or keyword, cutting down significantly on the time spent hunting for critical data."
    image: "image/wiki/wiki-recherches.png"
    image_bg_color: bg-teal-500
    align: left
  - title: "Work with peace of mind thanks to version control"
    description: "One of Frappe Wiki's biggest strengths is its version management, which tracks every change made to an article. That means you can always roll back to a previous version and keep your knowledge base accurate and reliable."
    image: "image/wiki/wiki-version.png"
    image_bg_color: bg-teal-500
    align: right
  - title: "Collaborative knowledge sharing"
    description: "Teams can collaborate in real time, contributing valuable ideas and expertise. With easy-to-use commenting features, feedback and updates become part of the documentation process, keeping everyone on the same page."
    image: "image/wiki/wiki.png"
    image_bg_color: bg-teal-500
    align: left
  - title: "Secure access to sensitive information"
    description: "Have sensitive information to protect? With Frappe Wiki, you can set granular permissions to control who can view or edit articles, keeping data secure while still encouraging collaboration across the organization."
    image: "image/wiki/wiki-securise.png"
    image_bg_color: bg-teal-500
    align: right

bridge:
  title: "Why trust Dokos?"
  description: "At Dokos, we have deep respect for the excellent work done by the Frappe team. By offering Frappe Wiki to our customers, we're proud to carry forward their open-source vision and commitment to innovation. Our mission is to give companies the best tools available, and we believe Frappe Wiki delivers real value for boosting productivity and collaboration."
  align: center

carousel:
  cards:
    - title: "100% open source, no hidden costs"
      description: "With Frappe Wiki, you get a cost-effective knowledge management tool that grows with your business, with no costly subscription or hidden fees."
    - title: "A trusted, worldwide community"
      description: "Frappe Wiki and Dokos are used by thousands of companies around the world, across sectors such as manufacturing, services and distribution. By choosing Frappe Wiki, you join an international community of innovators and forward-thinking companies."

bottom_cta:
  title: "Ready to transform how you manage knowledge?"
  description: "Whether you want to streamline internal processes, boost efficiency, or simply make information easier for your teams to find, Frappe Wiki is the tool for the job. At Dokos, we're glad to help you unlock its full potential. <br> Get started today!</br>"
  card: true
  class: bg-amber-600/10 dark:bg-amber-800/10
  links:
    - label: Create your first wiki page
      size: md
      color: gray
      to: https://cloud.dokos.io
      target: _blank
    - label: Learn more about Frappe Wiki
      size: md
      variant: 'link'
      color: gray
      to: https://frappe.io/wiki
      target: _blank
      icon: i-heroicons-outline-arrow-right
      trailing: true

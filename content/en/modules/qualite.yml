features:
  - title: Structured, efficient quality inspections
    description: "Plan, run, and track inspections at every stage of your production chain.<br><br> With Dokos, you define precise checkpoints and specific acceptance criteria to make sure every product meets your quality requirements. <br><br>With automated reminders and detailed reporting, your teams gain efficiency and leave nothing to chance. <br><br>The result: full control over compliance and fewer errors.</br>"
    image: "image/qualite/inspection-qualite.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Quality inspection
      color: sky
  - title: Custom control plans
    description: "Dokos lets you create control plans tailored to your products and processes. <br><br>Standardize your quality control procedures for consistency across every inspection. <br><br>You gain the assurance that your quality requirements are met rigorously, while simplifying operational management for your teams.<br><br>With this systematic approach, your inspections become more precise and less prone to human error.</br>"
    image: "image/qualite/procedure-qualite.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Custom control plans
      color: sky
  - title: "Proactive non-conformance management"
    description: Identify, track, and correct anomalies with a simple, effective non-conformance management system.<br><br> As soon as an issue is detected, log the details, assign the necessary corrective actions, and track their resolution.<br><br> With full traceability, you get a clear view of non-conformances and can analyze trends to put preventive actions in place. This lets you react quickly and continuously improve the quality of your products.</br>
    image: "image/qualite/non-conformite.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Non-conformance
      color: sky
  - title: Corrective and Preventive Actions (CAPA)
    description: "Corrective and preventive actions (CAPA) are essential to maintaining a consistent quality level.<br><br> With Dokos, analyze the root causes of non-conformances, put corrective actions in place, and anticipate problems with preventive measures.<br><br> Automate tracking of every action to make sure each step is completed on time. <br><br>This reduces risk and improves the reliability of your processes.</br>"
    image: "image/qualite/action-qualite.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: CAPA
      color: sky
  - title: Improve your suppliers' quality
    description: "The quality of your products also depends on your suppliers. <br><br>Dokos lets you track your partners' quality performance through regular audits and product inspections.<br><br> If an issue arises, manage supplier complaints transparently and put corrective actions in place. <br><br>Centralize all supplier quality information to make decisions based on reliable data.</br>"
    image: "image/qualite/evaluation-fournisseurs.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Complaints
      color: sky
  - title: Analytics and dashboards to support you
    description: "Improve quality with dashboards and statistical tools. <br><br>Go further and build all the statistical analyses you need yourself, with Insights and Dokos' no-code tools. "
    image: "image/qualite/rapport-inspections.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: SPC
      color: sky
  - title: Continuous improvement at the heart of your processes
    description: "The Dokos Quality module includes continuous improvement tools to optimize your operations.<br><br> Whether with methodologies like Kaizen, Lean, or 5S, Dokos helps you identify opportunities for improvement and measure your gains in quality and efficiency. <br><br>Make continuous improvement part of your organization's culture to stay competitive and agile.</br>"
    image: "image/qualite/reunion-qualite.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Process improvement
      color: sky


publisher: dokos
licence: GPLv3
version: v5
marketplace: erpnext
docs: https://doc.dokos.io/v5/dokos/qualite
related: [production, stocks, achats, support]

hero:
  title: Your <span class="text-primary">quality procedures</span>, their goals and the deviations found, in your Dokos site.
  description: You describe your procedures, set goals measured at a set frequency and record non-conformances. Each deviation leads to a corrective or preventive action, tracked until it is closed.
  image: /modules/qualite/hero.webp

for_whom:
  items:
    - title: Your procedures live in office files
      description: You enter them in Dokos as steps, with sub-procedures. The tree view shows them as a hierarchy, and one procedure can belong to several parents.
      icon: i-heroicons-document-text
    - title: You track quality indicators by hand
      description: A quality goal carries a target and a monitoring frequency. Dokos creates the matching review at each due date, and you enter the actual value in it.
      icon: i-heroicons-chart-bar
    - title: You check goods at receipt or in the workshop
      description: A quality inspection, with its readings and acceptance criteria, blocks the submission of the purchase receipt or the job card until it has been done.
      icon: i-heroicons-magnifying-glass
    - title: Your customers give you feedback that nobody follows up
      description: You record quality feedback, rated parameter by parameter, and you open a quality action when the rating does not reach the expected level.
      icon: i-heroicons-chat-bubble-left-ellipsis

fit:
  description: "The Quality module is part of Dokos. Its documents attach to the procedures you define. The <strong>quality inspection</strong>, filed in the Stock module, is triggered on movement documents: an item set up for inspection cannot be received, delivered or manufactured without an inspection."
  image: /modules/qualite/fit.webp
  reads:
    - Customer and User, as the source of quality feedback
    - Purchase Receipt, Delivery Note, Stock Entry and Job Card, for inspections
    - Item, which carries the inspection template and turns inspection on
  adds:
    - The Quality Procedure document (with its tree view) and the Quality Goal document
    - Quality Review documents, created automatically according to the goal's frequency
    - The Non Conformance and Quality Action documents
    - The Quality Feedback and Quality Feedback Template documents
    - The Quality Meeting document
    - The Quality Inspection and Quality Inspection Template documents

features:
  - title: Describe your procedures as a tree
    description: A quality procedure is a list of steps entered in the Processes table, or a group of sub-procedures linked through the Procedure field. The tree view shows the whole set as a hierarchy. Unlike ERPNext, Dokos lets you attach a procedure to several parents, so that you do not duplicate a shared inspection step.
    badge: Quality procedure
  - title: Set goals and let the reviews create themselves
    description: A quality goal names an owner, the procedure to follow and a monitoring frequency (daily, weekly, monthly or quarterly). Its table lists the objectives, their target and their unit of measure. At each due date, Dokos creates a quality review with the Open status. You enter the actual measurements in it, then you create a quality action if needed.
    badge: Goal and review
  - title: Record non-conformances and track the actions
    description: Anyone in the organisation can report a non-conformance against an existing procedure, with its subject and details. You describe the corrective action, which deals with the cause, and the preventive action, which stops it from happening again. A quality action carries its type, the problem found, the proposed resolution, an owner and an end date. Its status goes from Open to Closed.
    badge: Non-conformance
  - title: Collect feedback from your customers and users
    description: You choose the source of the feedback, a customer or a user of the site, then a feedback template that fills in the parameters to rate. Each line gets a rating from 1 to 5 and a comment. When the feedback is below expectations, you open a quality action from it.
    badge: Quality feedback
  - title: Inspect items at receipt, at delivery and in the workshop
    description: "An inspection template, attached to the item, defines the readings to take and their criteria: a numeric range, an expected value or a formula. When you save, a reading outside the criteria changes to Rejected. The Manual Inspection checkbox lets the inspector set the status. Since Dokos V5, an inspection can be required at each operation of a bill of materials."
    image: /modules/qualite/feature-inspection.webp
    badge: Quality inspection

install:
  description: The Quality module is part of Dokos. There is no separate application to install.
  steps:
    - title: On Dokos Cloud
      description: The module is part of Dokos. It is on your site from the day it is created. Open Home > Quality.
    - title: Self-hosted
      description: "Install Dokos: <code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: First settings
      description: Enter your quality procedures, then your goals. For inspections, create an inspection template and turn inspection on for the items concerned.

faq:
  items:
    - label: Can a non-conformance be reported without a procedure?
      content: No. The non-conformance is attached to the quality procedure that was not followed. Create the procedure first.
    - label: Who can report a non-conformance?
      content: Anyone in the organisation who has access to the module. The document records the subject, the procedure concerned and the details of the observation.
    - label: Where is the quality inspection?
      content: In the Stock module, because it is triggered on the purchase receipt, the delivery note, the stock entry and the job card. The inspection template is attached to the item.
    - label: Are quality reviews created automatically?
      content: Yes, as soon as a monitoring frequency is set on the quality goal. The review is created with the Open status, and the quality manager completes and closes it.


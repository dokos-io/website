hero:
  title: From the internal request to the supplier invoice, <span class="text-primary">each step leaves a document</span>.
  description: The Dokos Purchasing module links the material request, the supplier quotation, the purchase order, the receipt and the purchase invoice. Each document picks up the previous one.

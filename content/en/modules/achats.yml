for_whom:
  items:
    - title: Your teams order by e-mail
      description: They enter a material request. You turn it into a purchase order and choose the supplier of each item.
      icon: i-heroicons-inbox-arrow-down
    - title: You compare suppliers in a spreadsheet
      description: Each reply becomes a supplier quotation in Dokos. You create the order from the quotation you select.
      icon: i-heroicons-scale
    - title: Your supplier invoices arrive as e-invoices
      description: Invoices received from your approved platform appear in the e-invoice list of the Purchasing module and become purchase invoices.
      icon: i-heroicons-document-arrow-down
    - title: A supplier delivers late and nobody records it
      description: The supplier scorecard calculates a score per period from the receipts and can block new orders.
      icon: i-heroicons-chart-bar

fit:
  description: >-
    A material request starts in Stock or from a sales order. It becomes a purchase order in Purchasing. The
    purchase receipt puts the items into stock and, if an inspection is required, goes through Quality. The
    purchase invoice posts to Accounting and is paid with a payment entry. With eTransactions, the e-invoices
    you receive feed this chain directly.
  image: /modules/achats/fit.webp
  reads:
    - Supplier, Contact and Address
    - Item, Item Price and Warehouse
    - Material Request (Stock)
    - Sales Order, for drop shipping
    - E-invoices received from the approved platform (eTransactions)
  adds:
    - The Purchasing workspace and Buying Settings
    - Supplier Quotation and Purchase Order
    - Purchase Receipt (in Stock) and Purchase Invoice (in Accounting)
    - Supplier Scorecard, with its periods and criteria
    - Purchase Taxes and Charges Template, Pricing Rules and Promotional Schemes on the buying side
  depends:
    - Stock
    - Accounting
    - Quality
    - eTransactions

features:
  - title: The material request, where a purchase starts
    description: >-
      A material request states a need for items or services, of type Purchase, Material Transfer,
      Manufacture or Customer Provided. You enter it by hand, or Dokos creates it when an item's stock falls
      below its reorder level in a warehouse, with the item's default quantity. From the request, Create >
      Purchase Order opens a dialog that suggests each item's default supplier and creates one order per
      supplier.
    image: /modules/achats/feature-demande.webp
    badge: Material request
  - title: Supplier quotations compared in Dokos
    description: >-
      You send your request for quotation to several suppliers. Each reply is entered as a supplier
      quotation, with its prices and lead times. From the purchase order, Get Items From > Supplier Quotation
      copies the lines of the quotation you select. Suppliers blocked by their scorecard are not suggested.
    badge: Supplier quotation
  - title: An order that follows the receipt and the invoice
    description: >-
      The purchase order takes the address, contact and currency from the supplier record. Its items come
      from an open material request or a supplier quotation. Once it is submitted, you create the purchase
      receipt, the purchase invoice and the payment entry from it. In drop shipping, the purchase order stays
      linked to the sales order, and the Update Delivered Quantity button recalculates the customer's
      delivery percentage. The over-delivery allowance also applies to orders created from a material
      request.
    badge: Purchase order
  - title: Receipt, inspection and purchase invoice
    description: >-
      The purchase receipt confirms the quantities received and puts them into stock. If the item requires
      it, a quality inspection comes before acceptance, and a purchase return sends back what is rejected.
      The purchase invoice links to the order or the receipt. E-invoices received from your approved platform
      appear in the e-invoice list with their status. Dokos creates the purchase invoice as a draft. You check
      the amount and the due date, match it with the order, then you approve the invoice, or you reject it
      with a reason that is sent back to the platform.
    badge: Receipt and invoice
  - title: A scorecard for each supplier
    description: >-
      You create a scorecard for each supplier, evaluated per week, month or year. Each criterion (quality
      of the items received, delivery time, response time to requests for quotation) has a formula built on
      variables such as the quantities received, accepted or rejected, and a weight. The weights add up to
      100. The current score weights the last twelve periods. Depending on the standing, Dokos shows a
      warning or blocks requests for quotation and purchase orders for this supplier.
    badge: Supplier evaluation

install:
  description: The Purchasing module is part of Dokos. There is nothing else to install.
  steps:
    - title: On Dokos Cloud
      description: Create your site from your Dokos Cloud dashboard. Dokos is installed with the Purchasing module. Included in every plan.
    - title: Self-hosted
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: To receive e-invoices
      description: Install the eTransactions application from the marketplace and enter the connection to your approved platform.

faq:
  items:
    - label: Can a material request cover several suppliers?
      content: >-
        Yes. The Create > Purchase Order dialog asks for a supplier for each item. If all items have the same
        supplier, Dokos creates one order. Otherwise it creates one order per supplier.
    - label: Can I remove an item from an order that has already been received?
      content: >-
        No. Items already received can no longer be removed from the purchase order.
    - label: What happens to an e-invoice that I do not process?
      content: >-
        After the delay configured on the approved platform, its status changes to Abandoned. You can still
        open it and reactivate it by hand. A rejected invoice cannot be brought back automatically: you ask
        the supplier to send it again.
    - label: How do I avoid ordering from a supplier with a poor score?
      content: >-
        On the supplier's scorecard, you link an action to a standing: a warning when a request for quotation
        or an order is created, or a block on these documents for this supplier.


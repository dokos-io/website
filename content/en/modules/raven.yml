colored_section:
  title: Change your everyday workflow with AI
  description: Raven is the AI-powered module built into Dokos that changes the way you work. With its assistant, you can automate complex tasks, extract data more easily, and collaborate more efficiently across your company.
  image: image/raven/raven-exemple.png
  align: left
features:
  - title: Build smart automations
    description: Create your own bots without writing a line of code. Raven helps you automate complex business processes while adapting to the context of each task.
    image: image/raven/raven-exemple.png
    image_bg_color: bg-teal-500
    align: right
  - title: Streamline your day with the Dokos integration
    description: Share, print, and work on your documents directly from the Raven chat, without leaving your Dokos interface.
    image: image/raven/raven-exemple.png
    image_bg_color: bg-teal-500
    align: left
  - title: Improve your collaboration
    description: Chat, share files, and follow your conversations in organized threads so you never lose track.
    image: image/projet/communication-raven.png
    image_bg_color: bg-teal-500
    align: right

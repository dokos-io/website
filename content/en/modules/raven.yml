hero:
  title: Team messaging <span class="text-primary">in your Dokos site</span>.
  description: Raven installs on your site. Your messages stay in your database, and a link to a quotation or an order is shown as a card with its status.

for_whom:
  items:
    - title: Your team chats in a tool separate from your management software
      description: You paste a link to an order and Raven shows its card, with its status and key fields. The discussion sits next to the document.
      icon: i-heroicons-link
    - title: An approval is waiting in a mailbox
      description: The document to approve is posted in a channel when it is created or submitted. You approve it, reject it or send it back from the conversation.
      icon: i-heroicons-check-badge
    - title: Your field teams only have a phone
      description: The iOS and Android apps connect to your site. Every channel is there, in sync with the web version.
      icon: i-heroicons-device-phone-mobile
    - title: You pay a per-user subscription for your chat
      description: Raven installs on your Dokos site, with no per-user subscription. The price of Dokos Cloud depends on server resources.
      icon: i-heroicons-users

fit:
  description: >-
    Raven runs on your site, next to Dokos, Dokos HR, the CRM and Helpdesk. You paste a
    document's link and Raven shows <strong>a card with its status and key fields</strong>. A
    document notification posts a message in a channel when a document is created, changed or
    submitted, with the conditions and message template you set without writing code. You approve,
    reject or send back a document without leaving the conversation. Leave entered in Dokos HR is
    shown next to the person's name.<br>
    If <a href="/en/modules/dokos-ai">Dokos AI</a> is installed, you talk to the assistant by
    direct message to a bot, without leaving Raven. This bridge is enabled in the AI Settings.
  reads:
    - Any document of the site, shown as a card from its link
    - Document events (creation, change, submission) for notifications
    - Leave applications from Dokos HR
  adds:
    - The Raven application, at /raven on your site
    - Workspaces, public or private channels and direct messages
    - Raven bots, incoming webhooks and AI agents
    - iOS and Android mobile apps, and an installable web app
  depends:
    - Dodock v5 (Frappe v16)

features:
  - title: Organise conversations in channels and threads
    description: You create public or private channels per team, project or topic, grouped in workspaces. Direct messages cover the rest. A side discussion goes into a thread so that it does not crowd the channel.
    badge: Channels
  - title: Share files and find them again
    description: You drop photos, videos and documents. A link shows a preview. Each shared file is listed per channel, and search covers the messages, files, links and people of all your channels.
    badge: Files
  - title: Move your Dokos documents through the conversation
    description: A link to a document becomes a card with its status. A document notification posts a message automatically when a document is created, changed or submitted, under the conditions you set. You approve or reject the document from the message.
    badge: Documents
  - title: Get notifications on the web and on your phone
    description: Push notifications have quiet hours and per-channel settings. A reminder brings a message back later. A scheduled message goes out at the time you choose.
    badge: Mobile

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: In your Dokos Cloud dashboard, open the marketplace and install Raven on your site. It needs no separate subscription.
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/raven</code> then <code>bench --site your-site install-app raven</code>. Raven opens at /raven on the site."
    - title: On phones
      description: Install Raven from the App Store or Google Play, enter your site's address and sign in. The apps require Raven 3.1 or later.

faq:
  items:
    - label: Where are messages stored?
      content: In your Dokos site's database, with the rest of your data. Nothing is sent to a third-party messaging service.
    - label: Can I approve a document from Raven?
      content: Yes. You approve, reject or send back a document from the message that announces it, without opening Dokos.
    - label: Do document notifications need code?
      content: No. You choose the document type, the event (creation, change, submission), conditions and the message template, then the target channel.
    - label: Does Raven include AI agents?
      content: Yes. Raven offers bots that post and reply, incoming webhooks that write to a channel, and agents connected to your own OpenAI or compatible provider. The Dokos AI assistant can be reached by direct message once the Raven bridge is enabled.
    - label: Is there a per-user subscription?
      content: No. Raven is an application of your site. On Dokos Cloud it needs no separate subscription, and the price of your plan depends on server resources, not on the number of users (see <a href="/en/tarifs">pricing</a>). When self-hosting, it can be installed freely, under the AGPLv3 licence.


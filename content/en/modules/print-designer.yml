colored_section:
  title: "Create with a powerful, intuitive tool!"
  description: "Frappe Print Designer lets you build custom print formats for all your business documents (invoices, quotes, purchase orders, reports, and more) without writing a single line of code. Whether you're a small business on the rise or a large organization looking to strengthen its visual identity, Frappe Print Designer gives you unmatched flexibility.<br>And the best part? This tool is available to every Dokos user, at no extra cost."
  align: left
  image: "image/print-designer/main-interface.png"

main_features:
  - title: "Customize without limits"
    description: "With a simple, intuitive interface, you can drag and drop fields, rearrange your information, and create unique documents in a flash. Whether you need to add logos, specific sections, or dynamic tables, it's all possible, effortlessly."
    image: "image/print-designer/interface-personnalisable.png"
    image_bg_color: bg-teal-500
    align: right
  - title: "Create a design that looks like you "
    description: "Express your visual identity by customizing fonts, colors, and margins. If you want to go further, add CSS code for full control over the style. <br> Whether you want an elegant invoice or a detailed analytical report, your documents are in your hands."
    image: "image/print-designer/choix-images.png"
    image_bg_color: bg-teal-500
    align: left
  - title: "Discover our smart, dynamic fields"
    description: "Frappe Print Designer lets you embed data specific to your documents, automatically! Whether it's names, amounts, or dates, fields update in real time to give you accurate, always-current printouts. You can also easily add QR codes or barcodes for simplified management."
    image: "image/print-designer/champs-dynamiques.png"
    image_bg_color: bg-teal-500
    align: right
  - title: "A tool that adapts to your processes"
    description: "Invoices, quotes, sales or inventory reports: this tool adapts to all your document types. Save time by reusing templates or creating specific formats to fit your needs, with full control over look and content."
    image: "image/print-designer/apercu-avant-impression.png"
    image_bg_color: bg-teal-500
    align: left
  - title: "See changes in real time"
    description: "You can preview your changes live and generate professional PDFs, ready to share instantly by email or store in your systems."
    image: "image/print-designer/pdf-facture.png"
    image_bg_color: bg-teal-500
    align: right

bridge:
  title: "A team that respects and cares about your needs"
  description: "At Dokos, we have immense respect for the outstanding work of the Frappe team. We're glad to give you access to this innovative tool, which we're convinced will bring real value to your organization. We believe in the power of Frappe Print Designer to simplify how you manage your printouts and let you focus on what matters: growing your business. By choosing Dokos, you get a powerful, entirely free, easy-to-use solution, all within a collaborative, evolving ecosystem. <br> That's our way of supporting you with robust, accessible tools, with no hidden cost."
  align: center


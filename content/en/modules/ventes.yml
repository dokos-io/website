hero:
  title: From the quotation to the payment, <span class="text-primary">one thread</span> of documents.
  description: The Dokos Sales module creates your quotations and turns them into orders, then invoices. Each document picks up the previous one, and you see what is left to deliver and to invoice.
  image: /modules/ventes/hero.webp

for_whom:
  items:
    - title: Your quotations start in a word processor
      description: You create the quotation in Dokos from the customer record or the opportunity. Prices come from your price list, and the order picks up the accepted quotation.
      icon: i-heroicons-document-text
    - title: You invoice subscriptions by hand every month
      description: A subscription generates its invoices each period and triggers the payment if the customer has saved a payment method.
      icon: i-heroicons-arrow-path
    - title: You sell in a shop and at a distance
      description: The point of sale takes payments at the counter, with the LNE certification when the Certification Caisse module is installed under licence. Invoices sent by e-mail carry a payment link.
      icon: i-heroicons-building-storefront
    - title: You do not know what is left to deliver
      description: The status of each order shows what is left to deliver and to invoice. You filter the list on this status.
      icon: i-heroicons-truck

fit:
  description: >-
    A lead becomes an opportunity in the CRM, then a quotation, then a sales order. When it is submitted, the
    order checks availability in Stock. It creates the delivery note and the sales invoice, which posts its
    entry to Accounting. The payment request uses the gateways of the Payments application.
  image: /modules/ventes/fit.webp
  reads:
    - Customer, Contact and Address
    - Item, Item Price and Price List
    - Lead and Opportunity (CRM)
    - Warehouse, for the availability check at submission
  adds:
    - Quotation, Sales Order, Sales Invoice and Down Payment Invoice
    - Subscription, Payment Request and Payment Terms
    - Point of Sale and POS invoices
    - Pricing Rules, Promotional Scheme, Coupon Code and Shipping Rule
    - Sales Person, Sales Partner and the sales reports
  depends:
    - CRM
    - Accounting
    - Stock
    - Payments

features:
  - title: A quotation that becomes an order
    description: >-
      You create the quotation for a customer, for a prospect or from a CRM opportunity. Prices and terms
      come from the customer's price list. You apply a discount per line or on the total, or a coupon code.
      The quotation shows its gross margin while you enter it. Once it is submitted, you send it by e-mail or
      export it as a PDF. Its status changes to Ordered, Rejected, Expired or Lost, with a reason that feeds
      the sales analysis. You convert the whole quotation or only some of its lines.
    image: /modules/ventes/feature-devis.webp
    badge: Quotation
  - title: An order that drives what comes next
    description: >-
      The sales order picks up the accepted quotation. If you manage stock, Dokos checks availability when the
      order is submitted. From the order, you create the delivery note, the sales invoice, a down payment
      invoice, a payment request, a project or a subscription. The status shows what is left to do (To
      Deliver and Bill, To Bill, To Deliver, Completed). A drop-shipping purchase order stays linked to the
      sales order and updates its delivered quantities.
    badge: Sales order
  - title: An invoice, its payment and its receipt
    description: >-
      The sales invoice posts its entry to accounting when it is submitted, in a continuous number sequence.
      You send a payment request with a Stripe, GoCardless or Braintree link, and the down payments already
      received are deducted from the balance. At the counter, the point of sale creates the invoice and
      records the payment in one operation, with several payment methods and a SumUp terminal if you have
      one. With eTransactions, each submitted invoice generates its Factur-X file.
    image: /modules/ventes/feature-facture.webp
    badge: Sales invoice
  - title: Subscriptions that invoice on their own
    description: >-
      You create a subscription from a submitted order or from Sales > Subscriptions, with a recurring item
      and a monthly, quarterly or yearly period, invoiced at the start or at the end of the period. Dokos
      generates the invoices and, if the customer has saved a card or a mandate, triggers the payment at each
      due date. Otherwise it sends a payment link. You cancel a subscription at a given date, with a prorated
      last invoice.
    badge: Subscriptions
  - title: Your prices by customer and by period
    description: >-
      You keep several price lists, per currency or per customer group. Pricing rules apply a discount or a
      price depending on the item, the customer, the quantity or the period. A promotional scheme groups these
      rules for one campaign. A coupon code is entered on the quotation. Shipping rules calculate shipping
      costs, and payment terms set the due dates.
    badge: Prices and promotions

install:
  description: The Sales module is part of Dokos. There is nothing else to install.
  steps:
    - title: On Dokos Cloud
      description: Create your site from your Dokos Cloud dashboard. Dokos is installed with the Sales module. Included in every plan.
    - title: Self-hosted
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: To take payments online
      description: Install the Payments application from the marketplace and configure your gateway.

faq:
  items:
    - label: Can I change a quotation I have already sent?
      content: >-
        A submitted quotation can no longer be changed. You cancel it, amend it, submit it again and send it
        again. To compare two options, you duplicate the quotation.
    - label: How do I invoice a down payment?
      content: >-
        From the submitted sales order, Create > Down Payment Invoice. Lines are grouped by VAT rate. On the
        final invoice, the Advances section lists the down payments received, and Dokos posts only the
        balance still due.
    - label: What happens if stock is short when an order is submitted?
      content: >-
        If stock management is enabled, Dokos checks availability at submission and can block the order with
        the message "Insufficient Stock".
    - label: Can I change the period of a subscription?
      content: >-
        No. The period and the invoicing moment cannot be changed once the subscription is saved. You create a
        new subscription.
    - label: Is the point of sale certified?
      content: >-
        Yes, when the Certification Caisse module is installed with a licence issued by Dokos SAS. This module
        is certified by LNE. The [Certifications page](/en/certifications) explains the role of the licence.
        Payment data is written to a tamper-proof log and can be exported as a fiscal archive.


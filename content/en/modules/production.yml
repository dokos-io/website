publisher: dokos
licence: GPLv3
version: v5
marketplace: erpnext
docs: https://doc.dokos.io/v5/dokos/production
related: [stocks, achats, qualite, ventes]

hero:
  title: Your <span class="text-primary">work orders</span>, from the bill of materials to the finished product in stock.
  description: You describe what your products are made of in a bill of materials, you start work orders, and your operators enter their time on job cards. Dokos reserves the components, records the material transfers and compares the actual cost with the planned cost.
  image: /modules/production/hero.webp

for_whom:
  items:
    - title: You make to stock and restart production from a threshold
      description: The production plan groups your forecasts and your reorder levels, then creates the work orders and the material requests for missing components.
      icon: i-heroicons-cube
    - title: You make to order
      description: You create a production plan directly from a sales order. The work orders take the source warehouse set in the plan.
      icon: i-heroicons-clipboard-document-check
    - title: You assemble sub-assemblies on several levels
      description: A bill of materials can contain other bills of materials. The update tool passes a change to a sub-assembly on to the parent bills of materials.
      icon: i-heroicons-squares-2x2
    - title: You want to know the actual cost of a batch
      description: The time entered on job cards, multiplied by the workstations' hourly costs, is added to the cost of the materials consumed.
      icon: i-heroicons-calculator

fit:
  description: "The Manufacturing module is part of Dokos. It reads your items and warehouses, and writes stock entries at each step: <strong>Material Transfer for Manufacture</strong> to the work-in-progress warehouse, then <strong>Manufacture</strong> to the finished goods warehouse. Missing components become material requests."
  image: /modules/production/fit.webp
  reads:
    - Item, Warehouse and Unit of Measure
    - Sales Order and Master Production Schedule (MPS), to feed the production plan
    - Material Request and Purchase Receipt, for missing components
    - Stock Entry, for material transfers and manufacture
    - Quality Inspection, required on a job card when the item asks for it
  adds:
    - The BOM, Routing, Operation and Workstation documents
    - The Production Plan, Work Order, Job Card and Downtime Entry documents
    - The Plant Floor, the operators' screen
    - The Work Order Summary report and the BOM stock analysis report
    - Manufacturing Settings (default warehouses, planning rules)
  depends:
    - Stock

features:
  - title: Describe your products in a bill of materials
    description: You list the purchased components and the manufactured sub-assemblies, with their quantities. If a routing is attached, each component is linked to the operation that consumes it. The BOM cost section adds up the cost of the components and the cost of the operations. A submitted bill of materials is locked. A new version gets an incremented number, and only one bill of materials per item has the Active status.
    image: /modules/production/feature-nomenclature.webp
    badge: Bill of materials
  - title: Plan the quantities to produce
    description: The production plan groups sales orders, MPS forecasts and reorder levels. You can also create it directly from a sales order. Dokos works out the work orders to start and the material requests for missing components.
    badge: Production plan
  - title: Start a work order and track the materials
    description: When the work order is submitted, Dokos reserves the raw materials in their source warehouses. The transfer button creates a stock entry to the workshop, and partial transfers add up. At the end of production, a Manufacture entry moves the finished products to the target warehouse. If you stop an order, the materials already transferred go back to stock.
    image: /modules/production/feature-ordre.webp
    badge: Work order
  - title: Your operators enter their time on a job card
    description: Each operation of the bill of materials generates a job card, assigned to a workstation. The operator opens the Plant Floor, records their time and confirms their quantity. When they click Complete, they split the total between completed quantity, pending quantity and process loss. Each submitted job card updates the progress and the actual cost of the order.
    image: /modules/production/feature-carte.webp
    badge: Job card
  - title: Set the hourly costs of your workstations
    description: "A workstation carries four hourly costs: labour, electricity, rent and consumables. A workstation type (manual or machine) applies these costs to all its workstations. A working hours calendar and a holiday list are used to check availability during planning. The Plant Floor shows each workstation as available or busy."
    badge: Workstation

install:
  description: The Manufacturing module is part of Dokos. There is no separate application to install.
  steps:
    - title: On Dokos Cloud
      description: The module is on your site from the day it is created, in every plan. Open the Manufacturing workspace from the home page.
    - title: Self-hosted
      description: "Install Dokos: <code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: First settings
      description: Enter the default warehouses in Manufacturing Settings, create your workstations and operations, then your first bills of materials.
  prerequisites:
    - Your items and warehouses are created in the Stock module

faq:
  items:
    - label: How does Dokos calculate the cost of a work order?
      content: The bill of materials gives the planned cost. The actual cost adds up the materials consumed and the time entered on job cards, multiplied by each workstation's hourly costs. The work order shows both values.
    - label: Are the quantities consumed theoretical or actual?
      content: The bill of materials field that sets how components are consumed chooses between the theoretical quantities of the bill of materials and the quantities actually transferred by stock entries. If it is empty, the global setting in Manufacturing Settings applies.
    - label: Can I check quality during manufacturing?
      content: Yes. A quality check can be set on each operation of a bill of materials. The job card then cannot be submitted before a quality inspection has been done.
    - label: How do I create a variant of an existing product?
      content: Duplicate the existing bill of materials from its form and adjust the components. A finished product can also be marked as a phantom item in the BOM creator.


main_features:
  - title: Create a personalized learning experience
    description: "Give your customers access to tailored training. Build learning paths adapted to their specific needs, whether they are new to your services or experienced users. By providing quality educational content, you strengthen their mastery of your products and improve their long term satisfaction."
    image: "image/learning/learning-cours.png"
    image_bg_color: bg-teal-500
    align: right
    links:
    - label: Publish your first course
      to: https://cloud.dokos.io
      size: xl
      color: amber
      icon: i-heroicons-rocket-launch
      trailing: false
      target: _blank
    - label: Documentation
      icon: i-heroicons-arrow-right
      trailing: true
      size: xl
      color: gray
      to: https://doc.dokos.io
      target: _blank
  - title: "Integrate seamlessly with Dokos"
    description: "Frappe Learning integrates seamlessly with Dokos, making it easy to manage users, courses, and certifications. This integration lets you centralize your customers' training while enjoying the benefits of a modern management software environment, with no separate platform to run and no extra costs. "
    image: "image/ventes/cinq-insights ventes.png"
    image_bg_color: bg-teal-500
    align: left
  - title: "Track progress in real time"
    description: "Track your learners' progress with our precise analytics tools. You can view completed steps, assess performance, and identify areas for improvement to offer an ever better service. This creates a continuous learning loop, keeping your customers informed and satisfied."
    image: "image/learning/learning-tableau-de-bord-stat.png"
    image_bg_color: bg-teal-500
    align: right
  - title: "A genuine training program at no extra cost"
    description: "In a few clicks, set up the Frappe Learning app at no additional cost. Build a genuine training program for your users or customers, without increasing your infrastructure or management costs."
    image: "image/nuage-dashboard-dark.png"
    image_bg_color: bg-teal-500
    align: left


carousel:
  title: "Key features of Frappe Learning"
  cards:
    - title: "Build your courses with ease"
      description: "Built with an intuitive interface, Frappe Learning lets you create complete training modules in a few clicks. Import multimedia content, build interactive quizzes, and structure learning paths flexibly."
    - title: "Simplify user management"
      description: "Manage enrollments, assign courses, and give your users a personalized learning experience. Track their progress and adjust paths based on their needs."
    - title: "Showcase skills acquired"
      description: "Award certificates and badges to your customers at the end of each course. Strengthen their engagement and their confidence in your services."
    - title: "Get detailed reports"
      description: "Analyze your users' progress and the effectiveness of your training. Frappe Learning helps you fine-tune your educational content for the best results."

bridge_after_carousel:
  title: "Why did we choose Frappe Learning for you?"
  description: "At Dokos, we have always valued learning as a key to success. Frappe Learning is more than a simple training platform: it is a way to enrich your relationship with your customers and make them more independent and effective. This app fits harmoniously into the Dokos world and is an excellent lever for strengthening user loyalty. We deeply respect the work and innovation of Frappe. With this app, we offer you a complete solution that not only improves your customers' satisfaction, but also speeds up their adoption of your services."
  align: center

bottom_section:
  title: "Concrete benefits for you and your customers!"
  cards:
    - title: "Stronger loyalty"
      description: "With engaging training paths, help your customers get the most out of your products. Provide every tool for success and build a long term relationship of trust. "
      icon: i-heroicons-outline-fire
      class: "col-span-4 row-span-2"
    - title: "Time savings and efficiency"
      description: "Automate learning with online modules available around the clock, reducing the need for customer support and strengthening your users' independence."
      icon: i-heroicons-outline-cube
      class: "col-span-4 row-span-2"
    - title: "Stronger reputation"
      description: "By offering certifications through Frappe Learning, you position your company as a leader in your field, with a solid educational approach."
      icon: i-heroicons-outline-cube
      class: "col-span-4 row-span-2"


bottom_cta:
  title: "Ready to transform your customers' learning?"
  description: "Take control of their learning experience and discover how Frappe Learning can help you strengthen the satisfaction, engagement and independence of your users.<br>Get started today!</br>"
  card: true

# English version of content/fr/modules/learning.yml (sources and screenshot notes are there).

title: Frappe Learning
description: Publish your online courses, follow your learners by batch and issue their certificates from your Dokos site.
icon: i-heroicons-academic-cap
application: Frappe Learning
theme: projets-ressources-humaines
author: Frappe Technologies and contributors
logo:
  light: /frappe/lms.png
  dark: /frappe/lms.png
navigation:
  title: Frappe Learning
  icon: i-heroicons-academic-cap
  description: Online courses, batches, quizzes and certificates.

publisher: frappe
licence: AGPLv3
version: v5
marketplace: lms
docs: https://docs.frappe.io/learning
related: [ressources-humaines, paiements, wiki, support]

hero:
  title: Your training courses <span class="text-primary">online</span>, on your Dokos site.
  description: You write a course in chapters and lessons, open it to your learners and follow their progress. At the end, you issue the certificate.
  image: /modules/learning/hero.webp

for_whom:
  items:
    - title: You train your customers on your product
      description: You publish a free or paid course. Each customer enrols, follows the lessons at their own pace and gets a certificate.
      icon: i-heroicons-user-group
    - title: You onboard your new employees
      description: You group the hires of the same month in a batch, with dates and live classes. The batch enrols them in all its courses.
      icon: i-heroicons-identification
    - title: You run classes with assessments
      description: You add quizzes and assignments to the lessons. An evaluator grades the submissions and validates the certificate.
      icon: i-heroicons-clipboard-document-check

fit:
  description: "Frappe Learning installs on your Dokos site and uses its <strong>users</strong>: a learner, an instructor or an evaluator is a user of your site with the matching role. Paid courses go through the Payments application, the same one as your invoices. The application is available at /lms and in your site's apps screen."
  reads:
    - Your site's Users, with the Student, Instructor, Evaluator and Moderator roles
    - The payment gateways of the Payments application, for paid courses
  adds:
    - The Learning application at /lms
    - The "LMS Course", "Course Chapter", "Course Lesson", "LMS Batch" and "LMS Program" DocTypes
    - The "LMS Quiz", "LMS Assignment", "LMS Certificate" and "LMS Live Class" DocTypes
    - The "LMS Enrollment" and "LMS Payment" DocTypes
  depends:
    - Dodock
    - Payments

features:
  - title: Write the course in chapters and lessons
    description: A course contains chapters, and each chapter contains its lessons. A lesson holds text, a video, a PDF, slides, a quiz or an assignment. The learner view shows the lesson as your learners will see it. Only a Moderator publishes the course.
    badge: Courses
  - title: Group your learners in batches
    description: A batch brings a group of learners together on one or more courses, with a start date and an end date. A learner added to the batch is enrolled in all its courses. You schedule a Zoom live class from the batch, and the learners see the list of classes to attend.
    badge: Batches
  - title: Assess with quizzes and assignments
    description: You create a quiz with single-choice, multiple-choice or open questions. An assignment is submitted as a PDF or a document. The evaluator grades from their submission queue. A program chains several courses in a set order.
    badge: Assessments
  - title: Issue the certificate
    description: At the end of a course or a batch, you grant the learner a certificate, automatically at the end of the course or all at once for the whole batch. The application provides a certificate template, and you can replace it with your own. You can charge for a course, a batch or the certificate itself.
    badge: Certificates

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: In your Dokos Cloud dashboard, open the marketplace and install "Frappe Learning" on your site. The application is included in every plan.
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/lms</code> then <code>bench --site your-site install-app lms</code>. The Payments application must be installed on the bench first."
    - title: Open your first course
      description: In /lms, give the roles to your users, create a course with its chapters and lessons, then publish it with a Moderator account.
  prerequisites:
    - The Payments application, required by Frappe Learning
    - A Zoom account, only for live classes

faq:
  items:
    - label: Do my learners need an account on my site?
      content: Yes. Each learner is a user of your site with the Student role. An instructor has the Instructor role, a grader the Evaluator role and an administrator the Moderator role.
    - label: Can I sell a course?
      content: Yes. You enable "paid course" in the course settings and choose a gateway in Settings, Payment tab. The payment goes through your site's Payments application.
    - label: What is the difference between a course, a batch and a program?
      content: The course is the content, in chapters and lessons. The batch brings learners together on one or more courses between two dates. The program chains several courses in a set order.
    - label: How do live classes work?
      content: From a batch, you create a Zoom live class. The batch's learners see the list of live classes to attend.


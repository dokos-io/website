related: [ventes, ressources-humaines, comptabilite, support]

hero:
  title: Your <span class="text-primary">projects</span>, their tasks and the time spent, linked to your invoices.
  description: You split a project into tasks, your team enters its hours in timesheets, and Dokos calculates the cost and billable amount of the project. A sales invoice is created from the timesheet.

for_whom:
  items:
    - title: You sell services billed by the hour
      description: Each timesheet line marked Billable carries a billing rate. After submission, you create the sales invoice from the timesheet, and the project shows the billed amount.
      icon: i-heroicons-clock
    - title: You run projects with tasks that follow each other
      description: A task depends on another and cannot be completed before it. Dependencies show in the Gantt view; you edit the Plan view by drag and drop.
      icon: i-heroicons-arrows-right-left
    - title: You want the margin of each project
      description: The project adds up the costs of timesheets, expense claims, purchases and consumed materials, then compares them with the sales amount.
      icon: i-heroicons-banknotes
    - title: You repeat the same type of project
      description: A project template holds a sequence of tasks. At creation, the tasks are filled in and dated from their duration, skipping the company's holidays.
      icon: i-heroicons-document-duplicate

fit:
  description: "The Projects module is part of Dokos. A project is linked to a <strong>sales order</strong> and receives the costs of the other modules: timesheets, expense claims, purchase invoices and consumed materials. The <strong>timesheet</strong> links an employee's time to a project, a task and a sales invoice."
  reads:
    - Sales Order, set on the project
    - Sales Invoice, created from a submitted timesheet
    - Expense Claim and Purchase Invoice, whose amounts feed the project cost
    - Employee, for timesheets and activity costs per person
    - Holiday List, to date the tasks of a template
  adds:
    - The Project, Project Template and Project Update documents
    - The Task document, with its Gantt and Plan views
    - The Timesheet, Activity Type and Activity Cost documents
    - The cost and billing fields of the project (Total Billable Amount, Total Billed Amount, Gross Margin)

features:
  - title: Create a project, from scratch or from a template
    description: "You enter the name, the status and the expected end date, then the type, priority and department if needed. With From Template, the template's tasks are created and dated automatically. The % Complete Method field sets how progress is calculated: manual, by completed tasks, by task progress or by task weight."
    badge: Project
  - title: Split the work into dependent tasks
    description: A task has a status (Open, Working, Overdue, Pending Review, Completed, Cancelled) and a priority. The Is Group box makes it the parent of subtasks. The Dependent Tasks field blocks closing while the upstream task is not completed. The actual start and end dates come from timesheets.
    image: /modules/projets/feature-taches.webp
    badge: Task
  - title: Enter the time spent, line by line
    description: A timesheet covers one or more days. Each line gives the start time, the hours, the activity type, the project and the task. A timer measures the actual time. The cost rate comes from the activity type or from the employee's own activity cost; once the timesheet is submitted, the rates are locked.
    badge: Timesheet
  - title: Bill the time and track the margin
    description: Lines marked Billable, multiplied by the billing rate, give the billing amount. From the submitted timesheet, you create the sales invoice; the total billed hours and the billed percentage are updated. On the project, the gross margin compares the sales amount with the total cost.
    badge: Billing
  - title: Keep your customers informed
    description: The Users table of the project gives access to a website user, for example your customer, with a welcome e-mail and, if you wish, access to the attachments. The project update sends the progress to the stakeholders, at the frequency you choose.
    badge: Customer follow-up

install:
  description: The Projects module is part of Dokos. There is no separate application to install.
  steps:
    - title: On Dokos Cloud
      description: The module is on your site from its creation, in every plan. Open the Projects workspace from the home page.
    - title: Self-hosted
      description: "Install Dokos: <code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: First setup
      description: Check the activity types created by default (Planning, Research, Proposal Writing, Execution, Communication), set their rates, then create your first project template.

faq:
  items:
    - label: How do I set a different hourly rate per person?
      content: Create an Activity Cost for the employee and the activity type, with its costing rate and its billing rate. Dokos applies these rates to the employee's timesheets.
    - label: Can my customer follow the progress of the project?
      content: Yes. Add them to the Users table of the project as a website user. You can also send them project updates at a regular frequency.
    - label: How is the progress of a project calculated?
      content: "According to the % Complete Method you choose: manual entry, share of completed tasks, task progress or task weight. If the weights do not add up to 100, Dokos normalises the result."
    - label: Do expense claims count in the project cost?
      content: Yes. An expense claim that mentions the project or one of its tasks updates the claimed amount field and the total cost of the project.


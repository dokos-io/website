features:
  - title: Attract customers with a dynamic product catalog
    description: Publish and update your products in a few clicks. <br><br>With Dokos, manage your descriptions, prices, images, and specifications from a single place.<br><br> Every product gets its own dedicated page for a clear, professional presentation.</br>
    image: "image/e-commerce/article-site-web.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Catalog
      color: sky
  - title: Give your customers a smooth, effortless shopping experience
    description: Streamline the customer journey with a simplified checkout process. <br><br>The Dokos e-commerce module includes an intuitive shopping cart, letting your customers order your products online with ease.<br><br>Track orders in real time with secure payment options.</br>
    image: "image/e-commerce/parametre-e-commerce.svg"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Orders
      color: sky
  - title: Strengthen customer interaction with our custom forms
    description: Whether for quote requests, newsletter sign-ups, or specific questions, everything is built directly into Dokos. <br><br>Plus, your customers can log in via their social accounts (Google, Facebook) for fast, secure access.</br>
    image: "image/e-commerce/article-de-blog.png"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Forms
      color: sky
  - title: Maximize your site's visibility with our SEO tools.
    description: Create meta tags to improve your search engine ranking, and use our blog management to attract and retain your audience.
    image: "image/e-commerce/SEO-site-web.png"
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: SEO
      color: sky
  - title: Make your site your own
    description: Build a site that looks like you with Dokos. <br><br>Change the colors, fonts, logos, and overall theme of your online store so it perfectly reflects your brand.</br>
    video: "/image/e-commerce/site-web-dokos.mp4"
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Site
      color: sky



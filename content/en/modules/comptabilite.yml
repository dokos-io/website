fit:
  description: >-
    Accounting is at the centre of your Dokos site. A sales invoice submitted in Sales, a purchase invoice
    submitted in Purchasing or a purchase receipt recorded in Stock all post to the same general ledger.
    Payment entries matched with your bank transactions close the loop.
  image: /modules/comptabilite/fit.webp
  reads:
    - Sales Invoice and Purchase Invoice
    - Payment Entry and Journal Entry
    - Bank Account and Bank Transaction
    - Sales Order and Purchase Order, for down payments and the forecast
    - Subscription, Expense Claim and Salary Slip, for the cash-flow forecast
  adds:
    - The Accounting workspace, the chart of accounts, the journals and the fiscal year
    - The General Ledger, Balance Sheet, Profit and Loss Statement and Trial Balance
    - The Banking module (/banking) and the cash-flow forecast
    - The SAS Ledger log of the certified point of sale and the fiscal archive export
    - SEPA Direct Debit, Down Payment Invoices and FEC Import
  depends:
    - Sales
    - Purchasing
    - Stock
    - eTransactions
    - Payments

features:
  - title: Your invoices become your journal entries
    description: >-
      You submit a sales or purchase invoice. Dokos gives it its number at submission, in a continuous
      sequence, and posts the entry to the general ledger. Invoicing and accounting documents cannot be
      deleted. The balance sheet comes out in the French format, and third-party accounts go to assets or
      liabilities according to their balance.
    badge: General ledger
  - title: An LNE-certified point of sale
    description: >-
      The point of sale creates the invoice and records the payment in one operation, with several payment
      methods on the same receipt. Each payment operation is written to a SAS Ledger log per company. From the
      Company record, you export a fiscal archive for a period of up to one year and you check the log's
      cryptographic chain. You keep each archive for six years. The certification requires the Certification
      Caisse module and a licence issued by Dokos SAS.
    badge: LNE certified
  - title: Your supplier invoices arrive as e-invoices
    description: >-
      Dokos receives e-invoices in CII, Factur-X and UBL formats through its connection to an approved
      platform. Each invoice received appears in the e-invoice list of the Purchasing module with its status
      (Received, Pending Approval, Integrated, Rejected, Abandoned). Dokos creates the purchase invoice as a
      draft and notifies the accounting team, who check the amount and the due date before submitting it. An
      indicator shows which platform the invoice came through. For sending, Dokos generates the
      Factur-X file when a sales invoice is submitted and sends it through the approved platform.
    badge: E-invoicing
  - title: The Banking module matches your statements
    description: >-
      You import your statements in OFX, CSV, XLSX or PDF. Dokos detects the columns and skips duplicates. For
      each transaction, it suggests a match by amount, reference or document number, with an adjustable date
      tolerance. You approve, you match one transaction with several payments or the reverse, or you create
      the missing payment. Matching rules assign a party or an account according to the label. The module is
      in beta, and the reconciliation tool you know is still available, on the same data.
    badge: Banking (beta)
  - title: A cash-flow forecast from your documents
    description: >-
      From Accounting > Cash Flow, you choose a period and click Generate. Dokos reads your sales and
      purchase invoices, your subscriptions, your orders, your approved expense claims and your salary slips.
      It shows the opening balance, the expected receipts and payments, the closing balance and a day-by-day
      grid. You click a flow to open its document, and you add manual entries. The tool is in beta. The
      documentation recommends generating it again each week, over eight to twelve weeks.
    badge: Cash flow (beta)

install:
  description: The Accounting module is part of Dokos. There is nothing else to install.
  steps:
    - title: On Dokos Cloud
      description: Create your site from your Dokos Cloud dashboard. The Accounting module is part of Dokos, installed with it on your site.
    - title: Self-hosted
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> then <code>bench --site your-site install-app erpnext</code>."
    - title: For e-invoicing
      description: Install the eTransactions application from the marketplace, then enter the connection to your approved platform in its settings.
    - title: For the certified point of sale
      description: The Certification Caisse module is installed on sites that take payments from consumers, with a licence issued by Dokos SAS. Write to us to activate it on your site.

faq:
  items:
    - label: Can I bring over my existing accounts?
      content: >-
        Yes. From Accounting > France, you create the FEC import settings, then the missing journals and
        accounts, then an FEC Import document with your file. Dokos creates invoices or journal entries
        according to your settings and can reconcile payments based on the file.
    - label: How does my accountant access my accounts?
      content: >-
        You create a user for them with the accounting roles. Role permissions and user permissions limit what
        they see, for example to a single company.
    - label: Can I collect from my customers by SEPA direct debit?
      content: >-
        Yes. Each customer has an active SEPA mandate with IBAN and BIC. From Accounting > SEPA Direct Debit,
        you select the payment entries of the period and generate the XML file (pain.008) for your bank.
    - label: When does e-invoicing become mandatory in France?
      content: >-
        Receiving e-invoices has been mandatory for all companies since September 2026. Sending has been
        mandatory for large and mid-sized companies since September 2026, and becomes mandatory for SMEs and
        micro-businesses in September 2027. Dokos already receives e-invoices and generates the Factur-X file
        at submission.
    - label: What is different from ERPNext accounting?
      content: >-
        Dokos numbers invoices at submission in a continuous sequence, prevents the deletion of invoicing and
        accounting documents, produces the balance sheet in the French format, generates SEPA direct debit
        files, imports OFX statements, and handles down payment invoices and straight-line depreciation.


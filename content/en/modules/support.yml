title: Helpdesk
description: Turns each customer request into a tracked ticket, with response times per priority, a knowledge base and a portal where the customer follows the request.
icon: i-heroicons-lifebuoy
application: Helpdesk
theme: support-collaboration
author: Frappe Technologies
logo:
  light: /frappe/helpdesk.png
  dark: /frappe/helpdesk.png

publisher: frappe
licence: AGPLv3
version: v5
marketplace: helpdesk
related: [telephony, raven, wiki, crm, ventes]

hero:
  title: Your customer requests, <span class="text-primary">handled as tickets</span>, with tracked response times.
  description: Each e-mail received becomes a ticket assigned to an agent. A service level agreement sets the first response and resolution times per priority. The customer follows the request from a portal.

for_whom:
  items:
    - title: Requests arrive in a shared mailbox
      description: Each e-mail creates a ticket. An assignment rule gives it to an agent according to priority, request type or each agent's workload.
      icon: i-heroicons-inbox-arrow-down
    - title: You do not know how long a customer waits for an answer
      description: An SLA policy sets a first response time and a resolution time per priority. The counter takes your working hours and holidays into account.
      icon: i-heroicons-clock
    - title: Your agents type the same answers again and again
      description: A saved reply goes into the ticket in one click. A knowledge base article is offered to the customer before they even open a ticket.
      icon: i-heroicons-document-duplicate
    - title: Your customers call to ask about progress
      description: The customer opens the portal, sees the status of their tickets and replies from the same page.
      icon: i-heroicons-user-circle

fit:
  description: >-
    Helpdesk installs alongside Dokos. Agents work in the agent portal, at the
    /helpdesk address of the site. Customers open and follow their tickets in the customer
    portal, at the /help address. A ticket is an <strong>HD Ticket</strong> document, linked to a
    contact and a customer. Incoming and outgoing e-mails go through the e-mail accounts
    of your site. The SLA policy uses a holiday list of the site to pause
    its counters. With the <a href="/en/modules/telephony">Telephony</a> application, a call
    button appears in the ticket.
  reads:
    - Contact and Customer
    - The site's e-mail accounts
    - The holiday list
  adds:
    - The HD Ticket, HD Agent, HD Team and HD Service Level Agreement documents
    - The knowledge base, HD Article and HD Article Category documents
    - The agent portal (/helpdesk) and the customer portal (/help)
    - Saved replies and assignment rules
  depends:
    - Telephony

features:
  - title: Follow each request in a ticket
    description: A ticket has a status, a priority, a type and a team. An assignment rule gives it to an agent automatically. The agent replies by e-mail from the ticket, adds an internal comment and sees the full history of the exchanges.
    badge: Tickets
  - title: Set response times per priority
    description: An SLA policy defines, for each priority, a first response time and a resolution time. The counter pauses while the ticket waits for the customer, outside working hours and on the holidays of the chosen list.
    badge: SLA
  - title: Publish a knowledge base
    description: Agents write articles grouped by category, with headings, lists, tables, images and videos. An article is draft, published or archived, and visible to the public, to customers or internally. The new ticket form suggests relevant articles before sending.
    badge: Knowledge base
  - title: Give your customers a portal
    description: The customer signs in to the portal, opens a ticket, follows its status and replies from the same page. They read the articles open to them and can say whether an article helped.
    badge: Customer portal
  - title: Reply quickly and measure
    description: A saved reply goes into the ticket for frequent questions. The analysis shows the timeline of each ticket, its response times and a summary of the conversation.
    badge: Saved replies

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: In your Dokos Cloud dashboard, open the marketplace and install Helpdesk on your site. It needs no separate subscription; the price of your plan depends on server resources (see <a href="/en/tarifs">pricing</a>).
    - title: Self-hosted
      description: "<code>bench get-app https://github.com/frappe/telephony</code>, then <code>bench get-app https://github.com/frappe/helpdesk</code> and <code>bench --site your-site install-app helpdesk</code>. The agent portal opens at /helpdesk, the customer portal at /help."
    - title: Connect your mailbox
      description: Add your support e-mail account in the site settings. Received e-mails create tickets, and agents' replies are sent from this account.
  prerequisites:
    - An e-mail account dedicated to support

faq:
  items:
    - label: Do my customers see their tickets?
      content: Yes. The customer portal, at the /help address of your site, shows each customer their tickets, their status and the history of the exchanges. They reply from the portal or by e-mail.
    - label: Do SLA times take our working hours into account?
      content: Yes. You define the working hours for each day of the week and link a holiday list. The first response and resolution counters pause outside these hours and while the ticket waits for the customer's answer.
    - label: Through which channels do requests arrive?
      content: By e-mail and through the customer portal. With the Telephony application, agents make and receive Twilio or Exotel calls from the ticket.
    - label: Can an article stay internal?
      content: Yes. Each article has a visibility, public, customers or private. A private article is seen only by agents. A draft is never visible to customers.
    - label: Do I need Dokos to use Helpdesk?
      content: Helpdesk runs on Dodock, the base of your site. Installed alongside Dokos, it shares the site's contacts and customers.


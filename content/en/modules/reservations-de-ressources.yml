    - title: You organise workshops or events
      description: >-
        You publish the event on the website, open registrations and take payment from the web form.
      icon: i-heroicons-ticket

fit:
  description: >-
    Bookings installs on your Dokos site and takes over the functions of the V4 Venue module, removed in V5.
    Since V5, <strong>everything is a resource</strong>, bookable or not; the item is only used for invoicing.
    A <strong>Bookable Resource</strong> carries the calendar, the prices per unit of measure and the required badges.<br>
    Each <strong>Item Booking</strong> is linked to a billed party, and its invoice is generated and tracked
    automatically. A signed contract creates a Sales Order, a Subscription and its recurring invoices in the Sales module.
    Online payment goes through the gateways of the Payments application.
  reads:
    - Item, Item Group and Price List
    - Customer and Contact
    - Sales Order, Subscription and Sales Invoice
    - Event
    - Payment Gateway
  adds:
    - The Events & Resources workspace
    - The Bookable Resource, Item Booking, Booking Calendar and Booking Availability documents
    - The Booking Contract, Contract Type and Security Deposit documents
    - Booking credits and badges
    - The /bookings-ui portal, the Venue Settings and the Resource Booking Settings
  depends:
    - Dokos (Sales)
    - Payments for online payment

features:
  - title: Describe your resources and their calendars
    description: >-
      A Bookable Resource sets the number of simultaneous bookings, the prices per unit of measure (hour, half day,
      day, month) and the required badges. A Booking Calendar defines the slots per day of the week and its exceptions,
      such as public holidays or maintenance. Booking Availability sets the minimum and maximum notice, also checked on the server.
    badge: Resources
  - title: Let your customers book from the portal
    description: >-
      On /bookings-ui, the customer chooses a slot. The booking goes from Not Confirmed to Confirmed after the order,
      or after payment if you require it. An abandoned draft is deleted after the delay set in the Venue Settings.
      The customer cancels from their portal if you allow it, within the minimum cancellation delay.
    badge: Portal
  - title: Sign contracts online
    description: >-
      A Contract Type carries the text template, the minimum duration, the notice period, the included resources, the recurring item,
      the signing fees and the security deposit. You send the contract to the customer; they sign it with one click on their portal.
      The contract becomes Active and creates the Sales Order, the Subscription and the Security Deposit. An amendment changes an active contract without rewriting it.
    badge: Contracts
  - title: Sell booking credits
    description: >-
      A credit type converts an invoiced item into credits, when a ticket is bought or at each period of a subscription.
      When the invoice is submitted, the credits are allocated. When booking on the portal, the Deduct from booking credits
      box uses them. Credits expire according to the duration of the type, and a report shows the allocated, used and remaining balances.
    badge: Credits
  - title: Publish your events and their registrations
    description: >-
      A public Event marked Published appears on the website. Each online registration creates an Event Registration document.
      The event-registration-form web form takes payment, in one go or with automatic payments.
      By default, registrations close automatically 24 hours before the event, and a badge can be given to attendees.
    badge: Events

install:
  steps:
    - title: From the Dokos Cloud marketplace
      description: >-
        In your Dokos Cloud dashboard, open the marketplace and install Bookings on your site.
        The marketplace asks no subscription for Bookings; your plan is priced on server resources (see <a href="/en/tarifs">pricing</a>).
    - title: Self-hosted
      description: "<code>bench get-app https://gitlab.com/dokos/bookings</code> then <code>bench --site your-site install-app bookings</code>."
    - title: Set the Venue Settings
      description: >-
        In the Events & Resources workspace, open the Venue Settings: draft deletion delay,
        confirmation after payment, units of measure (number of hours in a half day), customer portal. Then create a first Bookable Resource.
  prerequisites:
    - A Dokos V5 site
    - The Payments application and a gateway for online payment
    - A Google Calendar connection and one calendar per resource for synchronisation

faq:
  items:
    - label: What happens to the Venue module?
      content: >-
        The V4 Venue module is removed in V5. Its functions (credits, event slots, badges, multiple venues) are taken over by Bookings.
    - label: Can I manage several venues on the same site?
      content: >-
        Yes. In the Venue Settings, enable multi-venue mode and list the allowed companies with their price list.
        Each published item states the companies where it appears. The visitor chooses the company at the bottom of the shop, and each company has its own cart.
    - label: Do bookings sync with Google Calendar?
      content: >-
        Yes. Each resource is linked to its own calendar, and an option in the Venue Settings syncs online bookings automatically.
        Deleting a single occurrence of a recurring event in Google Calendar is not yet carried over to Dokos.
    - label: Can a subscription book a desk permanently?
      content: >-
        Yes. In the subscription plan line, the Booked Item field designates the resource. For the whole duration of the subscription,
        the number of remaining places is reduced by the given quantity, and the subscription appears in the bookings Calendar view.
    - label: How is this different from booking through the Webshop?
      content: >-
        Booking from the e-commerce site is deprecated in V5. The Bookings /bookings-ui portal replaces it: it carries bookings,
        contracts, subscriptions and the member directory.


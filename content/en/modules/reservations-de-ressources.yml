for_whom:
  items:
    - title: You run a third place or a coworking space
      description: >-
        Your members book a desk or a room from the portal, with their credits or their subscription. You follow the balances in a report.
      icon: i-heroicons-building-office-2
    - title: You rent rooms or equipment by the hour or by the day
      description: >-
        Each resource has its prices per unit of measure, its opening calendar and its minimum notice. The invoice follows the booking.

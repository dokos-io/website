features:
  - title: Book in a few clicks
    description: The Dokos resource booking module lets your users easily book meeting rooms, machines, or equipment. <br><br>Get the most out of your resources and give your users full autonomy.</br>
    image: image/reservation-ressource/article-reservable-site-web.png
    image_bg_color: bg-teal-500
    align: left
    badge:
      label: Booking
      color: sky
  - title: A solution for every need
    description: Whether you run a coworking space, a third place, or an organization managing several resources, Dokos adapts to your needs with configurable, scalable features. Offer subscriptions, manage one-off booking tickets, and keep an overview of all your resources through a simple, intuitive interface.
    video: /image/reservation-ressource/reservations-de-ressources.mp4
    image_bg_color: bg-teal-500
    align: right
    badge:
      label: Booking
      color: sky
bottom_section:
  title: 'Key features:'
  cards:
    - title: Online room booking
      description: Offer an intuitive system so your teams or your customers can book spaces suited to their needs.
      icon: i-bi-person-workspace
      class: col-span-4 row-span-3
    - title: Equipment management
      description: Simplify booking machines or specific equipment with transparent tracking.
      icon: i-material-symbols-precision-manufacturing-outline-rounded
      class: col-span-4 row-span-3
    - title: Google Calendar integration
      description: Sync your booking calendars for full real-time visibility.
      icon: i-simple-icons-googlecalendar
      class: col-span-4 row-span-3
    - title: Custom user portal
      description: Every user gets a dedicated space to manage their bookings, view invoices, or update their information.
      icon: i-icon-park-outline-locking-web
      class: col-span-4 row-span-3
    - title: Subscription management
      description: Offer your users the option to subscribe. Simplify setting up recurring events.
      icon: i-tabler-file-rss
      class: col-span-4 row-span-3
    - title: Multi-site management
      description: Centralize the management of several third places while keeping an overview and the flexibility each location needs.
      icon: i-tabler-map-pins
      class: col-span-4 row-span-3

# English version of content/fr/ecosysteme/support-collaboration.yml (sources are there).
title: Support & collaboration
description: Customer support, team messaging and internal documentation, connected to the same data as your sales and operations modules.
navigation:
  title: Support & collaboration
  icon: i-heroicons-chat-bubble-left-right

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-chat-bubble-left-right
    to: /en/modules
  title: Customer support and <span class="text-primary">internal knowledge</span> in one place.
  description: A support ticket shows the full history of a customer, in the same tool. Internal procedures stay documented and searchable in one place.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: The whole ecosystem
      to: /en/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: The applications in this area
  description: Four applications. Helpdesk, Raven and Wiki install separately. Telephony adds to Helpdesk or the CRM.
  items:
    - title: Helpdesk
      description: Each customer request becomes a ticket, with response times by priority, a knowledge base and a portal where the customer follows the request.
      icon: i-ri-customer-service-2-line
      to: /en/modules/support
      logo:
        light: /frappe/helpdesk.png
        dark: /frappe/helpdesk.png
    - title: Raven
      description: Team messaging installed on your site, with channels, threads and your Dokos documents shown as cards in the conversation.
      icon: i-heroicons-chat-bubble-left-right
      to: /en/modules/raven
      logo:
        light: /frappe/raven.webp
        dark: /frappe/raven.webp
    - title: Wiki
      description: Your procedures published as web pages from your site, with a revision history and a review before publication.
      icon: i-heroicons-book-open
      to: /en/modules/wiki
      logo:
        light: /frappe/wiki.png
        dark: /frappe/wiki.png
    - title: Telephony
      description: Links an Exotel or Twilio account to your site. You make and receive calls from a Helpdesk ticket or a CRM record, and each call is logged.
      icon: i-heroicons-phone
      to: /en/modules/telephony

cta:
  title: Move your customer support out of the shared mailbox
  description: Describe your current volumes and response times. We will tell you what a dedicated tool changes, and from what volume it becomes useful.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See pricing
      to: /en/tarifs
      size: xl
      color: neutral
      variant: outline

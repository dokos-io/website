# English version of content/fr/ecosysteme/site-web-outils-numeriques.yml (sources are there).
# Print Designer (deprecated) and Frappe Drive (archived, moving into Frappe Suite) are not listed.
title: Website & digital tools
description: Website, blog, newsletters, reports and integrations, built on the same data as the rest of Dokos.
navigation:
  title: Website & digital tools
  icon: i-heroicons-globe-alt

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-globe-alt
    to: /en/modules
  title: Your website and your reports, <span class="text-primary">on your Dokos data</span>.
  description: An Insights dashboard reads your management data directly, with no export. OCR reads a PDF supplier invoice and prepares the purchase invoice, which you match with the order.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: The whole ecosystem
      to: /en/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: The applications in this area
  description: Cross-cutting tools, useful in any sector.
  items:
    - title: Builder
      description: You build your website pages in a visual editor, linked to your Dokos data, and publish them in one click.
      icon: i-mdi-application-settings-outline
      to: /en/modules/builder
      logo:
        light: /frappe/builder.svg
        dark: /frappe/builder.svg
    - title: Insights
      description: Dashboards and reports built on your management data, with no export to another tool.
      icon: i-heroicons-chart-bar
      to: /en/modules/insights
      logo:
        light: /frappe/insights.svg
        dark: /frappe/insights.svg
    - title: Integrations
      description: The settings of the services connected to your site, with the webhooks, API keys and OAuth clients your other tools use.
      icon: i-mdi-connection
      to: /en/modules/integrations
    - title: Newsletter
      description: You send a newsletter to your site's e-mail groups, schedule the sending and track the opens.
      icon: i-heroicons-envelope
      to: /en/modules/newsletter
    - title: Blog
      description: You publish posts on your site, by author and category, with comments and an RSS feed.
      icon: i-heroicons-newspaper
      to: /en/modules/blog-app
    - title: Frappe Suite
      description: Files, documents, spreadsheets, presentations and video calls in one Frappe application, which replaces Drive. Frappe still marks it as in development.
      icon: i-heroicons-squares-2x2
      to: /en/modules/suite

cta:
  title: Connect your external tools to Dokos
  description: Describe the tool and how you use it. We will tell you whether an integration already exists or what needs to be built.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See the engineering engagements
      to: /en/ingenierie
      size: xl
      color: neutral
      variant: outline

# English version of content/fr/ecosysteme/projets-ressources-humaines.yml (sources are there).
title: Projects & human resources
description: Tracking of projects, teams and training, connected to customer invoicing and accounting.
navigation:
  title: Projects & human resources
  icon: i-heroicons-user-group

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-user-group
    to: /en/modules
  title: Your teams and your projects, <span class="text-primary">in one view</span>.
  description: Time spent on a project feeds both progress tracking and customer invoicing. A team's leave and absences can be read against its actual workload.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: The whole ecosystem
      to: /en/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: The applications in this area
  description: Three modules, useful to different degrees depending on whether you bill time or manage internal teams.
  items:
    - title: Projects
      description: Projects split into tasks, timesheets, and the cost and billable amount of each project.
      icon: i-eos-icons-project-outlined
      to: /en/modules/projets
    - title: Human resources
      description: Leave, attendance, expense claims and appraisals, with a mobile app for requests and approvals. The module has been under overhaul since September 2026.
      icon: i-mdi-human-capacity-increase
      to: /en/modules/ressources-humaines
      logo:
        light: /frappe/hrms_logo.svg
        dark: /frappe/hrms_logo.svg
    - title: Learning
      description: Online courses, sessions, quizzes and certificates issued from your site.
      icon: i-heroicons-academic-cap
      to: /en/modules/learning
      logo:
        light: /frappe/lms.png
        dark: /frappe/lms.png

cta:
  title: You bill time, or you manage internal teams
  description: The useful scope depends on your activity. Describe it, and we will tell you which modules cover it.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See pricing
      to: /en/tarifs
      size: xl
      color: neutral
      variant: outline

# English version of content/fr/ecosysteme/achats-stocks-production.yml (sources are there).
title: Purchasing, stock & manufacturing
description: From the purchase order to the warehouse dispatch, one chain for supply, stock and manufacturing.
navigation:
  title: Purchasing, stock & manufacturing
  icon: i-heroicons-cube

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-cube
    to: /en/modules
  title: From the purchase order to the <span class="text-primary">warehouse dispatch</span>, one chain.
  description: Purchasing, stock, manufacturing and quality control share the same bill of materials and the same locations. A work order consumes the actual stock.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: The whole ecosystem
      to: /en/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: The applications in this area
  description: Useful on their own for a distribution SME, or combined for a manufacturing site.
  items:
    - title: Purchasing
      description: Material requests, supplier quotations and purchase orders, receipts and purchase invoices, with a scorecard for each supplier.
      icon: i-icon-park-outline-buy
      to: /en/modules/achats
    - title: Stock
      description: Every receipt, issue and transfer of items, by warehouse, batch and serial number, with stock valuation.
      icon: i-vaadin-stock
      to: /en/modules/stocks
    - title: Manufacturing
      description: Bills of materials, work orders and job cards, with the actual cost of each batch produced.
      icon: i-fluent-manufacturer-24-regular
      to: /en/modules/production
    - title: Quality
      description: Procedures, measured goals, inspections at receipt and on the shop floor, and non-conformities followed up to their corrective action.
      icon: i-carbon-rule-data-quality
      to: /en/modules/qualite

cta:
  title: Rebuild your supply chain in Dokos
  description: Bills of materials, routings and stock history can be taken over from an existing ERP or a spreadsheet.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See the engineering engagements
      to: /en/ingenierie
      size: xl
      color: neutral
      variant: outline

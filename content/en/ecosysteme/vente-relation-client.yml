# English version of content/fr/ecosysteme/vente-relation-client.yml (sources are there).
title: Sales & customer relations
description: CRM, sales, online shop, bookings, memberships and points of sale share the same customer base, from the first contact to the invoice.
navigation:
  title: Sales & customer relations
  icon: i-heroicons-shopping-cart

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-shopping-cart
    to: /en/modules
  title: From prospecting to payment,<br><span class="text-primary">one customer base</span>.
  description: A quotation accepted in the CRM becomes an order, then an invoice, with no re-keying. The catalogue, stock and prices are shared by the CRM, sales, the online shop and the point of sale.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: The whole ecosystem
      to: /en/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: The applications in this area
  description: Each one installs on its own or with the others, on the same base.
  items:
    - title: CRM
      description: Leads, sales pipeline and quotations, from the first contact to the signature.
      icon: i-carbon-chart-relationship
      to: /en/modules/crm
      logo:
        light: /frappe/crm.svg
        dark: /frappe/crm.svg
    - title: Sales
      description: Quotations, orders, deliveries, invoices and subscriptions, with the site's prices and stock.
      icon: i-ep-sell
      to: /en/modules/ventes
    - title: Webshop
      description: An online shop and a customer portal on the same catalogue and the same stock.
      icon: i-gg-website
      to: /en/modules/e-commerce
      logo:
        light: /frappe/webshop_logo.svg
        dark: /frappe/webshop_logo.svg
    - title: Bookings
      description: Rooms, equipment or time slots that your customers can book, with credits for third places.
      icon: i-material-symbols-location-on-outline-rounded
      to: /en/modules/reservations-de-ressources
      logo:
        light: /frappe/bookings_logo.svg
        dark: /frappe/bookings_logo.svg
    - title: Construction
      description: Quotations built in sections with subtotals, then progress invoices as the work advances.
      icon: i-heroicons-calculator
      to: /en/modules/construction
      logo:
        light: /frappe/construction_logo.svg
        dark: /frappe/construction_logo.svg
    - title: Tribu
      description: Members, membership fees and donations of your non-profit, with online registration and payment, and automatic invoicing.
      icon: i-heroicons-identification
      to: /en/modules/tribu
    - title: Dokos WooCommerce
      description: Each order from your WooCommerce shop becomes a Dokos sales order, and your stock levels go back to the shop.
      icon: i-simple-icons-woocommerce
      to: /en/modules/woocommerce
      logo:
        light: /frappe/woocommerce_logo.svg
        dark: /frappe/woocommerce_logo.svg
    - title: Hiboutik
      description: Each sale from your Hiboutik till comes back as a sales invoice, and your items and stock go to the till.
      icon: i-heroicons-shopping-bag
      to: /en/modules/hiboutik
      logo:
        light: /frappe/hiboutik_logo.svg
        dark: /frappe/hiboutik_logo.svg
    - title: eCommerce Integrations
      description: The connectors published by Frappe for Shopify, Unicommerce, Zenoti and Amazon, for your orders and stock.
      icon: i-heroicons-shopping-bag
      to: /en/modules/ecommerce-integrations

cta:
  title: Your sales tools do not talk to each other
  description: Describe your current customer journey. We will tell you what a shared base changes, and what it will not change.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: See pricing
      to: /en/tarifs
      size: xl
      color: neutral
      variant: outline

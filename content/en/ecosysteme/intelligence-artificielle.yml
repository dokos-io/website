# English version of content/fr/ecosysteme/intelligence-artificielle.yml.
title: For your teams and your AI agents
description: "The company brain, for your teams and your AI agents. Dokos AI answers from your documents and asks for confirmation before writing. Its MCP server, like the one in Dokos CLI, connects Claude, ChatGPT, Gemini, Le Chat or the assistant of your choice, with the same permissions as a user."
navigation:
  title: AI & agents
  icon: i-heroicons-cpu-chip

hero:
  headline:
    label: The Dokos ecosystem
    icon: i-heroicons-cpu-chip
    to: /en/modules
  title: The company brain,<br>for your teams and your <span class="text-primary">AI agents</span>.
  description: An agent that works in Dokos reads the same documents as your teams, with the same permissions, and each action it takes appears in the document history. Dokos AI is the assistant built into the site. Dokos AI and Dokos CLI connect the assistant of your choice through their MCP server.
  links:
    - label: Dokos AI
      to: /en/modules/dokos-ai
      size: xl
      color: primary
      icon: i-heroicons-sparkles
    - label: Dokos CLI and MCP
      to: /en/modules/dokos-cli
      size: xl
      color: neutral
      variant: outline
      icon: i-heroicons-command-line

assistants:
  title: With the assistant you already use
  description: Dokos AI opens an MCP server protected by OAuth. You connect it to your assistant, which then acts with your account and your permissions.
  note: MCP connectors depend on each assistant's plan.
  items:
    - { name: Claude, logo: /ai/claude.svg }
    - { name: ChatGPT, logo: /ai/chatgpt.svg }
    - { name: Gemini, logo: /ai/gemini.svg }
    - { name: Mistral Le Chat, logo: /ai/mistral.svg }
    - { name: Grok, logo: /ai/grok.svg }
    - { name: Microsoft Copilot, logo: /ai/copilot.svg }
    - { name: Perplexity, logo: /ai/perplexity.svg }

scope:
  title: The same rules for everyone
  description: What an agent can do in Dokos is set by what the base already applies to each user.
  items:
    - title: A user's permissions
      description: An agent signs in with an account and roles. It reads and writes only what this account can read and write.
      icon: i-heroicons-shield-check
    - title: Confirmation before writing
      description: Dokos AI shows each creation, change or submission of a document before applying it, and waits for your approval.
      icon: i-heroicons-hand-raised
    - title: Every action in the history
      description: A change made by an agent appears in the document timeline, like a person's, with its author and time.
      icon: i-heroicons-clock
    - title: An MCP server
      description: Dokos CLI exposes the reads, writes, reports and schemas of your site to any MCP-compatible agent.
      icon: i-heroicons-command-line
    - title: Skills written for your processes
      description: A Dokos AI skill is a Markdown file with a YAML header, dedicated to one process. We write them with you in an AI engineering engagement.
      icon: i-heroicons-document-text
    - title: The REST API underneath
      description: Each document, report and permission is available through the API, for your own tools and your own agents.
      icon: i-heroicons-code-bracket

operations:
  title: What already runs without an agent
  description: Automations shipped in the product, which agents extend.
  items:
    - title: Supplier invoices read by OCR
      description: OCR extracts the data from a PDF invoice with Amazon Textract and prepares the purchase invoice. On Dokos V5, eTransactions takes over this reading.
      icon: i-heroicons-document-magnifying-glass
    - title: E-invoices received
      description: eTransactions reads CII, Factur-X and UBL invoices and connects to an approved platform (PA) for receiving.
      icon: i-heroicons-document-check
    - title: Bank reconciliation
      description: The Banking module, in beta, suggests matches between statements and journal entries, with a cash-flow forecast.
      icon: i-heroicons-building-library
    - title: Generated web pages
      description: Frappe Builder generates a page from a description, through the OpenRouter service, billed per use.
      icon: i-heroicons-globe-alt

modules:
  title: The applications in this area
  description: The built-in assistant, and the tool that connects external agents.
  items:
    - title: Dokos AI
      description: An assistant connected to your site's documents, with business skills and a confirmation before any write.
      icon: i-heroicons-sparkles
      to: /en/modules/dokos-ai
      logo:
        light: /frappe/dokos_logo.svg
        dark: /frappe/dokos_logo.svg
    - title: Dokos CLI
      description: Queries and drives a site from a terminal, or gives an AI agent the same capabilities through its MCP server (local MCP).
      icon: i-heroicons-command-line
      to: /en/modules/dokos-cli
      logo:
        light: /frappe/dokos_logo.svg
        dark: /frappe/dokos_logo.svg

cta:
  title: Hand a process to an agent
  description: Describe it to us. We will tell you what Dokos AI and the MCP server already cover, and what remains to be written.
  links:
    - label: Write to us
      to: /en/contact
      size: xl
      color: primary
    - label: AI engineering
      to: /en/ingenierie
      size: xl
      color: neutral
      variant: outline

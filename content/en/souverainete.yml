scope:
  title: What we commit to
  description: Each point refers to our privacy policy or to our hosting terms and conditions.
  items:
    - title: Data location
      description: Customer databases are hosted in France and Germany. Backups are replicated across several availability zones, in these two countries.
      icon: i-heroicons-map-pin
    - title: A named accountable party
      description: Dokos SAS, a French company registered with the Nancy trade and companies register, is your contractual point of contact and your data processor under Article 28 of the GDPR.
      icon: i-heroicons-building-office-2
    - title: European hosting providers
      description: "OVHcloud SAS in France and Hetzner GmbH in Germany. The payment providers, Stripe and GoCardless Ltd, are named in the privacy policy with the data they receive."
      icon: i-circle-flags-european-union
    - title: No software lock-in
      description: The software we run is published under free licences. No proprietary component decides whether your installation runs.
      icon: i-heroicons-lock-open
    - title: SecNumCloud
      description: We are not SecNumCloud-qualified and we do not claim to be. This qualification applies to the infrastructure host; we work as the application operator on top of it.
      icon: i-heroicons-information-circle
    - title: French obligations
      description: "Accounting, LNE-certified point of sale, e-invoicing: the relevant modules are built for French obligations. The details are on the Certifications page."
      icon: i-octicon-law

operations:
  title: Data protection, in detail
  description: These commitments are set out in our privacy policy and in our hosting terms and conditions.
  items:
    - title: You remain the data controller
      description: The data you put into your database belongs to you. We process it on your behalf, as a processor, following your instructions.
      icon: i-material-symbols-data-loss-prevention-outline
    - title: Limited and logged access
      description: Our teams access your data only at your request, to resolve a technical incident, or under a legal obligation. Every access is logged.
      icon: i-heroicons-finger-print
    - title: Notification within 72 hours
      description: In the event of a data breach on our servers, the CNIL is notified within 72 hours, and so are you whenever the rights of the people concerned are at risk.
      icon: i-heroicons-bell-alert
    - title: No banking data stored
      description: Payments go through PCI-DSS compliant providers. Card numbers do not pass through our systems.
      icon: i-heroicons-credit-card
    - title: Strictly necessary cookies
      description: The site only uses the cookies needed for the session and for security. No advertising or tracking cookie without explicit consent.
      icon: i-heroicons-shield-check
    - title: Controlled erasure
      description: After termination, your database is deactivated for four weeks, then destroyed. Backup copies are purged at the end of the twelve-month safety retention period.
      icon: i-heroicons-trash

reversibility:
  title: Taking back your data and your installation
  description: What you can do at any time, with no prior request.
  items:
    - title: Export your data
      description: A full export, in a structured and common format, from your own administration interface.
      icon: i-material-symbols-cloud-sync-outline-rounded
    - title: Carry on without the publisher
      description: Because the code is free, your installation stays usable if Dokos SAS disappears.
      icon: i-heroicons-arrow-path
    - title: Change operator
      description: No exclusivity clause. You can hand operations to a third party or bring them in house, with our help.
      icon: i-heroicons-arrows-right-left
    - title: Terminate with thirty days' notice
      description: In the event of a price revision, you can leave without penalty within thirty days of the notification.
      icon: i-heroicons-document-check

faq:
  title: Frequently asked questions
  items:
    - label: Where is the data hosted?
      content: In France and Germany, with OVHcloud and Hetzner. Production and backups are spread across these two countries, in the European Union. The details are in our privacy policy.
    - label: Who are your subprocessors?
      content: "They are named in our privacy policy, each with the reason for its involvement and the kind of data shared: OVHcloud and Hetzner for hosting, Stripe and GoCardless Ltd for payments. Any change that could affect your data is notified to you beforehand, in line with Article 28 of the GDPR."
    - label: How can I check the integrity of the installed version?
      content: We publish the fingerprint of each file in the certified scope, with the procedure to recompute it on your own installation. The details are on the [Certifications page](/en/certifications).
    - label: Who do I contact for a GDPR request?
      content: Our data protection officer can be reached at dpo@dokos.io, or by post at the address given in our [privacy policy (in French)](/fr/securityandprivacy). The response time is one month from receipt, which can be extended depending on the circumstances.

cta:

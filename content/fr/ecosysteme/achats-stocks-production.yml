# Sources : content/fr/modules/{achats,stocks,production,qualite}.yml (navigation.description, sections).
title: Achats, stocks & production
description: Du bon de commande à la sortie d'entrepôt, une seule chaîne d'approvisionnement, de stock et de fabrication.
navigation:
  title: Achats, stocks & production
  icon: i-heroicons-cube

hero:
  headline:
    label: L'écosystème Dokos
    icon: i-heroicons-cube
    to: /fr/modules
  title: Du bon de commande à la <span class="text-primary">sortie d'entrepôt</span>, une seule chaîne.
  description: Les achats, les stocks, la production et le contrôle qualité partagent la même nomenclature et les mêmes emplacements. Un ordre de fabrication consomme le stock réel.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Tout l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: Les applications de ce domaine
  description: Utiles séparément pour une PME de distribution, ou combinés pour un site de production.
  items:
    - title: Achats
      description: Demandes de matériel, devis et commandes fournisseurs, réceptions et factures d'achat, avec une carte de pointage par fournisseur.
      icon: i-icon-park-outline-buy
      to: /fr/modules/achats
    - title: Stocks
      description: Chaque entrée, sortie et transfert d'articles, par entrepôt, lot et numéro de série, avec la valorisation du stock.
      icon: i-vaadin-stock
      to: /fr/modules/stocks
    - title: Production
      description: Nomenclatures, ordres de travail et cartes de travail, avec le coût réel de chaque lot fabriqué.
      icon: i-fluent-manufacturer-24-regular
      to: /fr/modules/production
    - title: Qualité
      description: Procédures, objectifs mesurés, inspections en réception et en atelier, et non-conformités suivies jusqu'à leur action corrective.
      icon: i-carbon-rule-data-quality
      to: /fr/modules/qualite

cta:
  title: Reconstituez votre chaîne d'approvisionnement dans Dokos
  description: Nomenclatures, gammes de fabrication et historique de stock se reprennent depuis un ERP existant ou un tableur.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir les offres d'ingénierie
      to: /fr/ingenierie
      size: xl
      color: neutral
      variant: outline

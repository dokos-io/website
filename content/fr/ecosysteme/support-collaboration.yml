# Sources : content/fr/modules/{support,raven,wiki,telephony}.yml (navigation.description, README des dépôts
# frappe/helpdesk, frappe/raven, frappe/wiki, frappe/telephony cités dans ces pages).
title: Support & collaboration
description: Le support client, la messagerie d'équipe et la documentation interne, connectés aux mêmes données que vos modules commerciaux et opérationnels.
navigation:
  title: Support & collaboration
  icon: i-heroicons-chat-bubble-left-right

hero:
  headline:
    label: L'écosystème Dokos
    icon: i-heroicons-chat-bubble-left-right
    to: /fr/modules
  title: Le support client et la <span class="text-primary">connaissance interne</span>, au même endroit.
  description: Un ticket de support voit l'historique complet d'un client, sans changer d'outil. Les procédures internes restent documentées et cherchables plutôt que dispersées entre emails et fichiers partagés.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Tout l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: Les applications de ce domaine
  description: Quatre applications. Helpdesk, Raven et Wiki s'installent séparément. Telephony s'ajoute à Helpdesk ou au CRM.
  items:
    - title: Helpdesk
      description: Chaque demande client devient un ticket, avec des délais de réponse par priorité, une base de connaissances et un portail où le client suit sa demande.
      icon: i-ri-customer-service-2-line
      to: /fr/modules/support
      logo:
        light: /frappe/helpdesk.png
        dark: /frappe/helpdesk.png
    - title: Raven
      description: Une messagerie d'équipe installée sur votre site, avec des canaux, des fils et vos documents Dokos affichés en carte dans la conversation.
      icon: i-heroicons-chat-bubble-left-right
      to: /fr/modules/raven
      logo:
        light: /frappe/raven.webp
        dark: /frappe/raven.webp
    - title: Wiki
      description: Vos procédures publiées en pages web depuis votre site, avec un historique des révisions et une relecture avant publication.
      icon: i-heroicons-book-open
      to: /fr/modules/wiki
      logo:
        light: /frappe/wiki.png
        dark: /frappe/wiki.png
    - title: Telephony
      description: Relie un compte Exotel ou Twilio à votre site. Vous passez et recevez les appels depuis un ticket Helpdesk ou une fiche CRM, et chaque appel est journalisé.
      icon: i-heroicons-phone
      to: /fr/modules/telephony

cta:
  title: Sortez votre support client de la boîte mail partagée
  description: Décrivez-nous vos volumes et vos délais actuels. Nous vous dirons ce qu'un outil dédié change, et à partir de quel volume ça devient utile.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir les tarifs
      to: /fr/tarifs
      size: xl
      color: neutral
      variant: outline

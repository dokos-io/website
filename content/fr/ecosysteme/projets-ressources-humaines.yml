# Sources : content/fr/modules/{projets,ressources-humaines,learning}.yml ; billet rentree-2026.md (refonte RH).
# La paie héritée de Frappe HR n'est pas adaptée à la France (FAQ de ressources-humaines.yml) : elle n'est plus citée.
title: Projets & ressources humaines
description: Le suivi des projets, des équipes et de la formation, connecté à la facturation client et à la comptabilité.
navigation:
  title: Projets & ressources humaines
  icon: i-heroicons-user-group

hero:
  headline:
    label: L'écosystème Dokos
    icon: i-heroicons-user-group
    to: /fr/modules
  title: Vos équipes et vos projets, <span class="text-primary">une seule vue</span>.
  description: Le temps passé sur un projet alimente à la fois le suivi d'avancement et la facturation client. Les congés et les absences d'une équipe se lisent en face de sa charge de travail réelle.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Tout l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: Les applications de ce domaine
  description: Trois modules, utiles à des degrés différents selon que vous facturez du temps ou gérez des équipes internes.
  items:
    - title: Projets
      description: Des projets découpés en tâches, des feuilles de temps, et le coût et le montant facturable de chaque projet.
      icon: i-eos-icons-project-outlined
      to: /fr/modules/projets
    - title: Ressources humaines
      description: Congés, présences, notes de frais et évaluations, avec une application mobile pour les demandes et les approbations. Le module est en cours de refonte depuis la rentrée 2026.
      icon: i-mdi-human-capacity-increase
      to: /fr/modules/ressources-humaines
      logo:
        light: /frappe/hrms_logo.svg
        dark: /frappe/hrms_logo.svg
    - title: Learning
      description: Des cours en ligne, des sessions, des quiz et des certificats délivrés depuis votre site.
      icon: i-heroicons-academic-cap
      to: /fr/modules/learning
      logo:
        light: /frappe/lms.png
        dark: /frappe/lms.png

cta:
  title: Vous facturez du temps, ou vous gérez des équipes internes
  description: Le périmètre utile diffère selon votre activité. Décrivez-la, nous vous dirons quels modules l'adressent réellement.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir les tarifs
      to: /fr/tarifs
      size: xl
      color: neutral
      variant: outline

title: Site web & outils numériques
# Sources : content/fr/modules/{builder,insights,integrations,ocr,newsletter,blog-app}.yml (navigation.description
# et install). Print Designer (déprécié) et Frappe Drive (archivé, rejoint Frappe Suite d'après le README de
# github.com/frappe/drive) sont retirés de la liste.
description: Site web, blog, lettres d'information, rapports et intégrations, construits sur les mêmes données que le reste de Dokos.
navigation:
  title: Site web & outils numériques
  icon: i-heroicons-globe-alt

hero:
  headline:
    label: L'écosystème Dokos
    icon: i-heroicons-globe-alt
    to: /fr/modules
  title: Votre site et vos rapports, <span class="text-primary">sur vos données Dokos</span>.
  description: Un tableau de bord Insights lit directement vos données de gestion, sans export. L'OCR lit une facture fournisseur en PDF et prépare la facture d'achat, que vous rapprochez de la commande.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Tout l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline

modules:
  title: Les applications de ce domaine
  description: Des outils transverses, utiles quel que soit le secteur d'activité.
  items:
    - title: Builder
      description: Vous construisez les pages de votre site dans un éditeur visuel, reliées à vos données Dokos, et vous les publiez en un clic.
      icon: i-mdi-application-settings-outline
      to: /fr/modules/builder
      logo:
        light: /frappe/builder.svg
        dark: /frappe/builder.svg
    - title: Insights
      description: Des tableaux de bord et rapports construits sur vos données de gestion, sans export vers un autre outil.
      icon: i-heroicons-chart-bar
      to: /fr/modules/insights
      logo:
        light: /frappe/insights.svg
        dark: /frappe/insights.svg
    - title: Intégrations
      description: Les paramètres des services connectés à votre site, avec les webhooks, les clés API et les clients OAuth que vos autres outils utilisent.
      icon: i-mdi-connection
      to: /fr/modules/integrations
    - title: Newsletter
      description: Vous envoyez une lettre d'information aux groupes d'e-mails de votre site, vous planifiez l'envoi et vous suivez les ouvertures.
      icon: i-heroicons-envelope
      to: /fr/modules/newsletter
    - title: Blog
      description: Vous publiez des billets sur votre site, par auteur et par catégorie, avec commentaires et flux RSS.
      icon: i-heroicons-newspaper
      to: /fr/modules/blog-app
    - title: Frappe Suite
      # source: content/fr/modules/suite.yml (README frappe/suite, marqué « [WIP] » par Frappe)
      description: Fichiers, documents, tableurs, présentations et visioconférence dans une seule application de Frappe, qui remplace Drive. Frappe la marque encore comme en développement.
      icon: i-heroicons-squares-2x2
      to: /fr/modules/suite

cta:
  title: Raccordez vos outils externes à Dokos
  description: Décrivez-nous l'outil et l'usage. Nous vous dirons si une intégration existe déjà ou ce qu'il faut construire.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir les offres d'ingénierie
      to: /fr/ingenierie
      size: xl
      color: neutral
      variant: outline

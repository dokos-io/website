# Sources : content/fr/modules/{comptabilite,bank,paiements,etransactions}.yml ; billet rentree-2026.md
# (module Banking et prévisionnel de trésorerie en bêta) ; certifications.md (licence Certification Caisse).
title: Finance & comptabilité
description: Chaque facture, chaque paiement et chaque mouvement de stock alimente les comptes. Le rapprochement bancaire, les paiements en ligne et les factures électroniques s'appuient sur les mêmes écritures.
navigation:
  title: Finance & comptabilité
  icon: i-heroicons-banknotes

hero:
  headline:
    label: L'écosystème Dokos
    icon: i-heroicons-banknotes
    to: /fr/modules
  title: Une comptabilité qui se met à jour<br><span class="text-primary">à chaque document</span>.
  description: Une facture validée crée son écriture. Un paiement reçu la solde. Un mouvement de stock passe dans les comptes. Le rapprochement bancaire et les rapports financiers lisent ces écritures, sans ressaisie entre deux logiciels.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Tout l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline

scope:
  title: Ce que couvre ce domaine
  description: Conçu pour les obligations françaises, utilisable en multi-société et multi-devise.
  items:
    - title: Plan comptable français
      description: Plan de comptes, TVA, écritures, grand livre, balance, bilan et compte de résultat, avec export vers votre expert-comptable.
      icon: i-heroicons-book-open
    - title: Encaissement certifié LNE
      description: Pour les entreprises qui facturent des particuliers, le module Certification Caisse est certifié par le LNE. Vous l'installez et vous demandez une licence à Dokos SAS. La licence porte les clés de signature de chaque société et l'accès au journal de signature externe de Dokos SAS. Les empreintes du périmètre certifié sont publiées sur la page Certifications.
      icon: i-octicon-law
    - title: Facturation électronique
      description: Émission et réception des factures CII, Factur-X et UBL, par la plateforme agréée de votre choix.
      icon: i-heroicons-document-check
    - title: Rapprochement bancaire
      description: Vos relevés arrivent chaque jour par Bank, ou vous les importez en OFX, CSV, XLSX ou PDF. Le module Banking, en bêta, propose les correspondances. Le prévisionnel de trésorerie, en bêta, lit vos factures, vos commandes et vos abonnements.
      icon: i-heroicons-building-library

modules:
  title: Les applications de ce domaine
  description: Quatre applications, une seule comptabilité.
  items:
    - title: Comptabilité
      description: Écritures, TVA, grand livre, bilan et compte de résultat, multi-société et multi-devise. Le module Banking et le prévisionnel de trésorerie, en bêta depuis la rentrée 2026, en font partie.
      icon: i-heroicons-calculator
      to: /fr/modules/comptabilite
    - title: Bank
      description: Connecte vos comptes bancaires par l'agrégateur Bridge. Chaque jour, les opérations de la veille deviennent des transactions bancaires prêtes à être rapprochées. Réservé aux sites Dokos Cloud.
      icon: i-heroicons-building-library
      to: /fr/modules/bank
      logo:
        light: /frappe/bank_logo.svg
        dark: /frappe/bank_logo.svg
    - title: Payments
      description: Paiements par carte, prélèvement SEPA, PayPal ou terminal SumUp, depuis un lien de paiement rattaché à la facture, à la commande ou à l'abonnement.
      icon: i-heroicons-credit-card
      to: /fr/modules/paiements
      logo:
        light: /frappe/payments_logo.svg
        dark: /frappe/payments_logo.svg
    - title: eTransactions
      description: Reçoit les factures électroniques CII, Factur-X et UBL et se raccorde à une plateforme agréée.
      icon: i-heroicons-document-check
      to: /fr/modules/etransactions

cta:
  title: Vous migrez depuis un autre logiciel comptable
  description: Décrivez-nous votre plan de comptes et vos flux. Nous vous dirons ce qui se reprend tel quel, et ce qui demande un travail de préparation.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir les tarifs
      to: /fr/tarifs
      size: xl
      color: neutral
      variant: outline

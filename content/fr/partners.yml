description: Ces sociétés installent, paramètrent et font évoluer Dokos pour leurs clients. Si vous choisissez un partenaire, il devient votre interlocuteur principal pour le déploiement, l'assistance et la migration, et il peut faire appel au support de second niveau de Dokos SAS si votre abonnement le prévoit. Choisissez-le selon sa région et ses services.

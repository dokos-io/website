# Sources : https://doc.dokos.io/v5/dokos/chantiers et ses sous-pages (vue-chantiers, factures-situation, outils),
# README et hooks de https://gitlab.com/dokos/construction (branche v5), DocTypes Construction App Settings et
# Progress Invoicing Items, traductions françaises de l'application. Dans l'interface, l'application s'appelle « Chantier ».
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : un Devis en vue Chantier, avec des titres, des lignes d'articles et un sous-total par section
# - fit.webp : une Commande client validée avec le « Récapitulatif de facturation » et ses factures de situation déjà générées
# - feature-editeur.webp : l'éditeur de lignes du devis, boutons « Ajouter un titre », « Ajouter un commentaire », « Ajouter un article »
# - feature-impression.webp : l'aperçu d'impression du devis, sections et sous-totaux, une ligne masquée
# - feature-situation.webp : la fenêtre « Facture de situation » depuis la commande, pourcentage d'avancement proposé
# - feature-marge.webp : le rapport « Comparatif de marge par devis »
# - feature-parametres.webp : les Paramètres de l'application Chantier, colonnes de l'éditeur de devis

title: Construction
description: Construit vos devis par sections avec sous-totaux, puis facture le chantier par situations d'avancement.
icon: i-heroicons-calculator
application: Construction
theme: vente-relation-client
author: Dokos
logo:
  light: /frappe/construction_logo.svg
  dark: /frappe/construction_logo.svg
navigation:
  title: Construction
  icon: i-heroicons-calculator
  description: Devis par sections et factures de situation.

publisher: dokos
licence: AGPLv3
version: v5
marketplace: construction
docs: https://doc.dokos.io/v5/dokos/chantiers
related: [ventes, projets, achats, comptabilite]

hero:
  title: Des devis <span class="text-primary">structurés en lots</span>, facturés à l'avancement.
  description: Construction remplace la table d'articles des devis, commandes et factures par un éditeur à titres, commentaires et sous-totaux. La commande se facture ensuite par situations.
  image: /modules/construction/hero.webp

for_whom:
  items:
    - title: Vous chiffrez vos ouvrages dans un tableur
      description: Les lots, les sous-totaux et les commentaires se saisissent directement dans le devis Dokos, puis se retrouvent dans la commande et la facture.
      icon: i-heroicons-table-cells
    - title: Vous facturez vos chantiers par étapes
      description: Depuis la commande validée, vous créez une facture de situation avec un pourcentage d'avancement global ou par ligne.
      icon: i-heroicons-receipt-percent
    - title: Vous voulez comparer la marge prévue et la marge réelle
      description: Deux rapports comparent le devis à la facturation, par projet et par devis.
      icon: i-heroicons-chart-bar

fit:
  description: Construction s'active dans les <strong>Paramètres de l'application Chantier</strong>. Vous cochez « Utiliser la vue Table dédiée », vous choisissez les documents de vente et d'achat concernés, puis les colonnes à afficher. L'éditeur remplace alors la table d'articles du <strong>Devis</strong>, de la <strong>Commande client</strong>, de la <strong>Facture de vente</strong> et du Bon de livraison, ainsi que du Devis fournisseur, de la Commande fournisseur et du Reçu d'achat. Les lignes de type titre, commentaire ou article passent d'un document à l'autre avec leurs sous-totaux.
  image: /modules/construction/fit.webp
  reads:
    - Devis, Commande client, Bon de livraison, Facture de vente
    - Devis fournisseur, Commande fournisseur, Reçu d'achat
    - Projet et Tâche
    - Ensemble de produits
  adds:
    - Le document « Paramètres de l'application Chantier »
    - Un éditeur de lignes avec titres, commentaires, sous-totaux et affichage à l'impression
    - Les factures de situation et le « Récapitulatif de facturation » sur la commande
    - Les rapports « Récapitulatif de marque sur devis par projet » et « Comparatif de marge par devis »
  depends:
    - Ventes

features:
  - title: Composez le devis par sections
    description: Dans l'éditeur, vous ajoutez un titre, un commentaire ou un article, puis vous réordonnez les lignes par glisser-déposer. Chaque section calcule son sous-total. Les colonnes se choisissent dans les paramètres, par exemple le prix de revient unitaire, le coefficient de charge ou le pourcentage de marge brute.
    image: /modules/construction/feature-editeur.webp
    badge: Devis
  - title: Choisissez ce que le client voit
    description: "Pour chaque ligne, vous décidez de l'affichage à l'impression : masquer le prix, masquer la ligne, ou masquer les prix de toute une section. Le format d'impression reprend les sections et affiche les sous-totaux."
    image: /modules/construction/feature-impression.webp
    badge: Impression
  - title: Facturez par situations
    description: Sur une commande client validée, choisissez Créer puis Facture de situation. Dokos propose un pourcentage d'avancement, le plus élevé entre l'avancement du projet lié et ce qui est déjà facturé. Vous l'appliquez à toute la facture ou ligne par ligne. Le titre d'impression indique « Facture de situation n°3 » et le récapitulatif de facturation, sur la commande et sur la facture, liste les situations déjà émises.
    image: /modules/construction/feature-situation.webp
    badge: Facturation
  - title: Comparez la marge prévue et la marge réelle
    description: Le rapport « Récapitulatif de marque sur devis par projet » compare, pour chaque projet, le taux de marque du devis avec les ventes et les achats réels. Le rapport « Comparatif de marge par devis » met en face la marge calculée au devis et la marge constatée à la facturation.
    image: /modules/construction/feature-marge.webp
    badge: Rapports

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Construction sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/construction</code> puis <code>bench --site votre-site install-app construction</code>."
    - title: Activez la vue dédiée
      description: Ouvrez les Paramètres de l'application Chantier, cochez « Utiliser la vue Table dédiée », choisissez les documents de vente et d'achat concernés, puis les colonnes de l'éditeur de devis. La vue n'est pas active par défaut.

faq:
  items:
    - label: Dans quels documents l'éditeur apparaît-il ?
      content: Dans le devis, la commande client, la facture de vente et le bon de livraison, ainsi que dans le devis fournisseur, la commande fournisseur et le reçu d'achat. Vous activez séparément les documents de vente et les documents d'achat.
    - label: Une facture de situation peut-elle couvrir plusieurs commandes ?
      content: Non. Une facture de situation est rattachée à une seule commande client.
    - label: Le stock sort-il à la facture de situation ?
      content: Non. Les quantités sortent du stock par le bon de livraison, pas depuis la facture de situation.
    - label: Comment afficher l'avancement dans la table du devis ?
      content: Dans les Paramètres de l'application Chantier, ajoutez une colonne avec le champ `progress_percentage`, en général avant la quantité.
    - label: Que gagnent les projets et les tâches ?
      content: Un onglet regroupe, sur le projet et sur chaque tâche, tous les documents joints aux tâches du projet.

bottom_cta:
  title: Votre façon de chiffrer aujourd'hui
  description: Décrivez-nous votre processus de devis et de facturation de chantier, nous vous dirons ce que Construction couvre déjà.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

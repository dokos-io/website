for_whom:
  items:
    - title: Vos fournisseurs vous envoient déjà des factures électroniques
      description: Depuis septembre 2026, toute entreprise doit pouvoir les recevoir. Dokos les récupère sur votre plateforme agréée et les lit pour vous.
      icon: i-heroicons-inbox-arrow-down
    - title: Vous ressaisissez les factures fournisseur reçues en PDF
      description: Vous déposez le PDF dans la banette ou vous le transférez par courriel. L'OCR extrait le fournisseur, les montants et les lignes.
      icon: i-heroicons-document-magnifying-glass
    - title: Vous devez émettre vos factures par une plateforme agréée
      description: Vous renseignez le SIREN et le profil de vos clients. À la validation, la facture de vente part par votre plateforme agréée.
      icon: i-heroicons-paper-airplane

fit:
  description: eTransactions se configure dans <strong>Paramètres E-transactions</strong>, au niveau de la société. Les factures reçues, par la plateforme agréée ou par OCR, arrivent dans la même <strong>Banette de factures d'achat</strong>. Chacune devient une facture fournisseur en attente, que vous reliez à une commande fournisseur ou à un reçu d'achat, puis que vous transformez en <strong>Facture d'achat</strong>. Côté ventes, la fiche Client porte le SIREN, le profil e-invoice et la ligne d'annuaire qui serviront à l'émission.
  reads:
    - Société, Client, Fournisseur et leurs adresses
    - Commande fournisseur et Reçu d'achat
    - Facture d'achat
    - Facture de vente et Écriture de paiement
  adds:
    - Le document « Paramètres E-transactions » avec l'onglet « Plateforme Agréée »
    - La « Banette de factures d'achat » et les factures fournisseur en attente
    - Les champs SIREN, profil e-invoice et annuaire sur les fiches Client et Fournisseur
    - Un panneau de statut sur la facture de vente et l'action « Annuler avec cycle de vie »
  depends:
    - Comptabilité
    - Achats

features:
  - title: Connectez votre plateforme agréée
    description: Dans Paramètres E-transactions, onglet Plateforme Agréée, vous ajoutez SuperPDP, Esalink (HUBTIMIZE) ou une plateforme personnalisée conforme au standard AFNOR XP Z12-013. Vous choisissez le périmètre, ventes, achats ou les deux, puis l'environnement bac à sable ou production. Le bouton « Tester la connexion » vérifie vos identifiants avant l'activation. Dokos contrôle chaque jour l'état de la connexion et signale une erreur par un voyant.
    badge: En production
  - title: Inscrivez votre société à l'annuaire
    description: Le bouton « Remplir depuis SIRENE » complète le SIREN, le numéro de TVA et l'adresse du siège sur la fiche Société. Depuis la configuration de la plateforme, « Inscription à l'annuaire » enregistre votre identifiant dans l'annuaire français ou dans Peppol. Sur Esalink, l'entrée prend effet au moins dix jours après la demande.
    badge: En production
  - title: Recevez les factures de vos fournisseurs
    description: Dokos interroge la plateforme à intervalle régulier et dépose chaque facture reçue dans la banette. Il lit les formats UBL et CII, y compris les données intégrées à un PDF Factur-X, puis extrait le fournisseur, les montants, les lignes, les conditions de paiement et l'IBAN. Le fournisseur est recherché par numéro de TVA, puis par IBAN et par nom, avec un niveau de confiance. Vous confirmez, puis vous créez la facture d'achat. Vous pouvez aussi refuser une facture reçue directement depuis la fiche facture fournisseur.
    badge: En production
  - title: Renvoyez les statuts à votre fournisseur
    description: "Dokos transmet à la plateforme le statut « Prise en charge » à la création de la facture fournisseur, « Approuvée » à la validation de la facture d'achat, puis les statuts de paiement à la validation du paiement. Ces trois envois sont activés par défaut et se désactivent un par un dans Paramètres E-transactions."
    badge: En production
  - title: Lisez les PDF par OCR
    description: Les factures fournisseur reçues en PDF, déposées à la main ou transférées depuis une boîte de courriel dédiée, passent par Amazon Textract ou par Mistral OCR. Vous choisissez le service dans Paramètres E-transactions, onglet Achats ; Amazon Textract est le réglage par défaut. La facture fournisseur en attente reprend les données extraites, propose la commande fournisseur ouverte du fournisseur et bloque, si vous l'avez demandé, une facture d'achat dont le montant dépasse celui lu sur le document. Une option rapproche automatiquement la facture des reçus d'achat, dans la limite d'un écart en montant ou en pourcentage sur le total HT.
    badge: En production
  - title: Émettez vos factures depuis la facture de vente
    description: À la validation d'une facture de vente, Dokos classe le client, entreprise, administration, particulier ou partenaire étranger, puis génère le format attendu, Factur-X par défaut ou UBL pour un destinataire Peppol. L'envoi part automatiquement ou à la main, et un panneau affiche le statut renvoyé par la plateforme. Une facture déjà transmise s'annule par « Annuler avec cycle de vie ». Cette partie est en cours de finalisation.
    badge: En production

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez eTransactions sur votre site. Elle s'installe sans abonnement à part et fait partie de l'image Docker standard de Dokos.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/etransactions</code> puis <code>bench --site votre-site install-app etransactions</code>."
    - title: Obtenez vos identifiants de plateforme
      description: Pour SuperPDP, créez l'identifiant et le secret client sur votre compte SuperPDP. Pour Esalink, les clés sont fournies par Dokos Cloud (help@dokos.cloud) ou par Dokos SAS en auto-hébergement.
    - title: Complétez vos fiches
      description: Renseignez le SIREN et le numéro de TVA de votre société, de vos clients et de vos fournisseurs. Le bouton « Remplir depuis SIRENE » le fait pour vous.
  prerequisites:
    - Un compte chez une plateforme agréée (SuperPDP, Esalink ou une plateforme au standard AFNOR)
    - Pour l'OCR, une clé d'accès Amazon Textract ou une clé d'API Mistral

faq:
  items:
    - label: Quelles plateformes agréées sont prises en charge ?
      content: SuperPDP, Esalink (HUBTIMIZE) et toute plateforme personnalisée qui respecte le standard AFNOR XP Z12-013. Une société peut activer plusieurs plateformes, chacune avec son périmètre.
    - label: Dokos est-il lui-même une plateforme agréée ?
      content: Non. Dokos se connecte à la plateforme de votre choix. Dokos est par ailleurs membre fondateur de l'association [PDP Libre](https://pdplibre.org/), qui regroupe des éditeurs de logiciels libres autour de la facturation électronique.
    # source : billet rentree-2026.md (« Les premières factures électroniques sont déjà arrivées cet été »)
    - label: Qu'est-ce qui est en production aujourd'hui ?
      content: La connexion à une plateforme agréée, l'émission des factures de vente, la réception des factures aux formats Factur-X, CII et UBL, le renvoi des statuts au fournisseur et la lecture des PDF par OCR. Les premières factures électroniques sont arrivées chez des clients de Dokos SAS à l'été 2026.
    - label: Que deviennent mes réglages de l'application OCR ?
      content: Sur Dokos V5, eTransactions remplace l'application OCR. À l'installation, les réglages et les factures en attente de l'OCR sont repris dans eTransactions.
    - label: Comment un fournisseur reçu est-il reconnu ?
      content: Dokos cherche d'abord le numéro de TVA, puis l'IBAN, puis un alias de nom, puis le nom. Il affiche un niveau de confiance et vous laisse corriger le fournisseur avant de créer la facture d'achat.


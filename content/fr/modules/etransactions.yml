# Sources : https://doc.dokos.io/v5/integrations/etransaction et ses sous-pages (plateformes-agreees,
# inscription-annuaire, configuration-clients-fournisseurs, reception-factures-electroniques,
# emission-factures-electroniques, etransactions), https://doc.dokos.io/nouveautes (septembre 2026),
# README de https://gitlab.com/dokos/etransactions (branche v5), billet facturation-electronique.md.
# Statut fixé par le client : réception et connexion à une plateforme agréée en production, émission en cours.
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : Paramètres E-transactions, onglet « Plateforme Agréée », une plateforme active avec son voyant de santé
# - fit.webp : une Facture d'achat créée depuis une facture électronique reçue, avec l'indicateur de la plateforme d'origine
# - feature-plateforme.webp : la fenêtre d'ajout d'une plateforme (périmètre, environnement, bouton « Tester la connexion »)
# - feature-annuaire.webp : la fenêtre « Inscription à l'annuaire » avec le choix FR (PPF) ou Peppol et l'identifiant 0225:SIREN
# - feature-banette.webp : la Banette de factures d'achat avec des factures en attente, en cours et prêtes
# - feature-reception.webp : une Facture fournisseur en attente avec le fournisseur proposé et son niveau de confiance
# - feature-emission.webp : une Facture de vente validée en environnement bac à sable, avec le panneau de statut sur la plateforme


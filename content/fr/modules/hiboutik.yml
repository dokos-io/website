hero:
  title: Votre caisse <span class="text-primary">Hiboutik</span>, tenue par Dokos.
  description: Hiboutik est une caisse enregistreuse en ligne. Le connecteur envoie vos articles et vos stocks vers la caisse, puis ramène chaque vente dans Dokos sous forme de facture de vente.

for_whom:
  items:
    - title: Votre boutique encaisse sur Hiboutik
      description: Chaque ticket devient une facture de vente dans Dokos, en temps réel par webhook. La comptabilité suit sans ressaisie.
      icon: i-heroicons-shopping-cart
    - title: Vous tenez votre catalogue dans Dokos
      description: Libellé, prix TTC, taxe et stock partent de la fiche Article vers Hiboutik. Dokos reste la référence.
      icon: i-heroicons-tag
    - title: Vous gérez un tiers-lieu ou une boutique associative
      description: Le connecteur a été financé par des tiers-lieux. Il relie une caisse simple à une gestion complète.
      icon: i-heroicons-building-storefront

fit:
  description: Le connecteur se configure dans <strong>Paramètres Hiboutik</strong>, dans l'espace Intégrations. Un <strong>profil de point de vente</strong> fixe la liste de prix et l'entrepôt utilisés. Chaque vente encaissée arrive dans Dokos comme une <strong>Vente Hiboutik</strong>, qui génère la <strong>Facture de vente</strong> correspondante. Les mouvements de caisse arrivent de la même façon et sont comptabilisés en écriture de journal.
  reads:
    - Article, Prix d'article et Modèle de taxe d'article
    - Client de type Individuel
    - Profil de point de vente et Entrepôt
    - Facture de vente, Écriture de paiement, Écriture de journal
  adds:
    - Le document « Paramètres Hiboutik »
    - Les « Ventes Hiboutik » et les « Mouvements de caisse Hiboutik »
    - La case « Synchroniser avec Hiboutik » sur la fiche Article
    - Un espace de travail Hiboutik
  depends:
    - Ventes
    - Stocks

features:
  - title: Envoyez vos articles vers la caisse
    description: Cochez « Synchroniser avec Hiboutik » sur chaque article concerné. Le libellé, le prix TTC, la taxe et le stock partent vers Hiboutik, et la référence de la caisse est mémorisée sur l'article. Les images s'ajoutent dans Hiboutik.
    badge: Catalogue
  - title: Récupérez chaque vente en facture
    description: Hiboutik appelle Dokos à chaque vente ou note de crédit. Dokos enregistre une Vente Hiboutik, puis crée la facture de vente et son paiement, avec la correspondance des modes de paiement que vous avez définie. Une routine horaire vérifie qu'aucune vente n'a été oubliée.
    badge: Ventes
  - title: Comptabilisez les mouvements de caisse
    description: Les mouvements de caisse sont intégrés une fois par heure, puis comptabilisés. Le statut passe à Terminé une fois l'écriture validée. Les remises globales vont sur le compte que vous indiquez dans les paramètres.
    badge: Comptabilité
  - title: Tenez le stock de la caisse à jour
    description: Chaque mouvement de stock dans Dokos met à jour la quantité dans Hiboutik, sur l'entrepôt du profil de point de vente. Une option envoie une notification pour les alertes de stock.
    badge: Stocks

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Hiboutik sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/hiboutik</code> puis <code>bench --site votre-site install-app hiboutik</code>."
    - title: Reliez la caisse
      description: Dans Hiboutik, ouvrez Paramètres puis API et relevez vos informations de connexion. Dans Dokos, renseignez Paramètres Hiboutik, choisissez le profil de point de vente, associez les taux de TVA et les modes de paiement, puis enregistrez. Les webhooks apparaissent alors dans Hiboutik.
    - title: Lancez la première synchronisation
      description: Cochez « Synchroniser avec Hiboutik » sur les articles concernés, puis lancez la synchronisation des articles et des clients de type Individuel.
  prerequisites:
    - Un compte Hiboutik dont l'utilisateur a les droits sur les ventes, les produits, les clients, les stocks et les webhooks

faq:
  items:
    - label: Puis-je créer des articles directement dans Hiboutik ?
      content: Dokos est la référence du catalogue. Un article créé seulement dans Hiboutik n'est pas synchronisé et ses ventes ne remontent pas. Créez l'article dans Dokos, puis cochez « Synchroniser avec Hiboutik ».
    - label: Plusieurs entrepôts sont-ils possibles ?
      content: Non. Le connecteur travaille avec l'entrepôt du profil de point de vente, un seul par configuration.
    - label: Les points de fidélité sont-ils repris ?
      content: Non. Les points de fidélité Hiboutik ne sont pas gérés dans Dokos.
    - label: Comment sont traitées les ventes réglées par crédit client ?
      content: Aucune écriture de paiement n'est créée pour une vente réglée par crédit. Le solde se règle avec le mode « DIV » et un montant négatif sur le mode « CRED ». Les paiements en excédent sont créés par Dokos, puis rapprochés à la main.
    - label: Qui a développé ce connecteur ?
      content: La première version a été écrite par ioCraft (projet opossum). Les développements ont été financés par les tiers-lieux Coopérative Baraka, La Coroutine et MonsFabrica. Dokos SAS le maintient.


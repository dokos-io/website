# Sources : https://doc.dokos.io/v5/integrations/hiboutik, README et hooks de https://gitlab.com/dokos/hiboutik
# (branche v5), DocTypes Hiboutik Settings, Hiboutik Sales et Hiboutik Till Movement, traductions françaises.
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : le document « Paramètres Hiboutik » (espace Intégrations) avec la connexion API, le profil de point de vente et les modes de paiement
# - fit.webp : une Facture de vente créée depuis une « Vente Hiboutik », le lien vers la vente visible
# - feature-articles.webp : une fiche Article avec la case « Synchroniser avec Hiboutik » cochée
# - feature-ventes.webp : la liste « Ventes Hiboutik » avec des statuts En attente, Terminé et Erreur
# - feature-caisse.webp : un « Mouvement de caisse Hiboutik » et son écriture de journal
# - feature-stock.webp : la fiche Article, section stock, avec la quantité reprise dans Hiboutik


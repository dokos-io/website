# Sources :
# - README de https://github.com/frappe/helpdesk (branche develop) : portails agent et client,
#   SLA, règles d'affectation, base de connaissances, réponses enregistrées, dépendance à
#   l'application Telephony, compatibilité Frappe v15 et v16, licence AGPLv3
# - https://docs.frappe.io/helpdesk : pages Service Level Agreement, Knowledge Base, Twilio, Exotel
#
# Captures à prendre (demo.dokos.cloud/helpdesk, 1440×900, thème clair, français) :
# - hero.webp : la liste des tickets du portail agent, avec statut, priorité et délai SLA
# - fit.webp : un ticket ouvert, la fiche du contact et du client à droite, l'historique des
#   e-mails au centre
# - feature-tickets.webp : un ticket en cours avec son affectation à un agent et à une équipe
# - feature-sla.webp : une politique SLA avec les délais de première réponse et de résolution
#   par priorité, et les heures de travail
# - feature-base.webp : la base de connaissances du portail agent, articles groupés par catégorie
# - feature-portail.webp : le portail client (/help), un client qui suit son ticket et répond
# - feature-reponses.webp : l'insertion d'une réponse enregistrée dans un ticket

navigation:
  title: Helpdesk
  icon: i-heroicons-lifebuoy
  description: Tickets de support, délais de réponse et base de connaissances.

title: Helpdesk
description: Transforme chaque demande client en ticket suivi, avec des délais de réponse par priorité, une base de connaissances et un portail où le client suit sa demande.
icon: i-heroicons-lifebuoy
application: Helpdesk
theme: support-collaboration
author: Frappe Technologies
logo:
  light: /frappe/helpdesk.png
  dark: /frappe/helpdesk.png

publisher: frappe
licence: AGPLv3
version: v5
marketplace: helpdesk
related: [telephony, raven, wiki, crm, ventes]

hero:
  title: Vos demandes clients, <span class="text-primary">traitées en tickets</span>, avec des délais suivis.
  description: Chaque e-mail reçu devient un ticket affecté à un agent. Un accord de niveau de service fixe le délai de première réponse et de résolution par priorité. Le client suit sa demande depuis un portail.
  image: /modules/support/hero.webp

for_whom:
  items:
    - title: Les demandes arrivent dans une boîte mail partagée
      description: Chaque e-mail crée un ticket. Une règle d'affectation le confie à un agent selon la priorité, le type de demande ou la charge de chacun.
      icon: i-heroicons-inbox-arrow-down
    - title: Vous ne savez pas combien de temps un client attend une réponse
      description: Une politique SLA fixe un délai de première réponse et de résolution par priorité. Le compteur tient compte de vos heures de travail et de vos jours fériés.
      icon: i-heroicons-clock
    - title: Vos agents retapent les mêmes réponses
      description: Une réponse enregistrée s'insère dans le ticket en un clic. Un article de la base de connaissances est proposé au client avant même qu'il ouvre un ticket.
      icon: i-heroicons-document-duplicate
    - title: Vos clients appellent pour connaître l'avancement
      description: Le client ouvre le portail, voit l'état de ses tickets et répond depuis la même page.
      icon: i-heroicons-user-circle

fit:
  description: >-
    Helpdesk s'installe à côté de Dokos. Les agents travaillent dans le portail agent, à
    l'adresse /helpdesk du site. Les clients ouvrent et suivent leurs tickets dans le portail
    client, à l'adresse /help. Un ticket est un document <strong>HD Ticket</strong>, rattaché à un
    contact et à un client. Les e-mails entrants et sortants passent par les comptes de messagerie
    de votre site. La politique SLA s'appuie sur une liste de jours fériés du site pour suspendre
    ses compteurs. Avec l'application <a href="/fr/modules/telephony">Telephony</a>, un bouton
    d'appel apparaît dans le ticket.
  image: /modules/support/fit.webp
  reads:
    - Contact et Client
    - Les comptes de messagerie du site
    - La liste de jours fériés
  adds:
    - Les documents HD Ticket, HD Agent, HD Team, HD Service Level Agreement
    - La base de connaissances, documents HD Article et HD Article Category
    - Le portail agent (/helpdesk) et le portail client (/help)
    - Les réponses enregistrées et les règles d'affectation
  depends:
    - Telephony

features:
  - title: Suivez chaque demande dans un ticket
    description: Un ticket porte un statut, une priorité, un type et une équipe. Une règle d'affectation le confie automatiquement à un agent. L'agent répond par e-mail depuis le ticket, ajoute un commentaire interne et voit l'historique complet des échanges.
    image: /modules/support/feature-tickets.webp
    badge: Tickets
  - title: Fixez des délais par priorité
    description: Une politique SLA définit, pour chaque priorité, un délai de première réponse et un délai de résolution. Le compteur se met en pause quand le ticket attend le client, en dehors des heures de travail et les jours fériés de la liste choisie.
    image: /modules/support/feature-sla.webp
    badge: SLA
  - title: Publiez une base de connaissances
    description: Les agents écrivent des articles groupés par catégorie, avec titres, listes, tableaux, images et vidéos. Un article est en brouillon, publié ou archivé, et visible du public, des clients ou en interne. Le formulaire de nouveau ticket propose les articles pertinents avant l'envoi.
    image: /modules/support/feature-base.webp
    badge: Base de connaissances
  - title: Donnez un portail à vos clients
    description: Le client se connecte au portail, ouvre un ticket, en suit l'état et répond depuis la même page. Il consulte les articles qui lui sont ouverts et peut indiquer si un article l'a aidé.
    image: /modules/support/feature-portail.webp
    badge: Portail client
  - title: Répondez vite et mesurez
    description: Une réponse enregistrée s'insère dans le ticket pour les questions fréquentes. L'analyse montre la chronologie de chaque ticket, ses temps de réponse et un résumé de la conversation.
    image: /modules/support/feature-reponses.webp
    badge: Réponses enregistrées

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Helpdesk sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/telephony</code>, puis <code>bench get-app https://github.com/frappe/helpdesk</code> et <code>bench --site votre-site install-app helpdesk</code>. Le portail agent s'ouvre à /helpdesk, le portail client à /help."
    - title: Reliez votre messagerie
      description: Ajoutez le compte e-mail de votre support dans les paramètres du site. Les e-mails reçus créent des tickets, les réponses des agents partent de ce compte.
  prerequisites:
    - Un compte e-mail dédié au support

faq:
  items:
    - label: Mes clients voient-ils leurs tickets ?
      content: Oui. Le portail client, à l'adresse /help de votre site, montre à chaque client ses tickets, leur état et l'historique des échanges. Il répond depuis le portail ou par e-mail.
    - label: Les délais SLA tiennent-ils compte de nos horaires ?
      content: Oui. Vous définissez les heures de travail par jour de la semaine et vous liez une liste de jours fériés. Les compteurs de première réponse et de résolution se mettent en pause en dehors de ces heures et quand le ticket attend une réponse du client.
    - label: Par quels canaux les demandes arrivent-elles ?
      content: Par e-mail et par le portail client. Avec l'application Telephony, les agents passent et reçoivent des appels Twilio ou Exotel depuis le ticket.
    - label: Un article peut-il rester interne ?
      content: Oui. Chaque article a une visibilité, publique, clients ou privée. Un article privé n'est vu que des agents. Un brouillon n'est jamais visible des clients.
    - label: Faut-il Dokos pour utiliser Helpdesk ?
      content: Helpdesk fonctionne sur Dodock, le socle de votre site. Installé à côté de Dokos, il partage les contacts et les clients du site.

bottom_cta:
  title: Parlez-nous de votre support client.
  description: Décrivez-nous le volume de demandes et vos canaux, nous vous dirons comment Helpdesk s'organise sur votre site.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

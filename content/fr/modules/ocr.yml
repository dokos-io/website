# Sources : https://doc.dokos.io/v5/integrations/etransaction (section OCR, Banette de factures d'achat,
# règle IMAP, Paramètres), README de https://gitlab.com/dokos/ocr (branche develop ; le dépôt n'a pas de
# branche v5), DocTypes et hooks de l'application (OCR Settings, OCR Purchase Invoice Basket, Pending Purchase
# Invoice, OCR Request), install.py d'eTransactions (reprise des données OCR).
# L'application OCR couvre Dokos V4. Sur Dokos V5, ses fonctions sont reprises par eTransactions.
# source (3 novembre 2026) : branche v4 du dépôt ocr, dernière version v2.4.0 du 24 octobre 2025. OCR Settings y porte
# seulement la clé et le secret Amazon Textract, la création sans commande et les deux blocages sur montant.
# Le choix Mistral OCR, le rapprochement automatique avec les reçus d'achat et la validation automatique existent sur
# la branche develop du dépôt ocr et dans eTransactions (branche v5), pas dans la version V4 publiée.
#
# Captures à prendre (demo.dokos.cloud, où la banette est fournie par eTransactions) :
# - hero.webp : la Banette de factures d'achat avec plusieurs factures fournisseur en attente, en cours et prêtes
# - fit.webp : une Facture fournisseur en attente reliée à une Commande fournisseur, bouton « Créer la facture d'achat » visible
# - feature-depot.webp : la zone de dépôt de fichiers de la banette, un PDF en cours d'envoi
# - feature-extraction.webp : une Facture fournisseur en attente avec l'aperçu du PDF à gauche et les données extraites à droite
# - feature-rapprochement.webp : la fenêtre « Sélectionner les commandes fournisseur » avec les commandes ouvertes du fournisseur
# - feature-parametres.webp : les Paramètres OCR (clé Textract, création sans commande, blocage sur montant)

title: OCR
description: Lit vos factures fournisseur en PDF avec Amazon Textract et prépare la facture d'achat dans Dokos.
icon: i-mdi-ocr
application: OCR
theme: site-web-outils-numeriques
author: Dokos
logo:
  light: /frappe/ocr_logo.svg
  dark: /frappe/ocr_logo.svg
navigation:
  title: OCR
  icon: i-mdi-ocr
  description: Extraction des données de factures fournisseur avec Amazon Textract.

publisher: dokos
licence: AGPLv3
version: v4
marketplace: ocr
docs: https://doc.dokos.io/v5/integrations/etransaction
related: [achats, comptabilite, etransactions]

hero:
  title: Vos factures fournisseur en PDF, <span class="text-primary">lues</span> et prêtes à comptabiliser.
  description: Vous déposez le PDF ou vous le transférez par courriel. Amazon Textract en extrait le fournisseur, les montants et les lignes. Vous vérifiez, puis vous créez la facture d'achat.

for_whom:
  items:
    - title: Vous ressaisissez chaque facture fournisseur
      description: Le numéro, la date, les montants et les lignes sont lus sur le document. Il vous reste à vérifier.
      icon: i-heroicons-pencil-square
    - title: Vos factures arrivent par courriel
      description: Une règle de messagerie envoie les pièces jointes PDF dans la banette. L'analyse démarre sans action de votre part.
      icon: i-heroicons-envelope
    - title: Vous contrôlez les factures par rapport aux commandes
      description: La facture lue est reliée à la commande fournisseur ou au reçu d'achat. Un dépassement du montant lu peut bloquer la création de la facture d'achat.
      icon: i-heroicons-scale

fit:
  description: "L'OCR ajoute à Dokos une <strong>Banette de factures d'achat</strong>. Chaque fichier déposé crée une demande d'analyse envoyée à Amazon Textract, puis une <strong>facture fournisseur en attente</strong> qui reprend les données lues. Depuis cette facture en attente, vous choisissez la commande fournisseur ou le reçu d'achat concerné, puis vous créez la <strong>Facture d'achat</strong> du module Achats. Les statuts suivent le traitement : En attente, En cours, Prêt, Terminé."
  reads:
    - Fournisseur et son numéro de TVA
    - Commande fournisseur et Reçu d'achat
    - Facture d'achat
    - Compte de messagerie et Communication
  adds:
    - La « Banette de factures d'achat »
    - Les factures fournisseur en attente, avec aperçu du document et données extraites
    - Les demandes d'analyse OCR et leur suivi
    - Le document « Paramètres OCR »
  depends:
    - Achats
    - Comptabilité

features:
  - title: Déposez ou transférez vos factures
    description: Vous glissez un PDF ou une image dans la banette. Vous pouvez aussi ajouter un compte de messagerie à Dokos et définir, dans « Détails IMAP », que le dossier INBOX alimente la banette. Chaque courriel avec une pièce jointe PDF y est alors déposé.
    badge: Dépôt
  - title: Lisez les données avec Amazon Textract
    description: La demande d'analyse part vers Amazon Textract. Au retour, la facture fournisseur en attente affiche le fournisseur, le numéro et la date de la facture, l'échéance, les lignes, le total hors taxes, la TVA et le total. L'aperçu du document reste à côté des données pour la vérification. Le fichier envoyé à Amazon est supprimé une fois l'analyse récupérée.
    badge: Extraction
  - title: Reliez la facture à vos commandes
    description: Depuis la facture en attente, « Sélectionner les commandes fournisseur » ou « Sélectionner les reçus d'achat » propose les documents ouverts du fournisseur. Si des lignes ne correspondent à aucune commande, le bouton « Créer une commande fournisseur » la crée avec ces lignes. Si le fournisseur n'existe pas, un bouton le crée depuis les données lues.
    badge: Rapprochement
  - title: Réglez le niveau de contrôle
    description: Dans Paramètres OCR, vous autorisez ou non la création d'une facture d'achat sans commande, et vous bloquez la création quand le total TTC ou le total HT dépasse celui lu sur le document. À la création, vous choisissez de valider la facture d'achat ou de la garder en brouillon. Un avoir fournisseur devient une facture d'achat de retour, liée à la facture d'origine.
    badge: Paramètres

install:
  steps:
    - title: Sur Dokos V5, installez eTransactions
      description: Sur Dokos V5, l'application eTransactions reprend la banette, les factures en attente et les paramètres de l'OCR. À son installation, elle récupère les données existantes de l'OCR. Installez-la depuis la marketplace Dokos Cloud, comprise dans toutes les formules.
    - title: Sur Dokos V4, depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez OCR sur votre site.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/ocr</code> puis <code>bench --site votre-site install-app ocr</code>."
    - title: Renseignez vos clés
      description: Dans Paramètres OCR, saisissez la clé et le secret Amazon Textract, puis choisissez les règles de création des factures d'achat.
  prerequisites:
    - Un compte Amazon Web Services avec accès à Textract

faq:
  items:
    - label: Quels fichiers l'OCR accepte-t-il ?
      content: Des PDF et des images, déposés à la main dans la banette ou reçus en pièce jointe d'un courriel.
    - label: Où partent mes documents ?
      content: Le fichier est envoyé à Amazon Textract pour l'analyse, avec vos propres clés d'accès. Il est supprimé du stockage Amazon une fois le résultat récupéré par Dokos. Les données extraites restent dans votre site.
    - label: Existe-t-il un autre moteur qu'Amazon Textract ?
      content: Pas dans l'application OCR publiée pour Dokos V4, qui utilise Amazon Textract. Sur Dokos V5, eTransactions propose le choix entre Amazon Textract, réglage par défaut, et Mistral OCR, avec une clé d'API Mistral.
    - label: Que se passe-t-il si je passe à Dokos V5 ?
      content: eTransactions remplace l'application OCR. Lors de son installation, elle reprend les paramètres, la banette et les factures fournisseur en attente. Les factures reçues par plateforme agréée arrivent ensuite dans la même banette.
    - label: La facture d'achat est-elle créée toute seule ?
      content: Non. Vous relisez la facture en attente, vous choisissez la commande ou le reçu, puis vous cliquez sur « Créer la facture d'achat » et vous choisissez de la valider ou de la garder en brouillon. Sur Dokos V5, eTransactions ajoute le rapprochement automatique avec les reçus d'achat et la validation automatique des factures créées.


# credit-reservation, evenements, abonnement-reservation, portails, multi-societe) ; doc.dokos.io/v5/dokos/e-commerce/reservations-en-ligne ;
# billet content/fr/blog/2026/arrivee-V5.md ; README https://gitlab.com/dokos/bookings (branche v5, licence AGPL-3.0) ;
# marketplace cloud.dokos.io, identifiant bookings.
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : le portail Bookings (/bookings-ui), calendrier d'une ressource avec ses créneaux
# - fit.webp : une Réservation d'article confirmée avec son tiers facturé et la facture de vente liée
# - feature-ressources.webp : la fiche d'une Ressource réservable (prix par unité de mesure, calendrier, badges requis)
# - feature-portail.webp : /bookings-ui, liste des réservations d'un client avec les statuts
# - feature-contrats.webp : un Contrat de réservation au statut Actif, avec sa commande et son abonnement liés
# - feature-credits.webp : le rapport de solde des crédits de réservation
# - feature-evenements.webp : la fiche d'un Événement publié et ses inscriptions


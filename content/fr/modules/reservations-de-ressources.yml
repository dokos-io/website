    Bookings publie vos ressources réservables sur un portail, encaisse les réservations et génère les factures,
    les contrats et les abonnements dans votre site Dokos.

for_whom:
  items:
    - title: Vous gérez un tiers-lieu ou un espace de coworking
      description: >-
        Vos membres réservent un poste ou une salle depuis le portail, avec leurs crédits ou leur abonnement. Vous suivez les soldes dans un rapport.
      icon: i-heroicons-building-office-2
    - title: Vous louez des salles ou du matériel à l'heure ou à la journée
      description: >-
        Chaque ressource a ses prix par unité de mesure, ses créneaux d'ouverture et son préavis minimum. La facture suit la réservation.
      icon: i-heroicons-clock
    - title: Vous signez des contrats de poste fixe ou de domiciliation
      description: >-
        Le client signe en ligne. Le contrat crée la commande, l'abonnement, les factures récurrentes et le dépôt de garantie.
      icon: i-heroicons-document-check
    - title: Vous organisez des ateliers ou des événements
      description: >-
        Vous publiez l'événement sur le site, ouvrez les inscriptions et encaissez le paiement depuis le formulaire web.
      icon: i-heroicons-ticket

fit:
  description: >-
    Bookings est une application distincte, installée sur votre site Dokos. Elle reprend les fonctions du module Lieu de la V4, retiré en V5.
    Depuis la V5, <strong>tout est une ressource</strong>, réservable ou non ; l'article ne sert plus qu'à la facturation.
    Une <strong>Ressource réservable</strong> porte ses prix par unité de mesure, chacun lié à une Disponibilité, et les badges requis.<br>
    Chaque <strong>Réservation de ressource</strong> est rattachée à un tiers facturé, et sa facture est générée et suivie
    automatiquement. Un contrat signé crée une Commande client, un Abonnement et ses factures récurrentes dans le module Ventes.
    Le panier du portail s'appuie sur l'application Webshop, et le paiement en ligne passe par les passerelles de l'application Payments.
  reads:
    - Article, Groupe d'articles et Liste de prix
    - Client et Contact
    - Commande client, Abonnement et Facture de vente
    - Événement
    - Passerelle de paiement
    - Société, pour le mode multi-lieu
  adds:
    - L'espace de travail Bookings et les Paramètres de réservation de ressources
    - Les documents Ressource réservable, Groupe de ressources réservables, Lieu de réservation, Disponibilité et Réservation de ressource
    - Les documents Contrat de réservation de ressources, Type de contrat et Dépôt de garantie
    - Les crédits de réservation, les badges et le rapport Solde de crédits de réservation
    - Les inscriptions aux événements, les guides de création et le portail /bookings-ui
  depends:
    - Dokos (Ventes)
    - Webshop, pour le panier
    - Payments pour le paiement en ligne

features:
  - title: Décrivez vos ressources et leurs disponibilités
    description: >-
      Une Ressource réservable fixe le nombre de réservations simultanées, son tableau de prix par unité de mesure (heure, demi-journée,
      journée, mois) et les badges requis. Chaque prix renvoie à une Disponibilité, qui définit les créneaux par jour de la semaine, les exceptions,
      comme les jours fériés ou la maintenance, et le préavis minimum et maximum, contrôlé aussi côté serveur.
    badge: Ressources
  - title: Laissez vos clients réserver depuis le portail
    description: >-
      Sur /bookings-ui, le client choisit un créneau. La réservation passe de « Non confirmé » à « Confirmé » à la commande,
      au paiement ou jamais automatiquement, selon le mode de confirmation choisi pour le portail et pour le bureau. Un brouillon abandonné
      est supprimé après 15 minutes par défaut. Le client annule depuis son portail si vous l'autorisez, au plus tard 24 heures avant le créneau par défaut.
    badge: Portail
  - title: Signez des contrats en ligne
    description: >-
      Un Type de contrat porte le modèle de texte, la durée minimum, le préavis, les ressources incluses, l'article récurrent,
      les frais à la signature et le dépôt de garantie. Vous envoyez le contrat au client ; il le signe d'un clic sur son portail.
      Le contrat passe à « Actif » et crée la Commande client, l'Abonnement et le Dépôt de garantie. Un avenant modifie un contrat actif sans le réécrire.
    badge: Contrats
  - title: Vendez des crédits de réservation
    description: >-
      Un type de crédit convertit un article facturé en crédits, à l'achat d'un ticket ou à chaque période d'un abonnement.
      À la validation de la facture, les crédits sont alloués. Lors d'une réservation sur le portail, la case « Déduire des crédits
      de réservation » les consomme. Les crédits expirent selon la durée du type, et le rapport Solde de crédits de réservation présente les soldes attribués, utilisés et restants.
    badge: Crédits
  - title: Publiez vos événements et leurs inscriptions
    description: >-
      Un Événement public coché « Publié » apparaît sur le site. Chaque inscription en ligne crée un document Inscription à un événement.
      Le formulaire web « event-registration-form » encaisse le paiement, en une fois ou avec des paiements automatiques.
      Les inscriptions se ferment 24 heures avant l'événement par défaut, et un badge peut être attribué aux présents.
    badge: Événements

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: >-
        Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Bookings sur votre site.
        La marketplace ne demande pas d'abonnement pour Bookings ; votre formule est calculée sur les ressources du serveur (voir les <a href="/fr/tarifs">tarifs</a>).
    - title: En auto-hébergement
      description: "Installez d'abord Payments, Webshop et Blog, puis <code>bench get-app https://gitlab.com/dokos/bookings --branch v5</code> et <code>bench --site votre-site install-app bookings</code>."
    - title: Réglez les Paramètres de réservation de ressources
      description: >-
        Dans l'espace de travail Bookings, ouvrez les Paramètres de réservation de ressources : délai de suppression des brouillons,
        mode de confirmation, unités de mesure (durée d'une demi-journée), portail client, contrats. Créez ensuite une première Ressource réservable.
  prerequisites:
    - Un site Dokos V5
    - Les applications Webshop et Blog, que Bookings exige à l'installation
    - L'application Payments et une passerelle pour le paiement en ligne
    - Une connexion Google Agenda et un agenda par ressource pour la synchronisation

faq:
  items:
    - label: Que devient le module Lieu ?
      content: >-
        Le module Lieu de la V4 est retiré en V5. Ses fonctions (crédits, postes d'événement, badges, multi-lieux) sont reprises dans Bookings,
        à installer sur votre site avant le passage en V5.
    - label: Puis-je gérer plusieurs lieux sur un même site ?
      content: >-
        Oui. Le mode multi-lieu demande une Société par lieu, avec ses comptes. Dans les Paramètres de réservation de ressources, activez-le
        et listez les sociétés autorisées. Le visiteur choisit le lieu sur le site, et chaque lieu affiche ses propres ressources.
    - label: Les réservations se synchronisent-elles avec Google Agenda ?
      content: >-
        Oui. Chaque ressource est liée à un agenda distinct, et une option des Paramètres de réservation de ressources synchronise automatiquement les réservations.
        La suppression d'une seule occurrence d'une récurrence dans Google Agenda n'est pas encore reportée dans Dokos.
    - label: Un abonnement peut-il réserver un poste en permanence ?
      content: >-
        Oui. Dans la ligne du plan d'abonnement, le champ « Article réservé » désigne la ressource. Pendant toute la durée de l'abonnement,
        le nombre de places restantes est diminué de la quantité indiquée, et l'abonnement apparaît dans le calendrier des réservations.
    - label: Quelle différence avec la réservation depuis la boutique Webshop ?
      content: >-
        La réservation depuis le site e-commerce est dépréciée en V5. Le portail /bookings-ui de Bookings la remplace : il porte les réservations,
        les contrats, les abonnements, les guides de création et le trombinoscope des membres.
    - label: Puis-je remettre un code d'accès avec la réservation ?
      content: >-
        Oui, avec l'intégration Neop, une plateforme de gestion d'accès. Une réservation validée déclenche la création d'un code d'accès à 4 chiffres chez Neop. Le client le retrouve dans son espace client.


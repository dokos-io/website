hero:
  title: Vos salles, vos postes et vos machines, <span class="text-primary">réservés en ligne</span> et facturés dans Dokos.
  description: >-
    Bookings publie vos ressources réservables sur un portail, encaisse les réservations et génère les factures,
    les contrats et les abonnements dans votre site Dokos.
  image: /modules/reservations-de-ressources/hero.webp

for_whom:
  items:
    - title: Vous gérez un tiers-lieu ou un espace de coworking
      description: >-
        Vos membres réservent un poste ou une salle depuis le portail, avec leurs crédits ou leur abonnement. Vous suivez les soldes dans un rapport.
      icon: i-heroicons-building-office-2
    - title: Vous louez des salles ou du matériel à l'heure ou à la journée
      description: >-
        Chaque ressource a ses prix par unité de mesure, son calendrier d'ouverture et son préavis minimum. La facture suit la réservation.
      icon: i-heroicons-clock
    - title: Vous signez des contrats de poste fixe ou de domiciliation
      description: >-
        Le client signe en ligne. Le contrat crée la commande, l'abonnement, les factures récurrentes et le dépôt de garantie.
      icon: i-heroicons-document-check
    - title: Vous organisez des ateliers ou des événements
      description: >-
        Vous publiez l'événement sur le site, ouvrez les inscriptions et encaissez le paiement depuis le formulaire web.
      icon: i-heroicons-ticket

fit:
  description: >-
    Bookings s'installe sur votre site Dokos et reprend les fonctions du module Lieu de la V4, retiré en V5.
    Depuis la V5, <strong>tout est une ressource</strong>, réservable ou non ; l'article ne sert plus qu'à la facturation.
    Une <strong>Ressource réservable</strong> porte le calendrier, les prix par unité de mesure et les badges requis.<br>
    Chaque <strong>Réservation d'article</strong> est rattachée à un tiers facturé, et sa facture est générée et suivie
    automatiquement. Un contrat signé crée une Commande client, un Abonnement et ses factures récurrentes dans le module Ventes.
    Le paiement en ligne passe par les passerelles de l'application Payments.
  image: /modules/reservations-de-ressources/fit.webp
  reads:
    - Article, Groupe d'articles et Liste de prix
    - Client et Contact
    - Commande client, Abonnement et Facture de vente
    - Événement
    - Passerelle de paiement
  adds:
    - L'espace de travail Événements & Ressources
    - Les documents Ressource réservable, Réservation d'article, Calendrier de réservation et Disponibilité de réservation
    - Les documents Contrat de réservation, Type de contrat et Dépôt de garantie
    - Les crédits de réservation et les badges
    - Le portail /bookings-ui, les Paramètres du lieu et les Paramètres de réservation de ressources
  depends:
    - Dokos (Ventes)
    - Payments pour le paiement en ligne

features:
  - title: Décrivez vos ressources et leurs calendriers
    description: >-
      Une Ressource réservable fixe le nombre de réservations simultanées, les prix par unité de mesure (heure, demi-journée,
      journée, mois) et les badges requis. Un Calendrier de réservation définit les créneaux par jour de la semaine et ses exceptions,
      comme les jours fériés ou la maintenance. La Disponibilité de réservation fixe le préavis minimum et maximum, contrôlé aussi côté serveur.
    image: /modules/reservations-de-ressources/feature-ressources.webp
    badge: Ressources
  - title: Laissez vos clients réserver depuis le portail
    description: >-
      Sur /bookings-ui, le client choisit un créneau. La réservation passe de « Non confirmé » à « Confirmé » après la commande,
      ou après le paiement si vous l'exigez. Un brouillon abandonné est supprimé après le délai fixé dans les Paramètres du lieu.
      Le client annule depuis son portail si vous l'autorisez, dans la limite du délai minimum d'annulation.
    image: /modules/reservations-de-ressources/feature-portail.webp
    badge: Portail
  - title: Signez des contrats en ligne
    description: >-
      Un Type de contrat porte le modèle de texte, la durée minimum, le préavis, les ressources incluses, l'article récurrent,
      les frais à la signature et le dépôt de garantie. Vous envoyez le contrat au client ; il le signe d'un clic sur son portail.
      Le contrat passe à « Actif » et crée la Commande client, l'Abonnement et le Dépôt de garantie. Un avenant modifie un contrat actif sans le réécrire.
    image: /modules/reservations-de-ressources/feature-contrats.webp
    badge: Contrats
  - title: Vendez des crédits de réservation
    description: >-
      Un type de crédit convertit un article facturé en crédits, à l'achat d'un ticket ou à chaque période d'un abonnement.
      À la validation de la facture, les crédits sont alloués. Lors d'une réservation sur le portail, la case « Déduire des crédits
      de réservation » les consomme. Les crédits expirent selon la durée du type, et un rapport présente les soldes attribués, utilisés et restants.
    image: /modules/reservations-de-ressources/feature-credits.webp
    badge: Crédits
  - title: Publiez vos événements et leurs inscriptions
    description: >-
      Un Événement public coché « Publié » apparaît sur le site. Chaque inscription en ligne crée un document Inscription à un événement.
      Le formulaire web « event-registration-form » encaisse le paiement, en une fois ou avec des paiements automatiques.
      Les inscriptions se ferment automatiquement 24 heures avant l'événement par défaut, et un badge peut être attribué aux présents.
    image: /modules/reservations-de-ressources/feature-evenements.webp
    badge: Événements

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: >-
        Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Bookings sur votre site.
        L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/bookings</code> puis <code>bench --site votre-site install-app bookings</code>."
    - title: Réglez les Paramètres du lieu
      description: >-
        Dans l'espace de travail Événements & Ressources, ouvrez les Paramètres du lieu : délai de suppression des brouillons,
        confirmation après paiement, unités de mesure (nombre d'heures d'une demi-journée), portail client. Créez ensuite une première Ressource réservable.
  prerequisites:
    - Un site Dokos V5
    - L'application Payments et une passerelle pour le paiement en ligne
    - Une connexion Google Agenda et un agenda par ressource pour la synchronisation

faq:
  items:
    - label: Que devient le module Lieu ?
      content: >-
        Le module Lieu de la V4 est retiré en V5. Ses fonctions (crédits, postes d'événement, badges, multi-lieux) sont reprises dans Bookings.
    - label: Puis-je gérer plusieurs lieux sur un même site ?
      content: >-
        Oui. Dans les Paramètres du lieu, activez le mode multi-lieu et listez les sociétés autorisées avec leur liste de prix.
        Chaque article publié indique les sociétés où il apparaît. Le visiteur choisit la société en bas de la vitrine, et chaque société a son panier.
    - label: Les réservations se synchronisent-elles avec Google Agenda ?
      content: >-
        Oui. Chaque ressource est liée à un agenda distinct, et une option des Paramètres du lieu synchronise automatiquement les réservations en ligne.
        La suppression d'une seule occurrence d'une récurrence dans Google Agenda n'est pas encore reportée dans Dokos.
    - label: Un abonnement peut-il réserver un poste en permanence ?
      content: >-
        Oui. Dans la ligne du plan d'abonnement, le champ « Article réservé » désigne la ressource. Pendant toute la durée de l'abonnement,
        le nombre de places restantes est diminué de la quantité indiquée, et l'abonnement apparaît dans la vue Calendrier des réservations.
    - label: Quelle différence avec la réservation depuis la boutique Webshop ?
      content: >-
        La réservation depuis le site e-commerce est dépréciée en V5. Le portail /bookings-ui de Bookings la remplace : il porte les réservations,
        les contrats, les abonnements et le trombinoscope des membres.


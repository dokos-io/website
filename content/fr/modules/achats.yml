hero:
  title: De la demande interne à la facture fournisseur, <span class="text-primary">chaque étape laisse un document</span>.
  description: Le module Achats de Dokos enchaîne la demande de matériel, le devis fournisseur, la commande, la réception et la facture d'achat. Chaque document reprend le précédent.
  image: /modules/achats/hero.webp

for_whom:
  items:
    - title: Vos équipes commandent par e-mail
      description: Elles saisissent une demande de matériel. Vous la transformez en commande fournisseur en choisissant le fournisseur de chaque article.
      icon: i-heroicons-inbox-arrow-down
    - title: Vous comparez les fournisseurs dans un tableur
      description: Chaque réponse devient un devis fournisseur dans Dokos. Vous créez la commande depuis le devis retenu.
      icon: i-heroicons-scale
    - title: Vos factures fournisseurs arrivent en électronique
      description: Les factures reçues de votre plateforme agréée apparaissent dans la liste des e-invoices du module Achats et deviennent des factures d'achat.
      icon: i-heroicons-document-arrow-down
    - title: Un fournisseur livre en retard sans que personne ne le note
      description: La carte de pointage calcule un score par période à partir des réceptions et peut bloquer les nouvelles commandes.
      icon: i-heroicons-chart-bar

fit:
  description: >-
    Une demande de matériel part de Stocks ou d'une commande client. Elle devient une commande fournisseur
    dans Achats. Le reçu d'achat entre les articles en stock et, si une inspection est demandée, passe par
    Qualité. La facture d'achat écrit en Comptabilité et se paie par une écriture de paiement. Avec
    eTransactions, les factures électroniques reçues alimentent directement cette chaîne.
  image: /modules/achats/fit.webp
  reads:
    - Fournisseur, Contact et Adresse
    - Article, Prix de l'article et Entrepôt
    - Demande de matériel (Stocks)
    - Commande client, pour la livraison directe
    - E-invoices reçues de la plateforme agréée (eTransactions)
  adds:
    - L'espace de travail Achats et les Paramètres des achats
    - Devis fournisseur et Commande fournisseur
    - Reçu d'achat (dans Stocks) et Facture d'achat (dans Comptabilité)
    - Carte de pointage des fournisseurs, ses périodes et ses critères
    - Modèle de taxes et frais d'achat, Règles de prix et Schémas promotionnels côté achat
  depends:
    - Stocks
    - Comptabilité
    - Qualité
    - eTransactions

features:
  - title: La demande de matériel, point de départ de l'achat
    description: >-
      Une demande de matériel exprime un besoin d'articles ou de services, de type Achat, Transfert,
      Fabrication ou Matériel pour un client. Vous la saisissez à la main, ou Dokos la crée quand le stock d'un
      article passe sous son point de commande dans un entrepôt, avec la quantité par défaut de l'article.
      Depuis la demande, Créer > Commande fournisseur ouvre une boîte de dialogue qui propose le fournisseur
      par défaut de chaque article et crée une commande par fournisseur.
    image: /modules/achats/feature-demande.webp
    badge: Demande de matériel
  - title: Des devis fournisseurs comparés dans Dokos
    description: >-
      Vous envoyez votre demande de prix à plusieurs fournisseurs. Chaque réponse est saisie en devis
      fournisseur, avec ses prix et ses délais. Depuis la commande fournisseur, « Obtenir les articles de >
      Devis fournisseur » reprend les lignes du devis retenu. Les fournisseurs bloqués par leur carte de
      pointage ne sont pas proposés.
    image: /modules/achats/feature-devis.webp
    badge: Devis fournisseur
  - title: Une commande qui suit la réception et la facture
    description: >-
      La commande fournisseur reprend l'adresse, le contact et la devise de la fiche fournisseur. Ses articles
      viennent d'une demande de matériel ouverte ou d'un devis fournisseur. Une fois validée, vous créez
      depuis elle le reçu d'achat, la facture d'achat et l'écriture de paiement. En livraison directe, la
      commande fournisseur reste liée à la commande client et le bouton « Mettre à jour la quantité livrée »
      recalcule le taux de livraison du client. La tolérance de sur-livraison s'applique aussi aux commandes
      créées depuis une demande de matériel.
    image: /modules/achats/feature-commande.webp
    badge: Commande fournisseur
  - title: Réception, contrôle et facture d'achat
    description: >-
      Le reçu d'achat confirme les quantités reçues et les entre en stock. Si l'article l'exige, une inspection
      de la qualité précède l'acceptation, et un retour d'achat renvoie ce qui est refusé. La facture d'achat
      se lie à la commande ou au reçu. Les factures électroniques reçues de votre plateforme agréée
      apparaissent dans la liste des e-invoices avec leur statut. Dokos crée la facture fournisseur en
      brouillon ; vous vérifiez le montant et l'échéance, vous rapprochez avec la commande, puis vous validez
      ou vous refusez la facture avec un motif renvoyé à la plateforme.
    image: /modules/achats/feature-reception.webp
    badge: Réception et facture
  - title: Une carte de pointage par fournisseur
    description: >-
      Vous créez une carte de pointage par fournisseur, évaluée par semaine, par mois ou par an. Chaque
      critère (qualité des articles reçus, délai de livraison, délai de réponse aux demandes de prix) a une
      formule construite sur des variables comme les quantités reçues, acceptées ou rejetées, et une
      pondération ; les pondérations totalisent 100. Le score courant pondère les douze dernières périodes.
      Selon le classement obtenu, Dokos affiche un avertissement ou bloque la création de demandes de prix et
      de commandes pour ce fournisseur.
    image: /modules/achats/feature-evaluation.webp
    badge: Évaluation des fournisseurs

install:
  description: Le module Achats fait partie de Dokos. Il n'y a rien à installer en plus.
  steps:
    - title: Sur Dokos Cloud
      description: Créez votre site depuis votre tableau de bord Dokos Cloud. Dokos est installé avec le module Achats. Compris dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Pour recevoir les factures électroniques
      description: Installez l'application eTransactions depuis la marketplace et renseignez la connexion à votre plateforme agréée.

faq:
  items:
    - label: Une demande de matériel peut-elle couvrir plusieurs fournisseurs ?
      content: >-
        Oui. La boîte de dialogue Créer > Commande fournisseur demande un fournisseur par article. Si tous les
        articles ont le même fournisseur, Dokos crée une commande ; sinon il crée une commande par fournisseur.
    - label: Peut-on supprimer un article d'une commande déjà reçue ?
      content: >-
        Non. Les articles déjà reçus ne peuvent plus être supprimés de la commande fournisseur.
    - label: Que devient une facture électronique que je ne traite pas ?
      content: >-
        Passé le délai configuré au niveau de la plateforme agréée, elle passe au statut Abandonnée. Elle
        reste consultable et vous pouvez la réactiver à la main. Une facture refusée ne peut pas être
        réintégrée automatiquement : vous demandez au fournisseur de la renvoyer.
    - label: Comment éviter de commander à un fournisseur mal noté ?
      content: >-
        Sur sa carte de pointage, vous associez à un classement une action : un avertissement à la création
        d'une demande de prix ou d'une commande, ou le blocage de ces documents pour ce fournisseur.


# Sources :
# - README de https://github.com/frappe/print_designer (branche develop, lu le 29 octobre 2026)
#   Le README indique depuis le 10 octobre 2026 que le dépôt n'est plus maintenu et renvoie vers l'éditeur de formats
#   d'impression intégré à Frappe à partir de la version 16. TODO : décider avec Dokos du maintien de cette page et de la fiche marketplace.
# - Licence : fichier license.txt du dépôt (AGPLv3)
# - Marketplace Dokos Cloud : app « print_designer »
#
# Captures à prendre (demo.dokos.cloud, 1440×900, thème clair, français) :
# - hero.webp : le designer (/app/print-designer) ouvert sur un format de facture de vente
# - fit.webp : la liste des formats d'impression (Print Format) avec un format créé dans Print Designer, puis l'aperçu d'impression d'une facture de vente qui l'utilise
# - feature-editeur.webp : un élément texte sélectionné, repères d'alignement et panneau des propriétés
# - feature-donnees.webp : le sélecteur de champ dynamique, avec les champs du document et ceux des documents liés (client, société)
# - feature-tableau.webp : l'éditeur de tableau sur les lignes d'articles d'une facture
# - feature-pdf.webp : le PDF généré depuis la facture avec ce format

title: Print Designer
description: Dessinez vos formats d'impression de devis, de factures ou de bons de livraison dans un éditeur visuel, sans code.
icon: i-heroicons-document-text
application: Print Designer
theme: site-web-outils-numeriques
author: Frappe Technologies et contributeurs
logo:
  light: /frappe/print-designer.svg
  dark: /frappe/print-designer.svg
navigation:
  title: Print Designer
  icon: i-heroicons-document-text
  description: Formats d'impression dessinés dans un éditeur visuel.

publisher: frappe
licence: AGPLv3
version: v5
marketplace: print_designer
related: [ventes, achats, comptabilite, stocks]

hero:
  title: Vos documents imprimés, <span class="text-primary">dessinés</span> à votre image.
  description: Vous placez le logo, les champs du document et le tableau des lignes sur la page, puis vous imprimez le PDF depuis Dokos. Le format vaut pour tous les documents du même type.
  image: /modules/print-designer/hero.webp

for_whom:
  items:
    - title: Votre facture PDF ne ressemble pas à vos documents papier
      description: Vous reproduisez votre charte dans l'éditeur, puis vous l'appliquez à toutes les factures du site.
      icon: i-heroicons-paint-brush
    - title: Vous payez un développeur pour chaque changement de mise en page
      description: Vous déplacez un champ ou une colonne à la souris. L'aperçu se met à jour pendant que vous travaillez.
      icon: i-heroicons-cursor-arrow-rays
    - title: Vos documents courent sur plusieurs pages
      description: Vous dessinez plusieurs pages dans le même format, avec des en-têtes et des pieds de page différents.
      icon: i-heroicons-document-duplicate

fit:
  description: Print Designer crée des <strong>formats d'impression</strong> de Dodock, les mêmes que ceux que vous choisissez dans l'aperçu d'impression d'un devis ou d'une facture. Un format se rattache à un DocType. Il lit les champs du document imprimé et ceux des documents liés, par exemple l'adresse du client ou les coordonnées de la société.
  image: /modules/print-designer/fit.webp
  reads:
    - "Le document imprimé : Devis, Facture de vente, Bon de livraison, Bon de commande"
    - "Les documents liés : Client, Fournisseur, Adresse, Société"
  adds:
    - L'éditeur à l'adresse /app/print-designer
    - Des formats d'impression conçus dans l'éditeur, visibles dans la liste des formats d'impression
  depends:
    - Dodock

features:
  - title: Placez chaque élément à la souris
    description: Vous ajoutez un texte ou une image et vous le positionnez sur la page. L'éditeur affiche le rendu pendant que vous travaillez. Vous réglez l'apparence de chaque élément dans le panneau des propriétés.
    image: /modules/print-designer/feature-editeur.webp
    badge: Éditeur visuel
  - title: Insérez les champs du document et de ses liens
    description: Un champ dynamique affiche la valeur du document imprimé, par exemple le numéro et la date de la facture. Vous pouvez aussi afficher un champ d'un document lié, comme le numéro de TVA de la société ou l'adresse de livraison du client.
    image: /modules/print-designer/feature-donnees.webp
    badge: Données dynamiques
  - title: Composez le tableau des lignes
    description: L'éditeur de tableau liste les colonnes des lignes d'articles. Vous choisissez les colonnes, leur largeur et leur style, et vous voyez le résultat sur le document.
    image: /modules/print-designer/feature-tableau.webp
    badge: Tableaux
  - title: Imprimez le PDF depuis Dokos
    description: Le format apparaît dans l'aperçu d'impression du document. Vous l'imprimez, le téléchargez en PDF ou le joignez à un e-mail depuis Dokos. Pour des cas particuliers, un script ajoute des données calculées ou un élément HTML.
    image: /modules/print-designer/feature-pdf.webp
    badge: Impression

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez « Print Designer » sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/print_designer</code> puis <code>bench --site votre-site install-app print_designer</code>."
    - title: Créez votre premier format
      description: Ouvrez /app/print-designer, choisissez le DocType à imprimer et donnez un nom au format. Il apparaît ensuite dans l'aperçu d'impression de ce DocType.

faq:
  items:
    - label: Un format Print Designer remplace-t-il les formats d'impression existants ?
      content: Non. Il s'ajoute à la liste des formats d'impression du DocType. Vous choisissez le format dans l'aperçu d'impression du document.
    - label: Puis-je afficher des données d'un autre document ?
      content: Oui, pour les documents liés au document imprimé. Le sélecteur de champ dynamique propose les champs du document et ceux de ses liens.
    - label: Print Designer est-il encore maintenu par Frappe ?
      content: Depuis le 10 octobre 2026, le README du dépôt indique que Frappe ne le maintient plus et renvoie vers l'éditeur de formats d'impression intégré à Frappe à partir de la version 16, le socle de Dodock V5. Écrivez-nous avant de bâtir de nouveaux formats avec Print Designer.

bottom_cta:
  title: Posez-nous vos questions sur Print Designer.
  description: Dites-nous quels documents vous voulez mettre en forme.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

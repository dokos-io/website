# Sources : README https://github.com/frappe/drive (branche main) ; docs.frappe.io/drive (introduction, quick-start) ;
# licence vérifiée sur le dépôt (AGPL-3.0) ; marketplace cloud.dokos.io, identifiant drive.
# Le README indique que Frappe Drive est archivé et rejoint Frappe Suite (github.com/frappe/suite).
# Statut vérifié le 3 novembre 2026 : description du dépôt frappe/drive « Drive is now archived and is a part of
# Frappe Suite now », avis d'archivage ajouté le 1er octobre 2026 (commit « docs: add archival notice »).
# frappe/suite : « [WIP] », AGPL-3.0, sept produits (Drive, Writer, Sheets, Slides, Meet, Mail, Calendar),
# frappe >=16. TODO (décision utilisateur) : retirer cette page ou la remplacer par une page Frappe Suite.
#
# Captures à prendre (demo.dokos.cloud, interface /drive) :
# - hero.webp : l'accueil de Frappe Drive, dossiers et fichiers récents
# - fit.webp : la fenêtre de partage d'un dossier avec un utilisateur et un groupe d'utilisateurs du site
# - feature-envoi.webp : l'envoi d'un dossier complet, arborescence conservée
# - feature-partage.webp : le journal d'activité d'un fichier (changements de permissions)
# - feature-writer.webp : un document Writer édité à deux, avec une annotation ouverte
# - feature-apercu.webp : l'aperçu d'un PDF ou d'une vidéo dans le navigateur

navigation:
  title: Frappe Drive
  icon: i-heroicons-folder-open
  description: Stockage, partage et édition de documents sur votre site Dokos.

title: Frappe Drive
icon: i-heroicons-folder-open
description: Stocke et partage vos fichiers sur votre site Dokos. Frappe a archivé l'application, qui rejoint Frappe Suite.
application: Frappe Drive
theme: site-web-outils-numeriques
author: Frappe Technologies et contributeurs
logo:
  light: /frappe/drive.svg
  dark: /frappe/drive.svg

publisher: frappe
licence: AGPLv3
version: v5
marketplace: drive
docs: https://docs.frappe.io/drive/introduction
related: [wiki, raven, support, builder]

hero:
  title: Vos fichiers d'équipe, <span class="text-primary">stockés et partagés</span> depuis votre site Dokos.
  description: >-
    Frappe Drive ajoute à votre site un espace de fichiers avec les utilisateurs et les groupes que vous avez déjà.
    Frappe a archivé Drive en octobre 2026 : ses fonctions passent dans Frappe Suite, encore en développement.
    Pour un nouveau projet, parlez-nous d'abord de Suite.

for_whom:
  items:
    - title: Vos fichiers d'équipe vivent chez un service tiers
      description: >-
        Vous les stockez sur votre site Dokos, et vous les partagez avec les utilisateurs et les groupes du site.
      icon: i-heroicons-folder
    - title: Vous rédigez des documents à plusieurs
      description: >-
        L'éditeur Writer permet d'écrire en même temps, d'annoter, de répondre aux annotations et de garder des versions.
      icon: i-heroicons-pencil-square
    - title: Vous devez transmettre un dossier à un partenaire extérieur
      description: >-
        Vous créez un utilisateur invité avec un accès limité, ou vous publiez le fichier.
      icon: i-heroicons-user-plus

fit:
  description: >-
    Frappe Drive s'installe sur votre site Dokos et utilise ses <strong>Utilisateurs</strong> et ses
    <strong>Groupes d'utilisateurs</strong>. Vous ouvrez l'interface /drive, envoyez vos fichiers et dossiers, puis partagez
    chacun avec un utilisateur, un groupe, tout le site, ou le publiez.<br>
    Le stockage est mis en commun pour tous les utilisateurs, ou attribué par quota à chacun.
  reads:
    - Utilisateur
    - Groupe d'utilisateurs
  adds:
    - L'interface /drive
    - Les fichiers et dossiers Drive, leurs partages et leur journal d'activité
    - L'éditeur de documents Writer
    - Les utilisateurs invités et les quotas de stockage
  depends:
    - Dodock

features:
  - title: Envoyez des dossiers entiers
    description: >-
      Les fichiers volumineux sont envoyés en plusieurs parties. Un dossier envoyé garde son arborescence.
      Les vidéos sont lues en continu depuis le serveur.
    badge: Envoi
  - title: Partagez et retrouvez vos fichiers
    description: >-
      Vous partagez un fichier ou un dossier avec un utilisateur, un groupe, tout le site, ou vous le publiez.
      La recherche couvre vos fichiers et ceux partagés avec vous. Le journal d'activité montre les changements de permissions et de métadonnées.
    badge: Partage
  - title: Rédigez à plusieurs avec Writer
    description: >-
      Plusieurs utilisateurs, ou des invités, modifient un document en même temps. Vous annotez, répondez et résolvez les annotations.
      Les versions sont enregistrées à la main ou automatiquement, et un fichier .docx s'importe dans l'éditeur.
    badge: Documents
  - title: Ouvrez vos fichiers dans le navigateur
    description: >-
      De nombreux types de fichiers s'affichent en aperçu sans téléchargement. La liste des formats pris en charge est
      tenue dans la documentation de Frappe Drive.
    badge: Aperçu

install:
  steps:
    - title: Pour un nouveau projet, voyez Frappe Suite
      description: >-
        Frappe Suite réunit Drive, Writer, Sheets, Slides, Meet, Mail et Calendar dans une seule application (github.com/frappe/suite).
        Elle est encore marquée en développement par Frappe. Écrivez-nous pour en parler avant de l'installer.
    - title: Si votre site utilise déjà Drive
      description: >-
        L'application reste listée sur la marketplace Dokos Cloud. Le dépôt frappe/drive est archivé :
        prévoyez avec nous le passage à Suite.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/drive --branch develop</code> puis <code>bench --site votre-site install-app drive</code>. La branche develop déclare Frappe v15 à v17."
  prerequisites:
    - Un site Dokos V5
    - En auto-hébergement, les paquets système ffmpeg et libmagic

faq:
  items:
    - label: Puis-je partager un fichier avec quelqu'un qui n'a pas de compte ?
      content: >-
        Oui. Vous publiez le fichier, ou vous créez un utilisateur invité avec un accès limité et contrôlé.
    - label: Comment est réparti l'espace de stockage ?
      content: >-
        Le stockage est mis en commun pour tous les utilisateurs du site, ou attribué par quota à chaque utilisateur.
    - label: Frappe Drive remplace-t-il mes sauvegardes ?
      content: >-
        Non. Le README de Frappe Drive recommande aux auto-hébergeurs de ne pas en faire leur unique espace de fichiers
        et de garder une stratégie de sauvegarde.
    - label: Frappe Drive est-il toujours maintenu ?
      content: >-
        Frappe a archivé Drive en octobre 2026. Le dépôt frappe/drive indique que Drive fait désormais partie de
        Frappe Suite (github.com/frappe/suite), une application qui regroupe aussi Writer, Sheets, Slides, Meet, Mail et Calendar.
        Suite est publiée sous licence AGPLv3 et encore marquée en développement. Pour un nouveau site, parlez-nous de Suite.

bottom_cta:
  title: Vous utilisez Frappe Drive ou cherchez à le remplacer.
  description: Décrivez-nous vos volumes et vos usages, nous préparons avec vous le passage à Frappe Suite.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

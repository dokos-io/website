navigation:
  title: Frappe Drive
  icon: i-heroicons-folder-open
  description: Plateforme de stockage et partage de fichiers.

title: Frappe Drive
icon: i-heroicons-folder-open
description: Stockez et partagez vos fichiers depuis votre site Dokos, sans service tiers.
application: Frappe Drive
theme: site-web-outils-numeriques
logo:
  light: /frappe/drive.svg
  dark: /frappe/drive.svg

hero:
  title: Vos fichiers, <span class="text-primary">stockés et partagés</span> depuis Dokos.
  description: Frappe Drive ajoute à Dokos une plateforme de stockage et de partage de fichiers, sans dépendre d'un service de stockage tiers.
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: amber
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true
  headline:
    label: L'écosystème Dokos
    color: sky
    to: "/fr"
    right_icon: i-heroicons-arrow-right-20-solid

features:
  - title: Stockage de fichiers
    description: Un espace de stockage hébergé sur votre site Dokos, à côté de vos autres données de gestion.
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Stockage
      color: sky
  - title: Partage
    description: Partage des fichiers ou des dossiers avec votre équipe, sans passer par un service de stockage tiers.
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Partage
      color: sky

bottom_cta:
  title: Envie de sortir vos fichiers d'un service tiers ?
  description: Disponible depuis la marketplace de cloud.dokos.io. Décrivez-nous vos volumes et vos usages, nous vous dirons si Frappe Drive y répond.
  class: "bg-amber-600/10 dark:bg-amber-800/10"
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: black
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      variant: ghost
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

# Sources :
# - https://doc.dokos.io/v5/dokos-cli (et sous-pages installation, configuration, commandes,
#   integration-agents), https://doc.dokos.io/v5/integrations/ia/assistants-externes
# - README de https://gitlab.com/dokos/dokos-cli (branche develop) : commandes, sites en lecture
#   seule, trousseau du système, plugin Claude, licence MIT (Dokos SAS, 2026)
#
# Captures à prendre : Dokos CLI s'exécute sur le poste de l'utilisateur, les captures sont des
# fenêtres de terminal (thème clair, 1440×900) connectées à demo.dokos.cloud :
# - hero.webp : `dokos get-list "Sales Invoice" --filters '[["status","=","Overdue"]]'` avec le
#   tableau de résultats
# - fit.webp : une session Claude Code où l'agent appelle l'outil `doc_list` du serveur `dokos`,
#   puis demande confirmation avant un `doc_update`
# - feature-lecture.webp : `dokos run-report "Accounts Receivable"` suivi de `dokos meta get "Sales Invoice"`
# - feature-ecriture.webp : `dokos set-value "Task" "TASK-0001" status "Completed"`, puis la
#   même commande refusée sur un site marqué en lecture seule
# - feature-sites.webp : `dokos sites` listant plusieurs sites et le site actif
# - feature-agents.webp : `dokos agent install --print` et la liste des runtimes détectés


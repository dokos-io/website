fit:
  description: >-
    La comptabilité est au centre de votre site Dokos. Une facture de vente validée dans Ventes, une facture
    d'achat validée dans Achats ou un reçu d'achat enregistré dans Stocks écrivent dans le même grand livre.
    Les écritures de paiement rapprochées avec vos transactions bancaires ferment la boucle.
  image: /modules/comptabilite/fit.webp
  reads:
    - Facture de vente et Facture d'achat
    - Écriture de paiement et Écriture de journal
    - Compte bancaire et Transaction bancaire
    - Commande client et Commande fournisseur, pour les acomptes et le prévisionnel
    - Abonnement, Note de frais et Fiche de paie, pour le prévisionnel de trésorerie
  adds:
    - L'espace de travail Comptabilité, le plan comptable, les journaux et l'exercice fiscal
    - Le Grand livre, le Bilan, le Compte de résultat et la Balance générale
    - Le module Banque (/banking) et le prévisionnel de trésorerie
    - Le journal SAS Ledger de la caisse certifiée et l'export des archives fiscales
    - Le Prélèvement SEPA, les Factures d'acompte et l'Import FEC
  depends:
    - Ventes
    - Achats
    - Stocks
    - eTransactions
    - Paiements

features:
  - title: Vos factures deviennent vos écritures
    description: >-
      Vous validez une facture de vente ou d'achat. Dokos lui attribue son numéro à la validation, dans une
      séquence continue, et passe l'écriture au grand livre. Les documents de facturation et de comptabilité
      ne peuvent pas être supprimés. Le bilan sort au format attendu en France et les comptes de tiers se
      placent à l'actif ou au passif selon leur solde.
    badge: Grand livre
  - title: Une caisse certifiée LNE
    description: >-
      Le point de vente crée la facture et enregistre le paiement en une seule opération, avec plusieurs
      modes de paiement sur un même ticket. Chaque opération d'encaissement est inscrite dans un journal
      SAS Ledger par société. Depuis la fiche Société, vous exportez une archive fiscale par période d'un an
      au plus et vous vérifiez la chaîne cryptographique du journal. Vous conservez chaque archive six ans.
      La certification suppose le module Certification Caisse et une licence délivrée par Dokos SAS.
    badge: Certifié LNE
  - title: Vos factures fournisseurs arrivent en électronique
    description: >-
      Dokos reçoit les factures électroniques aux formats CII, Factur-X et UBL par sa connexion à une
      plateforme agréée. Chaque facture reçue apparaît dans la liste des e-invoices du module Achats avec son
      statut (Réceptionnée, En attente de validation, Intégrée, Refusée, Abandonnée). Dokos crée la facture
      fournisseur en brouillon et notifie l'équipe comptable, qui vérifie le montant et l'échéance avant de
      valider. Un indicateur affiche par quelle plateforme la facture est arrivée. Côté émission, Dokos génère
      déjà le fichier Factur-X à la validation d'une facture de vente ; l'envoi par la plateforme agréée est
      en cours.
    badge: Facturation électronique
  - title: Le module Banque rapproche vos relevés
    description: >-
      Vous importez vos relevés en OFX, CSV, XLSX ou PDF. Dokos détecte les colonnes et écarte les doublons.
      Pour chaque transaction, il propose une correspondance par montant, référence ou numéro de document,
      avec une tolérance de date réglable. Vous validez, vous rapprochez une transaction avec plusieurs
      paiements ou l'inverse, ou vous créez le paiement manquant. Des règles de correspondance affectent un
      tiers ou un compte selon le libellé. Le module est en bêta et l'outil de rapprochement que vous
      connaissez reste disponible, sur les mêmes données.
    badge: Banking (bêta)
  - title: Un prévisionnel de trésorerie à partir de vos documents
    description: >-
      Depuis Comptabilité > Trésorerie, vous choisissez une période et vous cliquez sur Générer. Dokos lit
      vos factures de vente et d'achat, vos abonnements, vos commandes, vos notes de frais approuvées et vos
      fiches de paie. Il affiche le solde d'ouverture, les encaissements et décaissements attendus, le solde
      de clôture et une grille jour par jour. Vous cliquez sur un flux pour ouvrir son document, et vous
      ajoutez des entrées manuelles. L'outil est en bêta ; la documentation conseille de le régénérer chaque
      semaine sur huit à douze semaines.
    badge: Trésorerie (bêta)

install:
  description: Le module Comptabilité fait partie de Dokos. Il n'y a rien à installer en plus.
  steps:
    - title: Sur Dokos Cloud
      description: Créez votre site depuis votre tableau de bord Dokos Cloud. Dokos est installé avec le module Comptabilité. Compris dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Pour la facturation électronique
      description: Installez l'application eTransactions depuis la marketplace, puis renseignez la connexion à votre plateforme agréée dans ses paramètres.
    - title: Pour la caisse certifiée
      description: L'application de certification de caisse s'installe sur les sites qui encaissent des particuliers. Écrivez-nous pour l'activer sur votre site.

faq:
  items:
    - label: Puis-je reprendre ma comptabilité existante ?
      content: >-
        Oui. Depuis Comptabilité > France, vous créez les paramètres d'import FEC, puis les journaux et les
        comptes manquants, puis un document Import FEC avec votre fichier. Dokos crée les factures ou les
        écritures de journal selon vos paramètres et peut lettrer les paiements d'après le fichier.
    - label: Comment mon expert-comptable accède-t-il à mes comptes ?
      content: >-
        Vous lui créez un utilisateur avec les rôles comptables. Les autorisations par rôle et les
        autorisations utilisateur limitent ce qu'il voit, par exemple à une seule société.
    - label: Puis-je prélever mes clients par SEPA ?
      content: >-
        Oui. Chaque client dispose d'un mandat SEPA actif avec IBAN et BIC. Depuis Comptabilité >
        Prélèvement Sepa, vous sélectionnez les écritures de paiement de la période et vous générez le
        fichier XML (pain.008) à transmettre à votre banque.
    - label: Quand la facturation électronique devient-elle obligatoire ?
      content: >-
        La réception est obligatoire pour toutes les entreprises en septembre 2026. L'émission est obligatoire
        pour les grandes entreprises et les ETI en septembre 2026, et pour les PME et microentreprises en
        septembre 2027. Dokos reçoit déjà les factures électroniques et génère le Factur-X à la validation.
    - label: Qu'est-ce qui change par rapport à la comptabilité d'ERPNext ?
      content: >-
        Dokos numérote les factures à la validation en séquence continue, interdit la suppression des
        documents de facturation et de comptabilité, produit le bilan au format français, génère les fichiers
        de prélèvement SEPA, importe les relevés OFX, gère les factures d'acompte et l'amortissement linéaire.


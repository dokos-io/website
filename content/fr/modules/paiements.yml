hero:
  title: Vos <span class="text-primary">demandes de paiement</span>, réglées par carte ou par prélèvement SEPA, depuis une facture ou votre boutique.
  description: Vous créez une demande de paiement depuis une commande client ou une facture de vente et vous envoyez le lien à votre client. La passerelle confirme le paiement à Dokos par webhook ; aucune donnée de carte n'est stockée sur votre site.
  image: /modules/paiements/hero.webp

for_whom:
  items:
    - title: Vous envoyez des factures et attendez les virements
      description: La demande de paiement génère un lien. Votre client paie par carte ou par prélèvement SEPA, et le statut de la demande se met à jour dans Dokos.
      icon: i-heroicons-link
    - title: Vous vendez en ligne avec Webshop
      description: Le mode de paiement lié à une passerelle, autorisé dans les Paramètres E-Commerce, apparaît au moment du paiement de la commande.
      icon: i-heroicons-shopping-cart
    - title: Vous facturez des abonnements
      description: Avec Stripe ou GoCardless, une demande de paiement liée à un abonnement conserve la carte ou le mandat de prélèvement pour les échéances suivantes.
      icon: i-heroicons-arrow-path
    - title: Vous encaissez sur place
      description: Le bouton « Payer avec SumUp » d'une facture, d'une demande de paiement ou du point de vente lance le paiement sur l'application SumUp et son terminal.
      icon: i-heroicons-device-phone-mobile

fit:
  description: Payments ajoute les passerelles à la <strong>demande de paiement</strong> de Dokos. Chaque passerelle se rattache à un mode de paiement, dont l'onglet Portail paramètre la page de paiement. Sur la fiche client, Dokos ne conserve que l'identifiant client de la passerelle et le moyen de paiement par défaut, pour réutiliser le même client d'une fois sur l'autre.
  image: /modules/paiements/fit.webp
  reads:
    - Commande client et Facture de vente, à l'origine d'une demande de paiement
    - Demande de paiement, dont le statut suit les notifications de la passerelle
    - Client, qui garde l'identifiant client de la passerelle et le moyen de paiement par défaut
    - Mode de paiement, avec ses onglets « Passerelle de paiement » et « Portail »
    - Paramètres E-Commerce, section « Modes de paiement autorisés »
    - Abonnement, pour les paiements récurrents
  adds:
    - Les documents « Paramètres Stripe », « Paramètres GoCardless », « Paramètres Stancer », « Paramètres HelloAsso », « Paramètres SumUp » et « Paramètres Paypal »
    - La page de paiement du portail, ouverte depuis le lien d'une demande de paiement
    - Le bouton « Payer avec SumUp » sur la facture de vente, la demande de paiement et le point de vente
    - Les webhooks de réception des statuts de paiement
  depends:
    - Comptabilité

features:
  - title: Envoyez un lien de paiement
    description: Depuis une commande client ou une facture de vente, vous créez une demande de paiement et vous partagez le lien généré. Votre client règle sur la page de paiement du portail, sans compte sur votre site. Pour tester, ouvrez le lien dans une fenêtre de navigation privée.
    image: /modules/paiements/feature-lien.webp
    badge: Demande de paiement
  - title: Encaissez les commandes de votre boutique
    description: Vous créez un mode de paiement et vous le reliez à votre passerelle dans l'onglet « Passerelle de paiement ». Dans les Paramètres E-Commerce, vous l'ajoutez aux modes de paiement autorisés. Les clients de votre boutique Webshop le voient au moment de payer.
    image: /modules/paiements/feature-boutique.webp
    badge: Webshop
  - title: Prélevez vos abonnements
    description: Avec Stripe, un paiement par carte ou par prélèvement SEPA lié à un abonnement enregistre le moyen de paiement pour les échéances suivantes. Avec GoCardless, c'est le mandat de prélèvement qui est conservé. Stancer conserve aussi la carte pour une demande liée à un abonnement ; HelloAsso ne le fait pas.
    image: /modules/paiements/feature-recurrent.webp
    badge: Récurrent
  - title: Encaissez sur place avec SumUp
    description: Vous saisissez dans les Paramètres SumUp les clés de votre compte développeur et vous créez un mode de paiement SumUp pour vos sociétés. Le bouton « Payer avec SumUp » apparaît sur la facture de vente, la demande de paiement et le point de vente ; il déclenche le paiement sur l'application SumUp d'un appareil mobile relié au terminal.
    image: /modules/paiements/feature-sumup.webp
    badge: SumUp
  - title: Recevez les confirmations par webhook
    description: Dans les Paramètres Stripe, le bouton « Créer des webhooks Stripe » configure les webhooks pour vous. Pour GoCardless, vous créez l'endpoint dans l'espace développeur et vous copiez le secret généré dans Dokos. Les changements de statut arrivent par ce canal, parfois quelques secondes après le paiement. Depuis Dokos V5, une demande échouée ne peut plus être réutilisée pour une nouvelle transaction.
    image: /modules/paiements/feature-stripe.webp
    badge: Webhooks

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Payments s'installe avec Dokos sur votre site. Si elle manque, ouvrez la marketplace depuis votre tableau de bord Dokos Cloud et installez-la. Comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/payments</code> puis <code>bench --site votre-site install-app payments</code>."
    - title: Premier paramétrage
      description: Saisissez les clés de votre passerelle dans son document de paramètres, créez un mode de paiement relié à cette passerelle, puis testez avec une demande de paiement ouverte dans une fenêtre privée.
  prerequisites:
    - Un compte chez l'une des passerelles prises en charge, avec ses clés API

faq:
  items:
    - label: Quelles passerelles sont prises en charge ?
      content: Stripe (carte et prélèvement SEPA), GoCardless (prélèvement SEPA), Stancer (carte), HelloAsso (carte, réservé aux associations), PayPal et SumUp (paiement sur place par terminal). Chaque passerelle a sa page dans la documentation.
    - label: Dokos stocke-t-il les données de carte ?
      content: Non. La saisie se fait chez la passerelle. Dokos ne conserve sur la fiche client que l'identifiant client de la passerelle et l'identifiant du moyen de paiement par défaut.
    - label: Nous sommes une association, que choisir ?
      content: HelloAsso, si votre association est vérifiée par HelloAsso. Le payeur peut ajouter une contribution volontaire à HelloAsso. Pour des abonnements, HelloAsso ne conserve pas la carte ; préférez alors Stripe ou GoCardless.
    - label: Comment tester un paiement avant la mise en service ?
      content: Créez une commande client ou une facture de vente, puis une demande de paiement. Ouvrez le lien dans une fenêtre privée ou déconnectée pour voir ce que verra votre client. PayPal propose en plus l'option « Utiliser la sandbox ».


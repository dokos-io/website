# Sources : https://doc.dokos.io/v5/integrations/payments et ses pages Stripe, Paypal, GoCardless,
# Stancer, HelloAsso, SumUp ; README et license.txt de https://gitlab.com/dokos/payments (branche v5) ;
# https://doc.dokos.io/nouveautes (v5 : une demande de paiement échouée ne peut plus être réutilisée).
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : une Demande de paiement soumise, avec son lien de paiement (/app/payment-request)
# - fit.webp : un Mode de paiement, onglet « Passerelle de paiement » (/app/mode-of-payment)
# - feature-lien.webp : la page de paiement du portail ouverte depuis le lien d'une demande de paiement
# - feature-boutique.webp : les Paramètres E-Commerce, section « Modes de paiement autorisés » (/app/webshop-settings)
# - feature-recurrent.webp : les Paramètres GoCardless, avec le secret du webhook (/app/gocardless-settings)
# - feature-sumup.webp : le bouton « Payer avec SumUp » sur une Facture de vente (/app/sales-invoice)
# - feature-stripe.webp : les Paramètres Stripe, bouton « Webhooks > Créer des webhooks Stripe » (/app/stripe-settings)


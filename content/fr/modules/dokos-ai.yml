# - Faits fixés par le client : trois couches (registre, orchestrateur, outils), compétences en
#   Markdown avec en-tête YAML, confirmation avant toute écriture, disponible sur la marketplace.
#
# Captures à prendre (demo.dokos.cloud, 1440×900, thème clair, français) :
# - hero.webp : l'espace de travail « Dokos AI », conversation ouverte avec une question sur les
#   créances clients et la réponse de l'assistant (icône « AI Assistant » du bureau)
# - fit.webp : la boîte de réception de l'espace Dokos AI, une écriture préparée en attente
#   d'approbation, avec le document concerné et les boutons Approuver / Rejeter
# - feature-conversation.webp : l'assistant qui exécute un rapport (Balance âgée des créances)
#   et répond avec les lignes trouvées
# - feature-formulaire.webp : un formulaire Article, le bouton IA à côté du champ Description,
#   la proposition de texte affichée avant remplacement
# - feature-competences.webp : la liste des compétences (AI Skill) avec la colonne
#   « Partager avec les assistants externes »
# - feature-flux.webp : l'éditeur visuel d'un flux automatisé, avec un point d'approbation


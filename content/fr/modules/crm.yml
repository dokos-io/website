hero:
  title: Vos prospects et vos affaires, <span class="text-primary">suivis jusqu'au devis</span> dans Dokos.
  description: >-
    Frappe CRM donne à votre équipe commerciale une interface dédiée à la prospection.
    Quand une affaire est gagnée, le client et le devis sont créés dans votre site Dokos.
  image: /modules/crm/hero.webp

for_whom:
  items:
    - title: Vos prospects sont dispersés entre boîtes mail et tableurs
      description: >-
        Chaque prospect a sa page, avec ses e-mails, ses notes, ses tâches et ses appels au même endroit.
      icon: i-heroicons-inbox-stack
    - title: Vos commerciaux ne veulent pas travailler dans le bureau Dokos
      description: >-
        Ils travaillent dans l'interface /crm, en liste ou en Kanban. Le devis et le client partent ensuite dans Dokos sans ressaisie.
      icon: i-heroicons-presentation-chart-line
    - title: Les demandes entrantes attendent qu'on les prenne
      description: >-
        Les règles d'attribution répartissent les nouveaux prospects à tour de rôle ou vers la personne qui en a le moins.
      icon: i-heroicons-arrows-right-left

fit:
  description: >-
    Frappe CRM s'installe sur le même site que Dokos. Dans <strong>Paramètres > ERPNext</strong>, vous activez
    l'intégration et choisissez la société. Quand une affaire passe au statut « Gagnée », ou au statut que vous
    avez choisi, le CRM crée le <strong>Client</strong> dans Dokos et lui relie les contacts et l'adresse de
    l'organisation. Le bouton « Créer un devis » ouvre un <strong>Devis</strong> Dokos prérempli avec le contact,
    l'adresse et les lignes de produits.<br>
    Les Articles de Dokos alimentent les Produits du CRM. Le prix d'une ligne vient de la liste de prix du client,
    ou de la liste de prix de vente par défaut.
  image: /modules/crm/fit.webp
  reads:
    - Article et Prix d'article
    - Client, Contact et Adresse
    - Devis, puis Commande client
    - Compte e-mail
  adds:
    - L'interface /crm, en liste et en Kanban
    - Les documents Prospect, Affaire, Organisation, Note, Tâche et Journal d'appel
    - Les règles d'attribution, les SLA et les modèles d'e-mail
  depends:
    - Dodock
    - Dokos pour les clients et les devis

features:
  - title: Qualifiez vos prospects et convertissez-les en affaires
    description: >-
      Vous créez un prospect à la main, par import CSV, depuis un formulaire web ou depuis vos publicités Meta.
      Son statut suit votre qualification (Nouveau, Contacté, Qualifié, Non qualifié). Le bouton « Convertir en affaire »
      crée l'organisation et le contact, ou les relie à des fiches existantes. L'affaire avance ensuite d'étape en étape
      jusqu'à « Gagnée » ou « Perdue ».
    image: /modules/crm/feature-prospects.webp
    badge: Prospects et affaires
  - title: Écrivez à vos prospects depuis leur fiche
    description: >-
      Vous connectez un compte e-mail dans Paramètres > E-mail. Les messages envoyés et reçus s'affichent sur la page
      du prospect ou de l'affaire. Vous utilisez des modèles d'e-mail et une signature. Une option crée un prospect
      à partir d'un expéditeur inconnu.
    image: /modules/crm/feature-email.webp
    badge: E-mail
  - title: Gardez la trace de chaque échange
    description: >-
      Sur la page d'un prospect, vous ajoutez une note, créez une tâche de relance, consignez un appel et laissez un
      commentaire en mentionnant un collègue. Les tâches de toute l'équipe se retrouvent dans la vue Tâches.
    image: /modules/crm/feature-suivi.webp
    badge: Suivi
  - title: Répartissez les prospects et fixez des délais de relance
    description: >-
      Les règles d'attribution distribuent les nouveaux prospects à tour de rôle ou vers la personne la moins chargée.
      Les SLA fixent le délai de première réponse. La hiérarchie commerciale limite ce que chaque utilisateur voit.
    image: /modules/crm/feature-attribution.webp
    badge: Attribution
  - title: Appelez depuis le CRM
    description: >-
      Avec Twilio ou Exotel, vous passez et recevez les appels depuis la fiche, et les appels sont enregistrés.
      L'application Frappe WhatsApp permet d'envoyer et de recevoir des messages WhatsApp depuis la même page.
    image: /modules/crm/feature-telephonie.webp
    badge: Téléphonie

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: >-
        Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez CRM sur votre site.
        L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/crm</code> puis <code>bench --site votre-site install-app crm</code>."
    - title: Activez l'intégration avec Dokos
      description: >-
        Dans /crm, ouvrez Paramètres > ERPNext, activez l'intégration et choisissez la société.
        Réglez la devise dans Paramètres > Valeurs par défaut avant de créer la première affaire.
  prerequisites:
    - Un site Dokos V5 (Frappe CRM, branche main, fonctionne avec Frappe v15 et v16)
    - Un compte Twilio ou Exotel pour la téléphonie, l'application Frappe WhatsApp pour WhatsApp

faq:
  items:
    - label: Faut-il Dokos pour utiliser Frappe CRM ?
      content: >-
        Frappe CRM fonctionne sur Dodock seul. La création du client, du devis et la synchronisation des articles
        demandent Dokos sur le même site.
    - label: Le nombre d'utilisateurs est-il limité ?
      content: >-
        Non. Frappe CRM ne limite pas le nombre d'utilisateurs. Vous les invitez dans Paramètres > Inviter un utilisateur,
        avec le rôle Sales User, Sales Manager ou Admin.
    - label: Comment arrivent les prospects ?
      content: >-
        À la main, par import CSV depuis la liste des prospects, par un formulaire web créé dans Paramètres > Formulaires,
        ou par la synchronisation des publicités Meta dans Paramètres > Lead Syncing.
    - label: Les prix du CRM suivent-ils ceux de Dokos ?
      content: >-
        Oui. Dokos fait foi : la création, la mise à jour et la suppression d'un Article se répercutent sur le Produit du CRM.
        Le prix vient du Prix d'article de la liste de prix de vente, et une affaire utilise la liste de prix du client.
    - label: Sous quelle licence est publié Frappe CRM ?
      content: >-
        GNU Affero General Public License v3.0 (AGPLv3), d'après le fichier de licence du dépôt frappe/crm.


# Sources : README https://github.com/frappe/crm (branche develop) ; docs.frappe.io/crm (introduction,
# setup-guide, erpnext, twilio, exotel, whatsapp) ; licence vérifiée sur le dépôt (AGPL-3.0) ;
# marketplace cloud.dokos.io, identifiant crm.
#
# Captures à prendre (demo.dokos.cloud, interface /crm) :
# - hero.webp : le tableau Kanban des affaires (/crm/deals, vue Kanban)
# - fit.webp : une affaire au statut « Gagnée » avec le bouton « Créer un devis » et le Client Dokos créé
# - feature-prospects.webp : la liste des prospects avec filtres et colonnes personnalisés (/crm/leads)
# - feature-email.webp : la page d'une affaire, onglet E-mails, avec un modèle d'e-mail sélectionné
# - feature-suivi.webp : la page d'un prospect, onglets Notes, Tâches et Appels
# - feature-attribution.webp : Paramètres > Règles d'attribution, une règle à tour de rôle
# - feature-telephonie.webp : la fenêtre d'appel Twilio ou Exotel ouverte sur une fiche


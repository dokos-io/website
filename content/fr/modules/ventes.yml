for_whom:
  items:
    - title: Vos devis partent d'un traitement de texte
      description: Vous créez le devis dans Dokos depuis la fiche client ou l'opportunité. Les prix viennent de votre liste de prix et la commande reprend le devis accepté.
      icon: i-heroicons-document-text
    - title: Vous facturez des abonnements chaque mois à la main

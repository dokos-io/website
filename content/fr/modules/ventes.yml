fit:
  description: >-
    Une piste devient une opportunité dans le CRM, puis un devis, puis une commande client. La commande
    vérifie la disponibilité dans Stocks à la validation. Elle crée le bon de livraison et la facture de
    vente, qui passe son écriture en Comptabilité. La demande de paiement s'appuie sur les passerelles de
    l'application Paiements.
  image: /modules/ventes/fit.webp
  reads:
    - Client, Contact et Adresse
    - Article, Prix de l'article et Liste de prix
    - Piste et Opportunité (CRM)
    - Entrepôt, pour le contrôle de disponibilité à la validation
  adds:
    - Devis, Commande client, Facture de vente et Facture d'acompte
    - Abonnement, Demande de paiement et Termes de paiement
    - Point de vente et factures de point de vente
    - Règles de prix, Schéma promotionnel, Code promotionnel et Règle de livraison
    - Vendeur, Partenaire commercial et les rapports commerciaux
  depends:
    - CRM
    - Comptabilité
    - Stocks
    - Paiements

features:
  - title: Un devis qui se transforme en commande
    description: >-
      Vous créez le devis pour un client, pour un prospect ou depuis une opportunité du CRM. Les prix et les
      conditions viennent de la liste de prix du client. Vous appliquez une remise par ligne ou sur le total,
      ou un code promotionnel. Le devis affiche sa marge brute pendant la saisie. Une fois validé, il est
      envoyé par e-mail ou exporté en PDF. Son statut passe à Commandé, Refusé, Expiré ou Perdu, avec un
      motif qui alimente l'analyse des ventes. Vous convertissez tout le devis ou seulement certaines lignes.
    image: /modules/ventes/feature-devis.webp
    badge: Devis
  - title: Une commande qui pilote la suite
    description: >-
      La commande client reprend le devis accepté. Si vous gérez les stocks, Dokos vérifie la disponibilité à
      la validation. Depuis la commande, vous créez le bon de livraison, la facture de vente, une facture
      d'acompte, une demande de paiement, un projet ou un abonnement. Le statut indique ce qui reste à faire
      (À livrer et facturer, À facturer, À livrer, Terminé). Une commande fournisseur en livraison directe
      reste liée à la commande client et met à jour ses quantités livrées.
    badge: Commande client
  - title: Une facture, son paiement et son ticket de caisse
    description: >-
      La facture de vente passe son écriture en comptabilité à la validation, dans une séquence de numéros
      continue. Vous envoyez une demande de paiement avec un lien Stripe, GoCardless ou Braintree, et les
      acomptes déjà encaissés se déduisent du solde. Au comptoir, le point de vente crée la
      facture et enregistre le paiement en une seule opération, avec plusieurs modes de paiement et un
      terminal SumUp si vous en avez un. Avec eTransactions, chaque facture validée génère son fichier
      Factur-X.
    image: /modules/ventes/feature-facture.webp
    badge: Facture de vente
  - title: Des abonnements qui facturent seuls
    description: >-
      Vous créez un abonnement depuis une commande validée ou depuis Ventes > Abonnements, avec un article
      récurrent et une période mensuelle, trimestrielle ou annuelle, facturée en début ou en fin de période.
      Dokos génère les factures et, si le client a enregistré une carte ou un mandat, déclenche le paiement à
      chaque échéance. Sinon il envoie un lien de paiement. Vous annulez un abonnement à une date donnée,
      avec un prorata sur la dernière facture.
    badge: Abonnements
  - title: Vos prix selon le client et le moment
    description: >-
      Vous tenez plusieurs listes de prix, par devise ou par groupe de clients. Les règles de prix appliquent
      une remise ou un prix selon l'article, le client, la quantité ou la période. Un schéma promotionnel
      regroupe ces règles pour une opération. Un code promotionnel se saisit sur le devis. Les règles de
      livraison calculent les frais de port et les termes de paiement fixent les échéances.
    badge: Prix et promotions

install:
  description: Le module Ventes fait partie de Dokos. Il n'y a rien à installer en plus.
  steps:
    - title: Sur Dokos Cloud
      description: Créez votre site depuis votre tableau de bord Dokos Cloud. Dokos est installé avec le module Ventes. Compris dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Pour encaisser en ligne
      description: Installez l'application Paiements depuis la marketplace et configurez votre passerelle.

faq:
  items:
    - label: Puis-je modifier un devis déjà envoyé ?
      content: >-
        Un devis validé n'est plus modifiable. Vous l'annulez, vous le modifiez, vous le validez de nouveau et
        vous le renvoyez. Pour comparer deux options, vous dupliquez le devis.
    - label: Comment facturer un acompte ?
      content: >-
        Depuis la commande client validée, Créer > Facture d'acompte. Les lignes sont regroupées par taux de
        TVA. Sur la facture finale, la section Avances liste les acomptes encaissés et Dokos ne comptabilise
        que le solde restant dû.
    - label: Que se passe-t-il si le stock manque à la validation d'une commande ?
      content: >-
        Si la gestion des stocks est activée, Dokos vérifie la disponibilité à la validation et peut bloquer la
        commande avec le message « Stock insuffisant ».
    - label: Puis-je changer la périodicité d'un abonnement ?
      content: >-
        Non. La période et le moment de facturation ne se modifient plus une fois l'abonnement enregistré.
        Vous créez un nouvel abonnement.
    - label: Le point de vente est-il certifié ?
      content: >-
        Oui, quand le module Certification Caisse est installé avec une licence délivrée par Dokos SAS. Ce module est certifié par le LNE. La [page Certifications](/fr/certifications) explique le rôle de la licence. Les
        données d'encaissement sont inscrites dans un journal inaltérable et exportables en archive fiscale.


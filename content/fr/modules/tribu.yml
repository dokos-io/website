hero:
  title: Vos adhérents et vos cotisations, <span class="text-primary">gérés dans Dokos</span>.
  description: >-
    Tribu enregistre vos adhérents, leurs adhésions et leurs dons. L'adhérent s'inscrit et paie en ligne,
    et Tribu crée la commande, la demande de paiement puis la facture dans votre comptabilité Dokos.

for_whom:
  items:
    - title: Vous tenez la liste de vos adhérents dans un tableur
      description: >-
        Chaque adhérent a sa fiche, avec ses coordonnées et l'historique de ses adhésions. Vous importez et exportez la liste.
      icon: i-heroicons-table-cells
    - title: Les adhésions arrivent en ligne et vous les ressaisissez
      description: >-
        Le formulaire web crée la fiche adhérent, son client et son contact, l'adhésion et la commande. Le paiement est encaissé dans le même parcours.
      icon: i-heroicons-globe-alt
    - title: Votre trésorier pointe les cotisations à la main
      description: >-
        Chaque adhésion a sa facture. Le paiement en ligne se rapproche en banque, et vous exportez la comptabilité.
      icon: i-heroicons-calculator

fit:
  description: >-
    Tribu s'installe sur votre site Dokos. Les <strong>Paramètres Tribu</strong> désignent l'article qui facture les adhésions,
    celui qui facture les dons, le groupe de clients et le mode de paiement par défaut. Chaque adhérent (<strong>Tribu Member</strong>)
    a son Client et son Contact dans Dokos. À la validation d'une adhésion (<strong>Tribu Membership</strong>), Tribu crée une
    <strong>Commande client</strong> avec l'adhésion et le don éventuel, puis une <strong>Demande de paiement</strong> si le montant n'est pas nul.<br>
    Le paiement en ligne passe par les passerelles de l'application Payments. Une fois la facture de vente payée, l'adhésion passe au statut
    Payé, et le rapprochement bancaire de Dokos pointe l'encaissement.
  reads:
    - Article, pour l'adhésion et pour le don
    - Client et Contact
    - Commande client, Demande de paiement et Facture de vente
    - Écriture de paiement et Transaction bancaire
    - Passerelle de paiement
  adds:
    - Les documents Tribu Member, Tribu Membership, Tribu Membership Type et Tribu Settings
    - Les catégories de types d'adhésion et les tarifs de chaque type
    - Les formulaires web d'adhésion, publiés sur votre site ou intégrés sur un autre site
    - Une tâche quotidienne qui active et expire les adhésions selon leurs dates
  depends:
    - Dokos (Ventes, Comptabilité)
    - Payments pour le paiement en ligne

features:
  - title: Tenez vos fiches adhérents
    description: >-
      La fiche d'un adhérent porte ses informations personnelles, ses contacts professionnels ou personnels et l'historique
      de ses adhésions. Vous filtrez et cherchez dans la liste, vous importez et exportez vos adhérents. Un adhérent perd
      son statut de membre quand il n'a plus d'adhésion active.
    badge: Adhérents
  - title: Définissez vos types d'adhésion
    description: >-
      Chaque type a sa période : une année glissante, une durée illimitée, des dates fixes ou une fin manuelle. Il porte un ou
      plusieurs tarifs, à prix fixe, à prix libre avec un minimum, ou gratuits. Nommer un type par saison, comme « Adhésion 2025-2026 »,
      facilite le suivi. Chaque nuit, Tribu active les adhésions dont la date de début est arrivée et expire celles qui arrivent à terme.
    badge: Types d'adhésion
  - title: Ouvrez l'inscription en ligne
    description: >-
      Chaque type d'adhésion a son formulaire web, à une adresse de votre site. Vous ajoutez des champs au formulaire
      sans code, par exemple un numéro de carte étudiant. Le paiement s'effectue dans le même parcours, et la fiche adhérent
      est créée automatiquement. Vous intégrez aussi le formulaire sur un autre site avec le code d'intégration fourni.
    badge: Inscription
  - title: Recevez des dons
    description: >-
      L'adhérent ajoute un don à son adhésion. Le don est facturé sur la même commande, avec l'article de don choisi dans les
      Paramètres Tribu, et suit les mêmes moyens de paiement que les adhésions.
    badge: Dons
  - title: Facturez et rapprochez
    description: >-
      Chaque adhésion validée crée sa commande client et sa demande de paiement. Une fois le paiement reçu, la commande est facturée
      et l'adhésion indique Payé, Partiellement payé ou Non payé. Les comptes comptables se règlent sur les articles d'adhésion et de don.
      Les paiements encaissés sont rapprochés en banque, et vous exportez la comptabilité vers votre expert-comptable.
    badge: Comptabilité

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: >-
        Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Tribu sur votre site.
        L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/tribu</code> puis <code>bench --site votre-site install-app tribu</code> et <code>bench --site votre-site migrate</code>."
    - title: Configurez une première adhésion
      description: >-
        Créez les articles d'adhésion et de don dans le module Ventes et renseignez-les dans les Paramètres Tribu. Définissez vos types
        d'adhésion, configurez un moyen de paiement et ses webhooks, puis testez une inscription complète avant d'ouvrir le formulaire.
  prerequisites:
    - Un site Dokos V5
    - L'application Payments et un compte chez un prestataire de paiement

faq:
  items:
    - label: Quels prestataires de paiement sont pris en charge ?
      content: >-
        HelloAsso, Stancer, Stripe, GoCardless et PayPal via Braintree.
    - label: Tribu gère-t-il les dons ?
      content: >-
        Oui. L'adhérent ajoute un don à son adhésion, facturé sur la même commande avec l'article de don des Paramètres Tribu,
        et payé par les mêmes moyens que l'adhésion.
    - label: Comment la comptabilité est-elle tenue ?
      content: >-
        Chaque adhésion validée crée une Commande client, facturée une fois le paiement reçu. Les comptes comptables sont configurés
        sur les articles d'adhésion et de don. Le rapprochement bancaire et les exports comptables sont ceux de Dokos.
    - label: Une adhésion importée crée-t-elle une commande ?
      content: >-
        Non. Les adhésions importées en masse ne créent ni commande ni demande de paiement. Vous reprenez ainsi votre historique sans le refacturer.
    - label: Où sont hébergées les données de mes adhérents ?
      content: >-
        Sur votre site Dokos, sur Dokos Cloud ou sur votre propre serveur. Tribu est publié sous licence AGPLv3.


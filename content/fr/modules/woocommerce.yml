navigation:
  title: Dokos WooCommerce
  icon: i-simple-icons-woocommerce
  description: Connecteur e-commerce entre WooCommerce et Dokos.

title: Dokos WooCommerce
icon: i-simple-icons-woocommerce
description: Connecte une boutique WooCommerce existante à votre gestion Dokos.
application: Dokos WooCommerce
theme: vente-relation-client
logo:
  light: /frappe/woocommerce_logo.svg
  dark: /frappe/woocommerce_logo.svg

hero:
  title: Votre boutique <span class="text-primary">WooCommerce</span>, connectée à Dokos.
  description: Dokos WooCommerce relie une boutique WordPress/WooCommerce existante à votre gestion Dokos, pour ne pas reconstruire une boutique quand une existe déjà.
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: amber
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true
  headline:
    label: L'écosystème Dokos
    color: sky
    to: "/fr"
    right_icon: i-heroicons-arrow-right-20-solid

features:
  - title: Connecteur e-commerce
    description: Relie une boutique WooCommerce existante à votre installation Dokos, sans migrer la boutique elle-même.
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Intégration
      color: sky
  - title: Une alternative au module Webshop natif
    description: Utile quand une boutique WooCommerce existe déjà et doit rester en place, plutôt que d'être remplacée par le portail e-commerce natif de Dokos.
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: E-commerce
      color: sky

bottom_cta:
  title: Une boutique WooCommerce à connecter à Dokos ?
  description: Disponible depuis la marketplace de cloud.dokos.io. Décrivez-nous votre boutique actuelle, nous vous dirons ce que le connecteur couvre déjà.
  class: "bg-amber-600/10 dark:bg-amber-800/10"
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: black
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      variant: ghost
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

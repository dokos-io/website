# Sources : gitlab.com/dokos/dodock (description, LICENSE MIT), doc.dokos.io/v5/dodock (présentation),
# doc.dokos.io/v5/dodock/developpeurs (api, api/rest_api, safe-exec, property-setters),
# doc.dokos.io/v5/dodock/fonctionnalites (workflows, utilisateurs, notifications, impression, webhooks, nommage),
# doc.dokos.io/v5/dodock/automatisations (déclencheurs, actions, file d'attente),
# doc.dokos.io/v5/dodock/interface/composants_ui, doc.dokos.io/v5/dodock/rapports/rapports-prepares,
# doc.dokos.io/v5/dodock/configuration/pappers, doc.dokos.io/v5/dodock/personnalisation.
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : la liste des types de document (/app/doctype) avec un DocType personnalisé ouvert
# - fit.webp : la fiche d'un DocType (/app/doctype/Sales Invoice) avec ses champs et ses autorisations
# - feature-doctype.webp : le formulaire Personnaliser (/app/customize-form) sur un type de document
# - feature-api.webp : la section Accès API d'un utilisateur (/app/user) et la réponse JSON de /api/resource
# - feature-automatisations.webp : un flux d'automatisation avec son déclencheur et ses actions
# - feature-scripts.webp : un script serveur (/app/server-script) et un format d'impression (/app/print-format)
# - feature-taches.webp : la file des tâches de fond (/app/rq-job) et les rapports préparés (/app/prepared-report)


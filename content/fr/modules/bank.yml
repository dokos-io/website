# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : le document Banque (Comptabilité > Paramètres > Banque) avec le panneau « Connexion bancaire » et ses comptes synchronisés
# - fit.webp : la liste Transaction bancaire (Comptabilité > Relevé bancaire > Transaction bancaire) avec des lignes importées par la synchronisation
# - feature-connexion.webp : le document Banque avec le bouton « Connecter votre banque »
# - feature-synchronisation.webp : la fenêtre « Mettre à jour les comptes bancaires » avec le compte bancaire Dokos et la date de synchronisation
# - feature-banking.webp : le module bancaire (/banking), un compte sélectionné, le panneau de correspondance ouvert sur une transaction
# - feature-tresorerie.webp : le prévisionnel de trésorerie (/desk/cash-flow-forecast) avec entrées, sorties et solde projeté


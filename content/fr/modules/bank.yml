  light: /frappe/bank_logo.svg
  dark: /frappe/bank_logo.svg
navigation:
  title: Bank
  icon: i-heroicons-building-library
  description: Synchronisation des comptes bancaires avec Dokos.

publisher: dokos
licence: AGPLv3
version: v5
marketplace: bank
docs: https://doc.dokos.io/v5/dokos/comptabilite/synchronisation-bancaire
related: [comptabilite, paiements, etransactions]

hero:
  title: Vos relevés bancaires <span class="text-primary">arrivent seuls</span> dans Dokos.
  description: Bank connecte vos comptes bancaires à Dokos par l'agrégateur Bridge. Chaque jour, les opérations deviennent des transactions bancaires prêtes à être rapprochées.

for_whom:
  items:
    - title: Vous importez vos relevés à la main
      description: Vous téléchargez un fichier sur le site de votre banque, puis vous l'importez dans Dokos. Bank supprime cette étape.
      icon: i-heroicons-arrow-down-tray
    - title: Votre comptable attend le relevé du mois
      description: Les opérations de la veille sont déjà dans Dokos. Le pointage se fait au fil de l'eau.
      icon: i-heroicons-calculator
    - title: Vous voulez voir votre trésorerie à venir
      description: Dokos V5 propose un prévisionnel de trésorerie, en version bêta depuis la rentrée 2026. Il lit les transactions que Bank importe.
      icon: i-heroicons-presentation-chart-line

fit:
  description: Bank ajoute au document <strong>Banque</strong> de Dokos un bouton de connexion à votre banque. Une fois le compte relié, chaque opération devient une <strong>Transaction bancaire</strong>, classée par date. Ces transactions sont celles que le rapprochement bancaire, l'outil historique comme le nouveau module bancaire, propose de faire correspondre à vos écritures de paiement et à vos factures.
  reads:
    - Banque et Compte bancaire
    - Transaction bancaire
    - Catégorie de transaction bancaire
    - Écriture de paiement, Facture de vente, Facture d'achat
  adds:
    - Un panneau « Connexion bancaire » sur le document Banque
    - La synchronisation quotidienne des opérations par Bridge, avec reprise automatique après un échec partiel
    - L'import des catégories de transaction fournies par Bridge
    - Un journal des erreurs de synchronisation sur le document Banque
  depends:
    - Comptabilité

features:
  - title: Connectez votre banque depuis le document Banque
    description: Ouvrez la liste Banque, créez ou modifiez votre banque, puis cliquez sur « Connecter votre banque ». Vous choisissez votre banque sur la page de connexion Bridge et saisissez vos identifiants bancaires. Bridge, édité par Bankin', est un agrégateur agréé par l'ACPR, encadré par la DSP2. Vos identifiants restent chez Bridge.
    badge: Connexion
  - title: Reliez chaque compte Bridge à un compte bancaire Dokos
    description: Après la connexion, cliquez sur « Mettre à jour les comptes bancaires ». Pour chaque compte, vous indiquez le compte bancaire Dokos à associer et la date de début de synchronisation. À la première connexion, l'historique disponible chez votre banque est importé, soit quelques semaines à quelques mois selon la banque.
    badge: Synchronisation
  - title: Rapprochez dans le nouveau module bancaire
    description: Dokos V5 propose le module Banking, en version bêta, à l'adresse <code>/banking</code> de votre site. Vous sélectionnez un compte et une période, puis le panneau de correspondance propose des factures, des écritures de paiement et des écritures de journal pour chaque transaction. Une transaction peut couvrir plusieurs factures. Des règles appliquent un tiers, un compte ou une catégorie aux libellés que vous définissez, et un journal des actions trace chaque rapprochement.
    badge: Bêta
  - title: Anticipez votre trésorerie
    description: Le prévisionnel de trésorerie, en version bêta depuis la rentrée 2026, affiche vos entrées, vos sorties et le solde projeté des semaines et des mois à venir. Ouvrez-le depuis Comptabilité > Trésorerie, ou à l'adresse <code>/desk/cash-flow-forecast</code> de votre site. Il lit vos factures non payées, vos abonnements, vos commandes, vos notes de frais et vos fiches de paie, et vous ajoutez des entrées manuelles.
    badge: Bêta

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Bank sur votre site. La documentation réserve la synchronisation Bridge aux sites Dokos Cloud.
    - title: En auto-hébergement
      description: "<code>bench get-app --branch v5 https://gitlab.com/dokos/bank</code> puis <code>bench --site votre-site install-app bank</code>. L'application fonctionne seulement avec l'application intermédiaire Bank API (<code>gitlab.com/dokos/bank-api</code>), qui porte le contrat Bridge."
    - title: Connectez votre première banque
      description: Ouvrez Comptabilité, Paramètres puis Banque. Cliquez sur « Connecter votre banque », puis associez vos comptes.
  prerequisites:
    - Dokos V5 (Frappe v16)
    - Une Banque et un Compte bancaire Dokos lié à un compte du grand livre

faq:
  items:
    - label: Quelles banques sont prises en charge ?
      content: Celles proposées par Bridge. La liste s'affiche sur la page de connexion Bridge au moment où vous choisissez votre banque.
    - label: À quelle fréquence les opérations arrivent-elles ?
      content: Une fois par jour, automatiquement. Vous pouvez aussi relancer la synchronisation d'un compte depuis une date donnée, depuis le document Banque. Un volume important peut prendre plusieurs minutes.
    - label: Puis-je utiliser Bank en auto-hébergement ?
      content: La documentation indique que la synchronisation Bridge est disponible uniquement sur Dokos Cloud. En auto-hébergement, elle propose un abonnement Plaid ou l'import de fichiers. Le module Banking importe vos relevés aux formats OFX, CSV, XLSX et PDF (avec du texte sélectionnable ; les scans ne sont pas lus) et ne crée pas de doublon quand le fichier porte un numéro de référence.
    - label: Dois-je passer au module Banking ?
      content: Non. Le module est en bêta. L'outil « Rapprochement bancaire » et la liste « Transaction bancaire » restent disponibles. Les deux outils partagent les mêmes données. Ce que vous rapprochez dans l'un apparaît dans l'autre.
    - label: Que se passe-t-il si une opération manque ?
      content: Vérifiez la date de synchronisation du compte, puis relancez la mise à jour depuis le document Banque. Le journal des erreurs du document Banque indique la cause d'un échec.


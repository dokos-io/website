navigation:
  title: Bank
  icon: i-heroicons-building-library
  description: Synchronisation des comptes bancaires.

title: Bank
icon: i-heroicons-building-library
description: Synchronise vos comptes bancaires avec votre comptabilité Dokos.
application: Bank
theme: finance-comptabilite
logo:
  light: /frappe/bank_logo.svg
  dark: /frappe/bank_logo.svg

hero:
  title: Vos comptes bancaires, <span class="text-primary">synchronisés</span> avec votre comptabilité.
  description: Bank synchronise vos comptes bancaires avec Dokos, pour rapprocher vos relevés des écritures comptables sans import manuel.
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: amber
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true
  headline:
    label: L'écosystème Dokos
    color: sky
    to: "/fr"
    right_icon: i-heroicons-arrow-right-20-solid

features:
  - title: Synchronisation des comptes
    description: Connecte vos comptes bancaires à votre installation Dokos pour en suivre les mouvements.
    image_bg_color: "bg-teal-500"
    align: left
    badge:
      label: Synchronisation
      color: sky
  - title: Rapprochement avec la comptabilité
    description: Les mouvements synchronisés alimentent le rapprochement bancaire du module Comptabilité.
    image_bg_color: "bg-teal-500"
    align: right
    badge:
      label: Comptabilité
      color: sky

bottom_cta:
  title: Envie de connecter vos comptes bancaires à Dokos ?
  description: Disponible depuis la marketplace de cloud.dokos.io. Décrivez-nous vos banques et le volume de transactions, nous vous dirons ce qui est déjà pris en charge.
  class: "bg-amber-600/10 dark:bg-amber-800/10"
  links:
    - label: Contactez-nous
      to: /fr/contact
      size: sm
      color: black
      variant: solid
      icon: i-heroicons-chat-bubble-left-right
    - label: Voir la marketplace
      to: https://cloud.dokos.io
      target: _blank
      size: sm
      variant: ghost
      color: gray
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

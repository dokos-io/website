# Sources :
# - README de https://github.com/frappe/lms (branche develop, lu le 29 octobre 2026)
# - Documentation Frappe Learning, page « Your First Steps with Frappe Learning » (https://docs.frappe.io/learning)
# - hooks.py du dépôt : required_apps = ["frappe/payments"], entrée « Learning » dans l'écran des applications
# - DocTypes du dépôt (lms/lms/doctype) : LMS Course, Course Chapter, Course Lesson, LMS Batch, LMS Quiz, LMS Assignment, LMS Certificate, LMS Program, LMS Enrollment, LMS Live Class, LMS Payment
# - Licence : fichier license.txt du dépôt (AGPLv3)
# - Marketplace Dokos Cloud : app « lms », titre « Frappe Learning »
#
# Captures à prendre (demo.dokos.cloud, 1440×900, thème clair, français) :
# - hero.webp : la page d'accueil de Learning (/lms) avec la liste des cours publiés
# - fit.webp : la liste des membres d'une session (batch) côté Learning, et la fiche Utilisateur Dokos d'un apprenant
# - feature-cours.webp : l'éditeur de cours, un chapitre déplié avec ses leçons (texte, vidéo, quiz)
# - feature-session.webp : une session avec ses dates, ses cours et un cours en direct planifié
# - feature-evaluation.webp : la correction d'un devoir remis en PDF, ou le résultat d'un quiz
# - feature-certificat.webp : un certificat généré à la fin d'un cours

title: Frappe Learning
description: Publiez vos cours en ligne, suivez vos apprenants par session et délivrez leurs certificats depuis votre site Dokos.
icon: i-heroicons-academic-cap
application: Frappe Learning
theme: projets-ressources-humaines
author: Frappe Technologies et contributeurs
logo:
  light: /frappe/lms.png
  dark: /frappe/lms.png
navigation:
  title: Frappe Learning
  icon: i-heroicons-academic-cap
  description: Cours en ligne, sessions, quiz et certificats.

publisher: frappe
licence: AGPLv3
version: v5
marketplace: lms
docs: https://docs.frappe.io/learning
related: [ressources-humaines, paiements, wiki, support]

hero:
  title: Vos formations <span class="text-primary">en ligne</span>, sur votre site Dokos.
  description: Vous écrivez un cours en chapitres et en leçons, vous l'ouvrez à vos apprenants et vous suivez leur progression. À la fin, vous délivrez le certificat.
  image: /modules/learning/hero.webp

for_whom:
  items:
    - title: Vous formez vos clients à votre produit
      description: Vous publiez un cours en libre accès ou payant. Chaque client s'inscrit, suit les leçons à son rythme et obtient un certificat.
      icon: i-heroicons-user-group
    - title: Vous intégrez vos nouveaux salariés
      description: Vous regroupez les recrues d'un même mois dans une session, avec des dates et des cours en direct. La session les inscrit à tous ses cours.
      icon: i-heroicons-identification
    - title: Vous animez des classes avec des évaluations
      description: Vous ajoutez des quiz et des devoirs aux leçons. Un évaluateur corrige les remises et valide le certificat.
      icon: i-heroicons-clipboard-document-check

fit:
  description: "Frappe Learning s'installe sur votre site Dokos et utilise ses <strong>utilisateurs</strong> : un apprenant, un formateur ou un évaluateur est un utilisateur de votre site avec le rôle correspondant. Les cours payants passent par l'application Paiements, la même que vos factures. L'application est accessible à l'adresse /lms et dans l'écran des applications de votre site."
  image: /modules/learning/fit.webp
  reads:
    - Les Utilisateurs de votre site, avec les rôles Student, Instructor, Evaluator et Moderator
    - Les passerelles de paiement de l'application Paiements pour les cours payants
  adds:
    - L'application Learning à l'adresse /lms
    - Les DocTypes « LMS Course », « Course Chapter », « Course Lesson », « LMS Batch » et « LMS Program »
    - Les DocTypes « LMS Quiz », « LMS Assignment », « LMS Certificate » et « LMS Live Class »
    - Les DocTypes « LMS Enrollment » et « LMS Payment »
  depends:
    - Dodock
    - Paiements

features:
  - title: Écrivez le cours en chapitres et en leçons
    description: Un cours contient des chapitres, et chaque chapitre contient ses leçons. Une leçon porte un texte, une vidéo, un PDF, des diapositives, un quiz ou un devoir. La vue apprenant montre la leçon telle que vos apprenants la verront. Seul un Moderator publie le cours.
    image: /modules/learning/feature-cours.webp
    badge: Cours
  - title: Regroupez vos apprenants en sessions
    description: Une session réunit un groupe d'apprenants sur un ou plusieurs cours, avec une date de début et une date de fin. Un apprenant ajouté à la session est inscrit à tous ses cours. Vous planifiez un cours en direct Zoom depuis la session, et les apprenants voient la liste des cours à suivre.
    image: /modules/learning/feature-session.webp
    badge: Sessions
  - title: Évaluez avec des quiz et des devoirs
    description: Vous créez un quiz avec des questions à choix unique, à choix multiples ou à réponse libre. Un devoir se remet en PDF ou en document. L'évaluateur corrige depuis sa file de remises. Un programme enchaîne plusieurs cours dans un ordre fixé.
    image: /modules/learning/feature-evaluation.webp
    badge: Évaluations
  - title: Délivrez le certificat
    description: À la fin d'un cours ou d'une session, vous accordez un certificat à l'apprenant, automatiquement à la fin du cours ou en une fois pour toute la session. L'application fournit un modèle de certificat, et vous pouvez y substituer le vôtre. Vous pouvez facturer un cours, une session ou le certificat lui-même.
    image: /modules/learning/feature-certificat.webp
    badge: Certificats

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez « Frappe Learning » sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/lms</code> puis <code>bench --site votre-site install-app lms</code>. L'application Paiements doit être installée sur le bench au préalable."
    - title: Ouvrez votre premier cours
      description: Dans /lms, donnez les rôles à vos utilisateurs, créez un cours avec ses chapitres et ses leçons, puis publiez-le avec un compte Moderator.
  prerequisites:
    - L'application Paiements, requise par Frappe Learning
    - Un compte Zoom, seulement pour les cours en direct

faq:
  items:
    - label: Mes apprenants doivent-ils avoir un compte sur mon site ?
      content: Oui. Chaque apprenant est un utilisateur de votre site avec le rôle Student. Un formateur a le rôle Instructor, un correcteur le rôle Evaluator et un administrateur le rôle Moderator.
    - label: Puis-je vendre un cours ?
      content: Oui. Vous activez « cours payant » dans les réglages du cours et vous choisissez une passerelle dans Settings, onglet Payment. Le paiement passe par l'application Paiements de votre site.
    - label: Quelle est la différence entre un cours, une session et un programme ?
      content: Le cours est le contenu, en chapitres et en leçons. La session réunit des apprenants sur un ou plusieurs cours entre deux dates. Le programme enchaîne plusieurs cours dans un ordre fixé.
    - label: Comment se passent les cours en direct ?
      content: Depuis une session, vous créez un cours en direct Zoom. Les apprenants de la session voient la liste des cours en direct à suivre.

bottom_cta:

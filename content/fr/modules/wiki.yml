# Sources :
# - README de https://github.com/frappe/wiki (branche version-3, v3.4.0 du 8 octobre 2026) : espaces avec
#   règles d'accès, éditeur de texte enrichi stocké en Markdown, demandes de modification avec relecture,
#   lecteur avec arborescence, recherche, mode sombre et téléchargement PDF, retours des lecteurs,
#   statistiques, GitHub Sync, sitemap et llms.txt, compatibilité Frappe v15 et v16, application à /wiki-app,
#   licence MIT
# - DocTypes de la branche version-3 : Wiki Space, Wiki Document, Wiki Change Request, Wiki Revision
# - README et tools_knowledge.py de https://gitlab.com/dokos/dokos-ai : l'assistant cherche dans les
#   Wiki Document
#
# Captures à prendre (demo.dokos.cloud, 1440×900, thème clair, français) :
# - hero.webp : une page wiki publiée, arborescence de l'espace à gauche, table des matières à droite
# - fit.webp : la liste des espaces dans /wiki-app, avec leur visibilité
# - feature-edition.webp : l'éditeur d'une page, avec un tableau et un diagramme Mermaid
# - feature-espaces.webp : les réglages d'un espace (adresse, logo, rôles autorisés)
# - feature-approbation.webp : une demande de modification en relecture, ancienne et nouvelle version côte à côte
# - feature-statistiques.webp : la page de statistiques, vues par espace et pages les plus lues

navigation:
  title: Wiki
  icon: i-heroicons-book-open
  description: Documentation et procédures publiées depuis votre site, avec relecture avant publication.

title: Wiki
description: Publie votre documentation et vos procédures en pages web depuis votre site, avec une relecture de chaque modification avant publication et l'historique de chaque page.
icon: i-heroicons-book-open
application: Frappe Wiki
theme: support-collaboration
author: Frappe Technologies
logo:
  light: /frappe/wiki.png
  dark: /frappe/wiki.png

publisher: frappe
licence: MIT
version: v5
marketplace: wiki
related: [support, raven, dokos-ai, learning]

hero:
  title: Vos procédures et votre documentation, <span class="text-primary">publiées depuis votre site</span>.
  description: Vous écrivez une page dans l'éditeur, un relecteur approuve la modification, et la page est en ligne sans redéploiement. Le wiki garde l'historique de chaque page.

for_whom:
  items:
    - title: Vos procédures internes sont dispersées dans des fichiers
      description: Vous les écrivez en pages wiki, rangées par espace. Un espace peut rester privé, réservé à certains rôles de votre site.
      icon: i-heroicons-folder-open
    - title: Vous publiez une documentation produit pour vos clients
      description: Un espace public a sa propre adresse et son logo. Le lecteur cherche dans les pages, télécharge une page en PDF et indique si elle l'a aidé.
      icon: i-heroicons-globe-alt
    - title: Une modification doit être relue avant d'être en ligne
      description: Vos modifications s'accumulent dans une demande de modification. Un relecteur lit les différences et l'approuve, et la page publiée change à ce moment-là.
      icon: i-heroicons-check-circle

fit:
  description: >-
    Wiki s'installe sur votre site. Les rédacteurs travaillent dans l'application, à l'adresse
    /wiki-app, et les pages publiées sont des pages web de votre site. Les pages sont rangées dans des
    <strong>espaces</strong>, chacun avec son adresse, son logo et ses règles d'accès. Les
    contributeurs se connectent avec leur compte Dokos, et les rôles de votre site décident qui lit un
    espace privé.<br>
    Si <a href="/fr/modules/dokos-ai">Dokos AI</a> est installé, l'assistant cherche dans votre
    wiki interne pour répondre aux questions de vos utilisateurs.
  reads:
    - Les comptes utilisateurs et les rôles du site, pour l'accès, l'édition et la relecture
  adds:
    - L'application Wiki, à l'adresse /wiki-app de votre site
    - Les documents Wiki Space et Wiki Document
    - Les demandes de modification (Wiki Change Request) et les révisions de chaque page
    - Les pages publiées sous les adresses de vos espaces, avec un sitemap, une copie Markdown de chaque page et un index llms.txt
    - Les statistiques de lecture et les retours des lecteurs
  depends:
    - Dodock v5

features:
  - title: Écrivez dans un éditeur de texte enrichi
    description: Vous rédigez avec des titres, des tableaux, des listes de tâches, des blocs de code, des encadrés, des images, des diagrammes Mermaid, des PDF et des vidéos. Le contenu est enregistré en Markdown. Une image peut avoir une version pour le mode sombre.
    badge: Rédaction
  - title: Organisez les pages en espaces
    description: Un espace regroupe les pages d'un wiki, par exemple un guide produit ou un manuel interne. Il a sa propre adresse, son logo et ses règles d'accès. Il est public, ou réservé à certains rôles.
    badge: Espaces
  - title: Faites relire avant de publier
    description: Vos modifications s'accumulent dans une demande de modification. Le relecteur lit les différences, puis approuve, demande des changements ou refuse. Une fois fusionnée, la modification est en ligne. Les lecteurs peuvent aussi proposer une modification.
    badge: Relecture
  - title: Mesurez la lecture de vos pages
    description: Les statistiques montrent les pages vues, les nouveaux visiteurs, les pages les plus lues et les sites d'origine, pour tout le wiki, pour un espace ou pour une page. Chaque page reçoit les retours de ses lecteurs.
    badge: Statistiques
  - title: Synchronisez un espace avec un dépôt GitHub
    description: GitHub Sync tient un espace à jour à partir d'un dossier de fichiers Markdown d'un dépôt GitHub. Vous prévisualisez le dossier sur votre site de développement avant de pousser vos changements.
    badge: GitHub Sync

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Wiki sur votre site. La marketplace ne demande pas d'abonnement pour Wiki.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/wiki --branch version-3</code> puis <code>bench --site votre-site install-app wiki</code>. L'application s'ouvre à l'adresse /wiki-app du site."
    - title: Créez un premier espace
      description: Dans /wiki-app, créez un espace avec son adresse et sa visibilité, puis une première page. Après relecture de la demande de modification, la page est en ligne à l'adresse de l'espace.

faq:
  items:
    - label: Dans quel format les pages sont-elles écrites ?
      content: Vous écrivez dans un éditeur de texte enrichi, et le contenu est enregistré en Markdown. Chaque page publiée existe aussi en copie Markdown.
    - label: Une modification peut-elle être publiée sans relecture ?
      content: Chaque modification passe par une demande de modification. Un relecteur l'approuve, demande des changements ou la refuse, et la page publiée ne change qu'à la fusion.
    - label: Puis-je garder un espace privé ?
      content: Oui. Un espace est public, ou réservé à certains rôles de votre site. Les autres utilisateurs ne le voient pas.
    - label: Dokos AI lit-il le wiki ?
      content: Oui. L'assistant de Dokos AI cherche dans le wiki interne, les cours Learning et les notes publiques pour répondre aux questions de vos utilisateurs.
    - label: Puis-je reprendre une documentation existante ?
      content: Si elle est en fichiers Markdown dans un dépôt GitHub, GitHub Sync la reprend dans un espace. Pour un autre outil, décrivez-le-nous pour que nous estimions la reprise.

bottom_cta:
  title: Dites-nous ce que vous voulez documenter.
  description: Nous vous montrerons Wiki sur un site de démonstration, avec un espace et une page relue.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

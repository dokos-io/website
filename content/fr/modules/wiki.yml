# Sources :
# - README de https://github.com/frappe/wiki (branche master) : pages en Markdown, relecture et
#   approbation des modifications, pièces jointes, table des matières, historique des révisions,
#   scripts personnalisés, recherche RediSearch, licence MIT
# - https://docs.frappe.io/wiki : espaces wiki, groupes, révisions, approbation, barre latérale
#   réorganisable, guide de migration
# - README de https://gitlab.com/dokos/dokos-ai : l'assistant cherche dans le Wiki interne
#
# Captures à prendre (demo.dokos.cloud, 1440×900, thème clair, français) :
# - hero.webp : une page wiki publiée, barre latérale de l'espace à gauche, table des matières à droite
# - fit.webp : l'espace de travail Wiki dans le bureau, liste des Wiki Page avec leur espace
# - feature-edition.webp : l'éditeur d'une page, en Markdown, avec une pièce jointe
# - feature-espaces.webp : la barre latérale d'un espace en cours de réorganisation par glisser-déposer
# - feature-approbation.webp : une modification proposée en attente d'approbation
# - feature-revisions.webp : l'historique des révisions d'une page

navigation:
  title: Wiki
  icon: i-heroicons-book-open
  description: Documentation et procédures publiées depuis votre site, avec relecture avant publication.

title: Wiki
description: Publie votre documentation et vos procédures en pages web depuis votre site, avec un historique des révisions et une relecture des modifications avant publication.
icon: i-heroicons-book-open
application: Frappe Wiki
theme: support-collaboration
author: Frappe Technologies
logo:
  light: /frappe/wiki.png
  dark: /frappe/wiki.png

publisher: frappe
licence: MIT
version: v5
marketplace: wiki
related: [support, raven, dokos-ai, learning]

hero:
  title: Vos procédures et votre documentation, <span class="text-primary">publiées depuis votre site</span>.
  description: Vous écrivez une page en Markdown, elle est en ligne sans redéploiement. Chaque modification est conservée dans l'historique et peut passer par une approbation avant publication.
  image: /modules/wiki/hero.webp

for_whom:
  items:
    - title: Vos procédures internes sont dispersées dans des fichiers
      description: Vous les écrivez en pages wiki, rangées par espace, avec une barre latérale et une table des matières générée depuis les titres.
      icon: i-heroicons-folder-open
    - title: Vous publiez une documentation produit pour vos clients
      description: Une page wiki est une page web de votre site. Vous corrigez une phrase ou ajoutez une page sans interruption de service.
      icon: i-heroicons-globe-alt
    - title: Une modification doit être relue avant d'être en ligne
      description: Un contributeur propose une modification. Un relecteur l'approuve, et la page publiée change à ce moment-là.
      icon: i-heroicons-check-circle

fit:
  description: >-
    Wiki s'installe sur votre site et sert ses pages comme des pages web de ce site. Les pages
    sont rangées dans des <strong>espaces wiki</strong>, chacun avec sa barre latérale. Les
    contributeurs se connectent avec leur compte Dokos. L'historique des révisions garde chaque
    version d'une page.<br>
    Si <a href="/fr/modules/dokos-ai">Dokos AI</a> est installé, l'assistant cherche dans votre
    wiki interne pour répondre aux questions de vos utilisateurs.
  image: /modules/wiki/fit.webp
  reads:
    - Les comptes utilisateurs du site, pour l'édition et l'approbation
  adds:
    - Les documents Wiki Page, Wiki Space et Wiki Group
    - Les Wiki Settings, avec la prise en charge de scripts personnalisés
    - Les pages publiées sous les adresses de vos espaces
    - L'historique des révisions et les modifications en attente d'approbation
  depends:
    - Dodock v5

features:
  - title: Écrivez en Markdown, avec pièces jointes
    description: Vous rédigez la page en Markdown dans l'éditeur. Vous joignez des fichiers à la page. La table des matières se génère depuis les titres.
    image: /modules/wiki/feature-edition.webp
    badge: Rédaction
  - title: Organisez les pages en espaces
    description: Un espace wiki regroupe des pages sur un sujet et porte sa propre barre latérale. Vous réorganisez la barre latérale par glisser-déposer et vous groupez les pages.
    image: /modules/wiki/feature-espaces.webp
    badge: Espaces
  - title: Faites relire avant de publier
    description: Une modification proposée attend l'approbation d'un relecteur. La page publiée ne change qu'une fois la modification approuvée.
    image: /modules/wiki/feature-approbation.webp
    badge: Approbation
  - title: Retrouvez chaque version
    description: L'historique des révisions conserve chaque version d'une page. Vous consultez une version passée et vous voyez ce qui a changé.
    image: /modules/wiki/feature-revisions.webp
    badge: Révisions

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Wiki sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/wiki</code> puis <code>bench --site votre-site install-app wiki</code>."
    - title: Créez un premier espace
      description: Ouvrez le bureau, créez un Wiki Space avec son adresse, puis une première Wiki Page. La page est en ligne à l'adresse de l'espace.

faq:
  items:
    - label: Dans quel format les pages sont-elles écrites ?
      content: En Markdown. La table des matières est générée depuis les titres de la page.
    - label: Une modification peut-elle être publiée sans relecture ?
      content: Le wiki propose un mécanisme d'approbation. Une modification proposée attend qu'un relecteur l'approuve avant que la page publiée change.
    - label: Puis-je revenir à une version précédente ?
      content: Oui. L'historique des révisions conserve chaque version d'une page.
    - label: Dokos AI lit-il le wiki ?
      content: Oui. L'assistant de Dokos AI cherche dans le wiki interne, les cours Learning et les notes publiques pour répondre aux questions de vos utilisateurs.
    - label: Puis-je reprendre un wiki existant ?
      content: La documentation Frappe Wiki comporte un guide de migration. Décrivez-nous votre outil actuel pour que nous estimions la reprise.

bottom_cta:
  title: Dites-nous ce que vous voulez documenter.
  description: Nous vous montrerons Wiki sur un site de démonstration, avec un espace et une page relue.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

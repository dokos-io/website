hero:
  title: Vos <span class="text-primary">connecteurs</span>, webhooks et accès API, réunis dans un espace de travail.
  description: L'espace de travail Intégrations rassemble les paramètres des services reliés à votre site Dokos. Vous y créez aussi les webhooks qui préviennent vos autres outils quand un document change, et les clients OAuth qu'ils utilisent pour se connecter.
  image: /modules/integrations/hero.webp

for_whom:
  items:
    - title: Vous vendez aussi en dehors de Dokos
      description: Les commandes de votre boutique WooCommerce et les ventes de votre caisse Hiboutik arrivent dans Dokos par leur connecteur, dont les paramètres se trouvent ici.
      icon: i-heroicons-shopping-bag
    - title: Un outil externe doit réagir quand un document change
      description: Un webhook envoie les champs de votre choix à une URL dès qu'un document est créé, modifié, soumis ou annulé. Zapier s'appuie sur ce mécanisme.
      icon: i-heroicons-bolt
    - title: Vous écrivez un script qui lit ou écrit vos données
      description: Chaque utilisateur génère une clé API et un secret depuis son profil. Les appels respectent les mêmes permissions que l'interface.
      icon: i-heroicons-code-bracket
    - title: Vous pilotez Dokos depuis un assistant IA
      description: Claude Code, agy, Vibe CLI ou OpenCode se connectent à votre site par Dokos CLI et travaillent sur les mêmes données, avec les mêmes garde-fous.
      icon: i-heroicons-cpu-chip

fit:
  description: "Le module Intégrations fait partie du socle Dodock sur lequel Dokos repose. Il ne crée pas de document métier lui-même : il <strong>écoute</strong> les documents de tous les modules pour déclencher des webhooks, et il <strong>héberge</strong> les paramètres des applications de connexion que vous installez depuis la marketplace."
  reads:
    - Tout document de votre site, selon le DocType et l'événement choisis sur un webhook
    - Commande client, Article et Client, synchronisés par le connecteur WooCommerce
    - Vente Hiboutik, transformée en Facture de vente par le connecteur Hiboutik
    - Demande de paiement et Mode de paiement, utilisés par les passerelles de l'application Payments
    - Facture d'achat, créée par E-transactions à la réception d'une facture UBL ou CII
  adds:
    - L'espace de travail « Intégrations »
    - Les documents « Webhook » et le journal des requêtes envoyées
    - Les documents « Client OAuth » et « Clé de connexion sociale »
    - L'« Application connectée », pour l'accès aux API Google par OAuth
    - La section « Accès API » du profil utilisateur, avec la clé API et le secret API
    - Les paramètres de chaque connecteur installé (Paramètres Stripe, Paramètres WooCommerce, etc.)

features:
  - title: Prévenez vos autres outils avec un webhook
    description: "Vous choisissez un DocType et un événement : After insert, On change, On update, On submit, On update after submit, On cancel ou On trash. La table Webhook Data liste les champs envoyés. Dokos appelle l'URL cible à chaque événement et conserve la trace des requêtes dans Intégrations > Webhooks."
    badge: Webhook
  - title: Donnez un accès API à un utilisateur
    description: "Depuis son profil utilisateur, section « Accès API », l'utilisateur génère une clé API et un secret API. Les appels REST s'authentifient avec ce couple et obéissent aux rôles et permissions de cet utilisateur : un employé ne lit que ses propres données, un responsable RH celles de son équipe. Les clés se renouvellent depuis le même écran."
    badge: Clé API
  - title: Connectez Zapier par OAuth2
    description: Vous créez un Client OAuth avec l'URI de redirection fournie par Zapier ; Dokos génère l'ID client et le secret. Une Clé de connexion sociale avec le fournisseur Dodock complète l'authentification. Dans Zapier, le déclencheur « Document events » crée les webhooks pour vous, et les actions Create Document et Find Document créent ou recherchent des documents.
    badge: Client OAuth
  - title: Paramétrez vos connecteurs métier au même endroit
    description: "Chaque application de connexion installée depuis la marketplace ajoute son document de paramètres dans cet espace de travail : Payments pour les passerelles de paiement, Dokos WooCommerce pour votre boutique, Dokos Hiboutik pour votre caisse, E-transactions pour la plateforme agréée de facturation électronique et eSignature pour la signature électronique."
    badge: Connecteurs

install:
  description: Le module Intégrations fait partie de Dodock et de Dokos. Il n'y a pas d'application séparée à installer. Les connecteurs, eux, s'installent un par un.
  steps:
    - title: Sur Dokos Cloud
      description: L'espace de travail Intégrations est présent dès la création de votre site, dans toutes les formules. Les connecteurs (Payments, WooCommerce, Hiboutik, E-transactions, eSignature, Dokos AI) s'installent depuis la marketplace de votre tableau de bord Dokos Cloud.
    - title: En auto-hébergement
      description: "Installez Dokos : <code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>. Chaque connecteur a son propre dépôt, indiqué sur sa page produit."
    - title: Premier usage
      description: Créez un webhook sur un DocType de test et vérifiez la requête reçue. Pour un accès API, générez une clé depuis le profil d'un utilisateur dédié, avec le rôle minimal nécessaire.

faq:
  items:
    - label: Quelle différence entre un webhook et l'API ?
      content: "Le webhook part de Dokos : à chaque événement sur un document, Dokos appelle l'URL que vous avez indiquée avec les champs choisis. L'API part de votre outil : il appelle Dokos avec une clé API pour lire ou écrire des documents."
    - label: Un script avec une clé API peut-il tout lire ?
      content: Non. Chaque appel suit les rôles et permissions de l'utilisateur dont la clé est utilisée, comme dans l'interface web. Créez un utilisateur dédié avec le rôle minimal et renouvelez ses clés régulièrement.
    - label: Faut-il un développement pour connecter Zapier ?
      content: Non. Vous créez un Client OAuth et une Clé de connexion sociale dans Dokos, puis vous saisissez l'URL de votre site, l'ID client et le secret dans Zapier. L'application Zapier pour Dokos est en bêta, sur invitation.
    - label: Comment accéder aux API Google depuis Dokos ?
      content: Par une Application connectée configurée en OAuth, qui obtient un accès hors ligne durable aux API Google. La documentation Dodock décrit la configuration et le renouvellement des jetons.


# Sources : https://doc.dokos.io/v5/integrations (connecteurs : Payments, eSignature, WooCommerce,
# Hiboutik, Zapier, E-transactions, IA), https://doc.dokos.io/v5/integrations/zapier (Client OAuth,
# Clé de connexion sociale, Webhooks et leurs événements), https://doc.dokos.io/v5/dokos/hrms/securite-api
# (Clé API et Secret API sur le profil utilisateur, mêmes permissions que l'interface),
# https://doc.dokos.io/v5/dodock/integrations/connected-app-google-oauth (Application connectée Google),
# https://doc.dokos.io/v5/integrations/ia (assistants externes via Dokos CLI).
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : l'espace de travail Intégrations, avec ses raccourcis vers les paramètres des connecteurs (/app/integrations)
# - fit.webp : un Webhook sur le DocType Facture de vente, événement « On submit », table Webhook Data (/app/webhook)
# - feature-webhook.webp : la liste des webhooks et le journal des requêtes envoyées (/app/webhook)
# - feature-api.webp : le profil utilisateur, section « Accès API », bouton de génération des clés (/app/user, onglet Paramètres)
# - feature-oauth.webp : un Client OAuth avec ses URIs de redirection (/app/oauth-client)
# - feature-connecteurs.webp : les Paramètres Stripe ou les Paramètres WooCommerce (/app/stripe-settings)


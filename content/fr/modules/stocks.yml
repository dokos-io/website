# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : l'espace de travail Stocks (/app/stock), cartes et raccourcis
# - fit.webp : un reçu d'achat validé (/app/purchase-receipt) avec son écriture de stock et son écriture comptable liées
# - feature-articles.webp : une fiche article avec variantes (/app/item), onglet Stock, options Lot et Numéro de série
# - feature-entrepots.webp : l'arborescence des entrepôts (/app/warehouse/view/tree)
# - feature-mouvements.webp : une écriture de stock de type Transfert (/app/stock-entry), statut En transit
# - feature-projections.webp : le rapport Projections de stock (/app/query-report/Stock Projected Qty)
# - feature-valorisation.webp : le rapport Solde des stocks (/app/query-report/Stock Balance)


hero:
  title: Chaque mouvement d'article <span class="text-primary">laisse une écriture de stock</span>.
  description: Le module Stocks de Dokos enregistre les réceptions, les livraisons et les transferts entre vos entrepôts. Il vous dit ce qui est en stock, ce qui est réservé et ce qui est attendu.
  image: /modules/stocks/hero.webp

for_whom:
  items:
    - title: Vous comptez vos stocks dans un tableur
      description: Les reçus d'achat et les bons de livraison mettent le stock à jour. Le rapport Solde des stocks donne la quantité et la valeur par entrepôt.
      icon: i-heroicons-table-cells
    - title: Vous devez tracer un lot ou un numéro de série
      description: Chaque réception et chaque livraison d'un article suivi exigent son lot ou son numéro de série. Vous retrouvez l'historique depuis la fiche du lot.
      icon: i-heroicons-qr-code
    - title: Vous découvrez les ruptures trop tard
      description: Le rapport Projections de stock calcule la quantité projetée. Un point de commande crée la demande de matériel à votre place.
      icon: i-heroicons-exclamation-triangle
    - title: Vous avez plusieurs lieux de stockage
      description: Les entrepôts forment une arborescence, jusqu'au rayon ou à l'étagère. Un transfert passe par un statut En transit.
      icon: i-heroicons-building-office-2

fit:
  description: >-
    Les documents des autres modules déplacent le stock. Le reçu d'achat créé depuis Achats entre les
    articles. Le bon de livraison créé depuis Ventes les sort. L'ordre de fabrication de Production consomme
    et produit. Chaque mouvement écrit une entrée dans le grand livre des stocks et, en inventaire permanent,
    son écriture en Comptabilité.
  image: /modules/stocks/fit.webp
  reads:
    - Article, Groupe d'article et Unité de mesure
    - Commande client et Commande fournisseur
    - Ordre de fabrication (Production)
    - Compte de stock de l'entrepôt (Comptabilité)
  adds:
    - L'espace de travail Stocks et les Paramètres de stock
    - Entrepôt, Lot, Numéro de série et Variantes d'article
    - Reçu d'achat, Bon de livraison, Bordereau de colis et Écriture de stock
    - Demande de matériel, Réservation de stock et Inspection de la qualité
    - Les rapports Solde des stocks, Projections de stock et Vieillissement des stocks
  depends:
    - Achats
    - Ventes
    - Production
    - Qualité
    - Comptabilité

features:
  - title: Des articles suivis par variante, lot ou numéro de série
    description: >-
      Un article modèle porte des attributs (taille, couleur) et Dokos crée ses variantes. Vous cochez « A un
      N° de Lot » et chaque mouvement de l'article exige un lot, avec une date de péremption et la création
      automatique du lot à la réception. Vous cochez « A un numéro de série » et chaque unité a sa fiche, qui
      relie le document d'achat ou de fabrication d'origine, le client livré, la garantie et le statut. Seuls
      les numéros de série au statut Disponible peuvent être livrés.
    image: /modules/stocks/feature-articles.webp
    badge: Articles
  - title: Des entrepôts en arborescence
    description: >-
      Un entrepôt est un lieu de stockage. Vous emboîtez des groupes et des sous-entrepôts, par exemple
      Entrepôt > Pièce > Rangée > Étagère. Chaque entrepôt porte l'abréviation de sa société et un compte
      comptable par défaut, qui fait apparaître ses mouvements au grand livre. Après enregistrement, le
      rapport Solde des stocks donne la quantité et la valorisation de l'entrepôt, et un bouton recalcule les
      valeurs depuis les entrées du grand livre des stocks.
    image: /modules/stocks/feature-entrepots.webp
    badge: Entrepôts
  - title: Réceptions, livraisons et transferts
    description: >-
      Le reçu d'achat entre les articles commandés. Le bon de livraison les sort pour un client, avec un
      bordereau de colis si besoin. L'écriture de stock transfère des articles entre entrepôts, avec un statut
      En transit entre le départ et l'arrivée. Les retours de vente et d'achat reprennent le document
      d'origine. Une inspection de la qualité peut conditionner la réception et un échantillon peut être
      conservé dans un entrepôt dédié.
    image: /modules/stocks/feature-mouvements.webp
    badge: Mouvements
  - title: Une quantité projetée et un point de commande
    description: >-
      Le rapport Projections de stock calcule, pour chaque article et entrepôt, la quantité projetée à partir
      de la quantité réelle, planifiée en fabrication, commandée et demandée, moins les quantités réservées.
      Une réservation de stock met de côté une quantité pour une commande ou un besoin interne, et libère le
      stock à l'annulation. Sur l'article, vous fixez un stock minimum et un entrepôt ; quand le stock passe
      sous ce point de commande, Dokos crée une demande de matériel avec la quantité par défaut.
    image: /modules/stocks/feature-projections.webp
    badge: Réapprovisionnement
  - title: La valeur de votre stock et son âge
    description: >-
      Le rapport Solde des stocks donne la quantité et la valeur par article et par entrepôt. Le rapport de
      vieillissement montre depuis combien de temps chaque lot est en stock. En inventaire permanent, chaque
      mouvement passe son écriture comptable, et le stock livré mais non facturé apparaît dans un rapport
      dédié de la comptabilité. Un rapport d'analyse par nomenclature complète la série pour la production.
    image: /modules/stocks/feature-valorisation.webp
    badge: Valorisation

install:
  description: Le module Stocks fait partie de Dokos. Il n'y a rien à installer en plus.
  steps:
    - title: Sur Dokos Cloud
      description: Créez votre site depuis votre tableau de bord Dokos Cloud. Dokos est installé avec le module Stocks. Compris dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Premiers réglages
      description: Dans Paramètres de stock, vous choisissez l'entrepôt par défaut et les options de stock négatif, puis vous créez vos entrepôts et vos articles.

faq:
  items:
    - label: Puis-je changer le suivi par lot d'un article déjà utilisé ?
      content: >-
        Non. Dès qu'une transaction existe pour l'article, l'option de lot ou de numéro de série ne peut plus
        être activée ou désactivée.
    - label: Comment un numéro de série reçoit-il son entrepôt ?
      content: >-
        Par un mouvement de stock seulement : écriture de stock, reçu d'achat, bon de livraison ou facture.
        Un numéro créé à la main depuis la liste n'a pas d'entrepôt tant qu'il n'a pas bougé.
    - label: Une réservation bloque-t-elle le stock pour les autres commandes ?
      content: >-
        Oui. La quantité réservée est retirée de la quantité projetée dès la validation de la réservation.
        Vingt-cinq unités en stock, cinq réservées pour une commande et dix pour un projet laissent dix
        unités disponibles.
    - label: Les mouvements de stock écrivent-ils en comptabilité ?
      content: >-
        Oui en inventaire permanent, via le compte comptable de l'entrepôt. Le stock livré mais non facturé
        est comptabilisé et suivi dans un rapport dédié.


related: [ventes, stocks, paiements, reservations-de-ressources, builder]

hero:
  title: Votre boutique en ligne et votre portail client, <span class="text-primary">sur le catalogue de Dokos</span>.
  description: >-
    Webshop publie vos articles sur le site web de votre Dokos. Une commande passée en ligne devient une Commande client,
    et vos clients retrouvent leurs commandes et leurs factures sur leur portail.
  image: /modules/e-commerce/hero.webp

for_whom:
  items:
    - title: Vous ressaisissez les commandes de votre boutique dans votre gestion
      description: >-
        Les commandes du site sont enregistrées automatiquement dans Dokos, avec le client et les articles de votre catalogue.
      icon: i-heroicons-shopping-cart
    - title: Vos clients vous demandent leurs factures par e-mail
      description: >-
        Sur le portail, chaque client consulte l'état de ses commandes, ses factures et ses expéditions.
      icon: i-heroicons-document-text
    - title: Vous facturez des abonnements
      description: >-
        Les factures des abonnements sont générées automatiquement et payables en ligne. Le client gère son abonnement depuis le portail.
      icon: i-heroicons-arrow-path

fit:
  description: >-
    Webshop est la version Dokos de l'application Webshop de Frappe. Elle s'appuie sur les <strong>Articles</strong>,
    les groupes d'articles, les listes de prix et le stock du module Ventes. Vous cochez « Publier l'article » dans la fiche
    de l'article, et il apparaît dans la vitrine avec ses images, sa description et son prix.<br>
    Une commande passée sur le site crée une <strong>Commande client</strong>. La TVA vient des règles de taxation marquées
    « Utiliser pour le Panier », les frais de port des règles de livraison marquées « Afficher sur le site web ».
    Le paiement en ligne passe par les passerelles de l'application Payments.
  image: /modules/e-commerce/fit.webp
  reads:
    - Article, Groupe d'articles et Prix d'article
    - Client, Contact et Adresse
    - Commande client, Facture de vente et Bon de livraison
    - Règle de taxation et Règle de livraison
    - Passerelle de paiement
  adds:
    - Le document Paramètres e-commerce
    - Le document Article de site web
    - La vitrine, le panier et la page de finalisation de commande
    - Le portail client et ses Paramètres du portail
  depends:
    - Dokos (Ventes)
    - Payments pour le paiement en ligne

features:
  - title: Publiez votre catalogue
    description: >-
      Vous publiez un article depuis sa fiche, avec ses images, sa description et ses spécifications. Les groupes d'articles
      structurent la navigation de la boutique. Les variantes (taille, couleur) se déclinent à partir des attributs de l'article.
    image: /modules/e-commerce/feature-catalogue.webp
    badge: Catalogue
  - title: Encaissez les commandes du site
    description: >-
      Le client remplit son panier et finalise sa commande. Dokos enregistre la Commande client, applique la règle de taxation
      du panier et propose les modes de livraison publiés. Le client retrouve l'historique de ses commandes sur son portail.
    badge: Commandes
  - title: Proposez le paiement en ligne
    description: >-
      Vous activez la caisse dans les Paramètres e-commerce et définissez l'URL de réussite de paiement. Les passerelles
      PayPal, Stripe, HelloAsso, GoCardless et Stancer sont intégrées. Le client règle par carte bancaire, par prélèvement
      automatique ou par virement.
    badge: Paiement
  - title: Ouvrez un portail à vos clients
    description: >-
      Depuis la page de connexion, un client ou un fournisseur crée son compte et reçoit son mot de passe par e-mail.
      Il consulte l'état de ses commandes, de ses factures et de ses expéditions. Le statut se met à jour quand la facture
      et le paiement sont validés. Dans les Paramètres du portail, vous choisissez les documents visibles, leur route et le rôle autorisé.
    badge: Portail client
  - title: Adaptez le panier à vos conditions de vente
    description: >-
      Dans l'onglet Panier des Paramètres e-commerce, vous ajoutez des blocs web au panier ou à la page de finalisation,
      par exemple un lien vers vos CGV ou une case à cocher. Vous personnalisez aussi le formulaire d'adresse en ajoutant des champs
      ou en modifiant leurs libellés.
    image: /modules/e-commerce/feature-personnalisation.webp
    badge: Personnalisation

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: >-
        Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Webshop sur votre site.
        L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://gitlab.com/dokos/webshop</code> puis <code>bench --site votre-site install-app webshop</code>."
    - title: Publiez un premier article
      description: >-
        Ouvrez la fiche d'un article, cliquez sur « Publier l'article », puis réglez les Paramètres e-commerce
        (liste de prix, règle de taxation du panier, modes de livraison, caisse).
  prerequisites:
    - Un site Dokos V5
    - L'application Payments et un compte chez une passerelle pour le paiement en ligne

faq:
  items:
    - label: Les commandes du site vont-elles dans ma comptabilité ?
      content: >-
        Une commande en ligne crée une Commande client dans Dokos. Vous la facturez comme une commande saisie au bureau.
        Pour les abonnements, les factures sont générées automatiquement et payables en ligne.
    - label: Quels moyens de paiement puis-je proposer ?
      content: >-
        Les passerelles PayPal, Stripe, HelloAsso, GoCardless et Stancer sont intégrées. Le client règle par carte bancaire,
        par prélèvement automatique ou par virement, avec ou sans passerelle.
    - label: Mes clients peuvent-ils réserver une salle depuis la boutique ?
      content: >-
        La réservation de ressources depuis le site e-commerce est dépréciée en V5 et sera retirée dans une prochaine version.
        Pour un nouveau projet, utilisez le portail de l'application [Réservations de ressources](/fr/modules/reservations-de-ressources).
    - label: Puis-je vendre pour plusieurs sociétés sur le même site ?
      content: >-
        Oui, avec le mode multi-lieu des Paramètres du lieu (application Bookings). Chaque société autorisée a sa liste de prix
        et son panier. Le visiteur choisit la société en bas de la vitrine.
    - label: Comment ajouter des pages à mon site ?
      content: >-
        Les pages « À propos » et le formulaire de contact se règlent dans les paramètres du site web. Les demandes du formulaire
        de contact sont enregistrées comme Communication. Pour une page d'accueil, passez par Site web > Page Web ou par l'application Builder.


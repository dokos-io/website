# Sources : doc.dokos.io/v5/dokos/e-commerce (introduction, parametres, portal-settings, reservations-en-ligne) ;
# doc.dokos.io/v5/dokos/lieu/multi-societe ; README https://gitlab.com/dokos/webshop (branche v5, licence GPLv3) ;
# marketplace cloud.dokos.io, identifiant webshop.
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : la vitrine du site (/all-products) avec des articles publiés
# - fit.webp : un Article de site web dans le bureau (Site web > Article de site web) et son Article Dokos lié
# - feature-catalogue.webp : la fiche d'un Article de site web avec image, description et groupe d'articles
# - feature-commande.webp : le panier puis la page de finalisation de commande
# - feature-paiement.webp : Paramètres e-commerce, section Paiement, avec une passerelle activée
# - feature-portail.webp : le portail client, liste des commandes (/orders)
# - feature-personnalisation.webp : Paramètres e-commerce, onglet Panier, section Personnalisations


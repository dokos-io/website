# Sources : https://doc.dokos.io/v5/dokos/production (Nomenclature, Ordre de travail,
# Carte de travail, Station de travail, cycle de production complet « Dokompany »),
# https://doc.dokos.io/nouveautes (v5 : plan de production depuis une commande client,
# duplication de nomenclature, contrôles qualité par opération).
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : le Plan d'atelier, cartes de travail par station (/app/job-card/view/dashboard ou le Plan d'atelier)
# - fit.webp : un Ordre de travail soumis, avec ses entrées de stock liées dans le tableau de bord du document (/app/work-order)
# - feature-nomenclature.webp : une Nomenclature multiniveau, section « Coût de la nomenclature » (/app/bom)
# - feature-plan.webp : un Plan de production alimenté par des commandes client (/app/production-plan)
# - feature-ordre.webp : l'Ordre de travail, boutons « Transférer les matières » et « Terminer » (/app/work-order)
# - feature-carte.webp : une Carte de travail avec ses journaux de temps (/app/job-card)
# - feature-station.webp : une Station de travail, section des coûts horaires (/app/workstation)


hero:
  title: Vos <span class="text-primary">ordres de travail</span>, de la nomenclature au produit fini en stock.
  description: Vous décrivez la composition de vos produits dans une nomenclature, vous lancez des ordres de travail et vos opérateurs saisissent leurs temps sur des cartes de travail. Dokos réserve les composants, enregistre les transferts de matières et compare le coût réel au coût prévu.
  image: /modules/production/hero.webp

for_whom:
  items:
    - title: Vous fabriquez sur stock et vous relancez la production à partir d'un seuil
      description: Le plan de production regroupe vos prévisions et vos seuils de réapprovisionnement, puis crée les ordres de travail et les demandes d'achat des composants manquants.
      icon: i-heroicons-cube
    - title: Vous produisez à la commande
      description: Vous créez un plan de production directement depuis une commande client. Les ordres de travail héritent de l'entrepôt source défini dans le plan.
      icon: i-heroicons-clipboard-document-check
    - title: Vous assemblez des sous-ensembles sur plusieurs niveaux
      description: Une nomenclature peut contenir d'autres nomenclatures. L'outil de mise à jour propage la modification d'un sous-ensemble dans les nomenclatures parentes.
      icon: i-heroicons-squares-2x2
    - title: Vous voulez connaître le coût réel d'un lot
      description: Les temps saisis sur les cartes de travail, multipliés par les coûts horaires des stations, s'ajoutent au coût des matières consommées.
      icon: i-heroicons-calculator

fit:
  description: Le module Production fait partie de Dokos. Il lit vos articles et vos entrepôts, et il écrit des entrées de stock à chaque étape : <strong>Transfert de matières pour la production</strong> vers l'entrepôt de travaux en cours, puis <strong>Fabrication</strong> vers l'entrepôt des produits finis. Les composants manquants deviennent des demandes d'achat.
  image: /modules/production/fit.webp
  reads:
    - Article, Entrepôt et Unité de mesure
    - Commande client et Plan Industriel et Commercial (MPS), pour alimenter le plan de production
    - Demande d'achat et Reçu d'achat, pour les composants manquants
    - Entrée de stock, pour les transferts de matières et la fabrication
    - Inspection de la qualité, exigée sur une carte de travail quand l'article le demande
  adds:
    - Les documents « Nomenclature », « Routage », « Opération » et « Station de travail »
    - Les documents « Plan de production », « Ordre de travail », « Carte de travail » et « Arrêt de production »
    - Le « Plan d'atelier », l'écran des opérateurs
    - Le rapport « Résumé des ordres de travail » et le rapport d'analyse de stock par nomenclature
    - Les « Paramètres de production » (entrepôts par défaut, règles de planification)
  depends:
    - Stocks

features:
  - title: Décrivez vos produits dans une nomenclature
    description: Vous listez les composants achetés et les sous-ensembles fabriqués, avec leurs quantités. Si un routage est attaché, chaque composant est lié à l'opération qui le consomme. La section « Coût de la nomenclature » additionne le coût des composants et le coût des opérations. Une nomenclature soumise est verrouillée ; une nouvelle version reçoit un numéro incrémenté, et une seule nomenclature par article porte le statut Actif.
    image: /modules/production/feature-nomenclature.webp
    badge: Nomenclature
  - title: Planifiez les quantités à produire
    description: Le plan de production regroupe les commandes client, les prévisions du MPS et les seuils de réapprovisionnement. Vous le créez aussi directement depuis une commande client. Dokos en déduit les ordres de travail à lancer et les demandes d'achat des composants manquants.
    image: /modules/production/feature-plan.webp
    badge: Plan de production
  - title: Lancez un ordre de travail et suivez les matières
    description: À la soumission, Dokos réserve les matières premières dans leurs entrepôts sources. Le bouton de transfert crée une entrée de stock vers l'atelier ; les transferts partiels se cumulent. En fin de production, une entrée de type Fabrication déplace les produits finis vers l'entrepôt cible. Si vous arrêtez un ordre, les matières déjà transférées retournent au stock.
    image: /modules/production/feature-ordre.webp
    badge: Ordre de travail
  - title: Vos opérateurs saisissent leurs temps sur une carte de travail
    description: Chaque opération de la nomenclature génère une carte de travail, assignée à une station. L'opérateur ouvre le Plan d'atelier, enregistre son temps et valide sa quantité. Au clic sur « Terminer », il répartit le total entre quantité complétée, quantité en attente et perte de process. Chaque carte soumise met à jour l'avancement et le coût réel de l'ordre.
    image: /modules/production/feature-carte.webp
    badge: Carte de travail
  - title: Fixez les coûts horaires de vos stations
    description: Une station de travail porte quatre coûts horaires : main-d'œuvre, électricité, loyer et consommables. Un type de station (manuel ou machine) applique ces coûts à toutes ses stations. Un calendrier d'ouverture et une liste de jours fériés servent à vérifier la disponibilité lors de la planification. Le Plan d'atelier affiche chaque station comme disponible ou occupée.
    image: /modules/production/feature-station.webp
    badge: Station de travail

install:
  description: Le module Production fait partie de Dokos. Il n'y a pas d'application séparée à installer.
  steps:
    - title: Sur Dokos Cloud
      description: Le module est présent dès la création de votre site, dans toutes les formules. Ouvrez l'espace de travail Production depuis la page d'accueil.
    - title: En auto-hébergement
      description: "Installez Dokos : <code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Premier paramétrage
      description: Renseignez les entrepôts par défaut dans « Paramètres de production », créez vos stations de travail et vos opérations, puis vos premières nomenclatures.
  prerequisites:
    - Vos articles et vos entrepôts sont créés dans le module Stocks

faq:
  items:
    - label: Comment Dokos calcule-t-il le coût d'un ordre de travail ?
      content: La nomenclature donne le coût prévisionnel. Le coût réel additionne les matières consommées et les temps saisis sur les cartes de travail, multipliés par les coûts horaires de chaque station. L'ordre de travail affiche les deux valeurs.
    - label: Les quantités consommées sont-elles théoriques ou réelles ?
      content: Le champ « Consommer les composants basé sur » de la nomenclature choisit entre les quantités théoriques de la nomenclature et les quantités réellement transférées par les entrées de stock. S'il est vide, le réglage global des paramètres de production s'applique.
    - label: Puis-je contrôler la qualité en cours de fabrication ?
      content: Oui. Un contrôle qualité peut être défini au niveau de chaque opération d'une nomenclature. La carte de travail ne peut alors pas être soumise avant qu'une inspection de la qualité ait été passée.
    - label: Comment créer une variante d'un produit existant ?
      content: Dupliquez la nomenclature existante depuis son formulaire et ajustez les composants. Un produit fini peut aussi être marqué comme article fantôme dans le créateur de nomenclature.


# Sources : https://doc.dokos.io/v5/dokos/qualite (Procédure de qualité, Objectif de qualité,
# Revue de la qualité, Non-conformité, Action de qualité, Retour de la qualité),
# https://doc.dokos.io/v5/dokos/stocks/quality-inspection (Inspection de la qualité),
# https://doc.dokos.io/nouveautes (v5 : contrôles qualité par opération de nomenclature).
#
# Captures à prendre (demo.dokos.cloud) :
# - hero.webp : la vue hiérarchique des procédures de qualité (/app/quality-procedure/view/tree)
# - fit.webp : une Inspection de la qualité liée à un Reçu d'achat, lectures acceptées et rejetées (/app/quality-inspection)
# - feature-procedure.webp : une Procédure de qualité parente avec son tableau Processus et ses sous-procédures (/app/quality-procedure)
# - feature-objectif.webp : un Objectif de qualité avec sa fréquence de surveillance et son tableau Objectifs (/app/quality-goal)
# - feature-non-conformite.webp : une Non-conformité avec ses actions corrective et préventive (/app/non-conformance)
# - feature-retour.webp : un Retour de la qualité avec ses paramètres notés de 1 à 5 (/app/quality-feedback)
# - feature-inspection.webp : le Modèle d'inspection de la qualité d'un article (/app/quality-inspection-template)


hero:
  title: Vos <span class="text-primary">procédures qualité</span>, leurs objectifs et les écarts constatés, dans votre site Dokos.
  description: Vous décrivez vos procédures, vous fixez des objectifs mesurés à fréquence régulière et vous enregistrez les non-conformités. Chaque écart donne lieu à une action corrective ou préventive, suivie jusqu'à sa clôture.
  image: /modules/qualite/hero.webp

for_whom:
  items:
    - title: Vos procédures vivent dans des fichiers bureautiques
      description: Vous les saisissez dans Dokos sous forme d'étapes, avec des sous-procédures. La vue hiérarchique les affiche en arborescence et une même procédure peut dépendre de plusieurs parents.
      icon: i-heroicons-document-text
    - title: Vous suivez des indicateurs qualité à la main
      description: Un objectif de qualité porte une cible et une fréquence de surveillance. Dokos crée la revue correspondante à chaque échéance ; vous y saisissez la valeur réelle.
      icon: i-heroicons-chart-bar
    - title: Vous contrôlez des marchandises à la réception ou en atelier
      description: Une inspection de la qualité, avec ses lectures et ses critères d'acceptation, bloque la soumission du reçu d'achat ou de la carte de travail tant qu'elle n'a pas été faite.
      icon: i-heroicons-magnifying-glass
    - title: Vos clients vous font des retours sans suivi
      description: Vous enregistrez un retour de la qualité, noté paramètre par paramètre, et vous ouvrez une action de qualité quand la note n'atteint pas le niveau attendu.
      icon: i-heroicons-chat-bubble-left-ellipsis

fit:
  description: "Le module Qualité fait partie de Dokos. Ses documents se rattachent aux procédures que vous définissez. L'<strong>inspection de la qualité</strong>, rangée dans le module Stocks, se déclenche sur les documents de flux : un article paramétré pour le contrôle ne peut pas être reçu, livré ou fabriqué sans inspection."
  image: /modules/qualite/fit.webp
  reads:
    - Client et Utilisateur, comme source d'un retour de la qualité
    - Reçu d'achat, Bon de livraison, Saisie de stock et Carte de travail, pour les inspections
    - Article, qui porte le modèle d'inspection et l'activation du contrôle
  adds:
    - Les documents « Procédure de qualité » (avec sa vue hiérarchique) et « Objectif de qualité »
    - Les documents « Revue de la qualité », créés automatiquement selon la fréquence de l'objectif
    - Les documents « Non-conformité » et « Action de qualité »
    - Les documents « Retour de la qualité » et « Modèle de retours sur la qualité »
    - Le document « Réunion de qualité »
    - Les documents « Inspection de la qualité » et « Modèle d'inspection de la qualité »

features:
  - title: Décrivez vos procédures en arborescence
    description: Une procédure de qualité est une liste d'étapes saisies dans le tableau Processus, ou un groupe de sous-procédures liées par le champ « Sous-procédure ». La vue hiérarchique affiche l'ensemble en arbre. Contrairement à ERPNext, Dokos permet de rattacher une procédure à plusieurs parents, pour ne pas dupliquer une étape de contrôle partagée.
    badge: Procédure de qualité
  - title: Fixez des objectifs et laissez les revues se créer
    description: Un objectif de qualité nomme un responsable, la procédure à suivre et une fréquence de surveillance (quotidienne, hebdomadaire, mensuelle ou trimestrielle). Son tableau liste les objectifs, leur cible et leur unité de mesure. À chaque échéance, Dokos crée une revue de la qualité au statut Ouvert ; vous y saisissez les mesures réelles, puis vous créez une action de qualité si nécessaire.
    badge: Objectif et revue
  - title: Enregistrez les non-conformités et suivez les actions
    description: Toute personne de l'organisation peut déclarer une non-conformité par rapport à une procédure existante, avec son sujet et ses détails. Vous y décrivez l'action corrective, qui traite la cause, et l'action préventive, qui évite la récidive. Une action de qualité porte son type, le problème rencontré, la résolution proposée, un responsable et une date de fin ; son statut passe d'Ouverte à Fermée.
    badge: Non-conformité
  - title: Recueillez les retours de vos clients et de vos utilisateurs
    description: Vous choisissez la source du retour, client ou utilisateur du site, puis un modèle de retours qui remplit les paramètres à évaluer. Chaque ligne reçoit une note de 1 à 5 et un commentaire. Quand le retour est en dessous des attentes, vous ouvrez une action de qualité depuis ce retour.
    badge: Retour de la qualité
  - title: Inspectez les articles à la réception, à la livraison et en atelier
    description: "Un modèle d'inspection, attaché à l'article, définit les lectures à faire et leurs critères : une plage numérique, une valeur attendue ou une formule. À l'enregistrement, une lecture hors critère passe en Rejeté ; la case « Inspection manuelle » laisse l'inspecteur fixer le statut. Depuis Dokos V5, un contrôle peut être exigé à chaque opération d'une nomenclature."
    image: /modules/qualite/feature-inspection.webp
    badge: Inspection de la qualité

install:
  description: Le module Qualité fait partie de Dokos. Il n'y a pas d'application séparée à installer.
  steps:
    - title: Sur Dokos Cloud
      description: Le module est présent dès la création de votre site, dans toutes les formules. Ouvrez Accueil > Qualité.
    - title: En auto-hébergement
      description: "Installez Dokos : <code>bench get-app https://gitlab.com/dokos/dokos</code> puis <code>bench --site votre-site install-app erpnext</code>."
    - title: Premier paramétrage
      description: Saisissez vos procédures de qualité, puis vos objectifs. Pour les inspections, créez un modèle d'inspection et activez le contrôle sur les articles concernés.

faq:
  items:
    - label: Une non-conformité peut-elle être déclarée sans procédure ?
      content: Non. La non-conformité se rattache à la procédure de qualité qui n'a pas été suivie. Créez la procédure d'abord.
    - label: Qui peut déclarer une non-conformité ?
      content: Toute personne de l'organisation disposant d'un accès au module. Le document enregistre le sujet, la procédure concernée et les détails de l'observation.
    - label: Où se trouve l'inspection de la qualité ?
      content: Dans le module Stocks, car elle se déclenche sur le reçu d'achat, le bon de livraison, la saisie de stock et la carte de travail. Le modèle d'inspection se rattache à l'article.
    - label: Les revues de la qualité sont-elles créées automatiquement ?
      content: Oui, dès qu'une fréquence de surveillance est définie sur l'objectif de qualité. La revue est créée au statut Ouvert ; le responsable qualité la complète et la termine.


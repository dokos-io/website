# Sources :
# - README de https://github.com/The-Commit-Company/raven (redirige vers github.com/frappe/raven,
#   branche develop) : canaux, fils, fichiers, recherche, notifications, applications mobiles,
#   cartes de documents, notifications de documents, approbation depuis le chat, bots, webhooks
#   et agents IA, compatibilité Frappe v15.111+ et v16, licence AGPLv3
# - https://doc.dokos.io/v5/integrations/ia/assistant et /configuration : pont Raven de Dokos AI
#
# Captures à prendre (demo.dokos.cloud/raven, 1440×900, thème clair, français) :
# - hero.webp : un canal d'équipe avec des messages, des réactions et une photo partagée
# - fit.webp : un message contenant le lien d'une Commande client, affiché en carte avec son
#   statut et ses champs clés
# - feature-fils.webp : un fil ouvert à côté du canal
# - feature-fichiers.webp : le tiroir des fichiers d'un canal et un résultat de recherche
# - feature-documents.webp : une notification de document postée dans un canal à la validation
#   d'une Facture de vente, avec les boutons d'approbation
# - feature-mobile.webp : les réglages de notification d'un canal (heures calmes, rappel)

navigation:
  title: Raven
  icon: i-heroicons-chat-bubble-left-right
  description: Messagerie d'équipe installée sur votre site, avec vos documents Dokos dans la conversation.

title: Raven
description: Une messagerie d'équipe installée sur votre site Dokos, avec des canaux, des fils et vos documents affichés en carte dans la conversation.
icon: i-heroicons-chat-bubble-left-right
application: Raven
theme: support-collaboration
author: The Commit Company
logo:
  light: /frappe/raven.webp
  dark: /frappe/raven.webp

publisher: community
licence: AGPLv3
version: v5
marketplace: raven
related: [support, wiki, dokos-ai, ressources-humaines, projets]

hero:
  title: Une messagerie d'équipe <span class="text-primary">dans votre site Dokos</span>.
  description: Raven s'installe sur votre site. Vos messages restent dans votre base de données, et un lien vers un devis ou une commande s'affiche en carte avec son statut.
  image: /modules/raven/hero.webp

for_whom:
  items:
    - title: Votre équipe discute dans un outil de chat séparé de votre gestion
      description: Vous collez un lien vers une commande et Raven affiche sa carte, avec son statut et ses champs clés. La discussion se tient à côté du document.
      icon: i-heroicons-link
    - title: Une validation attend dans une boîte mail
      description: Le document à approuver est posté dans un canal à sa création ou à sa validation. Vous l'approuvez, le refusez ou le renvoyez depuis la conversation.
      icon: i-heroicons-check-badge
    - title: Vos équipes de terrain n'ont qu'un téléphone
      description: Les applications iOS et Android se connectent à votre site. Chaque canal y est, synchronisé avec la version web.
      icon: i-heroicons-device-phone-mobile
    - title: Vous payez un abonnement par utilisateur pour votre chat
      description: Raven est compris dans votre site Dokos. Personne ne vous facture par utilisateur.
      icon: i-heroicons-users

fit:
  description: >-
    Raven tourne sur votre site, à côté de Dokos, de Dokos HR, du CRM et du Helpdesk. Vous
    collez le lien d'un document et Raven affiche <strong>une carte avec son statut et ses champs
    clés</strong>. Une notification de document poste un message dans un canal à la création, à la
    modification ou à la validation d'un document, selon les conditions et le modèle de message que
    vous réglez sans écrire de code. Vous approuvez, refusez ou renvoyez un document sans quitter la
    conversation. Les congés saisis dans Dokos HR s'affichent à côté du nom de la personne.<br>
    Si <a href="/fr/modules/dokos-ai">Dokos AI</a> est installé, vous dialoguez avec l'assistant
    par message direct à un bot, sans quitter Raven. Ce pont s'active dans les Paramètres de l'IA.
  image: /modules/raven/fit.webp
  reads:
    - Tout document du site, affiché en carte depuis son lien
    - Les événements de document (création, modification, validation) pour les notifications
    - Les demandes de congé de Dokos HR
  adds:
    - L'application Raven, à l'adresse /raven de votre site
    - Les espaces de travail, canaux publics ou privés et messages directs
    - Les bots, les webhooks entrants et les agents IA de Raven
    - Les applications mobiles iOS et Android, et une application web installable
  depends:
    - Dodock v5 (Frappe v16)

features:
  - title: Organisez les échanges en canaux et en fils
    description: Vous créez des canaux publics ou privés par équipe, par projet ou par sujet, regroupés en espaces de travail. Les messages directs servent au reste. Une discussion annexe part dans un fil pour ne pas couvrir le canal.
    image: /modules/raven/feature-fils.webp
    badge: Canaux
  - title: Partagez des fichiers et retrouvez-les
    description: Vous déposez des photos, des vidéos et des documents. Un lien affiche un aperçu. Chaque fichier partagé est listé par canal, et la recherche couvre les messages, les fichiers, les liens et les personnes de tous vos canaux.
    image: /modules/raven/feature-fichiers.webp
    badge: Fichiers
  - title: Faites circuler vos documents Dokos dans la conversation
    description: Un lien vers un document devient une carte avec son statut. Une notification de document poste automatiquement un message quand un document est créé, modifié ou validé, avec les conditions que vous fixez. Vous approuvez ou refusez le document depuis le message.
    image: /modules/raven/feature-documents.webp
    badge: Documents
  - title: Recevez les notifications sur le web et sur votre téléphone
    description: Les notifications push ont des heures calmes et des réglages par canal. Un rappel ramène un message plus tard. Un message programmé part à l'heure choisie.
    image: /modules/raven/feature-mobile.webp
    badge: Mobile

install:
  steps:
    - title: Depuis la marketplace Dokos Cloud
      description: Dans votre tableau de bord Dokos Cloud, ouvrez la marketplace et installez Raven sur votre site. L'application est comprise dans toutes les formules.
    - title: En auto-hébergement
      description: "<code>bench get-app https://github.com/frappe/raven</code> puis <code>bench --site votre-site install-app raven</code>. Raven s'ouvre à l'adresse /raven du site."
    - title: Sur les téléphones
      description: Installez Raven depuis l'App Store ou Google Play, saisissez l'adresse de votre site et connectez-vous. Les applications demandent Raven 3.1 ou plus récent.

faq:
  items:
    - label: Où sont stockés les messages ?
      content: Dans la base de données de votre site Dokos, avec le reste de vos données. Rien n'est envoyé à un service de messagerie tiers.
    - label: Puis-je approuver un document depuis Raven ?
      content: Oui. Vous approuvez, refusez ou renvoyez un document depuis le message qui l'annonce, sans ouvrir Dokos.
    - label: Les notifications de documents demandent-elles du code ?
      content: Non. Vous choisissez le type de document, l'événement (création, modification, validation), des conditions et le modèle du message, puis le canal de destination.
    - label: Raven inclut-il des agents IA ?
      content: Oui. Raven propose des bots qui postent et répondent, des webhooks entrants qui écrivent dans un canal, et des agents reliés à votre propre fournisseur OpenAI ou compatible. L'assistant de Dokos AI est joignable par message direct une fois le pont Raven activé.
    - label: Faut-il un abonnement par utilisateur ?
      content: Non. Raven est une application de votre site. Elle est comprise dans toutes les formules Dokos Cloud et s'installe librement en auto-hébergement, sous licence AGPLv3.

bottom_cta:
  title: Montrez une commande client à votre équipe depuis un canal.
  description: Décrivez-nous comment votre équipe échange aujourd'hui, nous vous montrerons Raven sur un site de démonstration.
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Voir la marketplace
      to: https://cloud.dokos.io/marketplace
      target: _blank
      size: xl
      color: neutral
      variant: outline

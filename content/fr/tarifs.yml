title: Tarifs
description: Exploitation sous contrat avec délais écrits, packs d'heures d'accompagnement, et hébergement en libre-service sans support. Prix hors taxes de nos conditions générales.
navigation:
  title: Tarifs
  icon: i-heroicons-credit-card

hero:
  headline:
    label: Tarifs publics, hors taxes
    icon: i-heroicons-document-text
  title: Tarifs
  # source: hostingconditions.md, §6.1 (tarifs au 01/09/2024, fondés sur le CPU, la base de données et le stockage)
  description: Les prix ci-dessous sont ceux de nos conditions générales d'hébergement, en vigueur depuis le 1er septembre 2024. Chaque formule fixe un temps de calcul (CPU) mensuel, une taille de base de données et un espace de stockage. Le nombre de comptes utilisateurs n'entre pas dans le prix.

lanes:
  title: ""
  items:
    - id: exploitation
      name: Exploitation sous contrat
      tagline: Nous exploitons votre installation, avec des délais écrits.
      highlight: true
      caution: >-
        À partir de 499 €, les garanties de niveau de service s'appliquent : délais de
        prise en charge et de rétablissement contractuels, du lundi au vendredi de 8h à 20h.
        En dessous, le support répond aux questions d'usage sans engagement de délai.
        Ces quatre formules sont hébergées sur des serveurs mutualisés : l'activité des autres
        sites du serveur peut influer sur les performances du vôtre.
      columns:
        - Formule
        - CPU / mois
        - Base de données
        - Stockage
        - Engagement
      rows:
        - ["99 € HT / mois", "2 h", "2 Go", "10 Go", "Support simple"]
        - ["199 € HT / mois", "3 h", "2 Go", "15 Go", "Support simple"]
        - ["499 € HT / mois", "4 h", "3 Go", "25 Go", "Garanties de niveau 1"]
        - ["999 € HT / mois", "6 h", "4 Go", "50 Go", "Garanties de niveau 2"]
      footnote: >-
        Hébergement dédié à partir de 1 199 € HT par mois (2 vCPU, 8 Go de RAM, 100 Go
        de stockage), jusqu'à 9 999 € HT pour 16 vCPU, 128 Go et 1 To. Vous disposez de
        deux serveurs dédiés, un pour l'application et un pour la base de données, et
        vous créez autant de benchs et de sites que vous le souhaitez. Les formules
        dédiées comprennent toutes le support technique standard et les garanties de
        niveau 2.
      cta:
        label: Voir les garanties en détail
        to: /fr/exploitation
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

    - id: accompagnement
      name: Accompagnement
      tagline: Des heures d'expertise, à consommer quand vous en avez besoin.
      caution: >-
        Analyse de besoin, paramétrage, reprise de données, formation, développement
        spécifique. Les packs sont valables sans limite de durée et peuvent être
        complétés à tout moment.
      columns:
        - Pack
        - Entreprises
        - Associations
        - Pour qui
      rows:
        - ["5 heures", "600 € HT", "480 € HT", "Interventions ciblées, utilisateurs déjà autonomes"]
        - ["20 heures", "2 200 € HT", "1 760 € HT", "Prise en main structurée d'un premier module"]
        - ["50 heures", "5 000 € HT", "4 000 € HT", "Plusieurs modules, entreprise en croissance"]
        - ["100 heures", "9 000 € HT", "7 200 € HT", "Déploiement complet et personnalisations"]
      cta:
        label: Nous écrire
        to: /fr/contact
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

    - id: decouverte
      name: Libre-service, sans support
      tagline: Vous démarrez seul, sur une instance mutualisée.
      caution: >-
        Ces deux formules ne comprennent ni support ni délai de rétablissement.
        Elles conviennent à un essai, à une maquette ou à un usage non critique. Si
        votre activité dépend du site, choisissez une formule avec support.
      columns:
        - Formule
        - CPU / mois
        - Base de données
        - Stockage
        - Support
      rows:
        - ["19 € HT / mois", "0,5 h", "0,5 Go", "1 Go", "Aucun"]
        - ["49 € HT / mois", "1 h", "1 Go", "5 Go", "Aucun"]
      cta:
        label: Créer un site
        to: https://cloud.dokos.io
        target: _blank
        color: neutral
        variant: outline
        icon: i-material-symbols-host-outline-rounded

scope:
  title: L'ingénierie se chiffre au projet
  description: Architecture, migration, développement métier et ingénierie IA ne se vendent pas au forfait horaire. Ces missions sont chiffrées après un cadrage court.
  items:
    - title: Architecture de plateforme
      description: Dimensionnement, découpage en applications, stratégie de montée de version et d'intégration au système d'information existant.
      icon: i-heroicons-squares-2x2
    - title: Migration
      description: Reprise de données depuis un logiciel existant ou depuis une installation Frappe ou ERPNext, avec plan de bascule et de repli.
      icon: i-heroicons-arrow-path
    - title: Développement métier
      description: Applications spécifiques, automatisations, connecteurs. Livrés sous licence libre, dans vos dépôts.
      icon: i-heroicons-wrench-screwdriver
    - title: Ingénierie IA
      description: Compétences Dokos AI et agents connectés par le serveur MCP, sur vos processus, avec confirmation avant toute écriture.
      icon: i-heroicons-cpu-chip
  links:
    - label: Voir les missions d'ingénierie
      to: /fr/ingenierie
      color: primary
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

faq:
  title: Questions sur la facturation
  items:
    - label: Pourquoi facturer au CPU plutôt qu'à l'utilisateur ?
      # source: hostingconditions.md, §6.1 (bascule sur le forfait supérieur)
      content: Le coût d'une instance dépend de ce qu'elle calcule et de ce qu'elle stocke. Vous pouvez donc ouvrir l'outil à toute votre équipe sans changer de formule. Si votre consommation de CPU, de base de données ou de stockage dépasse celle de votre formule, vous passez à la formule supérieure qui correspond à votre consommation.
    - label: Les applications de la marketplace sont-elles payantes ?
      # source: marketplace cloud.dokos.io, 30 applications publiées sur 33 fiches, toutes de type d'abonnement « Free » (relevé du 4 novembre 2026) ; hostingconditions.md §6.1
      content: >-
        Non. Les applications publiées sur la marketplace de Dokos Cloud n'ont pas d'abonnement à part : vous les
        installez sur votre site depuis votre tableau de bord. Le prix de votre formule ne dépend pas des applications
        installées, mais des ressources qu'elles consomment. Une application qui calcule ou stocke beaucoup peut vous
        faire passer à la formule supérieure. Le module Certification Caisse fait exception : il demande une licence à
        Dokos SAS, qui porte les clés de signature de chaque société et l'accès au journal de signature externe.
    - label: Les tarifs peuvent-ils augmenter en cours de contrat ?
      content: Une révision est possible en cas d'évolution significative des conditions économiques ou réglementaires. Elle suppose un préavis écrit de soixante jours, et vous pouvez alors résilier sans pénalité en le notifiant dans les trente jours. Sans réponse de votre part, les nouveaux prix s'appliquent à la date indiquée.
    - label: Quel est le préavis de résiliation ?
      # source: hostingconditions.md, §5
      content: Trente jours avant la fin de la période mensuelle en cours, par courrier recommandé avec accusé de réception ou par email à help@dokos.io. La résiliation prend effet à la fin du mois suivant la réception du préavis. Aucun remboursement partiel n'est effectué sur une période déjà facturée. Le contrat est mensuel et se renouvelle chaque mois ; le premier mois est facturé au prorata des jours restants.
    - label: Peut-on être accompagné en auto-hébergement ?
      content: Oui. Les packs d'accompagnement sont ouverts à tous les utilisateurs, y compris ceux qui hébergent Dokos eux-mêmes. L'exploitation sous contrat, en revanche, suppose que nous ayons la main sur l'infrastructure ou un accès équivalent. C'est ce qui rend les délais tenables.
    - label: Les tarifs affichés sont-ils à jour ?
      content: Ils reprennent la grille en vigueur au 1er septembre 2024, telle qu'elle figure dans nos conditions générales d'hébergement, qui restent le document contractuel de référence. En cas d'écart entre cette page et les conditions générales, ces dernières font foi.


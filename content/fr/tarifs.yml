title: Tarifs
description: "Le prix de Dokos ne dépend pas du nombre d'utilisateurs. Hébergement suivi par notre équipe dès 99 € HT par mois, en autonomie dès 19 €, et 14 jours d'essai gratuit."
navigation:
  title: Tarifs
  icon: i-heroicons-credit-card

hero:
  headline:
    label: Tarifs publics, hors taxes
    icon: i-heroicons-document-text
  title: Tarifs
  # L'argument fort d'abord. L'essai vaut pour tout hébergement chez nous, sans support : le support
  # commence avec l'abonnement payant (dit sur la carte du guide et dans la FAQ, pas ici).
  description: "Le prix ne dépend pas du nombre d'utilisateurs : ouvrez Dokos à toute votre équipe. Tout hébergement chez nous s'essaie gratuitement pendant 14 jours."
  # source: hostingconditions.md, §6.1 (tarifs au 01/09/2024, fondés sur le CPU, la base de données et le stockage)
  # Affichée en note, sous le guide.
  note: Les prix ci-dessous sont ceux de nos conditions générales d'hébergement, en vigueur depuis le 1er septembre 2024. Chaque formule fixe un temps de calcul (CPU) mensuel, une taille de base de données et un espace de stockage.

# Le guide, avant les tableaux : ce qui se choisit (l'hébergement) et ce qui s'ajoute (l'aide).
# Seul le suivi par notre équipe est mis en avant ; les options autonomes disent ce qu'elles demandent.
guide:
  hosting_label: Héberger Dokos
  hosting_hint: Un choix parmi trois.
  hosting:
    - name: Suivi par notre équipe
      text: Nous hébergeons Dokos et répondons à vos questions d'usage. À partir de 499 € par mois, un engagement de niveau de service (SLA) s'applique.
      from: À partir de
      price: 99 € HT / mois
      trial: 14 jours d'essai gratuit, support dès l'abonnement
      to: "#exploitation"
      highlight: true
    - name: En autonomie, hébergé chez nous
      text: Nous assurons l'hébergement, vous gérez le paramétrage et l'usage, sans support. Le forum communautaire, où notre équipe intervient, reste ouvert. Adapté aux petites structures à l'aise avec le paramétrage d'un logiciel.
      from: À partir de
      price: 19 € HT / mois
      trial: 14 jours d'essai gratuit
      to: "#decouverte"
    - name: Chez vous
      text: Le code est libre et gratuit. L'installation et la maintenance d'un logiciel de gestion demandent des compétences de développement en interne.
      price: 0 €
      to: https://gitlab.com/dokos
      link_label: Le code sur GitLab
  help_label: Se faire aider
  help_hint: En plus, quel que soit votre choix.
  help:
    - name: Des heures d'accompagnement
      text: "Paramétrage, reprise de données, formation : des heures utilisables à votre rythme, sur douze mois."
      from: À partir de
      price: 600 € HT les 5 heures
      to: "#accompagnement"
    - name: Un projet spécifique ou un grand groupe
      text: Nous chiffrons après un cadrage court.
      price: Sur devis
      to: /fr/contact
      link_label: Nous écrire
  link_label: Voir le détail

lanes:
  title: ""
  items:
    # kicker : le terme précis, au-dessus du nom en français courant (le même que dans le guide).
    - id: exploitation
      kicker: Exploitation sous contrat
      name: Suivi par notre équipe
      tagline: Nous hébergeons et suivons votre installation.
      highlight: true
      caution: >-
        À partir de 499 €, un engagement de niveau de service (SLA) s'applique : délais de
        prise en charge et de rétablissement inscrits au contrat, du lundi au vendredi de 8h
        à 20h. En dessous, le support répond aux questions d'usage du lundi au vendredi de 9h
        à 18h, sans engagement de délai.
        Ces quatre formules sont hébergées sur des serveurs mutualisés, partagés avec d'autres
        sites. Pour des performances qui ne dépendent que de vous, l'hébergement dédié commence
        à 1 199 € HT par mois.
      # Conseil affiché au-dessus du tableau : c'est le service voulu qui fait monter de niveau, pas le calcul.
      advice: "Choisissez la formule d'entrée qui correspond au service attendu : 99 € pour le support, 499 € pour un engagement de niveau de service (SLA). La puissance de base suffit à la plupart des équipes. En cas de dépassement, vous passez à la formule supérieure."
      columns:
        - Formule
        - Pour qui
        - CPU / mois
        - Base de données
        - Stockage
      rows:
        - ["99 € HT / mois", "Formule d'entrée avec support, suffisante pour la plupart des équipes.", "2 h", "2 Go", "10 Go"]
        - ["199 € HT / mois", "Pour un usage plus soutenu.", "3 h", "2 Go", "15 Go"]
        - ["499 € HT / mois", "Formule d'entrée avec SLA (niveau 1).", "4 h", "3 Go", "25 Go"]
        - ["999 € HT / mois", "SLA de niveau 2 et ressources étendues.", "6 h", "4 Go", "50 Go"]
      footnote: >-
        Hébergement dédié à partir de 1 199 € HT par mois (2 vCPU, 8 Go de RAM, 100 Go
        de stockage), jusqu'à 9 999 € HT pour 16 vCPU, 128 Go et 1 To. Vous disposez de
        deux serveurs dédiés, un pour l'application et un pour la base de données, et
        vous créez autant de benchs et de sites que vous le souhaitez. Les formules
        dédiées comprennent toutes le support technique standard et le SLA de niveau 2.
      cta:
        label: Voir le SLA en détail
        to: /fr/exploitation
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

    - id: accompagnement
      kicker: Packs d'accompagnement
      name: Des heures d'accompagnement
      tagline: Des heures d'expertise, valables douze mois.
      caution: >-
        Analyse de besoin, paramétrage, reprise de données, formation, développement
        spécifique. Les heures sont valables douze mois, utilisables par fractions, et
        chaque pack peut être complété à tout moment.
      columns:
        - Pack
        - Entreprises
        - Associations
        - Pour qui
      rows:
        - ["5 heures", "600 € HT", "480 € HT", "Interventions ciblées, utilisateurs déjà autonomes"]
        - ["20 heures", "2 200 € HT", "1 760 € HT", "Prise en main structurée d'un premier module"]
        - ["50 heures", "5 000 € HT", "4 000 € HT", "Plusieurs modules, entreprise en croissance"]
        - ["100 heures", "9 000 € HT", "7 200 € HT", "Déploiement complet et personnalisations"]
      cta:
        label: Nous écrire
        to: /fr/contact
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

    - id: decouverte
      kicker: Libre-service, sans support
      name: En autonomie, hébergé chez nous
      tagline: Nous hébergeons, vous gérez le reste.
      caution: >-
        Ces deux formules ne comprennent ni support ni délai de rétablissement. Elles
        conviennent aux petites structures autonomes et aux usages non critiques, comme
        un environnement de préproduction ou de test. Si votre activité dépend du site,
        choisissez une formule avec support.
      columns:
        - Formule
        - Pour qui
        - CPU / mois
        - Base de données
        - Stockage
      rows:
        - ["19 € HT / mois", "Formule d'entrée, suffisante dans la plupart des cas.", "0,5 h", "0,5 Go", "1 Go"]
        - ["49 € HT / mois", "Pour un usage plus soutenu.", "1 h", "1 Go", "5 Go"]
      cta:
        label: Créer un site
        to: https://cloud.dokos.io
        target: _blank
        color: neutral
        variant: outline
        icon: i-material-symbols-host-outline-rounded

scope:
  title: L'ingénierie se chiffre au projet
  description: Architecture, migration, développement métier et ingénierie IA ne se vendent pas au forfait horaire. Ces missions sont chiffrées après un cadrage court.
  items:
    - title: Architecture de plateforme
      description: Dimensionnement, découpage en applications, stratégie de montée de version et d'intégration au système d'information existant.
      icon: i-heroicons-squares-2x2
    - title: Migration
      description: Reprise de données depuis un logiciel existant ou depuis une installation Frappe ou ERPNext, avec plan de bascule et de repli.
      icon: i-heroicons-arrow-path
    - title: Développement métier
      description: Applications spécifiques, automatisations, connecteurs. Livrés sous licence libre, dans vos dépôts.
      icon: i-heroicons-wrench-screwdriver
    - title: Ingénierie IA
      description: Des assistants IA et des agents connectés par MCP, adaptés à vos processus, avec des rôles IA qui fixent ce que chacun peut faire.
      icon: i-heroicons-cpu-chip
  links:
    - label: Voir les missions d'ingénierie
      to: /fr/ingenierie
      color: primary
      icon: i-heroicons-arrow-right-20-solid
      trailing: true

faq:
  title: Questions sur la facturation
  items:
    # L'essai : sans support (le support commence avec l'abonnement). La fin d'essai est à confirmer.
    - label: Que comprend l'essai gratuit ?
      content: "Pendant 14 jours, vous essayez gratuitement l'hébergement chez nous, sur la formule de votre choix. L'essai ne comprend pas de support : il commence avec l'abonnement. Le forum communautaire, où notre équipe est présente, reste ouvert pendant l'essai. À la fin de l'essai, vous choisissez une formule pour continuer."
    - label: Pourquoi facturer au CPU plutôt qu'à l'utilisateur ?
      # source: hostingconditions.md, §6.1 (bascule sur le forfait supérieur)
      content: Le coût d'une instance dépend de ce qu'elle calcule et de ce qu'elle stocke. Vous pouvez donc ouvrir l'outil à toute votre équipe sans changer de formule. Si votre consommation de CPU, de base de données ou de stockage dépasse celle de votre formule, vous passez à la formule supérieure qui correspond à votre consommation.
    - label: Les applications de la marketplace sont-elles payantes ?
      # source: marketplace cloud.dokos.io, 30 applications publiées sur 33 fiches, toutes de type d'abonnement « Free » (relevé du 4 novembre 2026) ; hostingconditions.md §6.1
      content: >-
        Non. Les applications publiées sur la marketplace de Dokos Cloud n'ont pas d'abonnement à part : vous les
        installez sur votre site depuis votre tableau de bord. Le prix de votre formule ne dépend pas des applications
        installées, mais des ressources qu'elles consomment. Une application qui calcule ou stocke beaucoup peut vous
        faire passer à la formule supérieure. Le module Certification Caisse fait exception : il demande une licence à
        Dokos SAS, qui porte les clés de signature de chaque société et l'accès au journal de signature externe.
    - label: Les tarifs peuvent-ils augmenter en cours de contrat ?
      content: Une révision est possible en cas d'évolution significative des conditions économiques ou réglementaires. Elle suppose un préavis écrit de soixante jours, et vous pouvez alors résilier sans pénalité en le notifiant dans les trente jours. Sans réponse de votre part, les nouveaux prix s'appliquent à la date indiquée.
    - label: Quel est le préavis de résiliation ?
      # source: hostingconditions.md, §5
      content: Trente jours avant la fin de la période mensuelle en cours, par courrier recommandé avec accusé de réception ou par email à help@dokos.io. La résiliation prend effet à la fin du mois suivant la réception du préavis. Aucun remboursement partiel n'est effectué sur une période déjà facturée. Le contrat est mensuel et se renouvelle chaque mois ; le premier mois est facturé au prorata des jours restants.
    - label: Peut-on être accompagné en auto-hébergement ?
      content: Oui. Les packs d'accompagnement sont ouverts à tous les utilisateurs, y compris ceux qui hébergent Dokos eux-mêmes. Le suivi par notre équipe, en revanche, suppose que nous ayons la main sur l'infrastructure ou un accès équivalent. C'est ce qui rend les délais tenables.
    - label: Les tarifs affichés sont-ils à jour ?
      content: Ils reprennent la grille en vigueur au 1er septembre 2024, telle qu'elle figure dans nos conditions générales d'hébergement, qui restent le document contractuel de référence. En cas d'écart entre cette page et les conditions générales, ces dernières font foi.

# Pour un nouveau venu autant que pour un client : un conseil honnête, même vers une formule plus petite.
cta:
  title: Besoin d'un conseil
  description: "Décrivez-nous votre activité : nous vous orientons vers la formule adaptée, y compris si elle est plus modeste que prévu."
  links:
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: primary
    - label: Conditions générales d'hébergement
      to: /fr/hostingconditions
      size: xl
      color: neutral
      variant: outline

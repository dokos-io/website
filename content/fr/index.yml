title: Dokos — éditeur français d'ERP open source, et l'opérateur qui le fait tourner
description: Nous publions Dodock et Dokos sous licence GPLv3, et nous exploitons sous contrat les ERP open source de nos clients — Dokos, ERPNext et les applications Frappe.
navigation: false

announcement:
  label: Rejoignez-nous à Toulouse, au Faire Festival, les 28, 29 et 30 mai 2026.
  cta: En savoir plus
  to: /faire-festival-2026

hero:
  headline:
    label: Éditeur et opérateur, sous licence GPLv3
    icon: i-simple-icons-gitlab
  title: Éditeur français d'ERP open source.<br>Et l'<span class="text-primary">opérateur</span> qui le fait tourner.
  description: Nous écrivons Dodock et Dokos, nous les publions en clair, et nous exploitons sous contrat ce que nos clients font tourner — y compris ERPNext standard et les applications de l'écosystème Frappe. Hébergement européen, délais de rétablissement opposables, réversibilité totale.
  image: hero_dokos.svg
  links:
    - label: Parler à un ingénieur
      to: /fr/contact
      size: xl
      color: primary
      icon: i-heroicons-chat-bubble-left-right
      trailing: false
    - label: Créer un site
      to: https://cloud.dokos.io
      size: xl
      color: neutral
      variant: outline
      icon: i-material-symbols-host-outline-rounded
      target: _blank

proof:
  items:
    - label: Prise en charge, anomalie bloquante
      value: 3 h
      note: Délai contractuel, garanties de niveau 2
    - label: Hébergement des données
      value: France · Allemagne
      note: Aucun hyperscaler américain
    - label: Licence du socle
      value: GPLv3
      note: Auditable, reprenable, sans frais d'usage

sections:
  - title: Éditeur, pas intégrateur
    description: <strong>Nous maintenons notre propre fork du framework Frappe et de la distribution ERP construite dessus.</strong><br><br>Quand une anomalie est dans le socle, nous la corrigeons dans le socle — sans ouvrir un ticket en amont et attendre. Les dépôts, les tickets et l'historique des commits sont publics : vous pouvez juger notre rythme de correction avant de nous confier quoi que ce soit.
    image: /image/dokos-gitlab.png
    align: right
    features:
      - name: Dodock et Dokos
        description: Le framework applicatif et la distribution ERP, publiés sous GPLv3 sur notre GitLab.
        icon: i-heroicons-code-bracket-square
      - name: Conformité française portée
        description: Comptabilité, encaissement, facturation électronique — intégrés au produit, pas empilés en surcouche.
        icon: i-octicon-law
      - name: Aucun frais de licence
        description: Nous vendons de l'exploitation et de l'ingénierie, jamais le droit d'utiliser le logiciel.
        icon: i-heroicons-credit-card
    links:
      - label: Découvrir l'éditeur
        to: /fr/editeur
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

  - title: Exploité sous contrat
    description: <strong>Trois heures pour prendre en charge une anomalie bloquante, six pour rétablir le service.</strong><br><br>Ce ne sont pas des objectifs internes : ce sont les délais inscrits à l'annexe de nos conditions générales d'hébergement, opposables dès la signature. Nous exploitons Dokos, mais aussi ERPNext standard et les applications Frappe — sans exiger de migration.
    image: /image/nuage-dashboard-dark.png
    align: left
    features:
      - name: Délais opposables
        description: Prise en charge et rétablissement chiffrés par niveau de gravité, plage garantie 8h–20h.
        icon: i-heroicons-clock
      - name: Traçabilité complète
        description: Accès journalisés, actions tracées, Plan d'Assurance Sécurité annexé au contrat.
        icon: i-material-symbols-data-loss-prevention-outline
      - name: Sans migration imposée
        description: Déjà sous Frappe ou ERPNext ? Nous reprenons l'exploitation de l'existant.
        icon: i-simple-icons-frappe
    links:
      - label: Voir les garanties
        to: /fr/exploitation
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

  - title: Souverain et réversible
    description: <strong>Vos données restent en Europe, et votre logiciel reste le vôtre.</strong><br><br>Bases de données et sauvegardes hébergées en France et en Allemagne, chez OVHcloud et Hetzner. Aucun hyperscaler américain dans la chaîne. Et parce que tout est publié sous GPLv3, la réversibilité n'est pas une clause que nous concédons : c'est une propriété de ce que nous vendons.
    image: /image/compte-de-resultat.png
    align: right
    features:
      - name: Juridiction européenne
        description: Sous-traitants nommés, établis dans l'Union européenne, notifiés avant tout changement.
        icon: i-circle-flags-european-union
      - name: Export à tout moment
        description: Sauvegarde complète dans un format structuré, depuis votre propre administration.
        icon: i-material-symbols-cloud-sync-outline-rounded
      - name: Aucun composant fermé
        description: Rien ne rend votre installation inexploitable ailleurs, ni par un autre prestataire.
        icon: i-heroicons-lock-open
    links:
      - label: Souveraineté et sécurité
        to: /fr/souverainete
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

  - title: Ingénieurs embarqués
    description: <strong>Les personnes qui conçoivent le produit sont celles qui interviennent chez vous.</strong><br><br>Architecture de plateforme, migration, développement métier, ingénierie IA, formation. Nous travaillons au contact de vos équipes plutôt qu'en délégation, à deux dès le départ, et tout est livré en clair — code sous licence libre, documentation et procédures comprises.
    image: /image/dokos-communaute.png
    align: left
    features:
      - name: Jamais une seule personne
        description: Les missions sont staffées à deux dès le début. Un projet qui tient à une personne est un risque.
        icon: i-heroicons-user-group
      - name: Autonomie visée
        description: Le transfert de compétences fait partie de la mission. C'est réussi quand vous nous appelez moins.
        icon: i-heroicons-academic-cap
      - name: Livré en clair
        description: Code libre déposé dans vos dépôts, documentation et procédures de déploiement incluses.
        icon: i-heroicons-document-text
    links:
      - label: Nos interventions
        to: /fr/ingenierie
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true


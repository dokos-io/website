title: "Dokos, le logiciel de gestion open source pour toute l'entreprise"
description: "Ventes, comptabilité, stocks, RH, projets, support : une seule base de données, une suite d'applications libres, et un accès pour vos équipes comme pour vos agents IA."
navigation: false

announcement:
  label: Le module Certification Caisse de Dokos est certifié par le LNE.
  cta: Voir les certifications
  to: /fr/certifications

hero:
  headline:
    label: Version 5, sur Frappe et ERPNext v16
    icon: i-simple-icons-gitlab
  title: Dokos. Toute votre entreprise<br>dans un seul <span class="text-primary">logiciel libre</span>.
  description: "Ventes, comptabilité, stocks, RH, projets, support : une seule base de données, une suite d'applications qui s'y branchent, et un accès pour vos équipes comme pour vos agents IA."
  image: hero_dokos.webp
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
      trailing: false
    - label: Découvrir l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline
      icon: i-heroicons-squares-2x2

# Product facts, verifiable on /fr/certifications and in the journal.
proof:
  items:
    - label: Systèmes de caisse
      value: Certifié LNE
      note: Avec le module Certification Caisse et une licence délivrée par Dokos SAS.
    - label: Facturation électronique
      value: Réception et PA
      note: Lecture des factures CII, Factur-X et UBL, raccordement à une plateforme agréée. Émission en cours.
    - label: Agents IA
      value: Dokos AI · MCP
      note: Un assistant intégré à vos données, et un serveur MCP pour vos propres agents.

# The company behind the project, in one sentence.
pillars:
  title: Éditeur open source, experts Frappe et ERPNext,<br>nous bâtissons et garantissons vos applications métier.
  description: Dokos SAS, à Nancy, est l'équipe qui écrit, adapte et exploite Dokos.
  items:
    - title: Éditeur open source
      description: Nous maintenons Dodock, Dokos et une douzaine d'applications, publiés sous licence GPLv3 sur notre GitLab.
      icon: i-heroicons-code-bracket-square
      to: /fr/editeur
    - title: Experts Frappe et ERPNext
      description: Nous lisons et portons chaque version de Frappe et d'ERPNext, et nous exploitons aussi des installations standard.
      icon: i-simple-icons-frappe
      to: /fr/exploitation/frappe-erpnext
    - title: Nous bâtissons et garantissons vos applications métier
      description: Nos ingénieurs construisent vos applications sur cette base, puis les exploitent sous contrat, avec des délais écrits.
      icon: i-heroicons-wrench-screwdriver
      to: /fr/ingenierie

sections:
  - title: Une seule base de données pour toute l'entreprise
    description: <strong>Un devis accepté devient une commande, une facture, une écriture comptable et un paiement, sans ressaisie.</strong><br><br>Chaque document est lié à ceux qui le précèdent et à ceux qui le suivent. Une recherche retrouve un client, ses commandes, ses tickets et ses paiements. Les droits sont définis une fois, par rôle, et s'appliquent partout.
    image: /image/compte-de-resultat.png
    align: right
    features:
      - name: Tout est lié
        description: Du prospect à l'écriture comptable, chaque document garde la trace de son origine.
        icon: i-heroicons-link
      - name: Une seule saisie
        description: Un article, un client ou un tarif n'existe qu'une fois et sert à tous les modules.
        icon: i-heroicons-pencil-square
      - name: Des droits par rôle
        description: Les permissions s'appliquent aux écrans, aux rapports, à l'API et aux agents.
        icon: i-heroicons-shield-check
    links:
      - label: Voir l'écosystème
        to: /fr/modules
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

  - title: Une suite d'applications qui se branchent dessus
    description: >-
      <strong>Les modules d'ERPNext, les applications de Frappe et celles que nous éditons partagent la même base.</strong><br><br>CRM, support, décisionnel, site web, documents, messagerie d'équipe : chaque application s'installe en un clic depuis la marketplace de Dokos Cloud et lit les mêmes clients, articles et factures que les autres.
    image: /image/dokos-communaute.webp
    align: left
    features:
      - name: Modules ERPNext
        description: Ventes, achats, stocks, comptabilité, production, projets, qualité, ressources humaines.
        icon: i-heroicons-rectangle-group
      - name: Applications Frappe
        description: CRM, Helpdesk, Insights, Builder, Drive, Wiki, Print Designer, Learning, Newsletter.
        icon: i-simple-icons-frappe
      - name: Applications Dokos
        description: Banking, Bookings, eTransactions, OCR, Construction, Hiboutik, WooCommerce, Tribu, Dokos AI.
        icon: i-heroicons-puzzle-piece
    links:
      - label: Toutes les applications
        to: /fr/modules
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

  - title: Le harnais de vos équipes et de vos agents IA
    description: <strong>Une personne ou un agent agit sur les mêmes données, avec les mêmes droits.</strong><br><br>Dokos AI répond à partir de vos documents et demande confirmation avant d'écrire. Le serveur MCP de Dokos CLI connecte Claude Code et d'autres agents à votre site. Chaque action, humaine ou non, apparaît dans l'historique du document.
    image: /image/nuage-dashboard-dark.png
    align: right
    features:
      - name: Dokos AI
        description: Un assistant qui lit vos devis, factures, tickets et stocks, et attend votre accord avant toute écriture.
        icon: i-heroicons-sparkles
      - name: Dokos CLI et serveur MCP
        description: Les mêmes lectures et écritures depuis un terminal ou depuis l'agent de votre choix.
        icon: i-heroicons-command-line
      - name: API REST
        description: Chaque document, chaque rapport et chaque droit sont accessibles par l'API, pour vos propres outils.
        icon: i-heroicons-code-bracket
    links:
      - label: IA & agents
        to: /fr/ecosysteme/intelligence-artificielle
        color: primary
        icon: i-heroicons-arrow-right-20-solid
        trailing: true


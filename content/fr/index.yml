title: "Dokos, le logiciel de gestion open source pour toute l'entreprise"
description: "Ventes, comptabilité, stocks, RH, projets, support : une seule base de données, une suite d'applications libres, et un accès pour vos équipes comme pour vos agents IA."
navigation: false

announcement:
  label: Le système d'encaissement des particuliers de Dokos est certifié par le LNE.
  cta: Voir les certifications
  to: /fr/certifications

hero:
  headline:
    label: Version 5, sur Frappe et ERPNext v16
    icon: i-simple-icons-gitlab
  title: Dokos. Toute votre entreprise<br>dans un seul <span class="text-primary">logiciel libre</span>.
  # Three lines, one per layer of the stack on the right (components/home/HomeStack.vue).
  points:
    - layer: core
      title: Une seule base de données
      description: Ventes, achats, stocks, comptabilité, production, projets et RH.
    - layer: apps
      title: Des applications qui s'y branchent
      description: CRM, support, rapports, messagerie, site web… Vous installez celles qu'il vous faut.
    - layer: access
      title: Vos équipes et vos agents IA
      description: Dans le navigateur ou par MCP, avec les mêmes droits et le même historique.
  # The ecosystem drawn as a stack. Agents are never named by product: MCP only.
  stack:
    teams:
      title: Vos équipes
      note: dans le navigateur et sur mobile
      to: /fr/modules/dokos
    agents:
      title: Vos agents IA
      note: Accès MCP, avec l'agent de votre choix
      to: /fr/ecosysteme/intelligence-artificielle
    cli:
      title: Dokos CLI
      note: MCP local
      to: /fr/modules/dokos-cli
    label: Le cerveau de l'entreprise
    shared: mêmes droits · même historique
    apps_label: Applications
    apps_note: chacune s'installe seule ou avec les autres
    apps:
      - { title: Frappe CRM, domain: sales, to: /fr/modules/crm, publisher: frappe, note: "Prospection et suivi des affaires, du premier contact au devis Dokos." }
      - { title: Helpdesk, domain: collab, to: /fr/modules/support, publisher: frappe, note: "Tickets de support, délais de réponse et base de connaissances." }
      - { title: Insights, domain: finance, to: /fr/modules/insights, publisher: frappe, note: "Requêtes, graphiques et tableaux de bord sur vos données." }
      - { title: Raven, domain: collab, to: /fr/modules/raven, publisher: frappe, note: "Messagerie d'équipe, avec vos documents Dokos dans la conversation." }
      - { title: Builder, domain: web, to: /fr/modules/builder, publisher: frappe, note: "Création de pages web sans code, sur votre site Dokos." }
      - { title: Suite, domain: collab, to: /fr/modules/suite, publisher: frappe }
      - { title: Wiki, domain: collab, to: /fr/modules/wiki, publisher: frappe, note: "Documentation et procédures, avec relecture avant publication." }
      - { title: Learning, domain: people, to: /fr/modules/learning, publisher: frappe, note: "Cours en ligne, sessions, quiz et certificats." }
      - { title: Webshop, domain: web, to: /fr/modules/e-commerce, publisher: dokos, note: "Boutique en ligne et portail client, sur le catalogue de Dokos." }
      - { title: Bank, domain: finance, to: /fr/modules/bank, publisher: dokos, note: "Synchronisation des comptes bancaires avec Dokos." }
      - { title: eTransactions, domain: finance, to: /fr/modules/etransactions, publisher: dokos, note: "Facturation électronique et lecture des factures fournisseur." }
      - { title: Paiements, domain: finance, to: /fr/modules/paiements, publisher: dokos, note: "Carte, prélèvement SEPA, PayPal et terminal SumUp." }
      - { title: Telephony, domain: sales, to: /fr/modules/telephony, publisher: frappe, note: "Appels Exotel et Twilio depuis Helpdesk et le CRM." }
      - { title: Newsletter, domain: web, to: /fr/modules/newsletter, publisher: frappe, note: "Envoi groupé d'e-mails à vos groupes de contacts." }
      - { title: Tribu, domain: people, to: /fr/modules/tribu, publisher: dokos, note: "Adhérents, cotisations et dons, avec paiement en ligne." }
      - { title: Dokos AI, domain: ai, to: /fr/modules/dokos-ai, publisher: dokos, note: "Un assistant qui lit vos données et prépare des écritures que vous validez." }
    core:
      title: Dokos
      note: Ventes · Achats · Stocks · Comptabilité · Production · Projets · RH
      tags: [Encaissement certifié LNE, Facturation électronique]
      to: /fr/modules/dokos
    base:
      title: Dodock · Frappe Framework · ERPNext
      note: une base open source développée avec une communauté mondiale
      # source: licences sur gitlab.com/dokos/dodock (MIT) et github.com/frappe/erpnext (GPLv3)
      tag: MIT · GPLv3
      to: /fr/modules/dodock
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
      trailing: false
      class: dk-btn
    - label: Découvrir l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline
      icon: i-heroicons-squares-2x2
      class: dk-btn-outline

# Below the hero, the page goes down the stack one layer at a time.
# Layer 1: who works in Dokos. The invoice and its history are example data.
access:
  label: Équipes et agents IA
  title: "Une personne ou un agent : les mêmes règles."
  rules:
    - title: Les droits d'un utilisateur
      description: Un agent se connecte avec un compte et des rôles. Il ne voit que ce que ce compte voit.
    - title: Une confirmation avant d'écrire
      description: Dokos AI présente chaque création ou modification et attend votre accord.
    - title: Chaque action dans l'historique
      description: Une écriture d'agent apparaît dans la chronologie du document, avec son auteur et son heure.
  link:
    label: IA & agents
    to: /fr/ecosysteme/intelligence-artificielle
  assistants:
    title: Avec l'assistant que vous utilisez déjà
    description: Dokos AI ouvre un serveur MCP protégé par OAuth. Vous le branchez dans votre assistant, qui agit ensuite avec votre compte et vos droits.
    note: Les connecteurs MCP dépendent de l'offre de chaque assistant.
    items:
      - { name: Claude, logo: /ai/claude.svg }
      - { name: ChatGPT, logo: /ai/chatgpt.svg }
      - { name: Gemini, logo: /ai/gemini.svg }
      - { name: Le Chat de Mistral, logo: /ai/mistral.svg }
      - { name: Grok, logo: /ai/grok.svg }
      - { name: Microsoft Copilot, logo: /ai/copilot.svg }
      - { name: Perplexity, logo: /ai/perplexity.svg }
  example:
    title: Facture FA-2026-0412
    status: Validée
    fields:
      - { label: Client, value: Exemple SARL }
      - { label: Format, value: Factur-X }
      - { label: Total TTC, value: "4 860,00 €" }
    history:
      - { kind: person, who: Comptabilité, what: a créé la facture, time: "09:12" }
      - { kind: ai, who: Dokos AI, what: a ajouté 3 lignes du devis, time: "09:14" }
      - { kind: mcp, who: Agent via MCP, what: a contrôlé le Factur-X, time: "09:20" }
      - { kind: person, who: Comptabilité, what: a validé la facture, time: "09:21" }
    ask: J'ajoute ces trois lignes à la facture ?
    confirm: Confirmer
    cancel: Annuler

# Layer 2: the apps. The cards come from hero.stack.apps (one list for both).
apps:
  label: Applications
  title: Installez celles qu'il vous faut.
  description: Chaque application lit les mêmes clients, articles et factures que les autres. Elles s'installent depuis la marketplace de Dokos Cloud.
  all: Toutes
  domains:
    sales: Vente
    finance: Finance
    people: Équipe
    collab: Collaboration
    web: Web
    ai: IA
  publishers:
    frappe: Frappe
    dokos: Dokos
  link:
    label: Voir tout l'écosystème
    to: /fr/modules

# Layer 3: Dokos itself. The document numbers are example data.
core:
  label: Dokos
  title: Un devis accepté devient une facture, une écriture et un paiement, sans ressaisie.
  description: "Chaque document est lié à celui qui le précède. Les droits sont définis une fois, par rôle, et s'appliquent partout : écrans, rapports, API et agents."
  chain:
    - { title: Devis, number: DEV-0388 }
    - { title: Commande, number: CMD-0291 }
    - { title: Livraison, number: BL-0277 }
    - { title: Facture, number: FA-0412 }
    - { title: Écriture, number: ECR-5530 }
    - { title: Paiement, number: PAY-0198 }
  # Product facts, verifiable on /fr/certifications.
  facts:
    - label: Encaissement des particuliers
      value: Certifié LNE
      status: Disponible
      state: ok
      note: Référentiel de certification des systèmes de caisse du LNE. Avec le module Certification Caisse et une licence délivrée par Dokos SAS.
      link: { label: Les certifications, to: /fr/certifications }
    - label: Facturation électronique
      value: Émission et réception
      status: Disponible
      state: ok
      note: Factures CII, Factur-X et UBL, par la plateforme agréée de votre choix.
      link: { label: eTransactions, to: /fr/modules/etransactions }

# Layer 4: the open source base, and the tools Dokos connects to.
base:
  label: La base open source
  title: Construit sur Frappe et ERPNext, avec leur communauté.
  description: Dodock et Dokos suivent chaque version de Frappe et d'ERPNext, et y ajoutent ce qu'il faut en France. Dokos 5, publiée le 16 mars 2026, repose sur la version 16 de Frappe et d'ERPNext. Tout le code est publié sur notre GitLab, sous GPLv3, AGPLv3 ou MIT selon le dépôt.
  link:
    label: Lire le code
    to: https://gitlab.com/dokos
  layers:
    - { title: Dokos, note: "gestion, localisation française, LNE", to: /fr/modules/dokos }
    - { title: ERPNext, note: les modules de gestion }
    - { title: Dodock, note: "le framework, version Dokos de Frappe", to: /fr/modules/dodock }
    - { title: Licences libres, note: "GPLv3, AGPLv3 ou MIT, code publié" }

# The company behind the project, with the positioning sentence verbatim.
team:
  label: L'équipe derrière Dokos · Nancy
  title: Éditeur open source, experts Frappe et ERPNext, nous bâtissons et garantissons vos applications métier.
  description: Dokos SAS est l'équipe qui écrit, adapte et exploite Dokos.
  items:
    - title: Éditeur open source
      description: Dodock, Dokos et quatorze applications, publiés sous licence libre sur gitlab.com/dokos.
      to: /fr/editeur
    - title: Experts Frappe et ERPNext
      description: Nous portons chaque version et exploitons aussi des installations standard.
      to: /fr/exploitation/frappe-erpnext
    - title: Vos applications métier
      description: Construites sur cette base, puis exploitées sous contrat, avec des délais écrits.
      to: /fr/ingenierie

integrations:
  title: Connecté à vos autres outils
  icons:
    - i-logos-woocommerce-icon

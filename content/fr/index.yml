    - title: Achats, stocks & production
      description: Achats, stocks, production, qualité.
      icon: i-heroicons-cube
      to: /fr/ecosysteme/achats-stocks-production
    - title: Projets & ressources humaines
      description: Projets, ressources humaines, formation.
      icon: i-heroicons-user-group
      to: /fr/ecosysteme/projets-ressources-humaines
    - title: Support & collaboration
      description: Helpdesk, Raven, Wiki, téléphonie.
      icon: i-heroicons-chat-bubble-left-right

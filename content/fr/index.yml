      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
      trailing: false
      class: dk-btn
    - label: Découvrir l'écosystème
      to: /fr/modules
      size: xl
      color: neutral
      variant: outline
      icon: i-heroicons-squares-2x2
      class: dk-btn-outline

# The AI assistant at the user's side. The invoice and its history are example data.
access:
  label: Dokos AI
  title: Un assistant à vos côtés, sous vos règles.
  rules:
    - title: Les droits d'un utilisateur
      description: Un agent se connecte avec un compte et des rôles. Il ne voit que ce que ce compte voit.
    - title: Une confirmation avant d'écrire
      description: Dokos AI présente chaque création ou modification et attend votre accord.
    - title: Chaque action dans l'historique
      description: Une écriture d'agent apparaît dans la chronologie du document, avec son auteur et son heure.
  link:
    label: IA & agents
    to: /fr/ecosysteme/intelligence-artificielle
  assistants:
    title: Avec l'assistant que vous utilisez déjà
    description: Dokos AI ouvre un serveur MCP protégé par OAuth. Vous le branchez dans votre assistant, qui agit ensuite avec votre compte et vos droits.
    note: Les connecteurs MCP dépendent de l'offre de chaque assistant.
    items:
      - { name: Claude, logo: /ai/claude.svg }
      - { name: ChatGPT, logo: /ai/chatgpt.svg }
      - { name: Gemini, logo: /ai/gemini.svg }
      - { name: Le Chat de Mistral, logo: /ai/mistral.svg }
      - { name: Grok, logo: /ai/grok.svg }
      - { name: Microsoft Copilot, logo: /ai/copilot.svg }
      - { name: Perplexity, logo: /ai/perplexity.svg }
  example:
    title: Facture FA-2026-0412
    status: Validée
    fields:
      - { label: Client, value: Exemple SARL }
      - { label: Format, value: Factur-X }
      - { label: Total TTC, value: "4 860,00 €" }
    history:
      - { kind: person, who: Comptabilité, what: a créé la facture, time: "09:12" }
      - { kind: ai, who: Dokos AI, what: a ajouté 3 lignes du devis, time: "09:14" }
      - { kind: mcp, who: Agent via MCP, what: a contrôlé le Factur-X, time: "09:20" }
      - { kind: person, who: Comptabilité, what: a validé la facture, time: "09:21" }
    ask: J'ajoute ces trois lignes à la facture ?
    confirm: Confirmer
    cancel: Annuler

# How Dokos adapts to a company: three levels. Studio is in Dodock develop only
# (doc.dokos.io/next/dodock/personnalisation/studio), so it is marked « Bientôt ».
extend:
  label: Sur mesure
  title: Dokos s'adapte à votre entreprise.
  description: Ce qui vous est propre s'ajoute à la même base. Vos applications héritent des documents, des droits, de l'historique, de l'API et de l'accès des agents IA.
  levels:
    - title: Personnaliser sans code
      status: Disponible
      state: ok
      description: Depuis le navigateur, vous ajoutez des champs, vous adaptez les formulaires et vous définissez vos flux de validation, vos formats d'impression et vos rapports.
      items: [Champs, Formulaires, Validations, Impressions, Rapports]
      link: { label: La personnalisation, to: "https://doc.dokos.io/v5/dodock/personnalisation", target: _blank }
    - title: Studio
      status: Bientôt
      state: soon
      description: Un constructeur visuel d'applications web intégré à Dokos. Vous assemblez des pages, des composants et des sources de données, puis vous publiez l'application sur votre site. Studio est en préparation dans la prochaine version de Dodock.
      items: [Pages, Composants, Données Dokos]
      link: { label: Aperçu dans la documentation, to: "https://doc.dokos.io/next/dodock/personnalisation/studio", target: _blank }
    - title: Applications métier
      status: Disponible
      state: ok
      description: Nos ingénieurs, ou les vôtres, construisent les applications qui portent vos processus, sur Dodock, le cadre applicatif de Dokos. Elles sont livrées dans vos dépôts, sous licence libre, et peuvent être exploitées sous contrat.
      items: [Processus métier, Connecteurs, Automatisations]
      link: { label: Nos missions d'ingénierie, to: /fr/ingenierie }

# Layer 2: the apps. The cards come from hero.stack.apps (one list for both).
apps:
  label: Applications
  title: Installez celles qu'il vous faut.
  description: Chaque application lit les mêmes clients, articles et factures que les autres. Elles s'installent depuis la marketplace de Dokos Cloud.
  all: Toutes
  domains:
    sales: Vente
    finance: Finance
    people: Équipe
    collab: Collaboration
    web: Web
    ai: IA
  publishers:
    frappe: Frappe
    dokos: Dokos
  link:
    label: Voir tout l'écosystème
    to: /fr/modules

# Layer 3: Dokos itself. The document numbers are example data.
core:
  label: Le cerveau de l'entreprise
  title: Saisi une fois, utilisé partout.
  description: "Un devis accepté devient une commande, une livraison, une facture, une écriture et un paiement. Chaque document reprend le précédent, et Dokos fait le travail répétitif à chaque étape. Les droits sont définis une fois, par rôle, et s'appliquent partout : écrans, rapports, API et agents."
  does_label: Dokos s'en charge
  # Each « does » line is standard Dokos v5 behaviour (modules Ventes, Stocks, Comptabilité, eTransactions, Banque).
  chain:
    - { title: Devis, number: DEV-0388, does: "applique les prix de votre liste et les remises du client" }
    - { title: Commande, number: CMD-0291, does: "réserve le stock et suit ce qui reste à livrer et à facturer" }
    - { title: Livraison, number: BL-0277, does: "sort le stock et met à jour sa valeur" }
    - { title: Facture, number: FA-0412, does: "passe l'écriture et part par votre plateforme agréée" }
    - { title: Écriture, number: ECR-5530, does: "alimente le grand livre, la TVA et le bilan" }
    - { title: Paiement, number: PAY-0198, does: "propose le rapprochement avec votre relevé bancaire" }
  # Product facts, verifiable on /fr/certifications.
  facts:
    - label: Encaissement des particuliers
      value: Certifié LNE
      status: Disponible
      state: ok
      note: Référentiel de certification des systèmes de caisse du LNE. Avec le module Certification Caisse et une licence délivrée par Dokos SAS.
      link: { label: Les certifications, to: /fr/certifications }
    - label: Facturation électronique
      value: Émission et réception
      status: Disponible
      state: ok
      note: Factures CII, Factur-X et UBL, par la plateforme agréée de votre choix.
      link: { label: eTransactions, to: /fr/modules/etransactions }

# Layer 4: the open source base, and the tools Dokos connects to.
base:
  label: La base open source
  title: Construit sur Frappe et ERPNext, avec leur communauté.
  description: Dodock et Dokos suivent chaque version de Frappe et d'ERPNext, et y ajoutent ce qu'il faut en France. Dokos 5, publiée le 16 mars 2026, repose sur la version 16 de Frappe et d'ERPNext. Tout le code est publié sur notre GitLab, sous GPLv3, AGPLv3 ou MIT selon le dépôt.
  link:
    label: Lire le code
    to: https://gitlab.com/dokos
  layers:
    - { title: Dokos, note: "gestion, localisation française, LNE", to: /fr/modules/dokos }
    - { title: ERPNext, note: les modules de gestion }
    - { title: Dodock, note: "le framework, version Dokos de Frappe", to: /fr/modules/dodock }
    - { title: Licences libres, note: "GPLv3, AGPLv3 ou MIT, code publié" }


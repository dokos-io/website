      description: Vos besoins sont plus complexes, avec des particularités métier ou des connecteurs à développer ? Découvrez comment nous travaillons avec nos clients, du juste prix à votre autonomie.
      label: Comment nous travaillons ensemble
      to: /fr/travailler-ensemble
      highlight: true
  # Les autres faits sont déjà dans la bande qui défile sous le hero ; les tarifs, eux, se consultent ici.

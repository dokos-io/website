title: Dokos pour les tiers-lieux
description: Réservations de ressources, contrats, abonnements, adhésions et paiement en ligne, facturés dans votre comptabilité Dokos.

hero:
  headline:
    label: Tiers-lieux et coworkings
    icon: i-heroicons-building-office-2
  title: Vos espaces <span class="text-primary">réservés en ligne</span>, vos membres facturés dans Dokos.
  description: Vos membres réservent une salle, un poste ou une machine depuis le portail. Ils paient en ligne, avec leurs crédits ou leur abonnement. Dokos génère les factures, les contrats et les abonnements dans votre comptabilité.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Documentation
      to: https://doc.dokos.io/v5/dokos/lieu
      target: _blank
      size: xl
      color: neutral
      variant: outline


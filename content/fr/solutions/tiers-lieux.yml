colored_section:
  title: Construit avec les tiers-lieux depuis 2018
  description: "Le projet est né en 2018 avec la Compagnie des Tiers-Lieux, d'abord sur ERPNext, avant de devenir Dokos. Des tiers-lieux ont co-construit l'outil avec nous et financé de nouvelles fonctions. Les échanges se poursuivent sur le forum de la communauté Dokos, ouvert à tous. En mai 2026, au Faire Festival de Toulouse, nous avons retrouvé fablabs, intégrateurs et utilisateurs en auto-hébergement, et lancé l'interconnexion entre TiBillet, la billetterie libre et coopérative, et Dokos."
  # source : content/fr/blog/2026/faire-festival-retour.md
  image: /image/dokos-communaute.webp
  align: left

sections:
  - title: Vos ressources réservées depuis le portail
    description: Chaque salle, poste ou machine devient une ressource réservable, avec ses prix à l'heure, à la demi-journée, à la journée ou au mois, son calendrier d'ouverture et son préavis minimum. Le client choisit un créneau sur le portail. La réservation est confirmée après la commande, ou après le paiement si vous l'exigez.
    image: /solutions/reservations.webp
    align: right
    features:
      - title: Des crédits de réservation
        description: Un ticket ou un abonnement alloue des crédits, consommés à chaque réservation. Un rapport présente les soldes.
        icon: i-heroicons-ticket
      - title: La synchronisation avec Google Agenda
        description: Chaque ressource est liée à son agenda, et une option synchronise les réservations en ligne.
        icon: i-heroicons-calendar-days
      - title: Plusieurs lieux sur un même site
        description: En mode multi-lieu, chaque société a sa liste de prix et son panier.
        icon: i-heroicons-map-pin
    links:
      - label: Réservations de ressources
        to: /fr/modules/reservations-de-ressources
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Contrats et abonnements de vos résidents
    description: Pour un poste fixe ou une domiciliation, vous envoyez le contrat au client, qui le signe d'un clic sur son portail. Le contrat actif crée la commande client, l'abonnement et le dépôt de garantie. L'abonnement génère ses factures à chaque période et déclenche le paiement si le client a enregistré un moyen de paiement.
    image: /solutions/abonnement.webp
    align: left
    links:
      - label: Le module Ventes
        to: /fr/modules/ventes
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Le paiement en ligne
    description: Vous envoyez un lien de paiement depuis une commande ou une facture. Votre client paie par carte ou par prélèvement SEPA, et le statut de la demande se met à jour dans Dokos. Les passerelles Stripe, GoCardless, Stancer, HelloAsso, SumUp et PayPal sont disponibles. Avec Stripe ou GoCardless, le moyen de paiement est conservé pour les échéances de l'abonnement.
    image: /modules/paiements/hero.webp
    align: right
    links:
      - label: Le module Paiements
        to: /fr/modules/paiements
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Vos adhérents et leurs cotisations
    description: Avec Tribu, l'adhérent s'inscrit et paie dans un formulaire web. Tribu crée sa fiche, son adhésion et la facture de vente. Le module dons enregistre les contributions ponctuelles. Les encaissements se rapprochent en banque.
    image: /modules/comptabilite/hero.webp
    align: left
    links:
      - label: Tribu
        to: /fr/modules/tribu
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Votre site web et votre boutique
    description: Vous construisez les pages de votre site dans l'éditeur visuel de Frappe Builder et vous les publiez en un clic. Avec Webshop, vos articles sont publiés sur le site, une commande en ligne devient une commande client et vos clients retrouvent leurs commandes et leurs factures sur leur portail.
    image: /modules/builder/hero.webp
    align: right
    links:
      - label: Frappe Builder
        to: /fr/modules/builder
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
      - label: Webshop
        to: /fr/modules/e-commerce
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

cta:
  title: Décrivez-nous votre lieu.
  description: Éditeur open source, experts Frappe et ERPNext, nous bâtissons et garantissons vos applications métier. Créez un site d'essai sur Dokos Cloud, ou écrivez-nous pour nous présenter vos espaces et vos membres.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: neutral
      variant: outline

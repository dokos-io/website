title: Dokos pour les entreprises de services
description: Projets, temps passé, facturation et comptabilité dans le même logiciel de gestion, avec la marge de chaque projet.

hero:
  headline:
    label: Entreprises de services
    icon: i-heroicons-briefcase
  title: Du temps passé à la facture, <span class="text-primary">la marge de chaque projet</span>.
  description: Vous vendez des prestations, au forfait ou au temps passé. Votre équipe saisit ses heures sur les tâches du projet. Dokos crée la facture depuis la feuille de temps et compare le montant des ventes au coût du projet.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: neutral
      variant: outline

colored_section:
  title: Vos projets en tâches, sur un tableau
  description: "Un projet se rattache à une commande client et se découpe en tâches. Chaque tâche porte un statut et une priorité, et une tâche dépendante ne peut pas être terminée avant la tâche amont. Vous suivez l'avancement dans la liste, le Gantt ou le kanban. Dokos v5 repose sur Frappe et ERPNext v16 ; son code est publié sous licence GPLv3."
  image: /modules/projets/feature-taches.webp
  align: left

sections:
  - title: Le temps passé devient une facture
    description: Une feuille de temps indique, ligne par ligne, les heures, le type d'activité, le projet et la tâche. Les lignes facturables, multipliées par le taux de facturation, donnent le montant à facturer. Depuis la feuille soumise, vous créez la facture de vente.
    image: /modules/ventes/feature-facture.webp
    align: right
    features:
      - title: Des modèles de projet
        description: Les tâches d'un modèle sont créées et datées à partir de leur durée, en sautant les jours fériés de la société.
        icon: i-heroicons-document-duplicate
      - title: Vos clients informés
        description: Vous ouvrez le projet à votre client sur le portail et vous lui envoyez son état d'avancement à la fréquence choisie.
        icon: i-heroicons-user-group
    links:
      - label: Le module Projets
        to: /fr/modules/projets
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: La marge de chaque projet
    description: Le projet additionne les coûts des feuilles de temps, des notes de frais et des achats. Il les compare au montant des ventes et affiche la marge brute.
    image: /modules/comptabilite/fit.webp
    align: left
  - title: Du devis à l'encaissement
    description: Vous créez le devis depuis la fiche client. La commande reprend le devis accepté et la facture reprend la commande. Un abonnement génère ses factures à chaque période. Les factures envoyées par e-mail portent un lien de paiement.
    image: /modules/ventes/feature-devis.webp
    align: right
    links:
      - label: Le module Ventes
        to: /fr/modules/ventes
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Votre comptabilité se tient à partir de vos factures
    # source : content/fr/modules/comptabilite.yml (Banking, Trésorerie), billet rentree-2026.md
    description: Chaque facture de vente ou d'achat validée passe son écriture au grand livre. Le bilan et le compte de résultat sortent sans ressaisie. Le module Banque, en bêta, importe vos relevés en OFX, CSV, XLSX ou PDF et propose les correspondances avec vos paiements. Le prévisionnel de trésorerie, en bêta, lit vos factures, vos abonnements, vos notes de frais et vos fiches de paie pour projeter votre solde jour par jour. Dokos émet et reçoit les factures électroniques CII, Factur-X et UBL par votre plateforme agréée.
    image: /modules/comptabilite/hero.webp
    align: left
    links:
      - label: Le module Comptabilité
        to: /fr/modules/comptabilite
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Les congés et les notes de frais de votre équipe
    description: L'employé demande son congé ou saisit ses dépenses depuis l'application mobile, et son responsable approuve. L'allocation de congé se calcule à partir du contrat de travail. Chaque note de frais soumise crée son écriture comptable.
    image: /solutions/notes-de-frais.webp
    align: right
    links:
      - label: Le module Ressources Humaines
        to: /fr/modules/ressources-humaines
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Reliez vos autres outils
    description: Un webhook prévient un outil externe quand un document est créé, modifié ou soumis. Chaque utilisateur génère une clé API, avec les mêmes permissions que dans l'interface. L'agent de votre choix se connecte à votre site par MCP, et chaque écriture reste soumise à votre confirmation.
    image: /modules/integrations/hero.webp
    align: left
    links:
      - label: Les intégrations
        to: /fr/modules/integrations
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

carousel:
  - title: Un support client en tickets
    description: Avec Helpdesk, chaque e-mail reçu devient un ticket, avec des délais de réponse par priorité et un portail où le client suit sa demande.
  - title: Des droits par rôle
    description: Vous limitez un utilisateur à certains documents, par exemple ceux d'une seule société.
  - title: Un code ouvert
    description: Le code de Dokos est publié sous licence GPLv3. Vous ajoutez des champs et des flux de validation depuis l'interface.

cta:
  title: Dites-nous comment votre équipe vend et facture.
  description: Éditeur open source, experts Frappe et ERPNext, nous bâtissons et garantissons vos applications métier. Créez un site d'essai sur Dokos Cloud, ou écrivez-nous.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: neutral
      variant: outline

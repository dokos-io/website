  description: Éditeur open source, experts Frappe et ERPNext, nous bâtissons et garantissons vos applications métier. Créez un site d'essai sur Dokos Cloud, ou décrivez-nous vos flux de fabrication.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Nous écrire

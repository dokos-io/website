title: Dokos pour les entreprises de production
description: Nomenclatures, ordres de travail, stocks et contrôles qualité dans le même logiciel de gestion, avec le coût réel de chaque lot fabriqué.

hero:
  headline:
    label: Industrie et fabrication
    icon: i-heroicons-cog-6-tooth
  title: De la nomenclature au produit fini, <span class="text-primary">chaque étape laisse une écriture</span>.
  description: Vous fabriquez sur stock ou à la commande. Dokos relie vos nomenclatures, vos ordres de travail, vos mouvements de stock et vos contrôles qualité. Vous comparez le coût réel de chaque ordre au coût prévu.
  links:
    - label: Essayer Dokos
      to: https://cloud.dokos.io
      target: _blank
      size: xl
      color: primary
      icon: i-heroicons-rocket-launch
    - label: Nous écrire
      to: /fr/contact
      size: xl
      color: neutral
      variant: outline

colored_section:
  title: Le tableau de bord de votre production
  description: "Le module Production fait partie de Dokos, compris dans toutes les formules de Dokos Cloud. Il lit vos articles et vos entrepôts, puis il écrit une entrée de stock à chaque étape : transfert des matières vers l'atelier, puis fabrication vers l'entrepôt des produits finis. Dokos v5 repose sur Frappe et ERPNext v16 ; son code est publié sous licence GPLv3."
  image: /modules/production/hero.webp
  align: left

sections:
  - title: Décrivez vos produits dans une nomenclature
    description: Vous listez les composants achetés et les sous-ensembles fabriqués, avec leurs quantités. Une nomenclature peut contenir d'autres nomenclatures. La section « Coût de la nomenclature » additionne le coût des composants et celui des opérations.
    image: /modules/production/feature-nomenclature.webp
    align: right
    links:
      - label: Le module Production
        to: /fr/modules/production
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Planifiez à partir de vos commandes
    description: Le plan de production regroupe vos commandes client, vos prévisions et vos seuils de réapprovisionnement. Vous le créez aussi directement depuis une commande client. Dokos en déduit les ordres de travail à lancer et les demandes d'achat des composants manquants.
    image: /modules/production/fit.webp
    align: left
  - title: Lancez vos ordres de travail
    description: À la soumission d'un ordre de travail, Dokos réserve les matières premières dans leurs entrepôts sources. Le transfert vers l'atelier crée une entrée de stock, et les transferts partiels se cumulent. En fin de production, une entrée de type Fabrication place les produits finis dans l'entrepôt cible.
    image: /modules/production/feature-ordre.webp
    align: right
  - title: Le coût réel de chaque lot
    description: Chaque opération de la nomenclature génère une carte de travail, assignée à une station. L'opérateur y saisit son temps et sa quantité. Les temps saisis, multipliés par les coûts horaires des stations, s'ajoutent au coût des matières consommées. L'ordre de travail affiche le coût prévu et le coût réel.
    image: /modules/production/feature-carte.webp
    align: left
    features:
      - title: Des coûts horaires par station
        description: Une station de travail porte ses coûts de main-d'œuvre, d'électricité, de loyer et de consommables.
        icon: i-heroicons-calculator
      - title: Le Plan d'atelier
        description: L'écran des opérateurs affiche chaque station comme disponible ou occupée.
        icon: i-heroicons-squares-2x2
  - title: Vos stocks suivent la production
    description: Chaque réception, livraison et transfert écrit une entrée dans le grand livre des stocks. Vous suivez un article par lot ou par numéro de série. Le rapport Projections de stock tient compte des quantités planifiées en fabrication. Sous le point de commande d'un article, Dokos crée la demande de matériel.
    image: /modules/stocks/feature-mouvements.webp
    align: right
    links:
      - label: Le module Stocks
        to: /fr/modules/stocks
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true
  - title: Contrôlez la qualité en réception et en atelier
    description: Un modèle d'inspection, attaché à l'article, définit les lectures à faire et leurs critères. Tant que l'inspection n'est pas faite, le reçu d'achat ou la carte de travail ne peut pas être soumis. Depuis Dokos v5, un contrôle peut être exigé à chaque opération d'une nomenclature. Les non-conformités sont suivies jusqu'à leur action corrective.
    image: /modules/qualite/feature-inspection.webp
    align: left
    links:
      - label: Le module Qualité
        to: /fr/modules/qualite
        color: neutral
        variant: outline
        icon: i-heroicons-arrow-right-20-solid
        trailing: true

cta:
